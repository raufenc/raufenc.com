<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أَدَوات الاسْتِفْهام — الصَّفّ السّابِع · الوَحْدَة الأولى</title>
<meta name="description" content="لُعْبَة أَدَوات الاسْتِفْهام — اِخْتَر الأَداة المُناسِبَة لِكُلّ سُؤال (ما، مَن، ماذا، مَتى، أَيْن، كَيْف، كَم، لِماذا، هَلْ، أَيّ)">
<style>
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --crimson:#E5176B;--crimson-d:#C2185B;--blue:#0288D1;--blue-d:#0277BD;
  --ink:#2A2F45;--ink-soft:#6B7088;--paper:#FFF7F3;
  --ok:#43A047;--bad:#E53935;--gold:#F5A623;
}
html,body{height:100%}
body{font-family:'Arakom','Segoe UI',system-ui,sans-serif;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;
font-size:clamp(17px,1.55vw + 8px,30px);
background:radial-gradient(circle at 12% 8%,rgba(229,23,107,.10),transparent 22%),radial-gradient(circle at 88% 6%,rgba(2,136,209,.09),transparent 20%),var(--paper)}

/* üst bar */
.bar{height:52px;background:rgba(255,247,243,.92);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;border-bottom:1px solid #F2DCE5;position:relative;z-index:50}
.bar-back{background:#fff;border:2px solid rgba(229,23,107,.35);color:var(--crimson-d);padding:7px 16px;border-radius:100px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:.2s;text-decoration:none;white-space:nowrap}
.bar-back:hover{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.bar-name{font-family:'Arakom',sans-serif;font-size:clamp(17px,1vw + 8px,26px);color:var(--crimson-d);font-weight:bold;flex:1;text-align:left}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}

/* ── BAŞLANGIÇ ── */
#startScreen{text-align:center;max-width:820px;width:100%}
#startScreen h1{font-size:clamp(2.2em,6vw,3.4em);background:linear-gradient(100deg,var(--crimson),#FF5A8A 45%,var(--crimson-d));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px;font-weight:bold;line-height:1.1}
#startScreen .lead{color:var(--ink-soft);font-size:clamp(1em,2.2vw,1.3em);font-weight:600;margin-bottom:8px}
.adats{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin:18px auto 30px;max-width:680px}
.adat{background:#fff;border:2px solid #F0DCE4;color:var(--crimson-d);border-radius:100px;padding:.3em .9em;font-weight:bold;font-size:clamp(1em,2vw,1.35em)}
.start-btn{background:var(--crimson);color:#fff;border:none;padding:.7em 2em;border-radius:100px;font-size:clamp(1.2em,2.6vw,1.7em);font-weight:bold;cursor:pointer;font-family:inherit;transition:all .25s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 12px 28px rgba(229,23,107,.28)}
.start-btn:hover{transform:translateY(-4px) scale(1.04);background:var(--crimson-d)}

/* ── OYUN ── */
.hidden{display:none!important}
#game{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.count{display:inline-flex;align-items:center;gap:.4em;background:#fff;border:1px solid #F0DCE4;color:var(--ink-soft);font-weight:bold;border-radius:100px;padding:.25em 1.1em;font-size:clamp(1em,1.8vw,1.4em);box-shadow:0 4px 14px rgba(158,14,72,.08);flex-shrink:0}
.count b{color:var(--crimson-d)}

.arena{position:relative;width:min(94vw,1120px);aspect-ratio:16/10;max-height:74vh;margin:0 auto}
.orbit-guide{position:absolute;inset:5% 3%;border:2px dashed #CBD8E8;border-radius:50%;opacity:.55;pointer-events:none}

/* merkez kart */
.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(56%,560px);
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid #EFE0E7;border-radius:26px;
  padding:clamp(18px,2.6vw,34px) clamp(16px,2.4vw,30px);box-shadow:0 18px 44px rgba(158,14,72,.12);
  text-align:center;z-index:5}
.sentence{direction:rtl;font-weight:bold;color:var(--ink);line-height:1.7;font-size:clamp(1.25em,3vw,1.95em)}
.blank{display:inline-block;min-width:2.6em;color:var(--gold);border-bottom:5px dashed var(--gold);
  padding:0 .12em;margin:0 .1em;letter-spacing:.08em;transition:color .3s}
.blank.filled{color:var(--ok);border-bottom-style:solid;border-bottom-color:var(--ok);letter-spacing:0;animation:fillPop .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes fillPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}

/* baloncuklar */
.bubble{position:absolute;top:0;left:0;width:clamp(84px,11.6vmin,138px);height:clamp(84px,11.6vmin,138px);
  margin:0;transform:translate(-50%,-50%);border-radius:50%;border:none;cursor:pointer;font-family:inherit;
  background:radial-gradient(circle at 35% 28%,#ffffff,#EAF1F8 78%,#DCE7F2);
  box-shadow:0 10px 22px rgba(40,70,110,.16),inset 0 2px 5px rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:bold;
  font-size:clamp(1.25em,2.7vw,1.85em);transition:background .25s,box-shadow .25s,color .2s,border-color .2s;
  z-index:8;will-change:left,top}
.bubble:hover{box-shadow:0 14px 28px rgba(229,23,107,.22),inset 0 2px 5px rgba(255,255,255,.9)}
.bubble.correct{background:radial-gradient(circle at 35% 28%,#C8EFCB,#9BDDA0 80%);color:#1B5E20;
  box-shadow:0 0 0 6px rgba(67,160,71,.30),0 12px 26px rgba(67,160,71,.35)}
.bubble.wrong{background:radial-gradient(circle at 35% 28%,#FBD0D0,#F4A3A3 80%);color:#B71C1C;
  box-shadow:0 0 0 5px rgba(229,57,53,.28),0 12px 24px rgba(229,57,53,.30);animation:shake .42s}
.bubble:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 7px),-50%)}60%{transform:translate(calc(-50% + 7px),-50%)}}

.score-pop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(2em,5vw,3.4em);
  font-weight:bold;z-index:30;animation:popUp 1.1s forwards;pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.12)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}45%{opacity:1;transform:translate(-50%,-95%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}

/* ── SONUÇ MODALI ── */
#modal{display:none;position:fixed;inset:0;background:rgba(42,47,69,.55);backdrop-filter:blur(7px);z-index:999;justify-content:center;align-items:center;padding:18px}
.modal-card{background:#fff;padding:38px 34px;border-radius:30px;text-align:center;border-top:8px solid var(--crimson);max-width:480px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.25);animation:mShow .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes mShow{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.m-title{font-size:2.1em;font-weight:bold;color:var(--crimson-d);margin-bottom:10px}
.m-stars{font-size:2.6em;margin-bottom:8px}
.m-score{font-size:1.7em;color:var(--ink-soft);margin-bottom:24px;font-weight:bold}
.m-btn{background:var(--crimson);color:#fff;border:none;padding:14px 30px;border-radius:100px;font-size:1.1em;font-weight:bold;cursor:pointer;font-family:inherit;transition:.2s;margin:4px}
.m-btn:hover{transform:scale(1.05);background:var(--crimson-d)}
.m-btn.alt{background:#fff;color:var(--crimson-d);border:2px solid var(--crimson)}

/* dar + DİKEY (cep portre): daha küçük baloncuk + dar kart → çakışma yok */
@media(max-width:880px) and (orientation:portrait){
  .arena{aspect-ratio:3/4;max-height:none;width:96vw}
  .card{width:min(58%,240px);padding:clamp(12px,3.4vw,22px) clamp(10px,3vw,18px)}
  .sentence{font-size:clamp(1.05em,4.6vw,1.5em)}
  .bubble{width:clamp(60px,17vw,84px);height:clamp(60px,17vw,84px);font-size:clamp(1em,4.4vw,1.5em)}
}
/* yatay cep: kısa ekran → baloncuk + kart küçülür ki köşe çakışması olmasın */
@media(max-height:560px) and (min-width:560px){
  body{font-size:clamp(15px,2.6vmin + 6px,22px)}
  .bar{height:40px}
  .arena{max-height:84vh}
  .card{width:min(48%,430px);padding:10px 14px}
  .sentence{font-size:clamp(1.05em,2.6vw,1.5em);line-height:1.5}
  .bubble{width:clamp(58px,18vmin,88px);height:clamp(58px,18vmin,88px);font-size:clamp(1em,2.7vw,1.45em)}
}
@media(prefers-reduced-motion:reduce){
  .blank.filled,.bubble.wrong,.score-pop{animation:none}
}
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<body>

<div class="bar">
  <a class="bar-back" href="/7sinif/1/">↩ العَوْدَة</a>
  <span class="bar-name">🔎 أَدَوات الاسْتِفْهام</span>
</div>

<div class="stage">

  <!-- BAŞLANGIÇ -->
  <div id="startScreen">
    <h1>أَدَوات الاسْتِفْهام</h1>
    <div class="lead">اِخْتَر الأَداة المُناسِبَة لِكُلّ سُؤال</div>
    <div class="adats">
      <span class="adat">ما؟</span><span class="adat">مَن؟</span><span class="adat">ماذا؟</span>
      <span class="adat">مَتى؟</span><span class="adat">أَيْن؟</span><span class="adat">كَيْف؟</span>
      <span class="adat">كَم؟</span><span class="adat">لِماذا؟</span><span class="adat">هَلْ؟</span>
      <span class="adat">أَيّ؟</span>
    </div>
    <button class="start-btn" onclick="startGame()">▶ اِبْدَأْ</button>
  </div>

  <!-- OYUN -->
  <div id="game" class="hidden">
    <div class="count"><b id="cur">١</b> / <span id="tot">١٠</span></div>
    <div class="arena" id="arena">
      <div class="orbit-guide"></div>
      <div class="card">
        <div class="sentence" id="sentence"></div>
      </div>
      <!-- baloncuklar buraya JS ile -->
    </div>
  </div>

</div>

<!-- SONUÇ -->
<div id="modal">
  <div class="modal-card">
    <div class="m-title" id="mTitle">🎉 أَحْسَنْتَ!</div>
    <div class="m-stars" id="mStars"></div>
    <div class="m-score" id="mScore"></div>
    <button class="m-btn" onclick="restart()">🔄 اِبْدَأْ مِن جَديد</button>
    <button class="m-btn alt" onclick="location.href='/7sinif/1/'">القائِمَة ↩</button>
  </div>
</div>

<script>
/* ── SES (WebAudio — dış dosya yok) ── */
let _actx;
function _ac(){if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();return _actx}
function _tone(f,d,t,v,dl){t=t||'sine';v=v||.3;dl=dl||0;try{const c=_ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=t;const s=c.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
let _arSes=null;
if(typeof speechSynthesis!=='undefined')speechSynthesis.onvoiceschanged=function(){_arSes=null};
function konuş(m){if(!('speechSynthesis' in window))return;if(!_arSes){const v=speechSynthesis.getVoices();_arSes=v.find(x=>x.lang==='ar-SA')||v.find(x=>x.lang&&x.lang.indexOf('ar')===0)||null}if(!_arSes)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.voice=_arSes;u.lang='ar-SA';u.rate=.85;u.volume=.95;speechSynthesis.speak(u)}
function sesDoğru(){_tone(523,.1);_tone(659,.1,'sine',.3,.1);_tone(784,.25,'sine',.3,.2);konuş(['أَحْسَنْتَ','مُمْتاز','رائِع'][Math.floor(Math.random()*3)])}
function sesYanlış(){_tone(180,.15,'sawtooth',.25);_tone(150,.2,'sawtooth',.2,.15)}
function sesTıkla(){_tone(900,.04,'sine',.12)}
function sesBitir(){[523,659,784,1047,1319].forEach((f,i)=>_tone(f,.18,'sine',.28,i*.12))}

/* ── VERİ ──
   Her soru: cümlenin boşluktan SONRAKİ kısmı (after) + doğru edat (ans).
   Boşluk cümlenin BAŞINDADIR (RTL'de sağda). avoid: çeldirici olarak KULLANILMAYACAK edatlar. */
const PARTICLES=['ما','مَن','ماذا','مَتى','أَيْن','كَيْف','كَم','لِماذا','هَلْ','أَيّ'];
const QUESTIONS=[
 {ans:'ما',     after:'طَعامُك المُفَضَّل؟',              avoid:['ماذا','أَيْن','كَيْف']},
 {ans:'مَن',    after:'يَتَناوَلُ الفَطور مَعَك؟',          avoid:['مَتى','أَيْن','كَيْف','لِماذا','هَلْ']},
 {ans:'ماذا',   after:'تَأْكُلُ في الفَطور؟',              avoid:['ما','هَلْ']},
 {ans:'مَتى',   after:'تَرْجِعُ إِلى البَيْت؟',             avoid:['كَيْف','لِماذا','هَلْ','أَيْن']},
 {ans:'أَيْن',  after:'تَذْهَبُ بَعْد المَدْرَسَة؟',         avoid:['كَيْف','لِماذا','هَلْ','مَتى']},
 {ans:'كَيْف',  after:'تَذْهَبُ إِلى المَدْرَسَة؟',          avoid:['مَتى','لِماذا','هَلْ','أَيْن']},
 {ans:'كَم',    after:'ساعَةً تَدْرُسُ في المَساء؟'},
 {ans:'لِماذا', after:'تَسْتَيْقِظُ مُبَكِّرًا؟',            avoid:['مَتى','كَيْف','هَلْ','أَيْن']},
 {ans:'هَلْ',   after:'تُحِبُّ الشّاي؟',                   avoid:['لِماذا']},
 {ans:'أَيّ',   after:'طَعام تُحِبُّ في الفَطور؟',          avoid:['ما','ماذا','كَم']}
];

function arDig(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let deck,idx,firstTry,wrongThisQ;

function startGame(){
 sesTıkla();
 document.getElementById('startScreen').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');
 deck=shuffle([...QUESTIONS]);
 idx=0;firstTry=0;
 document.getElementById('tot').textContent=arDig(deck.length);
 loadQ();
 startOrbit();
}

function loadQ(){
 if(idx>=deck.length){endGame();return}
 const q=deck[idx];
 wrongThisQ=0;orbitPaused=false;
 document.getElementById('cur').textContent=arDig(idx+1);
 /* cümle: boşluk (başta) + kalan */
 document.getElementById('sentence').innerHTML=
   '<span class="blank" id="blank">•••</span> '+q.after;
 /* baloncuk seti: doğru + 4 çeldirici */
 const avoid=q.avoid||[];
 const pool=PARTICLES.filter(p=>p!==q.ans && avoid.indexOf(p)<0);
 const opts=shuffle([q.ans,...shuffle(pool).slice(0,4)]);
 /* eski baloncukları sil */
 document.querySelectorAll('#arena .bubble').forEach(b=>b.remove());
 const arena=document.getElementById('arena');
 opts.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='bubble';b.textContent=p+'؟';b.dataset.p=p;
  b.style.left='50%';b.style.top='50%';
  b.onclick=()=>pick(b,p,q);
  arena.appendChild(b);
 });
 placeBubbles(true);
}

function pick(btn,p,q){
 if(orbitPaused)return;
 if(p===q.ans){
  sesDoğru();
  btn.classList.add('correct');
  document.querySelectorAll('#arena .bubble').forEach(x=>x.disabled=true);
  const bl=document.getElementById('blank');
  bl.textContent=q.ans;bl.classList.add('filled');
  if(wrongThisQ===0)firstTry++;
  pop('✓','var(--ok)');
  orbitPaused=true;
  idx++;
  setTimeout(loadQ,1450);
 }else{
  sesYanlış();
  btn.classList.add('wrong');btn.disabled=true;
  wrongThisQ++;
  setTimeout(()=>{if(!btn.classList.contains('correct'))btn.classList.remove('wrong')},900);
 }
}

function pop(txt,color){
 const a=document.getElementById('arena');
 const s=document.createElement('div');s.className='score-pop';s.textContent=txt;s.style.color=color;
 a.appendChild(s);setTimeout(()=>s.remove(),1100);
}

/* ── YÖRÜNGE (elips üzerinde yavaş dönüş) ── */
let angle=0,orbitPaused=false,rafId=null;
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function placeBubbles(){
 const arena=document.getElementById('arena');
 if(!arena)return;
 const bubbles=arena.querySelectorAll('.bubble');
 const n=bubbles.length;if(!n)return;
 const w=arena.clientWidth,h=arena.clientHeight;
 const cx=w/2,cy=h/2;
 const card=arena.querySelector('.card');
 const br=((bubbles[0].offsetWidth)||110)/2;
 const gap=10;
 const cw=card?card.offsetWidth/2:cx*0.5;
 const ch=card?card.offsetHeight/2:cy*0.4;
 /* yörünge yarıçapları: baloncuklar daima kartı temizler, sahanın dışına taşmaz */
 const rx=Math.min(cx-br-4, Math.max(cx*0.80, cw+br+gap));
 const ry=Math.min(cy-br-4, Math.max(cy*0.74, ch+br+gap));
 bubbles.forEach((b,i)=>{
  const t=angle+(i*2*Math.PI/n)-Math.PI/2;
  b.style.left=(cx+rx*Math.cos(t))+'px';
  b.style.top=(cy+ry*Math.sin(t))+'px';
 });
}
function orbitTick(){
 if(!orbitPaused && !REDUCED)angle+=0.0017;
 placeBubbles();
 rafId=requestAnimationFrame(orbitTick);
}
function startOrbit(){if(rafId)cancelAnimationFrame(rafId);angle=-0.35;orbitTick()}
addEventListener('resize',placeBubbles);

function endGame(){
 sesBitir();
 const t=deck.length;
 const r=firstTry/t;
 document.getElementById('mTitle').textContent=r>=0.6?'🎉 أَحْسَنْتَ!':'💪 حاوِلْ مَرَّةً أُخْرى';
 document.getElementById('mStars').textContent=r>=0.9?'⭐⭐⭐':r>=0.6?'⭐⭐':'⭐';
 document.getElementById('mScore').innerHTML=arDig(firstTry)+' / '+arDig(t);
 document.getElementById('modal').style.display='flex';
}

function restart(){
 document.getElementById('modal').style.display='none';
 startGame();
}
</script>

<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='#startScreen,#game';function tgt(){var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>

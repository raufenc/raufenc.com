<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كَم السّاعَة؟ — الصَّفّ السّابِع · الوَحْدَة الرّابِعَة</title>
<meta name="description" content="لُعْبَة السّاعَة — لاعِب واحِد أَوْ لاعِبان · رَقَمِيَّة وَعَقارِب">
<style>
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --crimson:#E5176B;--crimson-d:#C2185B;--blue:#0288D1;--blue-d:#0277BD;
  --ink:#2A2F45;--ink-soft:#6B7088;--paper:#FFF7F3;
  --ok:#43A047;--bad:#E53935;--gold:#F5A623;
}
html,body{height:100%}
body{font-family:'Arakom','Segoe UI',system-ui,sans-serif;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;
font-size:clamp(17px,1.55vw + 8px,30px); /* akıllı tahtada ~30px tabana ölçeklenir; cepte 17px taban */
background:radial-gradient(circle at 12% 8%,rgba(229,23,107,.10),transparent 22%),radial-gradient(circle at 88% 6%,rgba(2,136,209,.09),transparent 20%),var(--paper)}

/* üst bar */
.bar{height:52px;background:rgba(255,247,243,.92);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;border-bottom:1px solid #F2DCE5;position:relative;z-index:50}
.bar-back{background:#fff;border:2px solid rgba(229,23,107,.35);color:var(--crimson-d);padding:7px 16px;border-radius:100px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:.2s;text-decoration:none;white-space:nowrap}
.bar-back:hover{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.bar-name{font-family:'Arakom',sans-serif;font-size:clamp(17px,1vw + 8px,26px);color:var(--crimson-d);font-weight:bold;flex:1;text-align:right}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}

/* ── BAŞLANGIÇ ── */
#startScreen{text-align:center;max-width:760px;width:100%}
#startScreen h1{font-size:clamp(2.4em,6vw,3.6em);background:linear-gradient(100deg,var(--crimson),#FF5A8A 45%,var(--crimson-d));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:22px;font-weight:bold}
.fmt-row{display:flex;justify-content:center;gap:10px;margin-bottom:34px}
.fmt-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid #F0DCE4;color:var(--ink-soft);padding:12px 26px;border-radius:100px;font-family:inherit;font-size:1.15em;font-weight:bold;cursor:pointer;transition:.25s}
.fmt-chip.on{border-color:var(--crimson);color:var(--crimson-d);box-shadow:0 8px 20px rgba(229,23,107,.18);transform:scale(1.05)}
.mode-row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.mode-btn{background:#fff;border:3px solid #F0DCE4;padding:34px 30px;border-radius:28px;cursor:pointer;transition:all .3s cubic-bezier(.175,.885,.32,1.275);width:min(280px,42vw);box-shadow:0 10px 24px rgba(158,14,72,.08);font-family:inherit}
.mode-btn:hover{transform:translateY(-10px);border-color:var(--crimson);box-shadow:0 22px 40px rgba(229,23,107,.16)}
.mode-icon{font-size:4.6em;margin-bottom:14px;line-height:1}
.mode-title{font-size:1.7em;font-weight:bold;color:var(--ink)}

/* ── ORTAK ── */
.hidden{display:none!important}
.q-label{font-size:clamp(1.5em,3vw,2.1em);font-weight:bold;color:var(--crimson-d);text-align:center}
.digital{font-weight:bold;background:#fff;border:4px solid #F0DCE4;border-radius:20px;padding:10px 30px;letter-spacing:2px;direction:ltr;color:var(--ink);line-height:1.2}
.csvg .hand{transition:transform 1.1s cubic-bezier(.3,1.1,.45,1)}
.opt{background:#fff;border:3px solid #F0DCE4;border-radius:18px;font-family:inherit;font-size:1.5em;font-weight:bold;color:var(--ink);cursor:pointer;padding:.55em .5em;text-align:center;transition:all .2s;line-height:1.45}
.opt:hover{border-color:var(--crimson);background:#FFF5F9}
.opt.correct{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.opt.wrong{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;animation:shake .4s}
.opt.picked{border-color:var(--gold);background:#FFF8E8}
.opt:disabled{cursor:default;opacity:.92}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.segments{height:14px;background:#F2E3E9;border-radius:8px;display:flex;overflow:hidden;width:100%}
.seg{flex:1;border-left:2px solid var(--paper);transition:background .3s}
.score-pop{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:3.4em;font-weight:bold;z-index:90;animation:popUp 1s forwards;pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.12)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}45%{opacity:1;transform:translate(-50%,-90%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

/* ── TEK OYUNCU ── */
#singleGame{width:100%;max-width:1560px;display:flex;gap:clamp(18px,2vw,40px);align-items:center;justify-content:center}
.s-left{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.5em;background:#fff;border:1px solid #F0DCE4;border-radius:26px;padding:.8em 1.1em;box-shadow:0 10px 26px rgba(158,14,72,.08)}
.s-top{display:flex;align-items:center;gap:.6em;font-weight:bold}
.s-top .sc{font-size:1.5em;color:var(--gold)}
.s-top .rnd{font-size:1.05em;color:var(--ink-soft)}
.s-display{min-height:clamp(220px,36vmin,400px);display:flex;align-items:center;justify-content:center}
.s-display .csvg{width:clamp(215px,35vmin,390px);height:clamp(215px,35vmin,390px);filter:drop-shadow(0 10px 20px rgba(229,23,107,.13))}
.s-display .digital{font-size:4.2em}
.s-opts{flex:1;display:grid;grid-template-columns:1fr;gap:.55em;max-width:min(46vw,760px)}
@media(min-width:1500px){.s-opts{grid-template-columns:1fr 1fr}.s-opts .opt{display:flex;align-items:center;justify-content:center;min-height:3.2em}}

/* ── DÜELLO ── */
#duelGame{width:100%;max-width:1240px;display:flex;flex-direction:column;gap:10px;height:100%}
.round-bar{height:12px;background:#F2E3E9;border-radius:8px;overflow:hidden;flex-shrink:0}
.round-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--ok),#9CCC65);border-radius:8px}
.duel-row{flex:1;min-height:0;display:flex;gap:14px}
.side{flex:1;display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid #F0DCE4;border-radius:22px;padding:14px 16px;position:relative;box-shadow:0 8px 22px rgba(158,14,72,.07);min-width:0}
.side.p1{border-top:5px solid var(--crimson)}
.side.p2{border-top:5px solid var(--blue)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:bold}
.side-name{font-size:1.15em}
.p1 .side-name{color:var(--crimson)}
.p2 .side-name{color:var(--blue)}
.side-score{font-size:1.3em;color:var(--gold)}
.side-display{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:clamp(130px,24vmin,290px)}
.side-display .csvg{width:clamp(125px,23vmin,280px);height:clamp(125px,23vmin,280px)}
.side-display .digital{font-size:2.6em;padding:.2em .7em}
.side-opts{display:grid;grid-template-columns:1fr 1fr;gap:.45em;flex:1;min-height:0}
.side-opts .opt{font-size:1.3em;padding:.4em .3em;display:flex;align-items:center;justify-content:center}

/* ── SONUÇ MODALI ── */
#modal{display:none;position:fixed;inset:0;background:rgba(42,47,69,.55);backdrop-filter:blur(7px);z-index:999;justify-content:center;align-items:center;padding:18px}
.modal-card{background:#fff;padding:38px 34px;border-radius:30px;text-align:center;border-top:8px solid var(--crimson);max-width:480px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.25);animation:mShow .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes mShow{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.m-title{font-size:2.2em;font-weight:bold;color:var(--crimson-d);margin-bottom:10px}
.m-stars{font-size:2.6em;margin-bottom:8px}
.m-score{font-size:2em;color:var(--ink-soft);margin-bottom:24px;font-weight:bold}
.m-btn{background:var(--crimson);color:#fff;border:none;padding:14px 30px;border-radius:100px;font-size:1.15em;font-weight:bold;cursor:pointer;font-family:inherit;transition:.2s;margin:4px}
.m-btn:hover{transform:scale(1.05);background:var(--crimson-d)}
.m-btn.alt{background:#fff;color:var(--crimson-d);border:2px solid var(--crimson)}

/* dar + DİKEY (cep portre): taraflar alt alta */
@media(max-width:880px) and (orientation:portrait){
  #singleGame{flex-direction:column;gap:16px}
  .s-opts{width:100%;max-width:520px}
  .duel-row{flex-direction:column}
  .side-display{min-height:120px}
  .side-display .csvg{width:118px;height:118px}
  .side-display .digital{font-size:2.2em}
  .side-opts .opt{padding:8px 4px}
  .stage{align-items:flex-start;overflow-y:auto}
}
/* yatay cep: kısa ekranda dikey alanı koru */
@media(max-height:560px) and (min-width:560px){
  body{font-size:clamp(15px,2.6vmin + 6px,22px)}
  .bar{height:40px}
  .bar-name{font-size:14px}
  .stage{padding:8px}
  #startScreen h1{margin-bottom:10px}
  .fmt-row{margin-bottom:14px}
  .mode-btn{padding:14px 22px}
  .mode-icon{font-size:2.6em;margin-bottom:6px}
  .s-display{min-height:clamp(150px,52vmin,230px)}
  .s-display .csvg{width:clamp(145px,50vmin,225px);height:clamp(145px,50vmin,225px)}
  .s-display .digital{font-size:3em}
  .side-display{min-height:clamp(95px,34vmin,140px)}
  .side-display .csvg{width:clamp(92px,32vmin,135px);height:clamp(92px,32vmin,135px)}
  .side-display .digital{font-size:1.9em}
  .segments{height:9px}
  .round-bar{height:8px}
}
</style>

<script defer src="/_vercel/speed-insights/script.js"></script>

<div class="bar">
  <a class="bar-back" href="/7sinif/4/">↩ العَوْدَة</a>

</div>

<div class="stage">

  <!-- BAŞLANGIÇ -->

    <div class="fmt-row">

        <div class="mode-icon">👥</div>
        <div class="mode-title">لاعِبان</div>

        <div class="side-display" id="p2Display"></div>
        <div class="side-opts" id="p2Opts"></div>
        <div class="segments" id="p2Seg"></div>
      </div>

  </div>

</div>

<!-- SONUÇ -->
<div id="modal">
  <div class="modal-card">
    <div class="m-title" id="mTitle"></div>
    <div class="m-stars" id="mStars"></div>
    <div class="m-score" id="mScore"></div>
    <button class="m-btn" onclick="playAgain()">🔄 اِلْعَبْ مَرَّةً أُخْرى</button>
    <button class="m-btn alt" onclick="location.href='/7sinif/4/'">القائِمَة ↩</button>
  </div>
</div>

<script>
/* ── SES (WebAudio — dış dosya yok) ── */
let _actx;
function _ac(){if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();return _actx}
function _tone(f,d,t,v,dl){t=t||'sine';v=v||.3;dl=dl||0;try{const c=_ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type=t;const s=c.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
let _arSes=null;
if(typeof speechSynthesis!=='undefined')speechSynthesis.onvoiceschanged=function(){_arSes=null};
function konuş(m){if(!('speechSynthesis' in window))return;if(!_arSes){const v=speechSynthesis.getVoices();_arSes=v.find(x=>x.lang==='ar-SA')||v.find(x=>x.lang&&x.lang.indexOf('ar')===0)||null}if(!_arSes)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.voice=_arSes;u.lang='ar-SA';u.rate=.85;u.volume=.95;speechSynthesis.speak(u)}
function sesDoğru(){_tone(523,.1);_tone(659,.1,'sine',.3,.1);_tone(784,.25,'sine',.3,.2);konuş(['أَحْسَنْتَ','مُمْتاز','رائِع'][Math.floor(Math.random()*3)])}
function sesYanlış(){_tone(180,.15,'sawtooth',.25);_tone(150,.2,'sawtooth',.2,.15)}
function sesTıkla(){_tone(900,.04,'sine',.12)}
function sesBitir(){[523,659,784,1047,1319].forEach((f,i)=>_tone(f,.18,'sine',.28,i*.12))}

/* ── VERİ — kitap formları: وَالرُّبْع / وَالثُّلُث / وَالنِّصْف ── */
const DATA=[
 {h:1, m:15,ar:"السّاعَة الواحِدَة وَالرُّبْع"},
 {h:1, m:30,ar:"السّاعَة الواحِدَة وَالنِّصْف"},
 {h:2, m:15,ar:"السّاعَة الثّانِيَة وَالرُّبْع"},
 {h:3, m:20,ar:"السّاعَة الثّالِثَة وَالثُّلُث"},
 {h:3, m:30,ar:"السّاعَة الثّالِثَة وَالنِّصْف"},
 {h:4, m:30,ar:"السّاعَة الرّابِعَة وَالنِّصْف"},
 {h:5, m:20,ar:"السّاعَة الخامِسَة وَالثُّلُث"},
 {h:6, m:15,ar:"السّاعَة السّادِسَة وَالرُّبْع"},
 {h:7, m:20,ar:"السّاعَة السّابِعَة وَالثُّلُث"},
 {h:8, m:30,ar:"السّاعَة الثّامِنَة وَالنِّصْف"},
 {h:9, m:15,ar:"السّاعَة التّاسِعَة وَالرُّبْع"},
 {h:10,m:20,ar:"السّاعَة العاشِرَة وَالثُّلُث"},
 {h:11,m:30,ar:"السّاعَة الحادِيَة عَشْرَة وَالنِّصْف"},
 {h:12,m:15,ar:"السّاعَة الثّانِيَة عَشْرَة وَالرُّبْع"}
];
const S_TOTAL=10, D_TOTAL=5, ROUND_MS=15000;
let fmt='analog', mode='';
function arDig(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
function digitalStr(q){return arDig(q.h)+':'+arDig(String(q.m).padStart(2,'0'))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setFmt(f){sesTıkla();fmt=f;
 document.getElementById('fmtA').classList.toggle('on',f==='analog');
 document.getElementById('fmtD').classList.toggle('on',f==='digital');}

/* ── ANALOG SVG (Arap-Hint rakamlı, hep ileri dönen ibreler) ── */
function clockSVG(color){
 const nums=['١٢','١','٢','٣','٤','٥','٦','٧','٨','٩','١٠','١١'];let t='',L='';
 for(let i=0;i<60;i++){if(i%5===0)continue;const a=(i*6-90)*Math.PI/180;
  t+=`<line x1="${(100+86*Math.cos(a)).toFixed(1)}" y1="${(100+86*Math.sin(a)).toFixed(1)}" x2="${(100+91*Math.cos(a)).toFixed(1)}" y2="${(100+91*Math.sin(a)).toFixed(1)}" stroke="#EBD7E0" stroke-width="1.5"/>`}
 for(let i=0;i<12;i++){const a=(i*30-90)*Math.PI/180;
  L+=`<text x="${(100+72*Math.cos(a)).toFixed(1)}" y="${(100+72*Math.sin(a)+6.5).toFixed(1)}" text-anchor="middle" font-size="17" font-family="Arakom" font-weight="bold" fill="#2A2F45">${nums[i]}</text>`}
 return `<svg class="csvg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="95" fill="#fff" stroke="${color}" stroke-width="6"/>${t}${L}
  <g class="hand mh" style="transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="34" stroke="${color}" stroke-width="4.5" stroke-linecap="round"/></g>
  <g class="hand hh" style="transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="57" stroke="#2A2F45" stroke-width="7" stroke-linecap="round"/></g>
  <circle cx="100" cy="100" r="6" fill="${color}"/></svg>`;
}
/* her gösterim alanı kendi kümülatif açısını data-attr'da tutar (ileri dönüş) */
function showTime(elId,q,color){
 const el=document.getElementById(elId);
 if(fmt==='digital'){el.innerHTML=`<div class="digital">${digitalStr(q)}</div>`;return}
 let w=el.querySelector('.csvg');let first=false;
 if(!w){el.innerHTML=clockSVG(color);w=el.querySelector('.csvg');first=true;w.dataset.h=0;w.dataset.m=0}
 const hT=(q.h%12)*30+q.m*.5, mT=q.m*6;
 let pH=parseFloat(w.dataset.h)||0, pM=parseFloat(w.dataset.m)||0;
 let dH=hT-(pH%360); if(dH<0)dH+=360;
 let dM=mT-(pM%360); if(dM<0)dM+=360;
 const extra=first?0:360;
 pH+=dH+extra; pM+=dM+extra;
 w.dataset.h=pH; w.dataset.m=pM;
 setTimeout(()=>{const hh=w.querySelector('.hh'),mh=w.querySelector('.mh');
  if(hh)hh.style.transform=`rotate(${pH}deg)`;
  if(mh)mh.style.transform=`rotate(${pM}deg)`;},20);
}

function buildSeg(id,n){const b=document.getElementById(id);b.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('div');s.className='seg';b.appendChild(s)}}
function options4(q,deck){
 const wrongs=shuffle(deck.filter(o=>o.ar!==q.ar)).slice(0,3).map(o=>o.ar);
 return shuffle([q.ar,...wrongs]);
}
function pop(parentId,txt,color){const s=document.getElementById(parentId);const p=document.createElement('div');p.className='score-pop';p.textContent=txt;p.style.color=color;s.appendChild(p);setTimeout(()=>p.remove(),1000)}

/* ── TEK OYUNCU ── */
let sDeck,sCur,sScore,sLock;
function startSingle(){
 sesTıkla();mode='single';
 document.getElementById('startScreen').classList.add('hidden');
 document.getElementById('singleGame').classList.remove('hidden');
 sDeck=shuffle([...DATA]).slice(0,S_TOTAL);sCur=0;sScore=0;sLock=false;
 document.getElementById('sScore').textContent=0;
 document.getElementById('sTot').textContent=arDig(S_TOTAL);
 document.getElementById('sDisplay').innerHTML='';
 buildSeg('sSeg',S_TOTAL);loadSingle();
}
function loadSingle(){
 if(sCur>=S_TOTAL){endSingle();return}
 const q=sDeck[sCur];sLock=false;
 document.getElementById('sNum').textContent=arDig(sCur+1);
 showTime('sDisplay',q,'#E5176B');
 const cont=document.getElementById('sOpts');cont.innerHTML='';
 options4(q,DATA).forEach(o=>{
  const b=document.createElement('button');b.className='opt';b.textContent=o;
  b.onclick=()=>{
   if(sLock)return;sLock=true;
   const segs=document.getElementById('sSeg').children;
   document.querySelectorAll('#sOpts .opt').forEach(x=>x.disabled=true);
   if(o===q.ar){sesDoğru();b.classList.add('correct');sScore+=10;
    document.getElementById('sScore').textContent=sScore;
    if(segs[sCur])segs[sCur].style.background='var(--ok)';
   }else{sesYanlış();b.classList.add('wrong');
    document.querySelectorAll('#sOpts .opt').forEach(x=>{if(x.textContent===q.ar)x.classList.add('correct')});
    if(segs[sCur])segs[sCur].style.background='var(--bad)';
   }
   sCur++;setTimeout(loadSingle,1400);
  };
  cont.appendChild(b);
 });
}
function endSingle(){
 sesBitir();
 document.getElementById('mTitle').textContent='🎉 أَحْسَنْتَ!';
 document.getElementById('mStars').textContent=sScore>=90?'⭐⭐⭐':sScore>=70?'⭐⭐':'⭐';
 document.getElementById('mScore').textContent=sScore+'%';
 document.getElementById('modal').style.display='flex';
}

/* ── DÜELLO (iki oyuncuya AYNI soru → adil yarış) ── */
let dDeck,dCur,P1,P2,roundTimer,roundStart,revealed;
function startDuel(){
 sesTıkla();mode='duel';
 document.getElementById('startScreen').classList.add('hidden');
 document.getElementById('duelGame').classList.remove('hidden');
 dDeck=shuffle([...DATA]).slice(0,D_TOTAL);dCur=0;
 P1={score:0,pick:null,t:0,btn:null};P2={score:0,pick:null,t:0,btn:null};
 document.getElementById('p1Score').textContent='⭐ 0';
 document.getElementById('p2Score').textContent='⭐ 0';
 document.getElementById('p1Display').innerHTML='';
 document.getElementById('p2Display').innerHTML='';
 buildSeg('p1Seg',D_TOTAL);buildSeg('p2Seg',D_TOTAL);
 loadRound();
}
function loadRound(){
 if(dCur>=D_TOTAL){endDuel();return}
 revealed=false;P1.pick=null;P2.pick=null;P1.btn=null;P2.btn=null;
 const q=dDeck[dCur];
 showTime('p1Display',q,'#E5176B');
 showTime('p2Display',q,'#0288D1');
 const optSet=options4(q,DATA);               // 4'lü set turda BİR KEZ üretilir (adil yarış)
 [[1,P1],[2,P2]].forEach(([n,P])=>{
  const cont=document.getElementById('p'+n+'Opts');cont.innerHTML='';
  shuffle([...optSet]).forEach(o=>{           // her tarafta AYNI 4 seçenek, FARKLI sıra
   const b=document.createElement('button');b.className='opt';b.textContent=o;
   b.onclick=()=>{
    if(P.pick!==null||revealed)return;
    sesTıkla();P.pick=o;P.t=Date.now();P.btn=b;b.classList.add('picked');
    if(P1.pick!==null&&P2.pick!==null)reveal(q);
   };
   cont.appendChild(b);
  });
 });
 /* tur sayacı: cevapsız kalınamaz, kilitlenme yok */
 clearInterval(roundTimer);roundStart=Date.now();
 const fill=document.getElementById('roundFill');fill.style.width='100%';fill.style.background='linear-gradient(90deg,var(--ok),#9CCC65)';
 roundTimer=setInterval(()=>{
  const left=Math.max(0,ROUND_MS-(Date.now()-roundStart));
  const pct=left/ROUND_MS*100;
  fill.style.width=pct+'%';
  if(pct<35)fill.style.background='linear-gradient(90deg,#F5A623,#FFC107)';
  if(pct<15)fill.style.background='linear-gradient(90deg,var(--bad),#FF7043)';
  if(left===0){clearInterval(roundTimer);reveal(q)}
 },60);
}
function reveal(q){
 if(revealed)return;revealed=true;clearInterval(roundTimer);
 document.querySelectorAll('#duelGame .opt').forEach(x=>x.disabled=true);
 const res=[[1,P1],[2,P2]].map(([n,P])=>{
  const segs=document.getElementById('p'+n+'Seg').children;
  const ok=P.pick===q.ar;
  /* doğru cevabı her iki tarafta da göster */
  document.querySelectorAll('#p'+n+'Opts .opt').forEach(x=>{if(x.textContent===q.ar)x.classList.add('correct')});
  if(ok){P.score+=10;if(segs[dCur])segs[dCur].style.background='var(--ok)';
   pop('side'+n,'+10','var(--ok)');
  }else{if(P.btn)P.btn.classList.add('wrong');
   if(segs[dCur])segs[dCur].style.background='var(--bad)';}
  return{n,P,ok};
 });
 const corr=res.filter(r=>r.ok);
 if(corr.length){sesDoğru()}else{sesYanlış()}
 if(corr.length===2){                       // ikisi de doğru → hızlı olana ⚡ bonus
  const fast=corr.reduce((a,b)=>a.P.t<=b.P.t?a:b);
  setTimeout(()=>{fast.P.score+=5;pop('side'+fast.n,'⚡ +5','var(--gold)');updScores()},650);
 }else if(corr.length===1){
  setTimeout(()=>{corr[0].P.score+=5;pop('side'+corr[0].n,'⚡ +5','var(--gold)');updScores()},650);
 }
 updScores();
 dCur++;setTimeout(loadRound,2200);
}
function updScores(){
 document.getElementById('p1Score').textContent='⭐ '+P1.score;
 document.getElementById('p2Score').textContent='⭐ '+P2.score;
}
function endDuel(){
 sesBitir();
 let t;
 if(P1.score>P2.score)t='🏆 الفائِز: اللّاعِب الأَوَّل!';
 else if(P2.score>P1.score)t='🏆 الفائِز: اللّاعِب الثّاني!';
 else t='🤝 تَعادُل!';
 document.getElementById('mTitle').textContent=t;
 document.getElementById('mStars').textContent='';
 document.getElementById('mScore').innerHTML='<span style="color:var(--crimson)">'+P1.score+'</span> — <span style="color:var(--blue)">'+P2.score+'</span>';
 document.getElementById('modal').style.display='flex';
}

function playAgain(){
 document.getElementById('modal').style.display='none';
 if(mode==='single')startSingle();else startDuel();
}
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صَنِّفْ وَسائِط النَّقْل — جَوًّا/بَحْرًا/بَرًّا</title>
<style>
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0c1d3a,#1B5E20,#4CAF50);min-height:100vh;color:#0c1d3a;padding:20px;font-size:clamp(20px,2.4vw,32px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:900px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#1B5E20;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#2E7D32;margin-bottom:14px;font-size:1.2em}
.bar{display:flex;justify-content:space-between;background:#E8F5E9;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-weight:bold;color:#1B5E20;flex-wrap:wrap;gap:6px}
.tip{background:#FFF8E1;border-right:4px solid #FFC107;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#5D4037;font-size:1.15em;line-height:1.55}
.tip b{color:#1B5E20}
.stage{display:flex;justify-content:center;min-height:90px;align-items:center;margin-bottom:14px}
.item-card{background:linear-gradient(135deg,#4CAF50,#1B5E20);color:#fff;border-radius:18px;padding:14px 26px;font-size:1.5em;font-weight:bold;font-family:'Arakom',sans-serif;box-shadow:0 8px 22px rgba(27,94,32,.35);cursor:grab;user-select:none;touch-action:none;transition:transform .2s,opacity .25s;text-align:center}
.item-card:hover{transform:translateY(-2px)}
.item-card.dragging{opacity:.3;cursor:grabbing}
.item-card .em{font-size:2em;display:block}
.item-card .ar{margin-top:4px;font-size:.85em}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cat{background:#F1F8E9;border:3px dashed #A5D6A7;border-radius:14px;padding:14px;text-align:center;min-height:140px;transition:all .25s;display:flex;flex-direction:column;gap:6px}
.cat .title{font-weight:bold;color:#1B5E20;font-size:1.05em}
.cat .title-tr{font-size:.78em;color:#558B2F;font-weight:normal}
.cat .icon{font-size:1.6em}
.cat.drop-target{background:#FFF9C4;border-color:#FFC107;border-style:solid;transform:scale(1.03)}
.cat.correct-drop{background:#C8E6C9;border-color:#4CAF50;border-style:solid}
.cat.wrong-drop{background:#FFCDD2;border-color:#F44336;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cat-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.cat-chip{background:#4CAF50;color:#fff;padding:4px 10px;border-radius:12px;font-size:.85em;font-weight:bold}
.drag-ghost{position:fixed;pointer-events:none;background:linear-gradient(135deg,#4CAF50,#1B5E20);color:#fff;padding:14px 26px;border-radius:18px;font-size:1.5em;font-weight:bold;font-family:'Arakom',sans-serif;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
.fb{text-align:center;margin-top:10px;min-height:22px;font-weight:bold}
.btn{display:inline-block;background:linear-gradient(135deg,#2E7D32,#4CAF50);color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#2E7D32;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10;text-decoration:none}
.back:hover{background:rgba(0,0,0,.85)}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائِمَة</a>
<div class="box">
<h1>📂 صَنِّفْ وَسائِط النَّقْل</h1>
<div class="sub">اِسْحَبْ كُلّ وَسيلَة إِلى نَوْعِها — جَوًّا، بَحْرًا، بَرًّا</div>
<div id="game">
<div class="tip">
<b>📘 الأَنْواع:</b> <b>جَوًّا</b> أَيْ مِن السَّماء — <b>بَرًّا</b> أَيْ عَلى الأَرْض — <b>بَحْرًا</b> أَيْ عَلى الماء. ٨ وَسائِل في ٣ مَجْموعات
</div>
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>المُتَبَقّي: <span id="left">12</span></span></div>
<div class="stage" id="stage"></div>
<div class="cats">
  <div class="cat" data-cat="air"><div class="icon">✈️</div><div class="title">جَوًّا</div><div class="cat-items" id="cat-air"></div></div>
  <div class="cat" data-cat="land"><div class="icon">🛣️</div><div class="title">بَرًّا</div><div class="cat-items" id="cat-land"></div></div>
  <div class="cat" data-cat="sea"><div class="icon">🌊</div><div class="title">بَحْرًا</div><div class="cat-items" id="cat-sea"></div></div>
</div>
<div class="fb" id="fb"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#1B5E20">🎉 أَحْسَنْتَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#2E7D32;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إعادَة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائِمَة ↩</button>
</div>
</div>
<script>

var ITEMS=[
{em:'✈️',ar:'الطّائِرَة',cat:'air'},
{em:'🚗',ar:'السَّيّارَة',cat:'land'},
{em:'🚌',ar:'الحافِلَة',cat:'land'},
{em:'🚆',ar:'القِطار',cat:'land'},
{em:'🚲',ar:'الدَّرّاجَة',cat:'land'},
{em:'🚇',ar:'المَتْرو',cat:'land'},
{em:'🚶',ar:'مَشْيًا',cat:'land'},
{em:'🚢',ar:'السَّفينَة',cat:'sea'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var queue,cur,sc,dragState=null;
function init(){
queue=shuf([...ITEMS]);cur=0;sc=0;
document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');
document.getElementById('cat-air').innerHTML='';document.getElementById('cat-land').innerHTML='';document.getElementById('cat-sea').innerHTML='';
document.getElementById('sc').textContent=0;
showNext();
attachCatHandlers();
}
function showNext(){
document.getElementById('left').textContent=queue.length-cur;
if(cur>=queue.length){end();return}
var it=queue[cur];
var stage=document.getElementById('stage');stage.innerHTML='';
var c=document.createElement('div');c.className='item-card';c.id='currentItem';
c.innerHTML='<span class="em">'+it.em+'</span><span class="ar">'+it.ar+'</span>';
c.dataset.cat=it.cat;c.dataset.ar=it.ar;c.dataset.em=it.em;
c.addEventListener('mousedown',startDrag);c.addEventListener('touchstart',startDrag,{passive:false});
stage.appendChild(c);
}
function startDrag(e){
e.preventDefault();
var card=document.getElementById('currentItem');
var ghost=document.createElement('div');ghost.className='drag-ghost';
ghost.innerHTML='<span style="font-size:2em;display:block">'+card.dataset.em+'</span><span style="font-size:.85em">'+card.dataset.ar+'</span>';
document.body.appendChild(ghost);
card.classList.add('dragging');
var pt=getPt(e);ghost.style.left=pt.x+'px';ghost.style.top=pt.y+'px';
dragState={card:card,ghost:ghost,target:null,catCorrect:card.dataset.cat};
document.addEventListener('mousemove',dragMove);document.addEventListener('mouseup',dragEnd);
document.addEventListener('touchmove',dragMove,{passive:false});document.addEventListener('touchend',dragEnd);
}
function getPt(e){if(e.touches&&e.touches.length)return {x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.changedTouches&&e.changedTouches.length)return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};return {x:e.clientX,y:e.clientY}}
function dragMove(e){
if(!dragState)return;e.preventDefault();
var pt=getPt(e);
dragState.ghost.style.left=pt.x+'px';dragState.ghost.style.top=pt.y+'px';
dragState.ghost.style.display='none';
var el=document.elementFromPoint(pt.x,pt.y);
dragState.ghost.style.display='block';
if(dragState.target){dragState.target.classList.remove('drop-target');dragState.target=null}
var cat=el?el.closest('.cat'):null;
if(cat){cat.classList.add('drop-target');dragState.target=cat}
}
function dragEnd(e){
if(!dragState)return;e.preventDefault();
var ds=dragState;ds.card.classList.remove('dragging');ds.ghost.remove();
document.removeEventListener('mousemove',dragMove);document.removeEventListener('mouseup',dragEnd);
document.removeEventListener('touchmove',dragMove);document.removeEventListener('touchend',dragEnd);
if(ds.target){
ds.target.classList.remove('drop-target');
var cat=ds.target.dataset.cat;
if(cat===ds.catCorrect){
ds.target.classList.add('correct-drop');setTimeout(function(){ds.target.classList.remove('correct-drop')},700);
sc+=10;document.getElementById('sc').textContent=sc;
var chip=document.createElement('div');chip.className='cat-chip';chip.textContent=ds.card.dataset.em+' '+ds.card.dataset.ar;
document.getElementById('cat-'+cat).appendChild(chip);
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';
setTimeout(function(){document.getElementById('fb').textContent=''},700);
cur++;setTimeout(showNext,500);
}else{
ds.target.classList.add('wrong-drop');setTimeout(function(){ds.target.classList.remove('wrong-drop')},420);
document.getElementById('fb').textContent='❌ لَيْسَ هَذا النَّوْع';document.getElementById('fb').style.color='#F44336';
setTimeout(function(){document.getElementById('fb').textContent=''},1100);
}
}
dragState=null;
}
function attachCatHandlers(){}
function end(){
var fs=Math.round(sc/(ITEMS.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
<script>/* tek-ekran sığdırma v2 (tahta kuralı) */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;return document.querySelector(SEL)}function fit(){if(matchMedia('(orientation: portrait) and (max-width: 880px)').matches){document.documentElement.style.overflow='';document.body.style.overflow='';return}var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var avail=innerHeight-Math.max(8,r.top)-10;var f=Math.min(1,avail/Math.max(1,r.height));el.style.transformOrigin='top center';var on=f<0.999;el.style.transform=on?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow=on?'hidden':'';document.body.style.overflow=on?'hidden':''}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>

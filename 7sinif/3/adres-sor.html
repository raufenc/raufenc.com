<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السُّؤال عَن العُنْوان — أَيْن / كَيْف / بِماذا</title>
<style>
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0c1d3a,#BF360C,#FF5722);min-height:100vh;color:#0c1d3a;padding:20px;font-size:clamp(20px,2.4vw,32px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:780px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#BF360C;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#E64A19;margin-bottom:14px;font-size:1.2em}
.bar{display:flex;justify-content:space-between;background:#FBE9E7;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-weight:bold;color:#BF360C;flex-wrap:wrap;gap:6px}
.tip{background:#FFF8E1;border-right:4px solid #FFC107;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#5D4037;font-size:1.15em;line-height:1.55}
.tip b{color:#BF360C}
.q-card{background:linear-gradient(135deg,#FF5722,#BF360C);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(191,54,12,.4)}
.q-card .badge{display:inline-block;background:#FFD54F;color:#5D4037;padding:4px 14px;border-radius:18px;font-size:.78em;font-weight:bold;margin-bottom:8px}
.q-card .quest{font-size:1.3em;line-height:1.55}
.q-card .tr{font-size:.82em;color:rgba(255,255,255,.78);margin-top:8px;font-style:italic}
.opts{display:grid;gap:10px}
.opt{background:#FBE9E7;border:2px solid #FFAB91;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:1.05em;color:#BF360C;transition:all .2s;text-align:right;font-weight:600;direction:rtl}
.opt:hover{background:#FFCCBC;transform:translateX(-4px)}
.opt.correct{background:#C8E6C9;border-color:#4CAF50;color:#1B5E20}
.opt.wrong{background:#FFCDD2;border-color:#F44336;color:#B71C1C}
.opt.disabled{pointer-events:none;opacity:.6}
.fb{text-align:center;margin-top:14px;min-height:24px;font-weight:bold;font-size:1em}
.exp{text-align:center;color:#E64A19;margin-top:6px;font-size:1.15em;background:#FBE9E7;padding:8px 12px;border-radius:10px;min-height:0}
.btn{display:inline-block;background:linear-gradient(135deg,#FF5722,#BF360C);color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#BF360C;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10;text-decoration:none}
.back:hover{background:rgba(0,0,0,.85)}

/* yatay-öncelik */
@media (orientation:landscape) and (min-width:1000px){
  .box{max-width:min(1480px,94vw)}
  #game{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:center}
  #game>.bar,#game>.tip,#game>.fb,#game>.exp{grid-column:1/-1}
}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائِمَة</a>
<div class="box">
<h1>📍 السُّؤال عَن العُنْوان</h1>
<div class="sub">اِخْتَر الجَواب المُناسِب لِكُلّ سُؤال (أَيْن / كَيْف / بِماذا / إِلى أَيْن)</div>
<div id="game">
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>السُّؤال: <span id="qn">1</span>/10</span></div>
<div class="q-card">
  <div class="badge" id="badge">أَيْن…؟</div>
  <div class="quest" id="quest">…</div>
</div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#BF360C">🎉 أَحْسَنْتَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#E64A19;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إِعادَة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائِمَة ↩</button>
</div>
</div>
<script>
var ALL=[
{badge:'أَيْن…؟',q:'أَيْن عُنْوان المَدْرَسَة؟',ans:'في شارِع الفاتِح، رَقْم ١٢',opts:['في شارِع الفاتِح، رَقْم ١٢','بِالحافِلَة','إِلى البَيْت','بَعْد الظُّهْر'],exp:'"أَيْن" بِجَواب المَكان'},
{badge:'كَيْف…؟',q:'كَيْف أَذْهَبُ إِلى المَطار؟',ans:'اِذْهَبْ يَمينًا ثُمَّ يَسارًا',opts:['اِذْهَبْ يَمينًا ثُمَّ يَسارًا','بِخَمْس ليرات','إِلى البَيْت','صَباحًا'],exp:'"كَيْف" بِجَواب الطَّريقَة'},
{badge:'بِماذا…؟',q:'بِماذا تَذْهَبُ إِلى العَمَل؟',ans:'بِالسَّيّارَة',opts:['بِالسَّيّارَة','في شارِع زَيْنَب','إِلى المَدْرَسَة','يَمينًا'],exp:'"بِماذا" بِجَواب الوَسيلَة'},
{badge:'إِلى أَيْن…؟',q:'إِلى أَيْن تُسافِرُ في العُطْلَة؟',ans:'إِلى إِسْطَنْبول',opts:['إِلى إِسْطَنْبول','بِالطّائِرَة','صَباحًا','أَنا مِنْ تُرْكِيا'],exp:'"إِلى أَيْن" بِجَواب الوُجْهَة'},
{badge:'مِنْ أَيْن…؟',q:'مِنْ أَيْن أَنْتَ؟',ans:'أَنا مِنْ تُرْكِيا',opts:['أَنا مِنْ تُرْكِيا','إِلى المَدْرَسَة','بِالقِطار','نَعَمْ'],exp:'"مِنْ أَيْن" بِجَواب الأَصْل'},
{badge:'أَيْن…؟',q:'أَيْن مَحَطَّة الحافِلَة؟',ans:'عَلى اليَمين، أَمام المَسْجِد',opts:['عَلى اليَمين، أَمام المَسْجِد','بِالطّائِرَة','إِلى المَطار','صَباحًا'],exp:'"أَيْن" بِجَواب المَكان'},
{badge:'كَيْف…؟',q:'كَيْف أَصِلُ إِلى السّوق؟',ans:'اِمْشِ إِلى الأَمام، ثُمَّ اتَّجِهْ إِلى اليَمين',opts:['اِمْشِ إِلى الأَمام، ثُمَّ اتَّجِهْ إِلى اليَمين','بِالحافِلَة','إِلى المَدْرَسَة','صَباحًا'],exp:'"كَيْف" بِجَواب الإِرْشاد'},
{badge:'بِماذا…؟',q:'بِماذا تُسافِرُ إِلى مَكَّة المُكَرَّمَة؟',ans:'بِالطّائِرَة',opts:['بِالطّائِرَة','في الشّارِع','يَمينًا','صَباحًا'],exp:'"بِماذا" بِجَواب الوَسيلَة'},
{badge:'إِلى أَيْن…؟',q:'إِلى أَيْن تَذْهَبُ يَوْم الجُمُعَة؟',ans:'إِلى المَسْجِد لِصَلاة الجُمُعَة',opts:['إِلى المَسْجِد لِصَلاة الجُمُعَة','بِالحافِلَة','عَلى اليَسار','أَنا تُرْكِيّ'],exp:'"إِلى أَيْن" بِجَواب الوُجْهَة'},
{badge:'أَيْن…؟',q:'أَيْن تَسْكُنُ يا أَحْمَد؟',ans:'أَسْكُنُ في شارِع الحَدائِق',opts:['أَسْكُنُ في شارِع الحَدائِق','بِالقِطار','إِلى البَيْت','صَباحًا'],exp:'"أَيْن" بِجَواب المَكان'},
{badge:'كَيْف…؟',q:'كَيْف تَعْرِفُ الشّارِع؟',ans:'مِن الإِشارات وَالأَرْقام',opts:['مِن الإِشارات وَالأَرْقام','بِالسَّيّارَة','إِلى المَدْرَسَة','بِخَمْس ليرات'],exp:'"كَيْف" بِجَواب الطَّريقَة'},
{badge:'بِماذا…؟',q:'بِماذا تَذْهَبُ إِلى المَدْرَسَة؟',ans:'بِالحافِلَة',opts:['بِالحافِلَة','صَباحًا','أَمام السّوق','نَعَمْ'],exp:'"بِماذا" بِجَواب الوَسيلَة'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc;
function init(){qs=shuf([...ALL]).slice(0,10);cur=0;sc=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('badge').textContent=q.badge;
document.getElementById('quest').textContent=q.q;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
var el=document.getElementById('opts');el.innerHTML='';
shuf([...q.opts]).forEach(function(o){
var b=document.createElement('div');b.className='opt';b.textContent=o;
b.onclick=function(){answer(o,b,q)};
el.appendChild(b);
});
}
function answer(o,b,q){
document.querySelectorAll('.opt').forEach(function(x){x.classList.add('disabled')});
if(o===q.ans){b.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach(function(x){if(x.textContent===q.ans)x.classList.add('correct')});
document.getElementById('fb').textContent='❌ الصَّواب: '+q.ans;document.getElementById('fb').style.color='#F44336';}
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},1900);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/7sinif/oyunlar/intro.js" defer></script>
<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اِقْصِف الخَطَأ — أَفْعال السَّفَر</title>
<style>
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#1a0f1f,#440a4f,#9C27B0);min-height:100vh;color:#1a0f1f;padding:20px;font-size:clamp(20px,2.4vw,32px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:760px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#7B1FA2;font-size:2.2em;margin-bottom:6px}
.edited-tag{display:inline-block;background:#FFC107;color:#5D4037;padding:3px 12px;border-radius:14px;font-size:.72em;font-weight:bold;margin-left:6px}
.sub{text-align:center;color:#9C27B0;margin-bottom:14px;font-size:1.2em}
.bar{display:flex;justify-content:space-between;background:#F3E5F5;border-radius:12px;padding:10px 16px;margin-bottom:12px;font-weight:bold;color:#4A148C;flex-wrap:wrap;gap:6px}
.tip{background:#FFF8E1;border-right:4px solid #FFC107;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#5D4037;font-size:1.15em;line-height:1.55}
.tip b{color:#7B1FA2}
.timer-wrap{width:100%;height:10px;background:#F3E5F5;border-radius:5px;margin-bottom:14px;overflow:hidden}
.timer-bar{height:100%;background:#4CAF50;border-radius:5px;transition:width .1s linear,background .3s}
.cat{background:linear-gradient(135deg,#7B1FA2,#4A148C);color:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:12px;font-size:1.2em;font-weight:bold;box-shadow:0 6px 18px rgba(123,31,162,.4)}
.cat .tr{font-size:.72em;color:rgba(255,255,255,.78);margin-top:6px;font-weight:normal;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.opt{background:#F3E5F5;border:2px solid #CE93D8;border-radius:14px;padding:14px;cursor:pointer;font-size:1.05em;color:#4A148C;transition:all .2s;text-align:center;font-weight:600}
.opt:hover{background:#CE93D8;transform:translateY(-2px)}
.opt.correct{background:#C8E6C9;border-color:#4CAF50;color:#1B5E20}
.opt.wrong{background:#FFCDD2;border-color:#F44336;color:#B71C1C}
.opt.disabled{pointer-events:none;opacity:.6}
.fb{text-align:center;margin-top:10px;min-height:22px;font-weight:bold}
.exp{text-align:center;color:#7B1FA2;margin-top:4px;font-size:1.15em;background:#F3E5F5;padding:8px 12px;border-radius:10px;min-height:0}
.btn{display:inline-block;background:linear-gradient(135deg,#7B1FA2,#9C27B0);color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#7B1FA2;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10;text-decoration:none}
.back:hover{background:rgba(0,0,0,.85)}

@media (orientation:landscape) and (min-width:1000px){
  .box{max-width:min(1300px,92vw)}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائِمَة</a>
<div class="box">
<h1>💥 اِقْصِف الخَطَأ<span class="edited-tag">✎ وَقْت ٢٠ث · سَفَر</span></h1>
<div class="sub">اِخْتَر الكَلِمَة الَّتي لا تَنْتَمي إِلى المَجْموعَة (الوَقْت ٢٠ ثانِيَة)</div>
<div id="game">
<div class="tip">
<b>📘 التَّعْليمات:</b> في كُلّ مَجْموعَة كَلِمَة واحِدَة لا تُناسِبُ الباقي — اِقْصِفْها قَبْل انْتِهاء الوَقْت!
</div>
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>السُّؤال: <span id="qn">1</span>/<span id="tot">12</span></span></div>
<div class="timer-wrap"><div class="timer-bar" id="tbar" style="width:100%"></div></div>
<div class="cat" id="cat">…</div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#7B1FA2">🎉 أَحْسَنْتَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#9C27B0;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إِعادَة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائِمَة ↩</button>
</div>
</div>
<script>
var TIME=20000;  // 20 saniye

var ALL=[

{cat:'وَسائِط النَّقْل البَرِّيَّة',opts:['طائِرَة','حافِلَة','قِطار','سَيّارَة'],odd:0,exp:'الطّائِرَة وَحْدَها جَوِّيَّة — الباقي بَرِّيَّة'},
{cat:'وَسائِط النَّقْل البَرِّيَّة',opts:['سَيّارَة','حافِلَة','قِطار','سَفينَة'],odd:3,exp:'السَّفينَة بَحْرِيَّة، وَالباقي بَرِّيَّة'},
{cat:'وَسائِط النَّقْل البَرِّيَّة',opts:['سَفينَة','دَرّاجَة','حافِلَة','مِتْرو'],odd:0,exp:'السَّفينَة وَحْدَها بَحْرِيَّة — الباقي بَرِّيَّة'},

{cat:'كَلِمات المُقارَنَة',opts:['أَسْرَع','أَبْطَأ','أَكْبَر','سَيّارَة'],odd:3,exp:'سَيّارَة اسْم، وَالباقي صِيَغ تَفْضيل (أَفْعَل)'},

{cat:'الضَّوْء وَإِشارات المُرور',opts:['الضَّوْء الأَحْمَر','الضَّوْء الأَخْضَر','الضَّوْء الأَصْفَر','الحافِلَة'],odd:3,exp:'الحافِلَة وَسيلَة نَقْل، وَالباقي أَضْواء'},

{cat:'الاِتِّجاهات',opts:['اليَمين','اليَسار','الأَمام','الطّائِرَة'],odd:3,exp:'الطّائِرَة وَسيلَة نَقْل، وَالباقي اتِّجاهات'},

{cat:'الأَفْعال بِصيغَة الأَمْر',opts:['اِمْشِ','اُعْبُرْ','قِفْ','يَذْهَبُ'],odd:3,exp:'يَذْهَبُ فِعْل مُضارِع، وَالباقي أَفْعال أَمْر'},

{cat:'الأَماكِن',opts:['مَدْرَسَة','مُسْتَشْفى','مَسْجِد','قِطار'],odd:3,exp:'القِطار وَسيلَة نَقْل، وَالباقي أَماكِن'},
{cat:'المُدُن',opts:['إِسْطَنْبول','أَنْقَرَة','بورْصَة','مَكْتَبَة'],odd:3,exp:'المَكْتَبَة مَكان، لَيْسَتْ مَدينَة'},
{cat:'أَدَوات السُّؤال',opts:['كَيْف','بِماذا','مَتى','سَيّارَة'],odd:3,exp:'السَّيّارَة اسْم، وَالباقي أَدَوات سُؤال'},
{cat:'طُرُق السَّفَر',opts:['بَرًّا','بَحْرًا','جَوًّا','مَسْجِد'],odd:3,exp:'المَسْجِد مَكان، وَالباقي طُرُق سَفَر'},
{cat:'الأَفْعال المُضارِعَة',opts:['أَذْهَبُ','أُسافِرُ','أَرْكَبُ','حافِلَة'],odd:3,exp:'الحافِلَة اسْم، وَالباقي أَفْعال مُضارِعَة'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc,timerInt,curOdd;
function init(){qs=shuf([...ALL]).slice(0,12);cur=0;sc=0;document.getElementById('tot').textContent=qs.length;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
clearInterval(timerInt);
var q=qs[cur];
document.getElementById('cat').firstChild.textContent='المَجْموعَة: '+q.cat;
var _ca=document.getElementById('cattr');if(_ca)_ca.textContent='';
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
var el=document.getElementById('opts');el.innerHTML='';
var order=shuf(q.opts.map(function(_,i){return i;}));
curOdd=order.indexOf(q.odd);
order.forEach(function(origIdx,newIdx){
var b=document.createElement('div');b.className='opt';b.textContent=q.opts[origIdx];
b.onclick=function(){answer(newIdx,b,q)};
el.appendChild(b);
});
var start=Date.now();
timerInt=setInterval(function(){
var el2=Date.now()-start;var left=Math.max(0,TIME-el2);var pct=left/TIME*100;
var bar=document.getElementById('tbar');bar.style.width=pct+'%';
bar.style.background=pct>60?'#4CAF50':pct>30?'#FF9800':'#F44336';
if(left===0){clearInterval(timerInt);answer(-1,null,q)}
},50);
}
function answer(idx,b,q){
clearInterval(timerInt);
document.querySelectorAll('.opt').forEach(function(x){x.classList.add('disabled')});
document.getElementById('tbar').style.width='0%';
if(idx===curOdd){if(b)b.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{if(b)b.classList.add('wrong');
var correctBtn=document.querySelectorAll('.opt')[curOdd];if(correctBtn)correctBtn.classList.add('correct');
document.getElementById('fb').textContent=idx===-1?'⏰ اِنْتَهى الوَقْت':'❌ خَطَأ';document.getElementById('fb').style.color='#F44336';}
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},1900);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>

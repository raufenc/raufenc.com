<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كَوِّنْ جُمْلَة — أَفْعال السَّفَر</title>
<style>
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('/7sinif/oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0c1d3a,#102a52,#3F51B5);min-height:100vh;color:#0c1d3a;padding:16px;font-size:clamp(20px,2.3vw,30px)}
.box{background:#fff;border-radius:24px;padding:22px 24px;max-width:880px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#1A237E;font-size:2em;margin-bottom:4px}
.sub{text-align:center;color:#3F51B5;margin-bottom:12px;font-size:1.05em;line-height:1.5}
.sub b{color:#E65100}
.bar{display:flex;justify-content:space-between;background:#E8EAF6;border-radius:12px;padding:10px 18px;margin-bottom:12px;font-weight:bold;color:#1A237E;flex-wrap:wrap;gap:6px;font-size:.95em}
.q-card{background:linear-gradient(135deg,#3F51B5,#1A237E);color:#fff;border-radius:18px;padding:16px;text-align:center;margin-bottom:12px;box-shadow:0 8px 22px rgba(63,81,181,.4)}
.q-card .em{font-size:2.6em;line-height:1.1}
.q-card .quest{margin-top:6px;font-size:1.25em;line-height:1.5}
.built{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:#E8EAF6;border:3px dashed #7986CB;border-radius:16px;padding:14px;min-height:74px;margin-bottom:12px}
.built.complete{background:#C8E6C9;border-color:#4CAF50;border-style:solid}
.built.wrong{background:#FFCDD2;border-color:#F44336;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.built-chip{background:#3F51B5;color:#fff;padding:10px 18px;border-radius:18px;cursor:pointer;font-family:'Arakom',sans-serif;font-weight:bold;font-size:1.35em;user-select:none}
.built-chip:hover{background:#1A237E}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:#F3E5F5;border-radius:16px;min-height:74px;margin-bottom:10px}
.chip{background:linear-gradient(135deg,#7986CB,#3F51B5);color:#fff;padding:11px 20px;border-radius:18px;cursor:pointer;font-family:'Arakom',sans-serif;font-weight:bold;font-size:1.35em;user-select:none;transition:transform .2s,opacity .25s;box-shadow:0 4px 10px rgba(63,81,181,.3)}
.chip:hover{transform:translateY(-2px)}
.chip.used{opacity:.25;pointer-events:none}
.fb{text-align:center;margin-top:8px;min-height:26px;font-weight:bold}
.exp{text-align:center;color:#1B5E20;margin-top:6px;font-size:1.15em;min-height:0;line-height:1.6}
.btn{display:inline-block;background:linear-gradient(135deg,#3F51B5,#1A237E);color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#3F51B5;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10;text-decoration:none}
.back:hover{background:rgba(0,0,0,.85)}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائِمَة</a>
<div class="box">
<h1>🏗️ كَوِّنْ جُمْلَة</h1>
<div class="sub">اِقْرَأ السُّؤال، ثُمَّ رَتِّب الكَلِمات لِتُكَوِّنَ الجَواب — اِنْتَبِهْ: <b>كَلِمَة واحِدَة زائِدَة!</b></div>
<div id="game">
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>السُّؤال: <span id="qn">1</span>/<span id="tot">12</span></span></div>
<div class="q-card"><div class="em" id="em"></div><div class="quest" id="quest"></div></div>
<div class="built" id="built"></div>
<div class="pool" id="pool"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
<div style="text-align:center;margin-top:8px"><button class="btn alt" onclick="clearBuilt()">مَسْح ↻</button></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#1A237E">🎉 أَحْسَنْتَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#3F51B5;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إِعادَة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائِمَة ↩</button>
</div>
</div>
<script>

var ALL=[
{em:'🚌',q:'كَيْف تَذْهَبُ إِلى المَدْرَسَة؟',correct:['أَذْهَبُ','إِلى','المَدْرَسَة','بِالحافِلَة'],extra:['بِالطّائِرَة'],exp:'أَذْهَبُ إِلى المَدْرَسَة بِالحافِلَة'},
{em:'✈️',q:'بِماذا يُسافِرُ أَبوكَ إِلى أَنْقَرَة؟',correct:['يُسافِرُ','أَبي','إِلى','أَنْقَرَة','بِالطّائِرَة'],extra:['بَحْرًا'],exp:'يُسافِرُ أَبي إِلى أَنْقَرَة بِالطّائِرَة'},
{em:'🚆',q:'بِماذا تَرْجِعُ أُخْتُكَ إِلى إِسْطَنْبول؟',correct:['تَرْجِعُ','أُخْتي','إِلى','إِسْطَنْبول','بِالقِطار'],extra:['جَوًّا'],exp:'تَرْجِعُ أُخْتي إِلى إِسْطَنْبول بِالقِطار'},
{em:'🚢',q:'كَيْف تُسافِرُ إِلى بورْصَة؟',correct:['أُسافِرُ','إِلى','بورْصَة','بِالسَّفينَة'],extra:['بِالدَّرّاجَة'],exp:'أُسافِرُ إِلى بورْصَة بِالسَّفينَة'},
{em:'🚗',q:'بِماذا تَذْهَبُ أُمُّكَ إِلى المُسْتَشْفى؟',correct:['تَذْهَبُ','أُمّي','إِلى','المُسْتَشْفى','بِالسَّيّارَة'],extra:['مَشْيًا'],exp:'تَذْهَبُ أُمّي إِلى المُسْتَشْفى بِالسَّيّارَة'},
{em:'🚶',q:'كَيْف تَذْهَبُ إِلى المَكْتَبَة؟',correct:['أَذْهَبُ','إِلى','المَكْتَبَة','مَشْيًا'],extra:['بِالسَّفينَة'],exp:'أَذْهَبُ إِلى المَكْتَبَة مَشْيًا'},
{em:'🚇',q:'بِماذا تَذْهَبُ إِلى السّوق؟',correct:['أَذْهَبُ','إِلى','السّوق','بِالمِتْرو'],extra:['جَوًّا'],exp:'أَذْهَبُ إِلى السّوق بِالمِتْرو'},
{em:'🚲',q:'بِماذا تَذْهَبُ إِلى المَسْجِد؟',correct:['أَذْهَبُ','إِلى','المَسْجِد','بِالدَّرّاجَة'],extra:['بِالطّائِرَة'],exp:'أَذْهَبُ إِلى المَسْجِد بِالدَّرّاجَة'},
{em:'🚦',q:'ماذا تَفْعَلُ عِنْد الضَّوْء الأَحْمَر؟',correct:['أَقِفُ','عِنْد','الضَّوْء','الأَحْمَر'],extra:['الأَخْضَر'],exp:'أَقِفُ عِنْد الضَّوْء الأَحْمَر'},
{em:'🟢',q:'ماذا تَفْعَلُ عِنْد الضَّوْء الأَخْضَر؟',correct:['أَعْبُرُ','عِنْد','الضَّوْء','الأَخْضَر'],extra:['الأَحْمَر'],exp:'أَعْبُرُ عِنْد الضَّوْء الأَخْضَر'},
{em:'⚡',q:'أَيُّهُما أَسْرَع؟',correct:['الطّائِرَة','أَسْرَع','مِن','السَّفينَة'],extra:['أَبْطَأ'],exp:'الطّائِرَة أَسْرَع مِن السَّفينَة'},
{em:'🐢',q:'أَيُّهُما أَبْطَأ؟',correct:['الدَّرّاجَة','أَبْطَأ','مِن','القِطار'],extra:['أَسْرَع'],exp:'الدَّرّاجَة أَبْطَأ مِن القِطار'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc,built,pool;
function init(){qs=shuf([...ALL]).slice(0,12);cur=0;sc=0;document.getElementById('tot').textContent=qs.length;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('em').textContent=q.em;
document.getElementById('quest').textContent=q.q;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
built=[];pool=shuf([...q.correct,...q.extra]);
renderBuilt();renderPool(q);
}
function renderBuilt(){
var el=document.getElementById('built');el.innerHTML='';el.classList.remove('complete','wrong');
built.forEach(function(w,i){var c=document.createElement('div');c.className='built-chip';c.textContent=w;c.onclick=function(){built.splice(i,1);renderBuilt();renderPool(qs[cur])};el.appendChild(c)});
}
function renderPool(q){
var el=document.getElementById('pool');el.innerHTML='';
pool.forEach(function(w,i){
var c=document.createElement('div');c.className='chip';c.textContent=w;
var inBuilt=built.filter(function(b){return b===w}).length;
var inPool=pool.filter(function(p){return p===w}).length;
if(inBuilt>=inPool)c.classList.add('used');
c.onclick=function(){built.push(w);renderBuilt();renderPool(q);if(built.length===q.correct.length)setTimeout(check,200)};
el.appendChild(c);
});
}
function clearBuilt(){built=[];renderBuilt();renderPool(qs[cur])}
function check(){
var q=qs[cur];
var ok=built.length===q.correct.length&&built.every(function(w,i){return w===q.correct[i]});
if(ok){
document.getElementById('built').classList.add('complete');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},1700);
}else{
document.getElementById('built').classList.add('wrong');
document.getElementById('fb').textContent='❌ التَّرْتيب غَيْر صَحيح';document.getElementById('fb').style.color='#F44336';
setTimeout(function(){clearBuilt();document.getElementById('fb').textContent=''},900);
}
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/7sinif/oyunlar/intro.js" defer></script>
<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>

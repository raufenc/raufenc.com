<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مواقيت الصلاة — أوقات الصلاة</title>
<style>
@font-face{font-family:'Arakom';src:url('Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#1a237e,#283593,#5e35b2,#7b1fa2);min-height:100vh;color:#1a237e;padding:20px;font-size:clamp(20px,2.4vw,28px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:840px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#1a237e;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#5e35b2;margin-bottom:18px}
.bar{display:flex;justify-content:space-between;background:#EDE7F6;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:bold;color:#1a237e;flex-wrap:wrap;gap:6px}
.scene{background:linear-gradient(180deg,#1a237e 0%,#3949ab 50%,#7b1fa2 100%);border-radius:18px;padding:22px;margin-bottom:16px;text-align:center;color:#fff;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.scene .sky-icon{font-size:3.5em;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.scene .time-text{font-size:1.4em;font-weight:bold;background:rgba(255,255,255,.18);padding:8px 24px;border-radius:30px;backdrop-filter:blur(6px)}
.scene .clock{font-size:1.2em;letter-spacing:.05em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{background:#EDE7F6;border:2px solid #B39DDB;border-radius:14px;padding:16px;cursor:pointer;font-size:1.4em;color:#1a237e;transition:all .2s;text-align:center;font-weight:bold}
.opt:hover{background:#B39DDB;transform:translateY(-2px)}
.opt.correct{background:#C8E6C9;border-color:#4CAF50;color:#1B5E20}
.opt.wrong{background:#FFCDD2;border-color:#F44336;color:#B71C1C}
.opt.disabled{pointer-events:none;opacity:.6}
.fb{text-align:center;margin-top:14px;min-height:30px;font-size:1.1em;font-weight:bold}
.exp{text-align:center;color:#5e35b2;margin-top:6px;font-size:1.15em}
.btn{display:inline-block;background:#5e35b2;color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{background:#1a237e}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#5e35b2;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10}
.back:hover{background:rgba(0,0,0,.85)}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائمة</a>
<div class="box">
<h1>🕌 مَواقيتُ الصَّلاةِ</h1>
<div class="sub">اِنْظُرْ إلى الصورةِ والوَقْتِ، ثُمَّ اخْتَرِ اسْمَ الصَّلاةِ</div>
<div id="game">
<div class="bar"><span>النَّتيجة: <span id="sc">0</span></span><span>السؤال: <span id="qn">1</span>/10</span></div>
<div class="scene">
<div class="sky-icon" id="ico">🌅</div>
<div class="clock" id="clock">السّاعة ٠٥:٣٠</div>
<div class="time-text" id="hint"></div>
</div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#1a237e">🎉 بارَكَ اللَّهُ فيكَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#5e35b2;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إعادة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائمة ↩</button>
</div>
</div>
<script>
var PRAYERS=['الفَجْر','الظُّهْر','العَصْر','المَغْرِب','العِشاء'];
var ALL=[
{name:'الفَجْر',ico:'🌄',clock:'٠٥:٣٠',hint:'أَوَّلُ صَلاةٍ في اليَوْمِ',exp:'الفَجْرُ يُصَلّى قَبْلَ شُروقِ الشَّمْسِ'},
{name:'الفَجْر',ico:'🌅',clock:'٠٤:٤٥',hint:'في الصَّباحِ الباكِرِ جِدًّا',exp:'الفَجْرُ أَوَّلُ صَلَواتِ اليَوْمِ'},
{name:'الظُّهْر',ico:'☀️',clock:'١٢:٣٠',hint:'عِنْدَ وَقْتِ الغَداءِ',exp:'الظُّهْرُ بَعْدَ زَوالِ الشَّمْسِ'},
{name:'الظُّهْر',ico:'🌞',clock:'١٣:١٥',hint:'مُنْتَصَفُ النَّهارِ تَقْريبًا',exp:'الظُّهْرُ في مُنْتَصَفِ النَّهارِ'},
{name:'العَصْر',ico:'🌤️',clock:'١٥:٣٠',hint:'بَعْدَ المَدْرَسَةِ — العَوْدَةُ إِلى البَيْتِ',exp:'العَصْرُ بَيْنَ الظُّهْرِ والمَغْرِبِ'},
{name:'العَصْر',ico:'🏙️',clock:'١٦:٤٥',hint:'وَقْتُ اللَّعِبِ مَعَ الأَصْحابِ',exp:'العَصْرُ قَبْلَ غُروبِ الشَّمْسِ بِوَقْتٍ'},
{name:'المَغْرِب',ico:'🌇',clock:'١٩:١٥',hint:'وَقْتُ العَشاءِ مَعَ العائِلَةِ',exp:'المَغْرِبُ بَعْدَ غُروبِ الشَّمْسِ مُباشَرَةً'},
{name:'المَغْرِب',ico:'🌆',clock:'١٨:٣٠',hint:'السَّماءُ تَبْدَأُ تَحْمَرُّ',exp:'المَغْرِبُ يُصَلّى عِنْدَ غُروبِ الشَّمْسِ'},
{name:'العِشاء',ico:'🌃',clock:'٢١:٠٠',hint:'النُّجومُ تَظْهَرُ والسَّماءُ سَوْداءُ',exp:'العِشاءُ آخِرُ صَلَواتِ اليَوْمِ'},
{name:'العِشاء',ico:'🌙',clock:'٢٠:٣٠',hint:'قَبْلَ النَّوْمِ',exp:'العِشاءُ بَعْدَ المَغْرِبِ بِوَقْتٍ'},
{name:'الفَجْر',ico:'🐓',clock:'٠٥:٠٠',hint:'مَعَ صِياحِ الدّيكِ',exp:'الفَجْرُ في أَوَّلِ النَّهارِ'},
{name:'الظُّهْر',ico:'🏫',clock:'١٢:١٥',hint:'وَقْتُ الاسْتِراحَةِ في المَدْرَسَةِ',exp:'الظُّهْرُ في وَقْتِ الغَداءِ تَقْريبًا'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc;
function init(){qs=shuf([...ALL]).slice(0,10);cur=0;sc=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('ico').textContent=q.ico;
document.getElementById('clock').textContent='🕐 '+q.clock;
document.getElementById('hint').textContent=q.hint;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
var opts=shuf([...PRAYERS]);
var el=document.getElementById('opts');el.innerHTML='';
opts.forEach(function(o){
var b=document.createElement('div');b.className='opt';b.textContent=o;
b.onclick=function(){answer(o,b,q)};
el.appendChild(b);
});
}
function answer(o,b,q){
document.querySelectorAll('.opt').forEach(function(x){x.classList.add('disabled')});
if(o===q.name){b.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{b.classList.add('wrong');document.querySelectorAll('.opt').forEach(function(x){if(x.textContent===q.name)x.classList.add('correct')});
document.getElementById('fb').textContent='❌ الصَّوابُ: '+q.name;document.getElementById('fb').style.color='#F44336';}
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},1700);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتازٌ!':fs>=70?'جَيِّدٌ جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
</body>
</html>

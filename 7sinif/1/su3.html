<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماذا يَأْكُلُ/تَشْرَبُ؟ — هُوَ وَهِيَ</title>
<style>
@font-face{font-family:'Arakom';src:url('Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#4A148C,#6A1B9A,#7B1FA2);min-height:100vh;color:#4A148C;padding:20px;font-size:clamp(20px,2.4vw,32px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:780px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#4A148C;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#7B1FA2;margin-bottom:14px;font-size:1.2em}
.bar{display:flex;justify-content:space-between;background:#F3E5F5;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:bold;color:#4A148C;flex-wrap:wrap;gap:6px}
.tip{background:#FFF8E1;border-right:4px solid #FFC107;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#5D4037;font-size:.9em;line-height:1.55}
.tip b{color:#4A148C}
.scene{background:linear-gradient(135deg,#7B1FA2,#4A148C);color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(123,31,162,.4)}
.scene .who{font-size:3em;margin-bottom:6px}
.scene .name{display:inline-block;background:#FFD54F;color:#4A148C;padding:4px 16px;border-radius:20px;font-weight:bold;margin:4px}
.scene .item{display:inline-block;background:rgba(255,255,255,.18);padding:6px 18px;border-radius:20px;font-weight:bold;margin:4px;font-size:1.05em}
.scene .item .em{font-size:1.3em}
.scene .ask{font-size:1.5em;margin-top:10px;line-height:1.55}
.scene .tr{font-size:.82em;color:rgba(255,255,255,.75);margin-top:6px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{background:#F3E5F5;border:2px solid #CE93D8;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:1.55em;color:#4A148C;transition:all .2s;text-align:right;font-weight:600;direction:rtl}
.opt:hover{background:#CE93D8;transform:translateX(-4px)}
.opt.correct{background:#C8E6C9;border-color:#4CAF50;color:#1B5E20}
.opt.wrong{background:#FFCDD2;border-color:#F44336;color:#B71C1C}
.opt.disabled{pointer-events:none;opacity:.55}
.fb{text-align:center;margin-top:14px;min-height:30px;font-size:1.1em;font-weight:bold}
.exp{text-align:center;color:#6A1B9A;margin-top:6px;font-size:1.15em;background:#F3E5F5;padding:8px 12px;border-radius:10px;line-height:1.5}
.btn{display:inline-block;background:#7B1FA2;color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{background:#4A148C}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#7B1FA2;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
/* Oyun bitince (sonuç ekranı) başlık altındaki yönerge/altyazıyı gizle */
.box:has(#result:not(.hidden)) .sub{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10}
.back:hover{background:rgba(0,0,0,.85)}

/* yatay-öncelik */
@media (orientation:landscape) and (min-width:1000px){
  .box{max-width:min(1480px,94vw)}
  #game{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:center}
  #game>.bar,#game>.tip,#game>.fb,#game>.exp{grid-column:1/-1}
}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائِمَة</a>
<div class="box">
<h1>👥 ماذا يَأْكُلُ؟ ماذا تَشْرَبُ؟</h1>
<div class="sub">مَعَ "هُوَ" وَ"هِيَ" — اِخْتَر الجُمْلَة الصَّحيحَة (الكِتاب: ص. ٢٨-٢٩)</div>
<div id="game">
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>السُّؤال: <span id="qn">1</span>/10</span></div>
<div class="scene">
<div class="who" id="who">🧔</div>
<span class="name" id="name">عُثْمان</span>
<span class="item"><span class="em" id="em">🍯</span> <span id="item">العَسَل</span></span>
<div class="ask" id="ask">اِخْتَر الجَواب الصَّحيح:</div>
</div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#4A148C">🎉 رائِع!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#6A1B9A;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إِعادَة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائِمَة ↩</button>
</div>
</div>
<script>

var ALL=[
{who:'🧔',gender:'m',name:'عُثْمان',em:'🍯',item:'العَسَل وَالزُّبْدَة',ask:'ماذا يَأْكُلُ عُثْمان مِن المَأْكولات؟',
opts:['هُوَ يَأْكُلُ العَسَل وَالزُّبْدَة','هِيَ تَأْكُلُ العَسَل وَالزُّبْدَة','هُوَ تَأْكُلُ العَسَل وَالزُّبْدَة','أَنا آكُلُ العَسَل وَالزُّبْدَة'],
ans:0},
{who:'👩',gender:'f',name:'شَيْماء',em:'🥛',item:'الحَليب',ask:'ماذا تَشْرَبُ شَيْماء مِن المَشْروبات؟',
opts:['هِيَ تَشْرَبُ الحَليب','هُوَ يَشْرَبُ الحَليب','هِيَ يَشْرَبُ الحَليب','أَنْتَ تَشْرَبُ الحَليب'],
ans:0},
{who:'🧔',gender:'m',name:'إِبْراهيم',em:'🍗',item:'الدَّجاج',ask:'هَلْ يَأْكُلُ إِبْراهيم الدَّجاج؟',
opts:['نَعَمْ، هُوَ يَأْكُلُ الدَّجاج','نَعَمْ، هِيَ تَأْكُلُ الدَّجاج','لا، هُوَ تَأْكُلُ الدَّجاج','نَعَمْ، أَنا آكُلُ الدَّجاج'],
ans:0},
{who:'👩',gender:'f',name:'ياسَمين',em:'☕',item:'القَهْوَة',ask:'هَلْ تَشْرَبُ ياسَمين العَصير؟',
opts:['لا، هِيَ تَشْرَبُ القَهْوَة','لا، هُوَ يَشْرَبُ القَهْوَة','نَعَمْ، هِيَ تَشْرَبُ العَصير','نَعَمْ، هُوَ يَشْرَبُ القَهْوَة'],
ans:0},
{who:'🧔',gender:'m',name:'عُمَر',em:'🍗',item:'الدَّجاج',ask:'ماذا يَأْكُلُ عُمَر مِن المَأْكولات؟',
opts:['هُوَ يَأْكُلُ الدَّجاج','هِيَ تَأْكُلُ الدَّجاج','هُوَ تَأْكُلُ الدَّجاج','أَنْتِ تَأْكُلينَ الدَّجاج'],
ans:0},
{who:'👩',gender:'f',name:'فاطِمَة',em:'🍵',item:'الشّاي',ask:'ماذا تَشْرَبُ فاطِمَة مِن المَشْروبات؟',
opts:['هِيَ تَشْرَبُ الشّاي','هُوَ يَشْرَبُ الشّاي','أَنا أَشْرَبُ الشّاي','هِيَ يَشْرَبُ الشّاي'],
ans:0},
{who:'🧔',gender:'m',name:'أَحْمَد',em:'🧆',item:'الكُفْتَة',ask:'هَلْ يَأْكُلُ أَحْمَد الكُفْتَة؟',
opts:['نَعَمْ، هُوَ يَأْكُلُ الكُفْتَة','لا، هُوَ يَأْكُلُ المَكَرونَة','نَعَمْ، هِيَ تَأْكُلُ الكُفْتَة','لا، أَنا آكُلُ الكُفْتَة'],
ans:0},
{who:'👩',gender:'f',name:'عائِشَة',em:'🍵',item:'الشّاي',ask:'هَلْ تَشْرَبُ عائِشَة القَهْوَة؟',
opts:['لا، هِيَ تَشْرَبُ الشّاي','نَعَمْ، هِيَ تَشْرَبُ القَهْوَة','لا، هُوَ يَشْرَبُ الشّاي','نَعَمْ، أَنا أَشْرَبُ القَهْوَة'],
ans:0},
{who:'🧔',gender:'m',name:'فاتِح',em:'🍯',item:'العَسَل وَالزُّبْدَة',ask:'ماذا يَأْكُلُ فاتِح في الفَطور؟',
opts:['هُوَ يَأْكُلُ العَسَل وَالزُّبْدَة','هِيَ تَأْكُلُ السَّمَك','هُوَ تَأْكُلُ العَسَل','أَنْتَ تَأْكُلُ العَسَل'],
ans:0},
{who:'👩',gender:'f',name:'زَيْنَب',em:'🐟',item:'السَّمَك',ask:'ماذا تَأْكُلُ زَيْنَب في الغَداء؟',
opts:['هِيَ تَأْكُلُ السَّمَك والسَّلَطَة','هُوَ يَأْكُلُ السَّمَك','أَنا آكُلُ السَّمَك','هِيَ يَأْكُلُ السَّمَك'],
ans:0},
{who:'🧔',gender:'m',name:'بِلال',em:'🫒',item:'الزَّيْتون',ask:'ماذا يَأْكُلُ بِلال في الفَطور؟',
opts:['هُوَ يَأْكُلُ الزَّيْتون والجُبْن','هِيَ تَأْكُلُ الزَّيْتون','هُوَ تَأْكُلُ الزَّيْتون','أَنْتِ تَأْكُلينَ الزَّيْتون'],
ans:0},
{who:'👩',gender:'f',name:'مَرْيَم',em:'🥛',item:'الحَليب',ask:'ماذا تَشْرَبُ مَرْيَم في الفَطور؟',
opts:['هِيَ تَشْرَبُ الحَليب','هُوَ يَشْرَبُ الحَليب','أَنا أَشْرَبُ الحَليب','هِيَ يَشْرَبُ الحَليب'],
ans:0}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc;
function init(){qs=shuf([...ALL]).slice(0,10);cur=0;sc=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('who').textContent=q.who;
document.getElementById('name').textContent=q.name;
document.getElementById('em').textContent=q.em;
document.getElementById('item').textContent=q.item;
document.getElementById('ask').textContent=q.ask;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
var indexed=q.opts.map(function(o,i){return {t:o,i:i}});
var shuffled=shuf([...indexed]);
var el=document.getElementById('opts');el.innerHTML='';
shuffled.forEach(function(o){
var b=document.createElement('div');b.className='opt';b.textContent=o.t;
b.onclick=function(){answer(o.i,b,q)};
el.appendChild(b);
});
}
function answer(idx,b,q){
document.querySelectorAll('.opt').forEach(function(x){x.classList.add('disabled')});
if(idx===q.ans){b.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{b.classList.add('wrong');
document.querySelectorAll('.opt').forEach(function(x){if(x.textContent===q.opts[q.ans])x.classList.add('correct')});
document.getElementById('fb').textContent='❌ الصَّواب: '+q.opts[q.ans];document.getElementById('fb').style.color='#F44336';}
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},2100);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جدول يومي — أيام وأوقات</title>
<style>
@font-face{font-family:'Arakom';src:url('Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#33691E,#558B2F,#7CB342);min-height:100vh;color:#33691E;padding:20px;font-size:clamp(20px,2.4vw,28px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:820px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#33691E;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#558B2F;margin-bottom:18px}
.bar{display:flex;justify-content:space-between;background:#F1F8E9;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:bold;color:#33691E;flex-wrap:wrap;gap:6px}
.scene{background:linear-gradient(135deg,#558B2F,#33691E);color:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:16px;box-shadow:0 8px 22px rgba(85,139,47,.35)}
.scene .who{font-size:2.2em;margin-bottom:4px}
.scene .day{background:rgba(255,255,255,.18);display:inline-block;padding:6px 18px;border-radius:20px;margin:4px;font-weight:bold}
.scene .time{background:#FFD54F;color:#33691E;display:inline-block;padding:6px 18px;border-radius:20px;margin:4px;font-weight:bold}
.scene .ask{margin-top:10px;font-size:1.15em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{background:#F1F8E9;border:2px solid #C5E1A5;border-radius:14px;padding:14px;cursor:pointer;color:#33691E;transition:all .2s;text-align:center;font-weight:bold;display:flex;flex-direction:column;gap:6px;align-items:center}
.opt:hover{background:#C5E1A5;transform:translateY(-2px)}
.opt .ic{font-size:1.8em}
.opt .text{font-size:1em}
.opt.correct{background:#C8E6C9;border-color:#4CAF50}
.opt.wrong{background:#FFCDD2;border-color:#F44336}
.opt.disabled{pointer-events:none;opacity:.6}
.fb{text-align:center;margin-top:14px;min-height:30px;font-size:1.1em;font-weight:bold}
.exp{text-align:center;color:#558B2F;margin-top:6px;font-size:1.15em}
.btn{display:inline-block;background:#558B2F;color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{background:#33691E}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#558B2F;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10}
.back:hover{background:rgba(0,0,0,.85)}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائمة</a>
<div class="box">
<h1>📔 جَدْوَلُ اليَوْمِ</h1>
<div class="sub">يَوْمٌ وَوَقْتٌ — ماذا يَفْعَلُ في هَذا الوَقْتِ؟</div>
<div id="game">
<div class="bar"><span>النَّتيجة: <span id="sc">0</span></span><span>السؤال: <span id="qn">1</span>/12</span></div>
<div class="scene">
<div class="who" id="who">🧑‍🎓</div>
<div><span class="day" id="day">الأَحَد</span><span class="time" id="time">⏰ الفَجْر</span></div>
<div class="ask">ماذا يَفْعَلُ في هَذا الوَقْتِ؟</div>
</div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#33691E">🎉 بارَكَ اللَّهُ فيكَ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#558B2F;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إعادة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائمة ↩</button>
</div>
</div>
<script>
var ACTS=[
{ic:'🕌',t:'يُصَلّي في المَسْجِدِ'},
{ic:'📚',t:'يَدْرُسُ دُروسَهُ'},
{ic:'🏫',t:'يَذْهَبُ إلى المَدْرَسَةِ'},
{ic:'🏠',t:'يَرْجِعُ إلى البَيْتِ'},
{ic:'🍳',t:'يَتَناوَلُ الفَطورَ'},
{ic:'🍲',t:'يَتَناوَلُ العَشاءَ'},
{ic:'😴',t:'يَنامُ مُبَكِّرًا'},
{ic:'🤝',t:'يُساعِدُ أُمَّهُ'},
{ic:'⚽',t:'يَلْعَبُ مَعَ أَصْحابِهِ'},
{ic:'📖',t:'يَقْرَأُ القُرْآنَ الكَريمَ'},
{ic:'🧹',t:'يُنَظِّفُ غُرْفَتَهُ'},
{ic:'🚿',t:'يَتَوَضَّأُ'},
{ic:'☕',t:'يَشْرَبُ الشّايَ مَعَ عائِلَتِهِ'}
];
var ALL=[
{who:'🧑‍🎓',day:'الإِثْنَيْن',time:'⏰ الفَجْرُ',cor:'يُصَلّي في المَسْجِدِ',exp:'في الفَجْرِ نَتَوَضَّأُ ثُمَّ نُصَلّي'},
{who:'🧑‍🎓',day:'الإِثْنَيْن',time:'☀️ الظُّهْرُ',cor:'يَذْهَبُ إلى المَدْرَسَةِ',exp:'الإثنينُ يومُ دِراسَةٍ'},
{who:'👩‍🎓',day:'الجُمُعَة',time:'☀️ الظُّهْرُ',cor:'يُصَلّي في المَسْجِدِ',exp:'الجُمُعَةُ يَومُ صَلاةِ الجَماعَةِ'},
{who:'🧑‍🎓',day:'السَّبْت',time:'🌅 الصَّباحُ',cor:'يَتَناوَلُ الفَطورَ',exp:'في الصَّباحِ نَتَناوَلُ الفَطورَ'},
{who:'👩‍🎓',day:'الأَحَد',time:'🌇 المَغْرِبُ',cor:'يَتَناوَلُ العَشاءَ',exp:'العَشاءُ يَكونُ بَعْدَ صَلاةِ المَغْرِبِ'},
{who:'🧑‍🎓',day:'الثُّلاثاء',time:'🌃 العِشاءُ',cor:'يَدْرُسُ دُروسَهُ',exp:'الدِّراسَةُ في المَساءِ'},
{who:'👩‍🎓',day:'الأَرْبِعاء',time:'🌤️ العَصْرُ',cor:'يَرْجِعُ إلى البَيْتِ',exp:'بَعْدَ المَدْرَسَةِ نَرْجِعُ إلى البَيْتِ'},
{who:'🧑‍🎓',day:'الخَميس',time:'🌃 العِشاءُ',cor:'يَنامُ مُبَكِّرًا',exp:'النَّوْمُ المُبَكِّرُ سُنَّةٌ نَبَوِيَّةٌ'},
{who:'👩‍🎓',day:'الجُمُعَة',time:'🌇 المَغْرِبُ',cor:'يَقْرَأُ القُرْآنَ الكَريمَ',exp:'لَيْلَةُ الجُمُعَةِ لَيْلَةُ قِراءَةٍ'},
{who:'🧑‍🎓',day:'السَّبْت',time:'☀️ الظُّهْرُ',cor:'يُساعِدُ أُمَّهُ',exp:'في العُطْلَةِ نُساعِدُ الأُمَّ'},
{who:'👩‍🎓',day:'الأَحَد',time:'🌤️ العَصْرُ',cor:'يَلْعَبُ مَعَ أَصْحابِهِ',exp:'العَصْرُ وَقْتُ اللَّعِبِ'},
{who:'🧑‍🎓',day:'الإِثْنَيْن',time:'⏰ قَبْلَ الفَجْرِ',cor:'يَتَوَضَّأُ',exp:'نَتَوَضَّأُ قَبْلَ الصَّلاةِ'},
{who:'👩‍🎓',day:'الثُّلاثاء',time:'🌅 الفَجْرُ',cor:'يَشْرَبُ الشّايَ مَعَ عائِلَتِهِ',exp:'الفَطورُ بَعْدَ صَلاةِ الفَجْرِ'},
{who:'🧑‍🎓',day:'الأَحَد',time:'☀️ الظُّهْرُ',cor:'يُنَظِّفُ غُرْفَتَهُ',exp:'في العُطْلَةِ نُنَظِّفُ غُرَفَنا'}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc;
function init(){qs=shuf([...ALL]).slice(0,12);cur=0;sc=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('who').textContent=q.who;
document.getElementById('day').textContent=q.day;
document.getElementById('time').textContent=q.time;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
var correctAct=ACTS.find(function(a){return a.t===q.cor});
var wrongs=shuf(ACTS.filter(function(a){return a.t!==q.cor})).slice(0,3);
var opts=shuf([correctAct].concat(wrongs));
var el=document.getElementById('opts');el.innerHTML='';
opts.forEach(function(o){
var b=document.createElement('div');b.className='opt';
b.innerHTML='<span class="ic">'+o.ic+'</span><span class="text">'+o.t+'</span>';
b.onclick=function(){answer(o,b,q)};
el.appendChild(b);
});
}
function answer(o,b,q){
document.querySelectorAll('.opt').forEach(function(x){x.classList.add('disabled')});
if(o.t===q.cor){b.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{b.classList.add('wrong');
document.querySelectorAll('.opt').forEach(function(x){if(x.textContent.indexOf(q.cor)!==-1)x.classList.add('correct')});
document.getElementById('fb').textContent='❌ الصَّوابُ: '+q.cor;document.getElementById('fb').style.color='#F44336';}
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},1700);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتازٌ!':fs>=70?'جَيِّدٌ جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
</body>
</html>

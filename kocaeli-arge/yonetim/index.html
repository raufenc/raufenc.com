<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Yönetici Paneli · Kocaeli MEM AR-GE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kocaeli-arge/css/app.css">
<style>
  body { background: var(--bg); padding: 0; }
  #device { width: auto; max-width: 1080px; min-height: 100vh; border-radius: 0; box-shadow: none; }
  @media (min-width: 720px) { body { background: var(--bg); } #device .screen { height: auto; overflow: visible; } }
  .admin { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
  .side a.on { background: var(--meb-soft); color: var(--meb); }
  .side a svg { width: 18px; height: 18px; }
  .main { padding: 20px 24px 60px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tbl th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .grid2 .wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .admin { grid-template-columns: 1fr; } .side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; } .grid2 { grid-template-columns: 1fr; } }
  #gate { max-width: 420px; margin: 60px auto; }
  .tabbar { display: none; }
</style>
</head>
<body>
<div id="device"><div class="screen"><div id="gate" class="card pad"><div class="empty">Yükleniyor…</div></div><div id="panel" class="admin" hidden></div></div></div>
<script type="module" src="/kocaeli-arge/yonetim/admin.js"></script>
</body>
</html>

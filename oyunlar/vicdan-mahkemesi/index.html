<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicdan Mahkemesi — Sınıf Mahkemesi Oyunu</title>
<meta name="description" content="İfadeleri dinle, delilleri incele, vicdanınla hüküm ver. 11-13 yaş için değerler eğitimi temalı sınıf mahkemesi oyunu.">
<meta name="theme-color" content="#F5EDE0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Temel ============ */
:root{
  --krem:#F5EDE0;
  --kahve:#2B2118;
  --yesil:#4A7C59;
  --kiremit:#C4574A;
  --altin:#D9A441;
  --kagit:#FFFDF7;
  --cizgi:rgba(43,33,24,.14);
  --soluk:rgba(43,33,24,.62);
  --golge:0 10px 30px rgba(43,33,24,.10);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ overflow-x:hidden; }
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh; /* iOS Safari için dvh */
  background:var(--krem);
  color:var(--kahve);
  font:400 16px/1.6 "Inter",system-ui,sans-serif;
  overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:"Fraunces",Georgia,serif; line-height:1.25; margin:0 0 8px; }
p{ margin:0 0 12px; }
button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
a{ color:var(--yesil); touch-action:manipulation; }
img{ max-width:100%; }
:focus-visible{ outline:3px solid var(--altin); outline-offset:2px; border-radius:8px; }
[hidden]{ display:none !important; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ============ Üst şerit ============ */
.ust{
  position:sticky; top:0; z-index:20;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  max-width:560px; margin:0 auto; padding:10px 14px;
  background:linear-gradient(var(--krem) 78%, rgba(245,237,224,0));
}
.geri{
  display:inline-flex; align-items:center; min-height:44px; padding:0 10px;
  font-weight:600; font-size:14px; text-decoration:none; color:var(--soluk); border-radius:12px;
}
.geri:hover{ color:var(--kahve); }
.ust-sag{ display:flex; align-items:center; gap:8px; }
.puan-cip{
  background:var(--kagit); border:1px solid var(--cizgi); border-radius:999px;
  padding:8px 14px; font-weight:700; font-size:14px; box-shadow:var(--golge);
}
.sifirla{
  width:44px; height:44px; border-radius:14px; font-size:19px;
  background:var(--kagit); border:1px solid var(--cizgi); box-shadow:var(--golge);
}

/* ============ Sayfa ============ */
.sayfa{ max-width:560px; margin:0 auto; padding:4px 16px 56px; }
.ekran{ animation:ekranGel .35s ease; }
@keyframes ekranGel{ from{ opacity:0; transform:translateY(10px); } }

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:54px; padding:14px 22px; margin:10px 0 0;
  border-radius:18px; font-weight:600; font-size:16px; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{ transform:scale(.98); }
.btn.birincil{ background:var(--yesil); color:#fff; box-shadow:0 8px 20px rgba(74,124,89,.32); }
.btn.ikincil{ background:transparent; color:var(--kahve); border:2px solid var(--cizgi); }
.btn.tehlike{ background:var(--kiremit); color:#fff; box-shadow:0 8px 20px rgba(196,87,74,.3); }

.kart{ background:var(--kagit); border-radius:20px; padding:18px; box-shadow:var(--golge); margin:0 0 14px; }

/* ============ Açılış ============ */
.salon-serit{
  position:relative; height:150px; border-radius:22px; overflow:hidden;
  box-shadow:var(--golge); margin:6px 0 20px;
}
.salon-fallback{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#4A3423,#2B2118 62%,#1D1610);
}
.salon-fallback::before{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(217,164,65,.07) 0 26px, transparent 26px 52px);
}
.salon-fallback span{ font-size:58px; position:relative; }
.salon-serit img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.oyun-adi{ font-size:34px; font-weight:900; text-align:center; margin-bottom:2px; }
.oyun-alt{ text-align:center; color:var(--yesil); font-weight:700; font-family:"Fraunces",serif; font-size:18px; margin-bottom:16px; }
.giris-kart p{ margin:0; font-size:15.5px; }

/* ============ Dosya kapağı ============ */
.dosya-sahne{ perspective:1400px; margin:18px 0 6px; }
.dosya{ position:relative; }
.kagit{
  background:var(--kagit) repeating-linear-gradient(transparent 0 27px, rgba(43,33,24,.055) 27px 28px);
  border-radius:18px; padding:22px 18px; box-shadow:var(--golge); min-height:320px;
}
.kagit-ust{
  display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--soluk); margin-bottom:8px;
}
.kagit-baslik{ font-size:24px; font-weight:900; }
.deger-rozet{
  display:inline-block; background:rgba(74,124,89,.12); color:var(--yesil);
  font-size:12.5px; font-weight:700; border-radius:999px; padding:5px 12px; margin:4px 0 14px;
}
.dosya-kapak{
  position:absolute; inset:0; z-index:2; border-radius:18px;
  background:linear-gradient(145deg,#E8C177,#D9A441);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  box-shadow:var(--golge); pointer-events:none;
  transform-origin:left center;
  animation:kapakAc 1.1s cubic-bezier(.65,.05,.35,1) .9s forwards;
}
.dosya-kapak::before{
  content:""; position:absolute; top:-12px; left:20px; width:112px; height:24px;
  background:#D9A441; border-radius:10px 10px 0 0;
}
@keyframes kapakAc{
  0%{ transform:rotateY(0deg); opacity:1; }
  55%{ opacity:1; }
  100%{ transform:rotateY(-150deg); opacity:0; }
}
.dosya-no{
  font-family:"Fraunces",serif; font-weight:900; font-size:24px; letter-spacing:.1em;
  color:#5C4413; border:3px solid rgba(92,68,19,.5); border-radius:10px; padding:6px 16px;
  transform:rotate(-4deg);
}
.dosya-muhur{ font-size:42px; }
.dosya-kapak small{ font-weight:700; color:rgba(92,68,19,.75); letter-spacing:.1em; }

/* ============ Oyun ekranı ============ */
.oyun-baslik{ margin:4px 0 10px; }
.dosya-etiket{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.14em;
  color:var(--altin); text-transform:uppercase;
}
.oyun-baslik h2{ font-size:21px; margin:0; }

.adimlar{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 14px; }
.adim{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:1px;
  min-height:58px; padding:8px 2px; border-radius:14px;
  background:rgba(255,253,247,.7); border:2px solid transparent; color:var(--soluk);
}
.adim-ikon{ font-size:18px; line-height:1.2; }
.adim-ad{ font-size:11px; font-weight:600; }
.adim.aktif{ background:var(--kagit); border-color:var(--yesil); color:var(--kahve); box-shadow:var(--golge); }
.adim.tamam::after{
  content:"✓"; position:absolute; top:-5px; right:-3px;
  width:18px; height:18px; border-radius:50%; background:var(--yesil); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
}
.adim-aciklama{ font-size:14px; color:var(--soluk); margin-bottom:12px; }
.adim-baslik{ font-size:19px; }

/* Taraflar & portreler */
.taraf-onizleme{ display:flex; flex-direction:column; gap:10px; margin:6px 0 4px; }
.taraf-onizleme-satir{ display:flex; align-items:center; gap:10px; }
.portre{
  position:relative; flex:none; width:52px; height:52px; border-radius:16px; overflow:hidden;
  display:flex; align-items:center; justify-content:center; border:1px solid var(--cizgi);
}
.portre.kucuk{ width:44px; height:44px; border-radius:14px; }
.portre-emoji{ font-size:26px; }
.portre.kucuk .portre-emoji{ font-size:22px; }
.portre img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.rol-rozet{
  flex:none; font-size:11px; font-weight:700; border-radius:999px; padding:4px 10px; white-space:nowrap;
}
.rol-sanik{ background:rgba(196,87,74,.14); color:var(--kiremit); }
.rol-sikayetci{ background:rgba(217,164,65,.2); color:#8A6414; }
.rol-tanik{ background:rgba(74,124,89,.14); color:var(--yesil); }

/* İfadeler */
.taraf{ background:var(--kagit); border-radius:18px; box-shadow:var(--golge); margin-bottom:12px; overflow:hidden; }
.taraf-baslik{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 14px; min-height:64px;
}
.taraf-bilgi{ flex:1; min-width:0; display:flex; flex-direction:column; }
.taraf-ad{ font-weight:700; font-size:16px; font-family:"Fraunces",serif; }
.taraf-unvan{ font-size:12.5px; color:var(--soluk); }
.taraf-durum{ flex:none; font-size:15px; color:var(--yesil); font-weight:700; width:22px; text-align:center; }
.sorular{ padding:2px 14px 14px; border-top:1px dashed var(--cizgi); }
.soru{
  display:flex; gap:8px; width:100%; text-align:left; margin:10px 0 0; padding:12px 14px; min-height:48px;
  background:rgba(74,124,89,.08); border:1.5px solid rgba(74,124,89,.3); border-radius:14px;
  font-size:14.5px; font-weight:600; align-items:flex-start;
}
.soru.soruldu{ background:transparent; border-color:var(--cizgi); color:var(--soluk); font-weight:500; }
.balon{
  position:relative; margin:10px 0 4px 14px; padding:12px 14px;
  background:#fff; border-radius:16px; border-top-left-radius:4px;
  box-shadow:0 4px 14px rgba(43,33,24,.08); font-size:14.5px;
}
.balon::before{
  content:""; position:absolute; top:-6px; left:16px; width:12px; height:12px;
  background:#fff; transform:rotate(45deg);
}
.balon-ad{ display:block; font-size:11.5px; font-weight:700; color:var(--yesil); margin-bottom:2px; }
.balon p{ margin:0; }
.balon-yeni{ animation:balonGel .35s ease; }
@keyframes balonGel{ from{ opacity:0; transform:translateY(8px); } }

/* Deliller */
.delil-izgara{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.delil{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  min-height:108px; padding:14px 8px; background:var(--kagit); border-radius:18px;
  border:2px solid transparent; box-shadow:var(--golge); text-align:center;
}
.delil-emoji{ font-size:34px; }
.delil-ad{ font-size:13px; font-weight:600; line-height:1.35; }
.delil.incelendi{ border-color:var(--yesil); }
.delil-tik{
  position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%;
  background:var(--yesil); color:#fff; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.delil-detay{ text-align:center; }
.delil-detay-emoji{
  display:inline-flex; align-items:center; justify-content:center; width:84px; height:84px;
  font-size:44px; border-radius:26px; background:linear-gradient(135deg,#F6E7C4,#E7CD96); margin-bottom:10px;
}
.delil-detay h3{ font-size:20px; }
.delil-detay p{ text-align:left; font-size:15px; margin:0; }

/* Hüküm */
.hukum-btn{
  width:100%; min-height:66px; margin:10px 0 0; border-radius:20px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-family:"Fraunces",serif; font-weight:700; font-size:20px; color:#fff;
  transition:transform .12s ease;
}
.hukum-btn:active{ transform:scale(.98); }
.hukum-suclu{ background:var(--kiremit); box-shadow:0 8px 20px rgba(196,87,74,.32); }
.hukum-sucsuz{ background:var(--yesil); box-shadow:0 8px 20px rgba(74,124,89,.32); }
.hukum-delil{ background:var(--altin); color:#4A3410; box-shadow:0 8px 20px rgba(217,164,65,.35); }
.durum-satiri{ font-size:13.5px; color:var(--soluk); background:rgba(255,253,247,.8); border-radius:12px; padding:10px 14px; margin-bottom:6px; }

/* Terazi */
.terazi-kutu{ text-align:center; padding:10px 0 0; }
.terazi-svg{ width:170px; height:auto; }
.terazi-kol{ transform-origin:70px 28px; transform-box:view-box; }
.dengede .terazi-kol{ animation:teraziDenge 1.8s cubic-bezier(.34,1.3,.4,1) forwards; }
@keyframes teraziDenge{
  0%{ transform:rotate(-16deg); } 45%{ transform:rotate(9deg); }
  72%{ transform:rotate(-4deg); } 100%{ transform:rotate(0deg); }
}
.egik .terazi-kol{ animation:teraziEgil 1.4s ease-in-out forwards; }
@keyframes teraziEgil{
  0%{ transform:rotate(0deg); } 30%{ transform:rotate(-7deg); } 100%{ transform:rotate(14deg); }
}
.sonuc-baslik{ text-align:center; font-size:24px; margin:6px 0 4px; }
.sonuc-metin{ text-align:center; color:var(--soluk); font-size:15px; }
.puan-kazanc{
  display:table; margin:6px auto 16px; padding:9px 20px; border-radius:999px;
  background:var(--yesil); color:#fff; font-weight:700; font-size:15px;
}
.puan-kazanc.kayip{ background:var(--kiremit); }

.perde{ background:#33271C; color:var(--krem); border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:var(--golge); }
.perde h4{ color:var(--altin); font-size:17px; }
.perde p{ margin:0; font-size:14.5px; }

.not-kart{
  background:var(--kagit) repeating-linear-gradient(transparent 0 27px, rgba(43,33,24,.05) 27px 28px);
  border-left:6px solid var(--altin); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--golge);
}
.not-kart h4{ font-size:17px; }
.not-kart p{ margin:0; font-size:14.5px; }

.ceza-sec{
  display:block; width:100%; text-align:left; margin:10px 0 0; padding:14px 16px; min-height:64px;
  background:var(--kagit); border:2px solid var(--cizgi); border-radius:18px;
  font-size:14.5px; box-shadow:var(--golge); transition:transform .12s ease;
}
.ceza-sec:active{ transform:scale(.98); }
.degerlendirme{ border-radius:18px; padding:16px 18px; margin-bottom:14px; box-shadow:var(--golge); }
.degerlendirme.iyi{ background:rgba(74,124,89,.13); border:1.5px solid rgba(74,124,89,.4); }
.degerlendirme.kotu{ background:rgba(196,87,74,.1); border:1.5px solid rgba(196,87,74,.35); }
.degerlendirme h4{ font-size:16px; }
.degerlendirme p{ margin:0; font-size:14.5px; }
.dosya-puani{ text-align:center; font-weight:700; color:var(--yesil); margin:4px 0 10px; }

/* Final */
.final-tepe{ text-align:center; padding:10px 0 6px; }
.final-emoji{ font-size:64px; line-height:1; display:block; margin-bottom:8px; animation:rutbeGel .6s cubic-bezier(.3,1.5,.5,1); }
@keyframes rutbeGel{ from{ transform:scale(.4); opacity:0; } }
.rutbe-ad{ font-size:30px; font-weight:900; margin-bottom:2px; }
.rutbe-puan{ color:var(--yesil); font-weight:700; font-size:17px; margin-bottom:8px; }
.rutbe-metin{ color:var(--soluk); font-size:15px; }
.ozet-baslik{ font-size:18px; margin:14px 0 8px; }
.ozet-satir{
  display:flex; align-items:center; gap:12px; background:var(--kagit);
  border-radius:16px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--golge);
}
.ozet-ikon{
  flex:none; width:30px; height:30px; border-radius:50%; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
}
.ozet-ikon.d{ background:var(--yesil); } .ozet-ikon.y{ background:var(--kiremit); }
.ozet-orta{ flex:1; min-width:0; }
.ozet-orta b{ display:block; font-size:13.5px; }
.ozet-orta span{ font-size:12px; color:var(--soluk); }
.ozet-puan{ flex:none; font-weight:700; font-size:14px; color:var(--yesil); }

/* Modal */
.modal-katman{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-arka{ position:absolute; inset:0; background:rgba(43,33,24,.55); border:none; }
.modal-kutu{
  position:relative; width:100%; max-width:420px; max-height:80vh; max-height:80dvh; overflow:auto;
  background:var(--kagit); border-radius:22px; padding:22px; box-shadow:0 20px 50px rgba(43,33,24,.35);
  animation:modalGel .25s ease;
}
@keyframes modalGel{ from{ opacity:0; transform:translateY(14px) scale(.97); } }
.modal-kutu h3{ font-size:19px; }
.modal-kutu p{ font-size:14.5px; }
</style>
</head>
<body>

<header class="ust">
  <a class="geri" href="../">← Oyunlar</a>
  <div class="ust-sag">
    <span class="puan-cip" id="puanCip" hidden>⚖️ 0</span>
    <button class="sifirla" id="btnSifirla" data-eylem="sifirla-sor" title="Baştan Başla" aria-label="Baştan Başla" hidden>↺</button>
  </div>
</header>

<main class="sayfa" id="uygulama">
  <noscript><p>Bu oyun için JavaScript gereklidir. Lütfen tarayıcınızda JavaScript'i açın.</p></noscript>
</main>

<div class="modal-katman" id="modal" hidden>
  <button class="modal-arka" data-eylem="modal-kapat" aria-label="Kapat" tabindex="-1"></button>
  <div class="modal-kutu" role="dialog" aria-modal="true">
    <div id="modal-icerik"></div>
    <div id="modal-butonlar"></div>
  </div>
</div>

<script src="content.js"></script>
<script>
(function(){
'use strict';

/* content.js yüklenemezse zarif bir mesaj göster */
if (typeof ICERIK === 'undefined' || !ICERIK.vakalar || !ICERIK.vakalar.length){
  document.getElementById('uygulama').innerHTML =
    '<div class="kart"><h3>İçerik yüklenemedi</h3><p>content.js dosyası bulunamadı ya da bozuk görünüyor. Lütfen index.html ile aynı klasörde olduğundan emin olun.</p></div>';
  return;
}

/* ============ Sabitler (oyun kuralları içerikten ayrı, burada tanımlı) ============ */
var KAYIT_ANAHTARI = 'vicdan-mahkemesi-kayit-v1';
var HUKUM_PUANI = 20;   // doğru hüküm
var CEZA_PUANI  = 10;   // onarıcı ceza seçimi

var KARAKTERLER = {
  selim:    { ad:'Selim',        unvan:'Okulun yeni öğrencisi',  emoji:'🧒', g1:'#DEEBE0', g2:'#B9D2C1' },
  zeynep:   { ad:'Zeynep',       unvan:'Sınıf başkanı',          emoji:'👧', g1:'#F6E7C4', g2:'#E7CD96' },
  emir:     { ad:'Emir',         unvan:'7-A öğrencisi',          emoji:'👦', g1:'#F4DCD5', g2:'#E4B5A8' },
  burak:    { ad:'Burak',        unvan:'7-A öğrencisi',          emoji:'🧑‍🎨', g1:'#E9DFD0', g2:'#D2BFA4' },
  elif:     { ad:'Elif',         unvan:'7-A öğrencisi',          emoji:'👩‍🦰', g1:'#F7E4CE', g2:'#E9C9A2' },
  hademe:   { ad:'Ramazan Amca', unvan:'Okul görevlisi',         emoji:'🧔', g1:'#E1E7E2', g2:'#C2CFC6' },
  kantinci: { ad:'İsmail Abi',   unvan:'Kantin işletmecisi',     emoji:'👨‍🍳', g1:'#F6E2C2', g2:'#E8C88E' },
  rehber:   { ad:'Murat Bey',    unvan:'Rehber öğretmen',        emoji:'👨‍🏫', g1:'#DFE6DC', g2:'#C4D1BE' }
};

var HUKUMLER = {
  suclu:         { etiket:'Suçlu',          emoji:'⚖️', sinif:'hukum-suclu' },
  sucsuz:        { etiket:'Suçsuz',         emoji:'🕊️', sinif:'hukum-sucsuz' },
  delilYetersiz: { etiket:'Delil Yetersiz', emoji:'📂', sinif:'hukum-delil' }
};

var ROL_SINIF = { 'sanık':'sanik', 'şikâyetçi':'sikayetci', 'tanık':'tanik' };

var ADIMLAR = [
  { id:'olay',     ad:'Olay',     ikon:'📋' },
  { id:'ifadeler', ad:'İfadeler', ikon:'💬' },
  { id:'deliller', ad:'Deliller', ikon:'🔍' },
  { id:'hukum',    ad:'Hüküm',    ikon:'⚖️' }
];

/* Ceza tiplerine göre hâkim değerlendirmesi */
var CEZA_YORUM = {
  onarici:   { sinif:'iyi',  baslik:'Onarıcı bir karar! 🌱',
    metin:'Adaletin amacı utandırmak değil, kırılanı onarmaktır. Hata telafi edildi, kimse dışlanmadı, herkes dersini aldı. Nazan Öğretmen kürsüden başıyla onayladı. +' + CEZA_PUANI + ' Adalet Puanı' },
  intikamci: { sinif:'kotu', baslik:'Bu ceza değil, intikam... 🔥',
    metin:'Verdiğin ceza yarayı sarmıyor, yenisini açıyor. Utandırılan insan düzelmez, sadece saklanmayı öğrenir. Adalet terazisi öfkeyle tartmaz. (0 puan)' },
  gevsek:    { sinif:'kotu', baslik:'Dosya halının altına süpürüldü... 🙈',
    metin:'Görmezden gelmek de bir adaletsizliktir. Bedeli olmayan hata tekrar eder; asıl merhamet, hatayı telafi etme fırsatı vermektir. (0 puan)' }
};

/* Rütbeler — puana göre, yüksekten alçağa sıralı */
var RUTBELER = [
  { min:140, ad:'Adalet Ustası', emoji:'🏛️',
    metin:'Terazin hiç şaşmadı! Hayal Ortaokulu tarihi böyle bir hâkim görmedi. Nazan Öğretmen tokmağı artık gönül rahatlığıyla sana emanet ediyor.' },
  { min:100, ad:'Bilge Hâkim', emoji:'🦉',
    metin:'Görünüşe aldanmadın, fısıltılara kanmadın. Kürsüde vicdanının sesi hep duyuldu.' },
  { min:60,  ad:'Adil Hâkim', emoji:'⚖️',
    metin:'Çoğu dosyada terazi dengede kaldı. Biraz daha sabır, biraz daha delil — ustalık çok yakın.' },
  { min:0,   ad:'Çırak Hâkim', emoji:'📜',
    metin:'Kürsüye yeni oturdun, terazi elinde biraz titredi. Ama unutma: her usta hâkim, çırak olarak başladı. Tekrar dene!' }
];

var MAX_PUAN = ICERIK.vakalar.reduce(function(t,v){
  return t + HUKUM_PUANI + (v.dogruHukum === 'suclu' ? CEZA_PUANI : 0);
}, 0);

/* ============ Durum ============ */
function tazeVaka(){
  return { adim:'olay', faz:'secim', sorulan:{}, incelenen:[], uyariVerildi:false,
           hukum:null, hukumPuan:0, cezaTip:null, cezaPuan:0, acikKarakter:null };
}
function tazeState(){
  return { surum:1, ekran:'acilis', vakaIndex:0, puan:0, sonuclar:[], vaka:tazeVaka() };
}
function kaydet(){
  try{ localStorage.setItem(KAYIT_ANAHTARI, JSON.stringify(state)); }catch(e){ /* özel mod vb. — sessizce geç */ }
}
function kayitYukle(){
  try{
    var ham = localStorage.getItem(KAYIT_ANAHTARI);
    if(!ham) return null;
    var s = JSON.parse(ham);
    if(!s || s.surum !== 1 || !s.vaka || !Array.isArray(s.sonuclar)) return null;
    if(s.ekran !== 'final' &&
       (typeof s.vakaIndex !== 'number' || s.vakaIndex < 0 || s.vakaIndex >= ICERIK.vakalar.length)) return null;
    return s;
  }catch(e){ return null; }
}
function kayitSil(){
  try{ localStorage.removeItem(KAYIT_ANAHTARI); }catch(e){}
}

var state = kayitYukle() || tazeState();
var acilista = true;        // açılış ekranı gösteriliyor mu (kayda yazılmaz)
var sonSoru = null;         // yeni sorulan sorunun balonuna animasyon vermek için
var modalKapatilabilir = true;

/* ============ Yardımcılar ============ */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function vakaGetir(){ return ICERIK.vakalar[state.vakaIndex]; }
function karakterGetir(id){
  return KARAKTERLER[id] || { ad:id, unvan:'', emoji:'🙂', g1:'#EDE4D3', g2:'#D8CBB4' };
}
function toplamSoru(v){
  var t = 0;
  v.taraflar.forEach(function(taraf){ t += (v.ifadeler[taraf.karakter] || []).length; });
  return t;
}
function sorulanSayisi(){
  var t = 0, s = state.vaka.sorulan;
  for(var k in s){ if(Object.prototype.hasOwnProperty.call(s,k)) t += s[k].length; }
  return t;
}
function rutbeBul(p){
  for(var i=0;i<RUTBELER.length;i++){ if(p >= RUTBELER[i].min) return RUTBELER[i]; }
  return RUTBELER[RUTBELER.length-1];
}
/* Portre: görsel yoksa gradyan + emoji görünür kalır */
function portreHTML(id, sinif){
  var k = karakterGetir(id);
  return '<span class="portre ' + (sinif||'') + '" style="background:linear-gradient(135deg,' + k.g1 + ',' + k.g2 + ')">' +
    '<span class="portre-emoji" aria-hidden="true">' + k.emoji + '</span>' +
    '<img src="../assets/karakter/' + esc(id) + '.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\'">' +
  '</span>';
}
function teraziHTML(dengede){
  return '<div class="terazi-kutu ' + (dengede ? 'dengede' : 'egik') + '">' +
  '<svg class="terazi-svg" viewBox="0 0 140 120" aria-hidden="true">' +
    '<path d="M48 114 h44 l-7 -9 h-30 z" fill="#2B2118"/>' +
    '<rect x="67" y="30" width="6" height="78" rx="3" fill="#2B2118"/>' +
    '<g class="terazi-kol">' +
      '<rect x="18" y="25.5" width="104" height="5" rx="2.5" fill="#D9A441"/>' +
      '<line x1="26" y1="28" x2="14" y2="52" stroke="#2B2118" stroke-width="2"/>' +
      '<line x1="26" y1="28" x2="38" y2="52" stroke="#2B2118" stroke-width="2"/>' +
      '<path d="M10 52 a16 10 0 0 0 32 0 z" fill="#4A7C59"/>' +
      '<line x1="114" y1="28" x2="102" y2="52" stroke="#2B2118" stroke-width="2"/>' +
      '<line x1="114" y1="28" x2="126" y2="52" stroke="#2B2118" stroke-width="2"/>' +
      '<path d="M98 52 a16 10 0 0 0 32 0 z" fill="#4A7C59"/>' +
    '</g>' +
    '<circle cx="70" cy="28" r="5" fill="#D9A441" stroke="#2B2118" stroke-width="1.5"/>' +
  '</svg></div>';
}

/* ============ Ekran şablonları ============ */
function ekranAcilis(){
  var devamVar = state.ekran !== 'acilis';
  var butonlar = devamVar
    ? '<button class="btn birincil" data-eylem="devam">Devam Et ▸</button>' +
      '<button class="btn ikincil" data-eylem="bastan-sor">↺ Baştan Başla</button>'
    : '<button class="btn birincil" data-eylem="basla">Kürsüye Geç 🔨</button>';
  return '<section class="ekran">' +
    '<div class="salon-serit">' +
      '<div class="salon-fallback"><span>⚖️</span></div>' +
      '<img src="../assets/mahkeme/salon.jpg" alt="Mahkeme salonu" onerror="this.style.display=\'none\'">' +
    '</div>' +
    '<h1 class="oyun-adi">' + esc(ICERIK.oyunAdi) + '</h1>' +
    '<p class="oyun-alt">' + esc(ICERIK.giris.baslik) + '</p>' +
    '<div class="kart giris-kart"><p>' + esc(ICERIK.giris.metin) + '</p></div>' +
    butonlar +
  '</section>';
}

function ekranDosya(){
  var n = state.vakaIndex, v = vakaGetir();
  return '<section class="ekran">' +
    '<div class="dosya-sahne"><div class="dosya">' +
      '<div class="kagit">' +
        '<span class="kagit-ust">Hayal Ortaokulu · 7-A Sınıf Mahkemesi</span>' +
        '<h2 class="kagit-baslik">Dosya #' + (n+1) + ' — ' + esc(v.baslik) + '</h2>' +
        '<span class="deger-rozet">🧭 ' + esc(v.deger) + '</span>' +
        '<p style="font-size:15px">' + esc(v.ozet) + '</p>' +
      '</div>' +
      '<div class="dosya-kapak" aria-hidden="true">' +
        '<span class="dosya-no">DOSYA #' + (n+1) + '</span>' +
        '<span class="dosya-muhur">⚖️</span>' +
        '<small>7-A SINIF MAHKEMESİ</small>' +
      '</div>' +
    '</div></div>' +
    '<button class="btn birincil" data-eylem="dosya-ac">Duruşmayı Başlat 🔨</button>' +
  '</section>';
}

function adimlarHTML(v){
  var html = '<nav class="adimlar" aria-label="Duruşma adımları">';
  ADIMLAR.forEach(function(a){
    var aktif = state.vaka.adim === a.id;
    var tamam = false;
    if(a.id === 'ifadeler') tamam = sorulanSayisi() >= toplamSoru(v);
    if(a.id === 'deliller') tamam = state.vaka.incelenen.length >= v.deliller.length;
    if(a.id === 'hukum')    tamam = state.vaka.faz !== 'secim';
    html += '<button class="adim' + (aktif?' aktif':'') + (tamam?' tamam':'') + '" ' +
      'data-eylem="adim" data-adim="' + a.id + '"' + (aktif?' aria-current="step"':'') + '>' +
      '<span class="adim-ikon">' + a.ikon + '</span><span class="adim-ad">' + a.ad + '</span></button>';
  });
  return html + '</nav>';
}

function olayHTML(v){
  var taraflar = v.taraflar.map(function(t){
    var k = karakterGetir(t.karakter);
    return '<div class="taraf-onizleme-satir">' + portreHTML(t.karakter,'kucuk') +
      '<div style="flex:1"><b style="font-size:14.5px">' + esc(k.ad) + '</b>' +
      '<div style="font-size:12px;color:var(--soluk)">' + esc(k.unvan) + '</div></div>' +
      '<span class="rol-rozet rol-' + (ROL_SINIF[t.rol]||'tanik') + '">' + esc(t.rol) + '</span></div>';
  }).join('');
  return '<div class="kart">' +
      '<span class="deger-rozet">🧭 ' + esc(v.deger) + '</span>' +
      '<h3 class="adim-baslik">Olayın Özeti</h3>' +
      '<p style="font-size:15px">' + esc(v.ozet) + '</p>' +
    '</div>' +
    '<div class="kart"><h3 class="adim-baslik">Duruşmadaki Taraflar</h3>' +
      '<div class="taraf-onizleme">' + taraflar + '</div></div>' +
    '<button class="btn birincil" data-eylem="adim" data-adim="ifadeler">İfadelere Geç ▸</button>';
}

function ifadelerHTML(v){
  var top = toplamSoru(v), sor = sorulanSayisi();
  var html = '<p class="adim-aciklama">Taraflara dokunup sorularını seç. <b>' + sor + '/' + top + '</b> soru soruldu.</p>';
  v.taraflar.forEach(function(t){
    var k = karakterGetir(t.karakter);
    var sorular = v.ifadeler[t.karakter] || [];
    var sorulanlar = state.vaka.sorulan[t.karakter] || [];
    var acik = state.vaka.acikKarakter === t.karakter;
    var bitti = sorulanlar.length >= sorular.length && sorular.length > 0;
    html += '<section class="taraf">' +
      '<button class="taraf-baslik" data-eylem="karakter" data-id="' + esc(t.karakter) + '" aria-expanded="' + acik + '">' +
        portreHTML(t.karakter,'kucuk') +
        '<span class="taraf-bilgi"><span class="taraf-ad">' + esc(k.ad) + '</span>' +
        '<span class="taraf-unvan">' + esc(k.unvan) + '</span></span>' +
        '<span class="rol-rozet rol-' + (ROL_SINIF[t.rol]||'tanik') + '">' + esc(t.rol) + '</span>' +
        '<span class="taraf-durum">' + (bitti ? '✓' : (acik ? '▴' : '▾')) + '</span>' +
      '</button>';
    if(acik){
      html += '<div class="sorular">';
      sorular.forEach(function(s,i){
        var soruldu = sorulanlar.indexOf(i) !== -1;
        html += '<button class="soru' + (soruldu?' soruldu':'') + '" data-eylem="soru" ' +
          'data-karakter="' + esc(t.karakter) + '" data-i="' + i + '"' + (soruldu?' disabled':'') + '>' +
          '<span aria-hidden="true">' + (soruldu?'✓':'❓') + '</span><span>' + esc(s.soru) + '</span></button>';
        if(soruldu){
          var yeni = sonSoru === t.karakter + ':' + i;
          html += '<div class="balon' + (yeni?' balon-yeni':'') + '">' +
            '<span class="balon-ad">' + esc(k.ad) + '</span><p>' + esc(s.cevap) + '</p></div>';
        }
      });
      html += '</div>';
    }
    html += '</section>';
  });
  html += '<button class="btn birincil" data-eylem="adim" data-adim="deliller">Delillere Geç ▸</button>';
  return html;
}

function delillerHTML(v){
  var html = '<p class="adim-aciklama">Delillere dokunup yakından incele. <b>' +
    state.vaka.incelenen.length + '/' + v.deliller.length + '</b> delil incelendi.</p><div class="delil-izgara">';
  v.deliller.forEach(function(d,i){
    var inc = state.vaka.incelenen.indexOf(i) !== -1;
    html += '<button class="delil' + (inc?' incelendi':'') + '" data-eylem="delil" data-i="' + i + '">' +
      '<span class="delil-emoji" aria-hidden="true">' + d.emoji + '</span>' +
      '<span class="delil-ad">' + esc(d.ad) + '</span>' +
      (inc ? '<span class="delil-tik">✓</span>' : '') + '</button>';
  });
  html += '</div><button class="btn birincil" data-eylem="adim" data-adim="hukum">Hüküm Aşamasına Geç ▸</button>';
  return html;
}

function hukumHTML(v){
  var faz = state.vaka.faz;

  /* 1) Hüküm seçimi */
  if(faz === 'secim'){
    var html = '<div class="durum-satiri">💬 ' + sorulanSayisi() + '/' + toplamSoru(v) + ' soru soruldu · 🔍 ' +
      state.vaka.incelenen.length + '/' + v.deliller.length + ' delil incelendi</div>' +
      '<div class="kart"><h3 class="adim-baslik">Hükmünü Ver, Hâkimim</h3>' +
      '<p style="font-size:14.5px;color:var(--soluk);margin:0">İfadeleri ve delilleri vicdan terazinde tart. Tokmak senin elinde.</p></div>';
    ['suclu','sucsuz','delilYetersiz'].forEach(function(h){
      var b = HUKUMLER[h];
      html += '<button class="hukum-btn ' + b.sinif + '" data-eylem="hukum-sec" data-hukum="' + h + '">' +
        '<span>' + b.emoji + '</span><span>' + b.etiket + '</span></button>';
    });
    return html;
  }

  var dogru = state.vaka.hukum === v.dogruHukum;

  /* 2) Terazi + Perde Arkası */
  if(faz === 'sonuc'){
    var secilen = HUKUMLER[state.vaka.hukum], dogrusu = HUKUMLER[v.dogruHukum];
    var html2 = teraziHTML(dogru);
    if(dogru){
      html2 += '<h3 class="sonuc-baslik">Terazi Dengede!</h3>' +
        '<p class="sonuc-metin">Vicdanınla baktın, acele etmedin ve doğru hükmü verdin: <b>' + secilen.emoji + ' ' + secilen.etiket + '</b></p>' +
        '<span class="puan-kazanc">+' + HUKUM_PUANI + ' Adalet Puanı</span>';
    }else{
      html2 += '<h3 class="sonuc-baslik">Terazi Eğildi...</h3>' +
        '<p class="sonuc-metin">Senin hükmün: <b>' + secilen.emoji + ' ' + secilen.etiket + '</b><br>Doğru hüküm: <b>' +
        dogrusu.emoji + ' ' + dogrusu.etiket + '</b></p>' +
        '<span class="puan-kazanc kayip">Bu dosyadan puan yok</span>';
    }
    html2 += '<div class="perde"><h4>🎭 Perde Arkası</h4><p>' + esc(v.gercek) + '</p></div>';
    if(dogru && v.dogruHukum === 'suclu' && v.cezalar && v.cezalar.length){
      html2 += '<button class="btn birincil" data-eylem="faz" data-faz="ceza">Cezayı Belirle ▸</button>';
    }else{
      html2 += '<button class="btn birincil" data-eylem="faz" data-faz="ders">📜 Hâkimin Notu ▸</button>';
    }
    return html2;
  }

  /* 3) Ceza seçimi (yalnız doğru "suçlu" hükmünde) */
  if(faz === 'ceza'){
    var html3 = '<div class="kart"><h3 class="adim-baslik">Cezayı Sen Belirle</h3>' +
      '<p style="font-size:14.5px;color:var(--soluk);margin:0">Hüküm verildi; şimdi sıra adaletin nasıl onaracağında. Hangi karar yarayı sarar?</p></div>';
    v.cezalar.forEach(function(c,i){
      html3 += '<button class="ceza-sec" data-eylem="ceza-sec" data-i="' + i + '">' + esc(c.metin) + '</button>';
    });
    return html3;
  }

  /* 4) Hâkimin Notu + sonraki dosya */
  var html4 = '';
  if(state.vaka.cezaTip && CEZA_YORUM[state.vaka.cezaTip]){
    var y = CEZA_YORUM[state.vaka.cezaTip];
    html4 += '<div class="degerlendirme ' + y.sinif + '"><h4>' + y.baslik + '</h4><p>' + y.metin + '</p></div>';
  }
  html4 += '<div class="not-kart"><h4>📜 Hâkimin Notu</h4><p>' + esc(v.ders) + '</p></div>';
  html4 += '<p class="dosya-puani">Bu dosyadan kazandığın: +' + (state.vaka.hukumPuan + state.vaka.cezaPuan) + ' Adalet Puanı</p>';
  var sonMu = state.vakaIndex >= ICERIK.vakalar.length - 1;
  html4 += '<button class="btn birincil" data-eylem="sonraki-vaka">' +
    (sonMu ? 'Nihai Karara Git ▸' : 'Sonraki Dosya ▸') + '</button>';
  return html4;
}

function ekranOyun(){
  var v = vakaGetir();
  var icerik = '';
  switch(state.vaka.adim){
    case 'olay':     icerik = olayHTML(v); break;
    case 'ifadeler': icerik = ifadelerHTML(v); break;
    case 'deliller': icerik = delillerHTML(v); break;
    case 'hukum':    icerik = hukumHTML(v); break;
  }
  return '<section class="ekran">' +
    '<div class="oyun-baslik"><span class="dosya-etiket">Dosya #' + (state.vakaIndex+1) + ' / ' + ICERIK.vakalar.length + '</span>' +
    '<h2>' + esc(v.baslik) + '</h2></div>' +
    adimlarHTML(v) +
    '<div class="adim-icerik">' + icerik + '</div>' +
  '</section>';
}

function ekranFinal(){
  var r = rutbeBul(state.puan);
  var satirlar = '';
  state.sonuclar.forEach(function(s,i){
    var v = ICERIK.vakalar[i];
    if(!v) return;
    var sen = HUKUMLER[s.hukum] || { etiket:'—', emoji:'' };
    var dog = HUKUMLER[v.dogruHukum];
    satirlar += '<div class="ozet-satir">' +
      '<span class="ozet-ikon ' + (s.dogru?'d':'y') + '">' + (s.dogru?'✓':'✗') + '</span>' +
      '<div class="ozet-orta"><b>#' + (i+1) + ' ' + esc(v.baslik) + '</b>' +
      '<span>Hükmün: ' + sen.etiket + ' · Doğrusu: ' + dog.etiket + '</span></div>' +
      '<span class="ozet-puan">+' + s.puan + '</span></div>';
  });
  return '<section class="ekran">' +
    '<div class="final-tepe">' +
      '<span class="final-emoji">' + r.emoji + '</span>' +
      '<div class="dosya-etiket">Mahkeme karara vardı — rütben:</div>' +
      '<h2 class="rutbe-ad">' + r.ad + '</h2>' +
      '<div class="rutbe-puan">⚖️ ' + state.puan + ' / ' + MAX_PUAN + ' Adalet Puanı</div>' +
      '<p class="rutbe-metin">' + r.metin + '</p>' +
    '</div>' +
    '<h3 class="ozet-baslik">📋 Dosya Özeti</h3>' + satirlar +
    '<button class="btn birincil" data-eylem="tekrar">Tekrar Oyna ↺</button>' +
  '</section>';
}

/* ============ Çizim ============ */
function render(basaKaydir){
  var app = document.getElementById('uygulama');
  var html = '';
  if(acilista) html = ekranAcilis();
  else if(state.ekran === 'dosya') html = ekranDosya();
  else if(state.ekran === 'oyun')  html = ekranOyun();
  else if(state.ekran === 'final') html = ekranFinal();
  else html = ekranAcilis();
  app.innerHTML = html;
  sonSoru = null;
  ustGuncelle();
  if(basaKaydir) window.scrollTo(0,0);
}
function ustGuncelle(){
  var cip = document.getElementById('puanCip');
  var btn = document.getElementById('btnSifirla');
  var goster = !acilista;
  cip.hidden = !goster;
  btn.hidden = !goster;
  cip.textContent = '⚖️ ' + state.puan;
}

/* ============ Modal ============ */
function modalAc(html, butonlar, kapatilabilir){
  modalKapatilabilir = kapatilabilir !== false;
  document.getElementById('modal-icerik').innerHTML = html;
  var kutu = document.getElementById('modal-butonlar');
  kutu.innerHTML = '';
  (butonlar || [{ metin:'Tamam' }]).forEach(function(b){
    var el = document.createElement('button');
    el.className = 'btn ' + (b.sinif || 'birincil');
    el.textContent = b.metin;
    el.addEventListener('click', function(){ modalKapat(); if(b.tik) b.tik(); });
    kutu.appendChild(el);
  });
  document.getElementById('modal').hidden = false;
  var ilk = kutu.querySelector('button');
  if(ilk) ilk.focus();
}
function modalKapat(){ document.getElementById('modal').hidden = true; }

/* ============ Oyun eylemleri ============ */
function oyunaBasla(){
  state = tazeState();
  state.ekran = 'dosya';
  acilista = false;
  kaydet(); render(true);
}
function adimGec(a){
  /* Hüküm adımına erken geçişte nazik uyarı — engel yok, sadece hatırlatma */
  if(a === 'hukum' && state.vaka.faz === 'secim' && !state.vaka.uyariVerildi){
    var v = vakaGetir();
    var eksikSoru = toplamSoru(v) - sorulanSayisi();
    var eksikDelil = v.deliller.length - state.vaka.incelenen.length;
    if(eksikSoru > 0){
      state.vaka.uyariVerildi = true; kaydet();
      var m = 'Kürsüde henüz dinlenmemiş <b>' + eksikSoru + ' soru</b>' +
        (eksikDelil > 0 ? ' ve incelenmemiş <b>' + eksikDelil + ' delil</b>' : '') +
        ' var. Nazan Öğretmen\'in sözünü hatırla: <i>"Acele hüküm, adaletin en büyük düşmanıdır."</i>';
      modalAc('<h3>🔔 Bir dakika hâkimim!</h3><p>' + m + '</p>', [
        { metin:'İfadelere Dön', sinif:'birincil',
          tik:function(){ state.vaka.adim = 'ifadeler'; kaydet(); render(true); } },
        { metin:'Yine de Hüküm Ver', sinif:'ikincil',
          tik:function(){ state.vaka.adim = 'hukum'; kaydet(); render(true); } }
      ]);
      return;
    }
  }
  state.vaka.adim = a; kaydet(); render(true);
}
function soruSor(kid, i){
  var s = state.vaka.sorulan;
  if(!s[kid]) s[kid] = [];
  if(s[kid].indexOf(i) !== -1) return;
  s[kid].push(i);
  sonSoru = kid + ':' + i;
  kaydet(); render(false);
}
function delilIncele(i){
  var v = vakaGetir(), d = v.deliller[i];
  if(!d) return;
  if(state.vaka.incelenen.indexOf(i) === -1){
    state.vaka.incelenen.push(i);
    kaydet(); render(false);
  }
  modalAc('<div class="delil-detay"><span class="delil-detay-emoji">' + d.emoji + '</span>' +
    '<h3>' + esc(d.ad) + '</h3><p>' + esc(d.aciklama) + '</p></div>',
    [{ metin:'İncelendi ✓' }]);
}
function hukumVer(h){
  if(state.vaka.faz !== 'secim' || !HUKUMLER[h]) return;
  var v = vakaGetir();
  state.vaka.hukum = h;
  state.vaka.hukumPuan = (h === v.dogruHukum) ? HUKUM_PUANI : 0;
  state.puan += state.vaka.hukumPuan;
  state.vaka.faz = 'sonuc';
  kaydet(); render(true);
}
function cezaVer(i){
  if(state.vaka.faz !== 'ceza') return;
  var v = vakaGetir(), c = v.cezalar && v.cezalar[i];
  if(!c) return;
  state.vaka.cezaTip = c.tip;
  state.vaka.cezaPuan = (c.tip === 'onarici') ? CEZA_PUANI : 0;
  state.puan += state.vaka.cezaPuan;
  state.vaka.faz = 'ders';
  kaydet(); render(true);
}
function sonrakiVaka(){
  if(state.sonuclar.length !== state.vakaIndex) return; // çifte tıklamaya karşı koruma
  var v = vakaGetir();
  state.sonuclar.push({
    hukum: state.vaka.hukum,
    dogru: state.vaka.hukum === v.dogruHukum,
    puan: state.vaka.hukumPuan + state.vaka.cezaPuan,
    cezaTip: state.vaka.cezaTip
  });
  state.vakaIndex++;
  if(state.vakaIndex >= ICERIK.vakalar.length){
    state.ekran = 'final';
  }else{
    state.vaka = tazeVaka();
    state.ekran = 'dosya';
  }
  kaydet(); render(true);
}
function sifirlaSor(){
  modalAc('<h3>↺ Baştan Başla</h3><p>Tüm ilerlemen ve Adalet Puanların silinecek. Emin misin?</p>', [
    { metin:'Evet, Baştan Başla', sinif:'tehlike',
      tik:function(){ kayitSil(); state = tazeState(); acilista = true; render(true); } },
    { metin:'Vazgeç', sinif:'ikincil' }
  ]);
}

/* ============ Olay dinleyicileri ============ */
/* Yalnız "click" dinlenir: modern tarayıcılarda dokunma da tek bir click üretir,
   böylece touch + click çifte tetiklenmesi olmaz. */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-eylem]') : null;
  if(!el) return;
  switch(el.dataset.eylem){
    case 'basla':        oyunaBasla(); break;
    case 'devam':        acilista = false; render(true); break;
    case 'bastan-sor':
      modalAc('<h3>↺ Baştan Başla</h3><p>Kayıtlı ilerlemen silinecek ve yeni bir duruşma başlayacak. Emin misin?</p>', [
        { metin:'Evet, Baştan Başla', sinif:'tehlike', tik:oyunaBasla },
        { metin:'Vazgeç', sinif:'ikincil' }
      ]);
      break;
    case 'dosya-ac':     state.ekran = 'oyun'; state.vaka.adim = 'olay'; kaydet(); render(true); break;
    case 'adim':         adimGec(el.dataset.adim); break;
    case 'karakter':
      state.vaka.acikKarakter = (state.vaka.acikKarakter === el.dataset.id) ? null : el.dataset.id;
      kaydet(); render(false);
      break;
    case 'soru':         soruSor(el.dataset.karakter, parseInt(el.dataset.i, 10)); break;
    case 'delil':        delilIncele(parseInt(el.dataset.i, 10)); break;
    case 'hukum-sec':    hukumVer(el.dataset.hukum); break;
    case 'ceza-sec':     cezaVer(parseInt(el.dataset.i, 10)); break;
    case 'faz':          state.vaka.faz = el.dataset.faz; kaydet(); render(true); break;
    case 'sonraki-vaka': sonrakiVaka(); break;
    case 'tekrar':       oyunaBasla(); break;
    case 'sifirla-sor':  sifirlaSor(); break;
    case 'modal-kapat':  if(modalKapatilabilir) modalKapat(); break;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !document.getElementById('modal').hidden && modalKapatilabilir){
    modalKapat();
  }
});

/* ============ Başlat ============ */
render(true);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/kuran-ogretmenim/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kur'an okumayı kolayca öğrenmek isteyenler için hazırlanan dijital dersler ve içerikler.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kur'an Öğretmenim">
  <link rel="apple-touch-icon" href="icons/logo-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/logo-192.png"/>

  <title>Kur'an Öğretmenim — Uygulama</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#e9f5ee}
    #ko-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#e9f5ee;color:#1c2a25;font-family:"Segoe UI",Roboto,Arial,sans-serif;z-index:99999;transition:opacity .35s ease}
    #ko-splash.out{opacity:0;pointer-events:none}
    #ko-splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 40px -20px rgba(28,42,37,.5)}
    #ko-splash b{font-size:20px;letter-spacing:.01em}
    #ko-splash span{font-size:14px;color:#51605a}
    #ko-splash .bar{width:160px;height:4px;border-radius:4px;background:#cfe3d8;overflow:hidden}
    #ko-splash .bar i{display:block;width:40%;height:100%;background:#0e5a46;border-radius:4px;animation:ko-slide 1.1s ease-in-out infinite}
    @keyframes ko-slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#ko-splash .bar i{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="ko-splash" role="status" aria-live="polite">
    <img src="icons/logo-192.png" width="112" height="112" alt="">
    <b>Kur'an Öğretmenim</b>
    <span>Dersler hazırlanıyor…</span>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function(){
      var done=false;
      function hide(){ if(done) return; done=true; var s=document.getElementById('ko-splash'); if(!s) return; s.classList.add('out'); setTimeout(function(){ s.remove(); },400); }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 25000);
      if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('/kuran-ogretmenim/sw.js', { scope: '/kuran-ogretmenim/' }).catch(function(){}); }); }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

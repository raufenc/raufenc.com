<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أيام الأسبوع — رتّب الأيام</title>
<style>
@font-face{font-family:'Arakom';src:url('Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#01579B,#0277BD,#039BE5);min-height:100vh;color:#01579B;padding:20px;font-size:clamp(16px,1.8vw,22px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:760px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#01579B;font-size:1.6em;margin-bottom:6px}
.sub{text-align:center;color:#0277BD;margin-bottom:18px}
.bar{display:flex;justify-content:space-between;background:#E1F5FE;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:bold;color:#01579B;flex-wrap:wrap;gap:6px}
.area{background:#F1F8FF;border-radius:16px;padding:14px;margin-bottom:14px;min-height:300px}
.day{background:#fff;border:2px solid #B3E5FC;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:grab;user-select:none;transition:all .2s;touch-action:none}
.day:hover{border-color:#03A9F4;background:#E1F5FE}
.day .num{background:#03A9F4;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.day .ic{font-size:1.6em;flex-shrink:0}
.day .name{flex:1;font-size:1.2em;font-weight:bold}
.day .name .tr{display:block;font-size:.7em;color:#777;font-weight:normal;margin-top:2px}
.day .arr{display:flex;flex-direction:column;gap:2px}
.day .arr button{background:#B3E5FC;border:none;border-radius:6px;width:28px;height:22px;cursor:pointer;font-size:.8em}
.day .arr button:hover{background:#03A9F4;color:#fff}
.day.correct{background:#C8E6C9;border-color:#4CAF50}
.day.wrong{background:#FFCDD2;border-color:#F44336;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.actions{text-align:center;margin-top:8px}
.btn{display:inline-block;background:#0277BD;color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{background:#01579B}
.btn.alt{background:#9c88ff}
.btn.suc{background:#4CAF50}
.result{text-align:center}
.result .score{font-size:3em;color:#0277BD;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10}
.back:hover{background:rgba(0,0,0,.85)}
.tip{text-align:center;color:#0288D1;font-size:.95em;margin-bottom:10px;padding:8px;background:#E1F5FE;border-radius:10px}
</style>
</head>
<body>
<a href="./index.html" class="back">↩ القائمة</a>
<div class="box">
<h1>📅 أَيّامُ الأُسْبوعِ</h1>
<div class="sub" id="sub">رَتِّبْ أَيّامَ الأُسْبوعِ مِنَ الأَحَدِ إلى السَّبْتِ</div>
<div id="game">
<div class="bar"><span>المُحاوَلَة: <span id="att">1</span></span><span>الجُزْء: <span id="part">١</span>/٢</span></div>
<div class="tip" id="tip">اِسْتَخْدِم الأَسْهُمَ ▲▼ أَوْ اسْحَبِ الأَيّامَ لِتَرْتيبِها</div>
<div class="area" id="area"></div>
<div class="actions">
<button class="btn suc" onclick="check()">تَحَقَّقْ ✅</button>
<button class="btn alt" onclick="shuffleDays()">خَلْط 🔀</button>
</div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#01579B">🎉 رائِعٌ!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#0277BD;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إعادة 🔄</button>
<button class="btn alt" onclick="location.href='./index.html'">القائمة ↩</button>
</div>
</div>
<script>
var PARTS=[
{name:'الجُزْءُ الأَوَّل: مِنَ الأَحَدِ إلى الأَرْبِعاء',days:[
{name:'الأَحَد',tr:'Pazar',ic:'☀️',id:0},
{name:'الإِثْنَيْن',tr:'Pazartesi',ic:'🌙',id:1},
{name:'الثُّلاثاء',tr:'Salı',ic:'3️⃣',id:2},
{name:'الأَرْبِعاء',tr:'Çarşamba',ic:'4️⃣',id:3}
]},
{name:'الجُزْءُ الثّاني: مِنَ الخَميسِ إلى السَّبْتِ',days:[
{name:'الخَميس',tr:'Perşembe',ic:'5️⃣',id:0},
{name:'الجُمُعَة',tr:'Cuma',ic:'🕌',id:1},
{name:'السَّبْت',tr:'Cumartesi',ic:'🌳',id:2}
]}
];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var stage,order,att,p1Score;
function init(){stage=0;att=1;p1Score=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadPart()}
function loadPart(){
att=1;
document.getElementById('att').textContent=att;
document.getElementById('part').textContent=stage===0?'١':'٢';
document.getElementById('sub').textContent=PARTS[stage].name;
shuffleDays();
}
function shuffleDays(){order=shuf([...PARTS[stage].days]);render()}
function render(){
var a=document.getElementById('area');a.innerHTML='';
order.forEach(function(it,i){
var el=document.createElement('div');el.className='day';
el.innerHTML='<div class="arr"><button onclick="move('+i+',-1)">▲</button><button onclick="move('+i+',1)">▼</button></div><div class="num">'+(i+1)+'</div><div class="ic">'+it.ic+'</div><div class="name">'+it.name+'<span class="tr">'+it.tr+'</span></div>';
el.draggable=true;el.dataset.i=i;
el.addEventListener('dragstart',function(e){e.dataTransfer.setData('text',String(i));el.style.opacity='.5'});
el.addEventListener('dragend',function(){el.style.opacity='1'});
el.addEventListener('dragover',function(e){e.preventDefault();el.style.background='#B3E5FC'});
el.addEventListener('dragleave',function(){el.style.background=''});
el.addEventListener('drop',function(e){e.preventDefault();el.style.background='';var from=parseInt(e.dataTransfer.getData('text'));if(from!==i){var m=order.splice(from,1)[0];order.splice(i,0,m);render()}});
var td={};
el.addEventListener('touchstart',function(e){td.y=e.touches[0].clientY;td.moved=false},{passive:true});
el.addEventListener('touchmove',function(){td.moved=true},{passive:true});
el.addEventListener('touchend',function(e){if(td.moved){var diff=e.changedTouches[0].clientY-td.y;if(Math.abs(diff)>30)move(i,diff>0?1:-1)}},{passive:true});
a.appendChild(el);
});
}
function move(i,d){var n=i+d;if(n<0||n>=order.length)return;var tmp=order[i];order[i]=order[n];order[n]=tmp;render()}
function check(){
var els=document.querySelectorAll('.day');var cor=0;
order.forEach(function(it,i){if(it.id===i){cor++;els[i].classList.add('correct');els[i].classList.remove('wrong')}else{els[i].classList.add('wrong');els[i].classList.remove('correct')}});
if(cor===order.length){setTimeout(nextOrEnd,800)}
else{att++;document.getElementById('att').textContent=att}
}
function nextOrEnd(){
var s=Math.max(10,100-Math.max(0,(att-1)*15));
if(stage===0){p1Score=s;stage=1;loadPart()}
else{end(s)}
}
function end(p2){
var fs=Math.round((p1Score+p2)/2);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent='الجُزْءُ الأَوَّل: '+p1Score+'%  |  الجُزْءُ الثّاني: '+p2+'%';
}
init();
</script>
</body>
</html>

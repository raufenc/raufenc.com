    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.04-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/></svg>',
    git: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>',
    indir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>',
    paylas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    ses0: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>',
    ses1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
    yatay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/></svg>',
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function duz(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }

  // Videosu olan projeler; öne çıkanlar önce
  var tumu = PROJELER.filter(function (p) { return p.video; });
  tumu.sort(function (a, b) { return (b.featured ? 1 : 0) - (a.featured ? 1 : 0); });
  var aktifKat = 'tumu';
  var gorunen = tumu.slice();

  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var telefonDikey = function () { return window.matchMedia('(max-width: 820px) and (orientation: portrait)').matches; };

  // ── Süzgeçler ──
  var filtersEl = document.getElementById('filters');
  var katlar = [{ slug: 'tumu', name: 'Tümü' }].concat(KATEGORILER.filter(function (k) { return tumu.some(function (p) { return p.kategori === k.slug; }); }));
  katlar.forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'filter-btn'; b.textContent = k.name;
    b.setAttribute('aria-pressed', k.slug === 'tumu' ? 'true' : 'false');
    b.addEventListener('click', function () {
      aktifKat = k.slug;
      [].forEach.call(filtersEl.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      ciz();
    });
    filtersEl.appendChild(b);
  });

  // ── Izgara ──
  var vg = document.getElementById('vg');
  function ciz() {
    gorunen = tumu.filter(function (p) { return aktifKat === 'tumu' || p.kategori === aktifKat; });
    vg.innerHTML = '';
    document.getElementById('count').textContent = gorunen.length + ' video';
    if (!gorunen.length) { vg.innerHTML = '<p class="empty">Bu kategoride henüz video yok.</p>'; return; }
    gorunen.forEach(function (p, i) {
      var c = document.createElement('article');
      c.className = 'vg-card';
      c.id = 'v-' + p.video;
      var ext = /^https?:/.test(p.href);
      c.innerHTML =
        '<button class="vg-media" type="button" aria-label="' + esc(duz(p.title)) + ' — tanıtım videosunu izle">' +
          '<img src="' + VT.yol(p.video, 'kart.jpg') + '" alt="" loading="' + (i < 6 ? 'eager' : 'lazy') + '" decoding="async" width="640" height="360">' +
          '<span class="pl">' + IK.play + '<span class="dur">İzle</span></span>' +
        '</button>' +
        '<div class="vg-body">' +
          '<span class="vg-cat">' + esc(VT.kategoriAdi(p)) + ' · ' + esc(p.tag) + '</span>' +
          '<h2 class="vg-title">' + esc(duz(p.title)) + '</h2>' +
          '<p class="vg-desc">' + esc(duz(p.desc)) + '</p>' +
          '<div class="vg-actions">' +
            '<a class="vg-a" href="' + esc(p.href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>Projeye git ' + IK.git + '</a>' +
            '<a class="vg-a" href="' + VT.yol(p.video, 'dikey.mp4') + '" download="raufenc-' + p.video + '-dikey.mp4">' + IK.indir + ' Dikey</a>' +
            '<a class="vg-a" href="' + VT.yol(p.video, 'yatay.mp4') + '" download="raufenc-' + p.video + '-yatay.mp4">' + IK.indir + ' Yatay</a>' +
          '</div>' +
        '</div>';
      var m = c.querySelector('.vg-media');
      m.addEventListener('click', function () {
        if (telefonDikey()) akisAc(gorunen.indexOf(p), true);
        else VT.ac(p, gorunen, { hash: true });
      });
      if (finePointer && !reduce) {
        var v = null;
        m.addEventListener('mouseenter', function () {
          if (!v) {
            v = document.createElement('video');
            v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
            v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
            v.src = VT.yol(p.video, 'kart.mp4');
            m.insertBefore(v, m.querySelector('.pl'));
            v.addEventListener('playing', function () { m.classList.add('playing'); });
          }
          v.play().catch(function () {});
        });
        m.addEventListener('mouseleave', function () { if (v) { v.pause(); m.classList.remove('playing'); } });
      }
      vg.appendChild(c);
    });
    VT.bildirge().then(function (b) {
      gorunen.forEach(function (p) {
        var el = document.querySelector('#v-' + p.video + ' .dur');
        var m = b[p.video];
        if (el && m && m.sure) { var sn = Math.round(m.sure); el.textContent = Math.floor(sn / 60) + ':' + ('0' + (sn % 60)).slice(-2); }
      });
    });
  }
  ciz();

  // ── Akış ──
  var feed = document.getElementById('feed');
  var feedTop = document.getElementById('feed-top');
  var sesAcik = false;
  var aktif = -1;
  var io = null;
  var liste = [];

  function oge(p, i) {
    var d = document.createElement('section');
    d.className = 'fi';
    d.dataset.i = i;
    d.setAttribute('aria-label', duz(p.title));
    var ext = /^https?:/.test(p.href);
    d.innerHTML =
      '<div class="fi-bg" style="background-image:url(' + VT.yol(p.video, 'kart-dikey.jpg') + ')"></div>' +
      '<div class="fi-box">' +
        '<video playsinline loop preload="none"></video>' +
        '<div class="fi-shade"></div>' +
        '<div class="fi-paused">' + IK.play + '</div>' +
        '<div class="fi-bar"><i></i></div>' +
      '</div>' +
      '<div class="fi-info">' +
        '<div class="fi-cat">' + esc(VT.kategoriAdi(p)) + '</div>' +
        '<div class="fi-title">' + esc(duz(p.title)) + '</div>' +
        '<div class="fi-desc">' + esc(duz(p.desc)) + '</div>' +
        '<a class="fi-go" href="' + esc(p.href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>Projeye git ' + IK.git + '</a>' +
      '</div>' +
      '<div class="fi-rail">' +
        '<button class="fi-rb fi-ses" type="button" aria-label="Sesi aç">' + IK.ses0 + '</button>' +
        '<button class="fi-rb fi-pay" type="button" aria-label="Paylaş">' + IK.paylas + '</button>' +
        '<a class="fi-rb" href="' + VT.yol(p.video, 'dikey.mp4') + '" download="raufenc-' + p.video + '-dikey.mp4" aria-label="Dikey videoyu indir">' + IK.indir + '</a>' +
        '<button class="fi-rb fi-yat" type="button" aria-label="Yatay sürümü aç">' + IK.yatay + '</button>' +
      '</div>';
    var v = d.querySelector('video');
    var bar = d.querySelector('.fi-bar i');
    v.muted = !sesAcik;
    v.addEventListener('timeupdate', function () { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; });
    d.querySelector('.fi-box').addEventListener('click', function () {
      if (v.paused) { v.play().catch(function () {}); d.classList.remove('paused'); }
      else { v.pause(); d.classList.add('paused'); }
    });
    d.querySelector('.fi-ses').addEventListener('click', function () { sesAyarla(!sesAcik); });
    d.querySelector('.fi-pay').addEventListener('click', function () { VT.paylas(p); });
    d.querySelector('.fi-yat').addEventListener('click', function () {
      v.pause();
      VT.ac(p, liste, { bicim: 'yatay', kapaninca: function () { if (aktif === i) v.play().catch(function () {}); } });
    });
    return d;
  }

  function sesAyarla(acik) {
    sesAcik = acik;
    [].forEach.call(feed.querySelectorAll('.fi'), function (d) {
      var v = d.querySelector('video');
      v.muted = !acik;
      var b = d.querySelector('.fi-ses');
      b.innerHTML = acik ? IK.ses1 : IK.ses0;
      b.setAttribute('aria-label', acik ? 'Sesi kapat' : 'Sesi aç');
    });
  }

  function hazirla(i) {
    // etkin öğe ve komşularına kaynak ver; uzaktakileri boşalt
    [].forEach.call(feed.children, function (d) {
      var j = +d.dataset.i, v = d.querySelector('video');
      var p = liste[j];
      if (Math.abs(j - i) <= 1) {
        if (!v.getAttribute('poster')) v.poster = VT.yol(p.video, 'dikey.jpg');
        if (!v.getAttribute('src')) { v.src = VT.yol(p.video, 'dikey.mp4'); v.preload = j === i ? 'auto' : 'metadata'; }
      } else if (v.getAttribute('src') && Math.abs(j - i) > 2) {
        v.pause(); v.removeAttribute('src'); v.load();
      }
    });
  }

  function etkinlestir(i) {
    if (i === aktif) return;
    aktif = i;
    hazirla(i);
    [].forEach.call(feed.children, function (d) {
      var v = d.querySelector('video');
      if (+d.dataset.i === i) {
        d.classList.remove('paused');
        try { v.currentTime = 0; } catch (e) {}
        v.muted = !sesAcik;
        var pr = v.play();
        if (pr && pr.catch) pr.catch(function () { v.muted = true; sesAyarla(false); v.play().catch(function () {}); });
        history.replaceState(null, '', '#' + liste[i].video);
        if (window.gtag) gtag('event', 'tanitim_izle', { video: liste[i].video, bicim: 'akis' });
      } else { v.pause(); }
    });
  }

  function akisAc(bas, kullaniciSesi) {
    liste = gorunen.slice();
    feed.innerHTML = '';
    liste.forEach(function (p, i) { feed.appendChild(oge(p, i)); });
    feed.hidden = false; feedTop.hidden = false;
    document.documentElement.classList.add('feed-lock');
    aktif = -1;
    if (kullaniciSesi) sesAyarla(true); else sesAyarla(sesAcik);
    var hedef = feed.children[Math.max(0, bas || 0)];
    feed.scrollTop = hedef ? hedef.offsetTop : 0;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (g) {
      g.forEach(function (x) { if (x.isIntersecting && x.intersectionRatio >= 0.6) etkinlestir(+x.target.dataset.i); });
    }, { root: feed, threshold: [0.6] });
    [].forEach.call(feed.children, function (d) { io.observe(d); });
    etkinlestir(Math.max(0, bas || 0));
    var ipucuGoruldu = false;
    try { ipucuGoruldu = !!sessionStorage.getItem('vt-ipucu'); } catch (e) { ipucuGoruldu = true; }
    if (!ipucuGoruldu) {
      var h = document.createElement('div');
      h.className = 'feed-hint'; h.textContent = 'Sonraki video için yukarı kaydır';
      document.body.appendChild(h);
      setTimeout(function () { h.style.opacity = '0'; setTimeout(function () { h.remove(); }, 500); }, 2600);
      try { sessionStorage.setItem('vt-ipucu', '1'); } catch (e) {}
    }
    document.getElementById('feed-x').focus({ preventScroll: true });
  }

  function akisKapat() {
    if (feed.hidden) return;
    if (io) io.disconnect();
    [].forEach.call(feed.querySelectorAll('video'), function (v) { v.pause(); v.removeAttribute('src'); v.load(); });
    feed.innerHTML = '';
    feed.hidden = true; feedTop.hidden = true;
    document.documentElement.classList.remove('feed-lock');
    var p = liste[aktif];
    aktif = -1;
    history.replaceState(null, '', location.pathname);
    if (p) { var c = document.getElementById('v-' + p.video); if (c) c.scrollIntoView({ block: 'center' }); }
  }

  document.getElementById('btn-feed').addEventListener('click', function () { akisAc(0, true); });
  document.getElementById('feed-x').addEventListener('click', akisKapat);
  document.addEventListener('keydown', function (e) {
    if (feed.hidden || document.querySelector('.vt-modal')) return;
    if (e.key === 'Escape') akisKapat();
    else if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') { e.preventDefault(); var n = feed.children[aktif + 1]; if (n) n.scrollIntoView({ behavior: 'smooth' }); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k') { e.preventDefault(); var pv = feed.children[aktif - 1]; if (pv) pv.scrollIntoView({ behavior: 'smooth' }); }
    else if (e.key === 'm') sesAyarla(!sesAcik);
  });

  // ── Derin bağlantı: /videolar/#slug ──
  function hashAc() {
    var s = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!s) return;
    var i = gorunen.findIndex(function (p) { return p.video === s; });
    if (i < 0) return;
    if (telefonDikey()) akisAc(i);
    else {
      var c = document.getElementById('v-' + s);
      if (c) c.scrollIntoView({ block: 'center' });
      // sesli otomatik oynatma kullanıcı etkileşimi ister; oynatıcı sessiz başlarsa denetimlerden açılır
      VT.ac(gorunen[i], gorunen, { hash: true });
    }
  }
  hashAc();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öğretmen Paneli — Kâşif Motoru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --gece:#16233F; --gece2:#1f2f52; --altin:#c8a46e; --altin-acik:#f0c169;
         --kagit:#f5ede0; --murekkep:#2b2118; --kiremit:#c4574a; --yesil:#4a7c59; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ font-family:'Inter',system-ui,sans-serif; background:
        radial-gradient(ellipse 120% 80% at 50% -10%, #24365f, #16233F 70%);
        color:var(--kagit); min-height:100vh; padding:24px; }
  .kutu{ max-width:820px; margin:0 auto; }
  h1{ font-family:'Fraunces',Georgia,serif; font-size:26px; color:var(--altin-acik); margin-bottom:4px; }
  .alt{ color:#a9b4cc; font-size:14px; margin-bottom:22px; }
  .kart{ background:rgba(255,255,255,.05); border:1px solid rgba(200,164,110,.25);
         border-radius:16px; padding:18px 20px; margin-bottom:16px; }
  .kart h2{ font-family:'Fraunces',serif; font-size:17px; color:var(--altin); margin-bottom:12px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.08); }
  th{ color:#a9b4cc; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .arap{ font-family:'Amiri',serif; font-size:18px; }
  .rozet{ display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; }
  .gecti{ background:rgba(74,124,89,.25); color:#9fe0b0; }
  .bitti{ background:rgba(200,164,110,.2); color:var(--altin-acik); }
  .yok{ color:#8893ad; font-style:italic; }
  .bar{ height:8px; border-radius:100px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:5px; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--kiremit),var(--altin-acik)); }
  button{ font-family:inherit; background:transparent; color:var(--kiremit); border:1px solid var(--kiremit);
          padding:8px 16px; border-radius:100px; cursor:pointer; font-weight:600; margin-top:8px; }
  button:hover{ background:rgba(196,87,74,.12); }
  a{ color:var(--altin-acik); }
</style>
</head>
<body>
<div class="kutu">
  <h1>🕯️ Öğretmen Paneli</h1>
  <div class="alt">Çarşı Diyarı — İHO 7 Arapça · Ünite 3 &nbsp;·&nbsp; <a href="../index.html">← oyuna dön</a></div>

  <div class="kart">
    <h2>Bölüm İlerlemesi ve Skorlar</h2>
    <div id="bolumler"></div>
  </div>

  <div class="kart">
    <h2>En Çok Zorlanılan Kazanımlar (yanlış sayısı)</h2>
    <div id="hatalar"></div>
  </div>

  <div class="kart">
    <h2>Kayıt</h2>
    <p style="font-size:13px;color:#a9b4cc">Bu veriler bu tarayıcıda yereldir (localStorage). LMS/EBA'ya
       yüklendiğinde skor ve tamamlama SCORM üzerinden LMS'e de raporlanır.</p>
    <button id="sifirla">Bu tarayıcıdaki kaydı sıfırla</button>
  </div>
</div>

<script src="../icerik/arapca-carsi.js"></script>
<script>
(function () {
  var PAKET = window.PAKET;
  var id = PAKET.meta.id;
  var kayit = {};
  try { kayit = JSON.parse(localStorage.getItem('km_ilerleme_' + id) || '{}'); } catch (e) {}
  kayit.skorlar = kayit.skorlar || {}; kayit.hatalar = kayit.hatalar || {};

  // kanonId -> okunur etiket haritası
  var etiketMap = {};
  PAKET.bolumler.forEach(function (b) {
    b.segmentler.forEach(function (s) {
      (s.secenekler || []).forEach(function (o) { if (o.kanonId) etiketMap[o.kanonId] = o.etiket; });
      (s.fenerler || []).forEach(function (o) { if (o.kanonId) etiketMap[o.kanonId] = o.etiket; });
      if (s.tip === 'kelimeKopru' && s.kanonId) etiketMap[s.kanonId] = (s.hedef && s.hedef.kelime) || s.kanonId;
    });
  });
  function arap(t) { return /[؀-ۿ]/.test(t) ? '<span class="arap">' + t + '</span>' : t; }

  // Bölümler tablosu
  var bh = '<table><tr><th>Bölüm</th><th>Kazanım</th><th>Skor</th><th>Durum</th></tr>';
  PAKET.bolumler.forEach(function (b, i) {
    var sk = kayit.skorlar['b' + i];
    var esik = PAKET.meta.gecmeEsigi || 70;
    var durum = sk == null ? '<span class="yok">başlanmadı</span>'
      : (sk >= esik ? '<span class="rozet gecti">geçti</span>' : '<span class="rozet bitti">bitirdi</span>');
    var skHtml = sk == null ? '—' : sk + '<div class="bar"><i style="width:' + sk + '%"></i></div>';
    bh += '<tr><td><b>' + b.ad + '</b></td><td style="font-size:12px;color:#a9b4cc">' + b.kazanim + '</td><td>' + skHtml + '</td><td>' + durum + '</td></tr>';
  });
  bh += '</table>';
  document.getElementById('bolumler').innerHTML = bh;

  // Hatalar tablosu
  var arr = Object.keys(kayit.hatalar).map(function (k) { return { k: k, n: kayit.hatalar[k] }; })
                  .sort(function (a, b) { return b.n - a.n; });
  if (!arr.length) {
    document.getElementById('hatalar').innerHTML = '<p class="yok">Henüz kayıtlı yanlış yok.</p>';
  } else {
    var hh = '<table><tr><th>Kavram</th><th>Kanon ID</th><th>Yanlış</th></tr>';
    arr.forEach(function (r) {
      hh += '<tr><td>' + arap(etiketMap[r.k] || '—') + '</td><td style="font-size:12px;color:#8893ad">' + r.k + '</td><td><b>' + r.n + '</b></td></tr>';
    });
    hh += '</table>';
    document.getElementById('hatalar').innerHTML = hh;
  }

  document.getElementById('sifirla').addEventListener('click', function () {
    if (confirm('Bu tarayıcıdaki ilerleme kaydı silinsin mi?')) {
      localStorage.removeItem('km_ilerleme_' + id);
      location.reload();
    }
  });
})();
</script>
</body>
</html>

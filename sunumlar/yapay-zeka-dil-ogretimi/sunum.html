<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sunum — Muallim ve Makine | Rauf Enç</title>
<meta name="description" content="Yabancı Dil Öğretiminde Yapay Zekâ Kullanımı — 40 slayt, 6 bölüm, sunucu modu.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<style>
:root{--cream:#FBF7EF;--navy:#16404A;--teal:#1F6E6B;--gold:#B98A2E;--gold-text:#7B5B1E;--goldl:#E4C97E;--ink:#0d2830;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0b1f24;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1f24}
#stage img{max-width:100vw;max-height:100vh;user-select:none;-webkit-user-drag:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--goldl));width:0;z-index:50;transition:width .25s ease}
.zone{position:fixed;top:0;bottom:90px;width:28%;z-index:20;cursor:pointer}
#zPrev{left:0}#zNext{right:0}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:6px;align-items:center;background:rgba(13,40,48,.88);backdrop-filter:blur(10px);border:1px solid rgba(228,201,126,.25);border-radius:16px;padding:10px 14px;z-index:60;transition:opacity .4s, transform .4s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bar.hide{opacity:0;transform:translateX(-50%) translateY(80px);pointer-events:none}
#bar button,#bar a{appearance:none;border:0;background:transparent;color:#e8e1d2;font-size:15px;padding:8px 10px;border-radius:10px;cursor:pointer;line-height:1;display:flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;font-family:inherit}
#bar button:hover,#bar a:hover{background:rgba(228,201,126,.15);color:#fff}
#counter{color:var(--goldl);font-variant-numeric:tabular-nums;font-size:14px;padding:0 6px;min-width:64px;text-align:center}
#secBtn{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.divider{width:1px;height:22px;background:rgba(228,201,126,.25)}
#secMenu,#qrBox{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:rgba(13,40,48,.97);border:1px solid rgba(228,201,126,.3);border-radius:14px;padding:8px;z-index:70;display:none;box-shadow:0 16px 50px rgba(0,0,0,.5)}
#secMenu.open,#qrBox.open{display:block}
#secMenu{min-width:300px}
#secMenu button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#e8e1d2;padding:10px 14px;border-radius:9px;cursor:pointer;font-size:14.5px;gap:18px;font-family:inherit}
#secMenu button:hover{background:rgba(228,201,126,.14)}
#secMenu button .n{color:var(--goldl);font-variant-numeric:tabular-nums}
#qrBox{padding:18px;text-align:center;color:#e8e1d2}
#qrBox img{width:190px;border-radius:10px;margin:8px auto}
#qrBox .u{color:var(--goldl);font-size:13.5px}
#notes{position:fixed;left:0;right:0;bottom:0;background:rgba(251,247,239,.97);color:var(--ink);padding:18px 22px 88px;font-size:15.5px;line-height:1.55;z-index:40;transform:translateY(105%);transition:transform .35s ease;max-height:42vh;overflow:auto;border-top:3px solid var(--gold)}
#notes.open{transform:translateY(0)}
#notes b{color:var(--teal)}
#notes .nt{font-size:12px;letter-spacing:.12em;color:var(--gold-text);font-weight:700;margin-bottom:6px}
#grid{position:fixed;inset:0;background:rgba(11,31,36,.97);z-index:80;display:none;overflow:auto;padding:26px}
#grid.open{display:block}
#grid h2{color:var(--cream);font-family:Georgia,serif;font-weight:600;font-size:20px;margin:4px 6px 18px}
#grid .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
#grid figure{cursor:pointer;border-radius:10px;overflow:hidden;border:2px solid transparent;transition:.15s;position:relative;background:#122b32}
#grid figure:hover{border-color:var(--goldl);transform:translateY(-2px)}
#grid figure.cur{border-color:var(--gold)}
#grid img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
#grid figcaption{position:absolute;left:6px;bottom:6px;background:rgba(13,40,48,.85);color:var(--goldl);font-size:11.5px;padding:3px 8px;border-radius:7px}
#secLabel{position:fixed;top:14px;left:16px;z-index:55;background:rgba(13,40,48,.75);color:#d9d2c0;font-size:12.5px;letter-spacing:.08em;padding:7px 13px;border-radius:20px;border:1px solid rgba(228,201,126,.2);transition:opacity .4s;backdrop-filter:blur(8px)}
#secLabel.hide{opacity:0}
#hint{position:fixed;top:14px;right:16px;z-index:55;color:rgba(217,210,192,.75);font-size:12px;background:rgba(13,40,48,.6);padding:7px 12px;border-radius:20px;transition:opacity .6s;backdrop-filter:blur(8px)}
@media (max-width:760px){#bar{gap:2px;padding:8px 8px;max-width:96vw}#bar button,#bar a{padding:8px 7px;font-size:13.5px}#secBtn{display:none!important}#hint{display:none}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="secLabel"></div>
<div id="hint">← → gezin · G ızgara · N notlar · S sunucu modu · F tam ekran</div>
<div id="stage"><img id="slide" alt="Slayt"></div>
<div class="zone" id="zPrev"></div>
<div class="zone" id="zNext"></div>

<div id="notes"><div class="nt">KONUŞMACI NOTU</div><div id="noteText"></div></div>
<div id="grid"><h2>Slaytlara Genel Bakış <span style="color:#7fa8a3;font-size:13px;font-weight:400">(G ya da Esc ile kapat)</span></h2><div class="g" id="gridInner"></div></div>
<div id="secMenu"></div>
<div id="qrBox"><b>Telefonda takip</b><img src="assets/qr-sunum.png" alt="QR"><div class="u">raufenc.com/sunumlar/yapay-zeka-dil-ogretimi/sunum.html</div></div>

<div id="bar">
  <a href="index.html" title="Ana sayfa">⌂</a>
  <div class="divider"></div>
  <button id="bPrev" title="Önceki (←)">‹</button>
  <div id="counter">1 / 40</div>
  <button id="bNext" title="Sonraki (→)">›</button>
  <div class="divider"></div>
  <button id="secBtn" title="Bölüme git">☰ <span id="secName">Bölümler</span></button>
  <button id="bGrid" title="Izgara (G)">▦</button>
  <button id="bNotes" title="Notlar (N)">✎</button>
  <button id="bPres" title="Sunucu modu (S)">👁</button>
  <button id="bQr" title="QR — telefonda takip">▣</button>
  <button id="bFull" title="Tam ekran (F)">⛶</button>
  <div class="divider"></div>
  <a href="indir/Yabanci-Dil-Ogretiminde-Yapay-Zeka-Sunum.pptx" download title="PPTX indir">↓</a>
</div>

<script src="assets/deck.js"></script>
<script>
const N=DECK.N;let cur=1,notesOpen=false;
const $=id=>document.getElementById(id);
const slide=$("slide"),counter=$("counter"),progress=$("progress"),secLabel=$("secLabel"),
      notes=$("notes"),noteText=$("noteText"),grid=$("grid"),gridInner=$("gridInner"),
      secMenu=$("secMenu"),secName=$("secName"),bar=$("bar"),hint=$("hint"),qrBox=$("qrBox");
const pad=n=>String(n).padStart(2,"0");
const src=n=>`slides/s${pad(n)}.jpg`;

/* Senkron kanalı (sunucu modu) */
let bc=null; try{bc=new BroadcastChannel("seminer-sync")}catch(e){}
function announce(){ const msg={type:"slide",n:cur,t:Date.now()};
  if(bc)bc.postMessage(msg); try{localStorage.setItem("seminer-slide",JSON.stringify(msg))}catch(e){} }
if(bc)bc.onmessage=e=>{if(e.data&&e.data.type==="goto")go(e.data.n,true,false)};
addEventListener("storage",e=>{if(e.key==="seminer-goto"){try{const d=JSON.parse(e.newValue);go(d.n,true,false)}catch(_){}}});

function go(n,push=true,tell=true){
  cur=Math.max(1,Math.min(N,n));
  slide.src=src(cur);
  counter.textContent=`${cur} / ${N}`;
  progress.style.width=(cur/N*100)+"%";
  const s=DECK.secOf(cur);
  slide.alt=`Slayt ${cur} / ${N} — ${s.name}`;
  secLabel.textContent=s.name;secName.textContent=s.name;
  noteText.innerHTML=DECK.NOTES[cur-1];
  if(push)history.replaceState(null,"","#"+cur);
  [cur+1,cur+2,cur-1].forEach(k=>{if(k>=1&&k<=N){const i=new Image();i.src=src(k)}});
  document.querySelectorAll("#grid figure").forEach((f,i)=>f.classList.toggle("cur",i===cur-1));
  if(tell)announce();
}
function next(){go(cur+1)} function prev(){go(cur-1)}

for(let i=1;i<=N;i++){
  const f=document.createElement("figure");
  f.innerHTML=`<img src="slides/t${pad(i)}.jpg" alt="Slayt ${i}"><figcaption>${i}</figcaption>`;
  f.onclick=()=>{grid.classList.remove("open");go(i)};
  gridInner.appendChild(f);
}
DECK.SECTIONS.forEach(s=>{
  const b=document.createElement("button");
  b.innerHTML=`<span>${s.name}</span><span class="n">${s.start}</span>`;
  b.onclick=()=>{secMenu.classList.remove("open");go(s.start)};
  secMenu.appendChild(b);
});

$("bPrev").onclick=prev;$("bNext").onclick=next;
$("zPrev").onclick=prev;$("zNext").onclick=next;
$("bGrid").onclick=()=>grid.classList.toggle("open");
$("bNotes").onclick=()=>{notesOpen=!notesOpen;notes.classList.toggle("open",notesOpen)};
$("secBtn").onclick=e=>{e.stopPropagation();qrBox.classList.remove("open");secMenu.classList.toggle("open")};
$("bQr").onclick=e=>{e.stopPropagation();secMenu.classList.remove("open");qrBox.classList.toggle("open")};
$("bFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
function openPresenter(){window.open("sunucu.html","seminerSunucu","width=1100,height=720");announce()}
$("bPres").onclick=openPresenter;
document.addEventListener("click",e=>{
  if(!secMenu.contains(e.target)&&e.target.id!=="secBtn")secMenu.classList.remove("open");
  if(!qrBox.contains(e.target)&&e.target.id!=="bQr")qrBox.classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")next();
  else if(e.key==="ArrowLeft"||e.key==="PageUp")prev();
  else if(e.key==="Home")go(1);
  else if(e.key==="End")go(N);
  else if(e.key.toLowerCase()==="g")grid.classList.toggle("open");
  else if(e.key.toLowerCase()==="n"){notesOpen=!notesOpen;notes.classList.toggle("open",notesOpen)}
  else if(e.key.toLowerCase()==="s")openPresenter();
  else if(e.key.toLowerCase()==="f")$("bFull").click();
  else if(e.key==="Escape"){grid.classList.remove("open");secMenu.classList.remove("open");qrBox.classList.remove("open")}
});
let tx=null,ty=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():prev()}
  tx=ty=null;
},{passive:true});
let hideT;
function poke(){bar.classList.remove("hide");secLabel.classList.remove("hide");clearTimeout(hideT);hideT=setTimeout(()=>{bar.classList.add("hide");secLabel.classList.add("hide")},3200)}
["mousemove","touchstart","keydown"].forEach(ev=>addEventListener(ev,poke,{passive:true}));
poke();setTimeout(()=>hint.style.opacity=0,6000);
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
go(parseInt(location.hash.slice(1))||1,false);
addEventListener("hashchange",()=>go(parseInt(location.hash.slice(1))||1,false));
</script>
</body>
</html>

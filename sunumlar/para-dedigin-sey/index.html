<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Para Dediğin Şey — Rauf Enç</title>
  <meta name="description" content="55 slayt ve 19 video ile Para Dediğin Şey sunumu.">
  <link rel="stylesheet" href="../room.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../">← Sunum Odası</a>
    <span>Rauf Enç</span>
  </header>
  <main style="max-width:1100px;margin:8vh auto;padding:24px">
    <p class="eyebrow">VİDEOLU SUNUM · 55 SLAYT · 19 VİDEO</p>
    <h1 style="font-size:clamp(36px,6vw,72px);line-height:1.1;margin:24px 0">Para Dediğin Şey</h1>
    <p>Videoyu oynat düğmesiyle başlatın. Ok tuşlarıyla ilerleyin, L ile lazeri açın, F ile tam ekrana geçin.</p>
    <div class="hero-actions">
      <button class="primary" id="start">▷ Sunumu başlat</button>
      <a class="secondary" href="../">Sunumlara dön</a>
    </div>
    <p id="message" role="status"></p>
    <img src="./media/slide-01.jpg" alt="Para Dediğin Şey sunumu kapağı" style="width:100%;margin-top:32px;border-radius:16px">
  </main>
  <script type="module">
    import { openPlayer } from "../player.js";
    const button = document.querySelector("#start");
    let project;
    button.onclick = async () => {
      button.disabled = true;
      document.querySelector("#message").textContent = "";
      try {
        if (!project) {
          const response = await fetch("./project.json");
          if (!response.ok) throw new Error("Sunum dosyası açılamadı.");
          project = await response.json();
        }
        await openPlayer(project);
      } catch (error) {
        document.querySelector("#message").textContent = error.message;
      } finally { button.disabled = false; }
    };
  </script>
</body>
</html>

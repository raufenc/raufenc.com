<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alışkanlık Döngüsü — NöroTerbiye</title>
  <meta name="description" content="Alışkanlık döngüsü: tetik, istek, davranış ve ödül. Dört adımlı beyin döngüsünü interaktif diyagramla keşfedin ve döngüyü nerede kıracağınızı öğrenin.">
  <link rel="canonical" href="https://raufenc.com/noroterbiye/gorseller/aliskanlik-dongusu/">
  <meta property="og:title" content="Alışkanlık Döngüsü — NöroTerbiye">

  <style>
    .gv-page { --gv-accent: #f59e0b; --gv-grad: linear-gradient(120deg,#fbbf24 0%,#c084fc 40%,#f87171 70%,#34d399 100%); }

    .s-tetik    { --c: #f59e0b; --ct: #f59e0b; }
    .s-istek    { --c: #a855f7; --ct: #c084fc; }
    .s-davranis { --c: #ef4444; --ct: #f87171; }
    .s-odul     { --c: #10b981; --ct: #34d399; }
    html.light .s-tetik    { --ct: #b45309; }
    html.light .s-istek    { --ct: #7e22ce; }
    html.light .s-davranis { --ct: #b91c1c; }
    html.light .s-odul     { --ct: #047857; }

    .hl-main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .hl-canvas { padding: 20px 18px 18px; }
    .hl-ex { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .hl-ex .gv-kicker { margin: 0 6px 0 0; }
    .hl-ex .gv-chip { padding: 7px 12px 7px 10px; font-size: .78rem; }
    .hl-svg { display: block; width: 100%; max-width: 540px; height: auto; margin: 0 auto; overflow: visible; }
    .hl-svg { --node-bg: #14141f; --ring: rgba(255,255,255,.08); --core-bg: rgba(255,255,255,.04); --core-line: rgba(255,255,255,.14); --ink: #ececf6; --ink2: #8d8da8; }
    html.light .hl-svg { --node-bg: #ffffff; --ring: rgba(60,50,120,.1); --core-bg: rgba(120,90,200,.05); --core-line: rgba(60,50,120,.16); --ink: #1a1a2e; --ink2: #6a6a88; }

    .hl-track { fill: none; stroke: var(--ring); stroke-width: 14; }
    .hl-arc { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .5; transition: opacity .4s, stroke-width .4s; }
    .hl-arc.on { opacity: 1; stroke-width: 4; }
    .hl-flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1.5 11; opacity: .9; animation: hlFlow 1.5s linear infinite; }
    @keyframes hlFlow { to { stroke-dashoffset: -12.5; } }
    .hl-core { fill: var(--core-bg); stroke: var(--core-line); stroke-width: 1.2; }
    .hl-core-ring { fill: none; stroke: var(--core-line); stroke-width: 1; stroke-dasharray: 2 8; transform-origin: 280px 280px; animation: hlSpin 50s linear infinite; }
    @keyframes hlSpin { to { transform: rotate(360deg); } }
    .hl-cap { font: 800 11px var(--font-sans); letter-spacing: .24em; text-anchor: middle; fill: var(--ink2); }
    .hl-big { font: 800 24px var(--font-sans); letter-spacing: -.01em; text-anchor: middle; fill: var(--ink); }
    .hl-mid { font: 700 19px var(--font-sans); text-anchor: middle; fill: var(--ink); }
    .hl-small { font: 500 12px var(--font-sans); text-anchor: middle; fill: var(--ink2); }
    .hl-fade { transition: opacity .35s ease; }

    .nd { cursor: pointer; outline: none; }
    .nd-halo { fill: var(--c); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .nd.on .nd-halo { animation: ndHalo 2s ease-out infinite; }
    @keyframes ndHalo { 0% { opacity: .4; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.7); } }
    .nd-ring { fill: var(--node-bg); stroke: var(--c); stroke-width: 2.4; transition: all .35s; }
    .nd-ring2 { fill: none; stroke: var(--c); stroke-opacity: .3; stroke-width: 1; }
    .nd-g { transition: transform .35s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: center; }
    .nd:hover .nd-g, .nd.on .nd-g { transform: scale(1.1); }
    .nd.on .nd-ring { fill: color-mix(in srgb, var(--c) 20%, var(--node-bg)); stroke-width: 3.2; filter: drop-shadow(0 0 14px var(--c)); }
    .nd-ic { color: var(--c); }
    .nd-lab { font: 800 17px var(--font-sans); text-anchor: middle; fill: var(--ct); }
    .nd-en { font: 600 12.5px var(--font-sans); text-anchor: middle; fill: var(--ink2); letter-spacing: .04em; }
    .nd-n { font: 800 11px var(--font-sans); text-anchor: middle; dominant-baseline: central; fill: #fff; }
    .nd:focus-visible .nd-ring { stroke: var(--ink); }

    /* adım şeridi */
    .hl-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .hl-pill { --c: #888; position: relative; padding: 10px 10px 10px 12px; border-radius: 14px; background: var(--gv-card-2); border: 1px solid var(--gv-line); font-size: .78rem; line-height: 1.35; color: var(--gv-ink-2); transition: all .35s; overflow: hidden; }
    .hl-pill::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); opacity: .5; transition: opacity .3s; }
    .hl-pill b { display: block; font-size: .66rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ct); margin-bottom: 3px; }
    .hl-pill.on { background: color-mix(in srgb, var(--c) 12%, var(--gv-card-2)); border-color: color-mix(in srgb, var(--c) 55%, transparent); color: var(--gv-ink); transform: translateY(-2px); box-shadow: 0 10px 24px -14px var(--c); }
    .hl-pill.on::before { opacity: 1; }
    .hl-pill.dim { opacity: .45; }

    /* panel */
    .hl-panel { position: sticky; top: 84px; padding: 28px 26px 26px; min-height: 470px; overflow: hidden; --c: #f59e0b; --ct: #f59e0b; }
    .hl-panel::after { content: ''; position: absolute; inset: auto -20% -45% -20%; height: 75%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 24%, transparent), transparent); pointer-events: none; opacity: var(--gv-glow); }
    .hl-p { position: relative; z-index: 1; animation: hlIn .45s cubic-bezier(.2,.7,.2,1); }
    @keyframes hlIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .hl-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .hl-tabs .gv-chip { flex: 1; justify-content: center; padding: 8px 10px; min-width: 0; }
    .hl-p-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .hl-p-ic { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); box-shadow: 0 10px 30px -12px var(--c); flex-shrink: 0; }
    .hl-p h2 { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; color: var(--ct); line-height: 1.1; }
    .hl-p-sub { font-size: .8rem; color: var(--gv-ink-3); margin-top: 3px; letter-spacing: .04em; }
    .hl-p-desc { font-size: .98rem; line-height: 1.7; color: var(--gv-ink-2); margin: 14px 0 18px; }
    .hl-box { padding: 14px 16px; border-radius: 16px; margin-bottom: 12px; }
    .hl-box .gv-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .hl-box p { margin: 0; font-size: .9rem; line-height: 1.6; color: var(--gv-ink); }
    .hl-brain { background: color-mix(in srgb, var(--c) 9%, transparent); border: 1px solid color-mix(in srgb, var(--c) 24%, transparent); }
    .hl-brain .gv-kicker { color: var(--ct); }
    .hl-break { background: var(--gv-card-2); border: 1px solid var(--gv-line); }
    .hl-break .gv-ic { color: var(--c); }

    /* örnekler */
    .hl-exgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .hl-exc { text-align: left; font: inherit; color: var(--gv-ink); padding: 20px 18px 16px; background: var(--gv-card); border: 1px solid var(--gv-line); border-radius: 22px; cursor: pointer; transition: all .3s; display: flex; flex-direction: column; gap: 14px; }
    .hl-exc:hover { transform: translateY(-4px); border-color: var(--gv-line-2); }
    .hl-exc.on { border-color: color-mix(in srgb, var(--gv-accent) 65%, transparent); box-shadow: 0 16px 36px -18px var(--gv-accent); }
    .hl-exc-top { display: flex; align-items: center; gap: 12px; }
    .hl-exc-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--gv-ink); background: var(--gv-card-2); border: 1px solid var(--gv-line); }
    .hl-exc b { font-size: 1rem; }
    .hl-tl { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; }
    .hl-tl li { position: relative; display: flex; gap: 12px; padding: 0 0 12px 18px; font-size: .84rem; color: var(--gv-ink-2); line-height: 1.4; }
    .hl-tl li:last-child { padding-bottom: 0; }
    .hl-tl li::before { content: ''; position: absolute; left: 0; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .hl-tl li::after { content: ''; position: absolute; left: 4px; top: 16px; bottom: -2px; width: 1px; background: var(--gv-line-2); }
    .hl-tl li:last-child::after { display: none; }
    .hl-play { margin-top: auto; display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; color: var(--gv-accent); }
    html.light .hl-play { color: #b45309; }

    @media (max-width: 960px) {
      .hl-main { grid-template-columns: 1fr; }
      .hl-panel { position: static; min-height: 0; }
      .hl-exgrid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .hl-strip { grid-template-columns: repeat(2, 1fr); }
      .hl-exgrid { grid-template-columns: 1fr; }
      .hl-canvas { padding: 14px 8px 12px; }
      .hl-tabs .gv-chip { font-size: .72rem; padding: 8px 6px; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <script src="/nav.js"></script>

  <main class="gv-page" id="main-content">
    <header class="gv-hero">
      <span class="gv-eyebrow"><span data-gv-icon="loop" data-size="16"></span> Görsel Keşif · Alışkanlık bilimi</span>
      <h1 class="gv-title">Alışkanlık Döngüsü</h1>
      <p class="gv-lead">Her alışkanlık dört adımda oluşur — tetik, istek, davranış, ödül. Döngüyü anlamak, onu kırmanın ilk adımıdır.</p>
    </header>

    <section class="hl-main" aria-label="Alışkanlık döngüsü">
      <div class="gv-card hl-canvas">
        <div class="hl-ex" id="hlEx" role="group" aria-label="Örnek seç"><span class="gv-kicker">Örnek</span></div>
        <svg class="hl-svg" id="hlSvg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img"
             aria-label="Alışkanlık Döngüsü: Tetik, İstek, Davranış ve Ödül adımlarını dairesel döngü olarak gösteren interaktif diyagram"></svg>
        <div class="hl-strip" id="hlStrip"></div>
        <noscript>
          <p style="text-align:center;color:var(--text-secondary);padding:1rem;">Bu interaktif alışkanlık döngüsü JavaScript gerektirir. Döngü dört adımdan oluşur: 1) Tetik — bir uyaran beyni harekete geçirir, 2) İstek — beyin ödül bekler, 3) Davranış — eylem gerçekleşir, 4) Ödül — beyin tatmin olur ve döngü pekişir.</p>
        </noscript>
      </div>
      <aside class="gv-card hl-panel" id="hlPanel" aria-live="polite" aria-label="Adım ayrıntısı"></aside>
    </section>

    <section class="gv-sec gv-reveal" aria-labelledby="exT">
      <div class="gv-sec-head">
        <span class="gv-eyebrow"><span data-gv-icon="replay" data-size="16"></span> Örnekler</span>
        <h2 id="exT">Günlük Örnekler</h2>
        <p>Aynı döngü, farklı kılıklarda. Bir karta dokun, diyagramda adım adım izle.</p>
      </div>
      <div class="hl-exgrid" id="hlExGrid"></div>
    </section>

    <nav class="gv-more gv-reveal" id="gvMore" aria-label="Diğer görseller"></nav>
  </main>

  <script src="/noroterbiye/js/common.js"></script>
  <script src="/noroterbiye/js/gorseller.js"></script>
  <script>
    NT.renderNav();
    NT.renderFooter();
    GV.hydrate();
    GV.reveal();
    GV.moreNav('aliskanlik-dongusu');

    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var NS = 'http://www.w3.org/2000/svg';
      var ORDER = ['tetik', 'istek', 'davranis', 'odul'];
      var S = {
        tetik: { n: 1, title: 'Tetik', en: 'Trigger / Cue', icon: 'bell', color: '#f59e0b',
          desc: 'Bir uyaran beyni harekete geçirir — bildirim sesi, stres, can sıkıntısı.',
          brain: 'Bazal ganglionlar tetik algılar.',
          brk: 'Tetiği görünmez kıl: bildirimleri kapat, telefonu başka odaya bırak.' },
        istek: { n: 2, title: 'İstek', en: 'Craving', icon: 'magnet', color: '#a855f7',
          desc: 'Beyin ödül bekler — dopamin yükselir, “şunu yapmalıyım” hissi başlar.',
          brain: 'Nucleus accumbens dopamin sinyali verir.',
          brk: 'İsteği hemen yaşama: dürtü gelince on dakika bekle, ne istediğini adlandır.' },
        davranis: { n: 3, title: 'Davranış', en: 'Response', icon: 'action', color: '#ef4444',
          desc: 'Eylem gerçekleşir — telefonu açarsın, atıştırırsın, sosyal medyaya girersin.',
          brain: 'Motor korteks devreye girer.',
          brk: 'Davranışı zorlaştır: araya sürtünme koy, uygulamayı sil, oturduğun yeri değiştir.' },
        odul: { n: 4, title: 'Ödül', en: 'Reward', icon: 'gift', color: '#10b981',
          desc: 'Beyin tatmin olur — kısa süreli haz, döngü pekişir.',
          brain: 'Opioid sistemi haz verir, hipokampüs kaydeder.',
          brk: 'Ödülü değiştir: aynı ihtiyacı daha sağlıklı biçimde karşıla — yürüyüş, su, bir arkadaşı ara.' }
      };
      var EX = [
        { icon: 'phone', name: 'Sosyal Medya', s: { tetik: 'Bildirim sesi', istek: '“Kim yazmış?”', davranis: 'Telefonu aç', odul: 'Beğeni dopamini' } },
        { icon: 'snack', name: 'Atıştırma', s: { tetik: 'Stres', istek: '“Tatlı bir şey yesem”', davranis: 'Çikolata ye', odul: 'Şeker dopamini' } },
        { icon: 'gamepad', name: 'Oyun', s: { tetik: 'Can sıkıntısı', istek: '“Bir el oynasam”', davranis: 'Oyunu aç', odul: 'Başarı hissi' } },
        { icon: 'tv', name: 'Dizi', s: { tetik: 'Yorgunluk', istek: '“Bir bölüm izlesem”', davranis: 'Platformu aç', odul: 'Kaçış hissi' } }
      ];

      /* ── diyagram ── */
      var svg = $('hlSvg'), CX = 280, CY = 280, RR = 170, NR = 46;
      function el(n, a, p) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
      var ang = { tetik: -90, istek: 0, davranis: 90, odul: 180 };
      function pt(deg, r) { var a = deg * Math.PI / 180; return [CX + (r || RR) * Math.cos(a), CY + (r || RR) * Math.sin(a)]; }

      var defs = el('defs', {}, svg);
      var gap = 2 * Math.asin((NR + 12) / (2 * RR)) * 180 / Math.PI;
      el('circle', { cx: CX, cy: CY, r: RR, class: 'hl-track' }, svg);
      var arcs = {};
      ORDER.forEach(function (k, i) {
        var nk = ORDER[(i + 1) % 4];
        var a0 = ang[k] + gap, a1 = ang[k] + 90 - gap;
        var p0 = pt(a0), p1 = pt(a1);
        var d = 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + RR + ' ' + RR + ' 0 0 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
        var gid = 'hg' + i;
        var lg = el('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse', x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1] }, defs);
        el('stop', { offset: 0, 'stop-color': S[k].color }, lg); el('stop', { offset: 1, 'stop-color': S[nk].color }, lg);
        var mk = el('marker', { id: 'ha' + i, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
        el('path', { d: 'M1.5 1.5L8.5 5 1.5 8.5', fill: 'none', stroke: S[nk].color, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, mk);
        var arc = el('path', { d: d, class: 'hl-arc', stroke: 'url(#' + gid + ')', 'marker-end': 'url(#ha' + i + ')' }, svg);
        el('path', { d: d, class: 'hl-flow', stroke: 'url(#' + gid + ')' }, svg).style.animationDelay = (-i * .35) + 's';
        arcs[k] = arc;
      });

      /* merkez */
      var core = el('g', {}, svg);
      el('circle', { cx: CX, cy: CY, r: 104, class: 'hl-core-ring' }, core);
      el('circle', { cx: CX, cy: CY, r: 90, class: 'hl-core' }, core);
      var cap = el('text', { x: CX, y: CY - 30, class: 'hl-cap hl-fade' }, core); cap.textContent = 'DÖNGÜ';
      var big = el('text', { x: CX, y: CY + 6, class: 'hl-big hl-fade' }, core); big.textContent = 'Alışkanlık';
      var sm = el('text', { x: CX, y: CY + 32, class: 'hl-small hl-fade' }, core); sm.textContent = 'Bir adıma dokun';
      function setCenter(c, b, s, color) {
        [cap, big, sm].forEach(function (t) { t.style.opacity = 0; });
        setTimeout(function () {
          cap.textContent = c; big.textContent = b; sm.textContent = s;
          big.setAttribute('class', (b.length > 14 ? 'hl-mid' : 'hl-big') + ' hl-fade');
          cap.style.fill = color || '';
          [cap, big, sm].forEach(function (t) { t.style.opacity = 1; });
        }, 180);
      }

      /* düğümler */
      var nodes = {};
      ORDER.forEach(function (k) {
        var p = pt(ang[k]), s = S[k];
        var g = el('g', { class: 'nd s-' + k, 'data-k': k, tabindex: 0, role: 'button', 'aria-label': s.n + '. ' + s.title }, svg);
        el('circle', { class: 'nd-halo', cx: p[0], cy: p[1], r: NR }, g);
        el('circle', { cx: p[0], cy: p[1], r: NR + 12, fill: 'transparent' }, g);
        var gg = el('g', { class: 'nd-g' }, g);
        el('circle', { class: 'nd-ring2', cx: p[0], cy: p[1], r: NR + 7 }, gg);
        el('circle', { class: 'nd-ring', cx: p[0], cy: p[1], r: NR }, gg);
        var ic = el('svg', { class: 'nd-ic', 'data-gv-icon': s.icon, x: p[0] - 20, y: p[1] - 20, width: 40, height: 40 }, gg);
        /* sıra rozeti */
        var bx = p[0] + NR * 0.72, by = p[1] - NR * 0.72;
        el('circle', { cx: bx, cy: by, r: 11, fill: s.color }, g);
        var nt = el('text', { class: 'nd-n', x: bx, y: by + .5 }, g); nt.textContent = s.n;
        /* etiket: dairenin dışında */
        var out = ang[k] === -90 ? [p[0], p[1] - NR - 30] : ang[k] === 90 ? [p[0], p[1] + NR + 34] : null;
        if (out) {
          var l1 = el('text', { class: 'nd-lab', x: out[0], y: out[1] }, g); l1.textContent = s.title;
          var l2 = el('text', { class: 'nd-en', x: out[0], y: out[1] + 15 }, g); l2.textContent = s.en;
          if (ang[k] === -90) { l1.setAttribute('y', out[1] - 14); l2.setAttribute('y', out[1] + 1); }
        } else {
          var left = ang[k] === 180;
          var tx = left ? p[0] - NR - 12 : p[0] + NR + 12, anc = left ? 'end' : 'start';
          var l1b = el('text', { class: 'nd-lab', x: tx, y: p[1] - 2 }, g); l1b.textContent = s.title; l1b.style.textAnchor = anc;
          var l2b = el('text', { class: 'nd-en', x: tx, y: p[1] + 14 }, g); l2b.textContent = s.en; l2b.style.textAnchor = anc;
        }
        nodes[k] = g;
      });
      GV.hydrate(svg);

      /* örnek çipleri + şerit + kartlar */
      var exBar = $('hlEx'), strip = $('hlStrip'), grid = $('hlExGrid');
      var curEx = 0, cur = 'tetik', timers = [], playing = false;
      EX.forEach(function (e, i) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'gv-chip'; b.dataset.ex = i; b.style.setProperty('--c', '#f59e0b');
        b.setAttribute('aria-pressed', String(i === 0));
        b.innerHTML = GV.icon(e.icon, 16) + ' ' + e.name;
        exBar.appendChild(b);

        var c = document.createElement('button');
        c.type = 'button'; c.className = 'hl-exc'; c.dataset.ex = i;
        c.innerHTML = '<span class="hl-exc-top"><span class="hl-exc-ic">' + GV.icon(e.icon, 24) + '</span><b>' + e.name + '</b></span>' +
          '<ul class="hl-tl">' + ORDER.map(function (k) { return '<li class="s-' + k + '">' + e.s[k] + '</li>'; }).join('') + '</ul>' +
          '<span class="hl-play">' + GV.icon('play', 14) + ' Diyagramda oynat</span>';
        grid.appendChild(c);
      });
      ORDER.forEach(function (k) {
        var d = document.createElement('div');
        d.className = 'hl-pill s-' + k; d.dataset.k = k;
        strip.appendChild(d);
      });
      function fillStrip() {
        ORDER.forEach(function (k, i) {
          strip.children[i].innerHTML = '<b>' + S[k].n + '. ' + S[k].title + '</b>' + EX[curEx].s[k];
        });
      }
      function markEx() {
        document.querySelectorAll('[data-ex]').forEach(function (b) {
          var on = +b.dataset.ex === curEx;
          if (b.classList.contains('gv-chip')) b.setAttribute('aria-pressed', String(on)); else b.classList.toggle('on', on);
        });
      }

      /* panel */
      var panel = $('hlPanel');
      function renderPanel(k) {
        var s = S[k];
        panel.className = 'gv-card hl-panel s-' + k;
        panel.innerHTML = '<div class="hl-p">' +
          '<div class="hl-tabs" role="group" aria-label="Adım seç">' + ORDER.map(function (x) {
            return '<button type="button" class="gv-chip s-' + x + '" data-tab="' + x + '" aria-pressed="' + (x === k) + '"><span class="gv-dot"></span>' + S[x].title + '</button>';
          }).join('') + '</div>' +
          '<div class="hl-p-head"><span class="hl-p-ic">' + GV.icon(s.icon, 30) + '</span><div><h2>' + s.n + '. ' + s.title + '</h2><div class="hl-p-sub">' + s.en + '</div></div></div>' +
          '<p class="hl-p-desc">' + s.desc + '</p>' +
          '<div class="hl-box hl-brain"><p class="gv-kicker">' + GV.icon('brain', 16) + ' Beyinde ne oluyor?</p><p>' + s.brain + '</p></div>' +
          '<div class="hl-box hl-break"><p class="gv-kicker">' + GV.icon('route', 16) + ' Döngüyü burada kır</p><p>' + s.brk + '</p></div>' +
          '</div>';
      }
      function mark(k) {
        cur = k;
        ORDER.forEach(function (x) { nodes[x].classList.toggle('on', x === k); arcs[x].classList.toggle('on', x === k); });
      }
      function select(k) {
        stop();
        mark(k); renderPanel(k);
        setCenter(S[k].n + ' / 4', S[k].title, S[k].en);
        ORDER.forEach(function (x, i) { strip.children[i].classList.toggle('on', x === k); strip.children[i].classList.remove('dim'); });
      }
      function stop() { timers.forEach(clearTimeout); timers = []; playing = false; }
      function play(i) {
        stop(); curEx = i; markEx(); fillStrip(); playing = true;
        var ex = EX[i];
        ORDER.forEach(function (x, j) { strip.children[j].classList.remove('on'); strip.children[j].classList.add('dim'); });
        ORDER.forEach(function (k, j) {
          timers.push(setTimeout(function () {
            mark(k); renderPanel(k);
            setCenter(S[k].n + ' / 4 · ' + S[k].title.toUpperCase(), ex.s[k], ex.name);
            strip.children[j].classList.remove('dim');
            ORDER.forEach(function (x, m) { strip.children[m].classList.toggle('on', m === j); });
          }, j * 1500 + 200));
        });
        timers.push(setTimeout(function () {
          setCenter('DÖNGÜ KAPANDI', 'Alışkanlık pekişti', 'Ödül, tetiği bir sonraki sefere hazırlar');
          ORDER.forEach(function (x, m) { strip.children[m].classList.remove('dim'); strip.children[m].classList.add('on'); });
          playing = false;
        }, 4 * 1500 + 600));
      }

      ORDER.forEach(function (k) {
        nodes[k].addEventListener('click', function () { select(k); });
        nodes[k].addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(k); } });
      });
      panel.addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) select(b.dataset.tab); });
      exBar.addEventListener('click', function (e) { var b = e.target.closest('[data-ex]'); if (b) play(+b.dataset.ex); });
      grid.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ex]'); if (!b) return;
        var top = svg.getBoundingClientRect().top;
        if (top < 0 || top > innerHeight * .5) svg.scrollIntoView({ behavior: 'smooth', block: 'center' });
        play(+b.dataset.ex);
      });

      fillStrip(); markEx();
      select('tetik');
    })();
  </script>
</body>
</html>

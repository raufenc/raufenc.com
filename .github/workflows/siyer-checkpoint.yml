name: Preserve long-running Siyer media progress
on:
  push:
    branches: [codex/siyer-tam-ders-v2]
    paths: [.github/workflows/siyer-checkpoint.yml]
permissions:
  actions: write
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Pause queued validation, then checkpoint the active generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/raufenc/raufenc.com/actions/runs/39420297132/cancel || true
          gh api --method POST repos/raufenc/raufenc.com/actions/runs/39419766230/cancel

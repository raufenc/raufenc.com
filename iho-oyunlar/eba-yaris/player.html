<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF7F3">
<title>نَشاط / مُسابَقَة</title>
<!-- İHO 7. Sınıf Arapça — izle → cevapla → cevabı duy. 1 kişi: alıştırma · 2 kişi: hız yarışı -->
<link rel="stylesheet" href="/iho-oyunlar/eba-yaris/style.css">
</head>
<body>

<a class="back-btn" id="backBtn" href="/iho-oyunlar/eba-yaris/index.html" aria-label="رُجوع">←</a>

<div id="hud">
  <!-- 1 kişi -->
  <div id="hudSolo">
    <div class="dots" id="dots"></div>
    <div class="counter"><span id="curIdx">١</span> / <span id="totIdx">٤</span></div>
  </div>
  <!-- 2 kişi -->
  <div id="hudDuo">
    <span class="pill a" id="pillA">⚡٠ · ✓٠</span>
    <div class="counter"><span id="curIdx2">١</span> / <span id="totIdx2">٤</span></div>
    <span class="pill b" id="pillB">⚡٠ · ✓٠</span>
  </div>
</div>

<div id="stage">
  <video id="vid" preload="auto" playsinline></video>

  <!-- Başlangıç: mod seçimi -->
  <div id="startScreen">
    <h1 id="startTitle"></h1>
    <div class="start-sub" id="startSub"></div>
    <div class="mode-row">
      <button class="mode-btn solo" id="btnSolo"><span class="emo">👤</span> لاعِب واحِد <small>تَدَرَّبْ وَحْدَك</small></button>
      <button class="mode-btn duo" id="btnDuo"><span class="emo">👥</span> لاعِبان <small>تَسابَقا!</small></button>
    </div>
  </div>

  <!-- Bitiş: 1 kişi -->
  <div id="endScreen">
    <h2 class="end-title">النَّتيجَة</h2>
    <p class="end-score" id="finalScore">٠ / ٤</p>
    <p class="end-msg" id="endMsg"></p>
    <button class="start-btn" id="replayBtn">أَعِدْ</button>
  </div>

  <!-- Bitiş: 2 kişi -->
  <div id="endScreen2">
    <div class="end2-win" id="end2Win"></div>
    <div class="end2-grid">
      <div class="end2-card a" id="end2P1"></div>
      <div class="end2-card b" id="end2P2"></div>
    </div>
    <button class="start-btn" id="replayBtn2">أَعِدْ</button>
  </div>
</div>

<!-- 1 kişi paneli — video ALTINDA, video görünür kalır -->
<div id="qPanel">
  <div class="q-prompt" id="qPrompt"></div>
  <div class="opts" id="qOpts"></div>
  <div class="feedback" id="qFeedback"></div>
</div>

<!-- 2 kişi düello paneli — paylaşımlı soru üstte, iki ayrı yarış paneli altta -->
<div id="duel">
  <div class="duel-prompt" id="duelPrompt"></div>
  <div class="lanes">
    <div class="lane a">
      <div class="lane-head">👤 اللّاعِب ١</div>
      <div class="opts" id="optsA"></div>
    </div>
    <div class="lane b">
      <div class="lane-head">👤 اللّاعِب ٢</div>
      <div class="opts" id="optsB"></div>
    </div>
  </div>
</div>

<script src="/iho-oyunlar/eba-etkilesim/activities.js"></script>
<script src="/iho-oyunlar/eba-yaris/game.js"></script>
</body>
</html>

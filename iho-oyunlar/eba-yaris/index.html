<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>شاهِدْ وَتَسابَقْ — العَرَبِيَّة ٧</title>
<!-- İHO 7. Sınıf Arapça — EBA etkileşim + 2 kişilik hız yarışı. Klipler/font tek kaynaktan (../eba-etkilesim, ../). -->
<style>
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Regular.ttf') format('truetype');font-weight:normal;font-display:swap}
@font-face{font-family:'Arakom';src:url('/iho-oyunlar/Arakom-Bold.ttf') format('truetype');font-weight:bold;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Arakom','Noto Sans Arabic','Geeza Pro',system-ui,sans-serif;
  background:linear-gradient(135deg,#0f0c29 0%,#1a1035 40%,#0f1323 100%);
  color:#fff; min-height:100vh; min-height:100dvh; padding:28px 18px 48px; direction:rtl;
}
.wrap{max-width:1000px; margin:0 auto}
.hub-title{font-size:clamp(28px,5vw,50px); font-weight:800; line-height:1.15; text-align:center;
  background:linear-gradient(90deg,#f7971e,#ffd200); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;}
.hub-sub{text-align:center; opacity:.6; font-size:clamp(15px,2.4vw,20px); margin:8px 0 10px}
.mode-hint{text-align:center; font-size:clamp(13px,2vw,17px); opacity:.85; margin:0 0 24px;
  display:inline-flex; gap:6px; justify-content:center; width:100%}
.mode-hint b{font-weight:800}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px}
.card{
  display:block; text-decoration:none; color:#fff;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  border-radius:18px; padding:20px 18px; position:relative; overflow:hidden;
  transition:transform .15s ease, background .15s ease, border-color .15s;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#f7971e,#ffd200);opacity:.65;transition:opacity .15s}
.card:hover{transform:translateY(-3px); background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.28)}
.card:hover::before{opacity:1}
.card .unit{font-size:13px; opacity:.65; margin-bottom:8px}
.card .name{font-size:clamp(20px,2.6vw,26px); font-weight:700; line-height:1.35; margin-bottom:6px}
.card .desc{font-size:14px; opacity:.7; line-height:1.5}
.card .play{position:absolute; left:16px; bottom:14px; font-size:15px; letter-spacing:1px; opacity:.85}
.card .play span{opacity:.4; margin:0 2px}
.card .cnt{position:absolute; top:16px; left:18px; font-size:13px; opacity:.55}
.back{display:inline-flex; align-items:center; gap:6px; color:#fff; opacity:.7; text-decoration:none; font-size:15px; margin-bottom:18px}
.back:hover{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/iho-oyunlar/index.html">→ كُلّ الأَلْعاب</a>
  <h1 class="hub-title">شاهِدْ وَتَسابَقْ</h1>
  <div class="hub-sub">شاهِدْ، أَجِبْ، ثُمَّ اسْتَمِعْ إِلى الجَواب — العَرَبِيَّة لِلصَّفّ السّابِع</div>
  <div class="mode-hint"><span>👤 <b>تَدَرَّبْ وَحْدَك</b></span> &nbsp;·&nbsp; <span>👥 <b>تَسابَقْ مَعَ صَديقِك</b></span></div>
  <div class="grid" id="grid"></div>
</div>

<script src="/iho-oyunlar/eba-etkilesim/activities.js"></script>
<script>
const UNIT_AR={1:'الوَحْدَة الأُولى',2:'الوَحْدَة الثّانِيَة',3:'الوَحْدَة الثّالِثَة',4:'الوَحْدَة الرّابِعَة'};
const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const toAr=n=>String(n).split('').map(c=>AR[+c]??c).join('');
const grid=document.getElementById('grid');
(window.ACTIVITIES||[]).forEach(a=>{
  const el=document.createElement('a');
  el.className='card'; el.href='/iho-oyunlar/eba-yaris/player.html?id='+encodeURIComponent(a.id);
  const pg=parseInt(a.id.slice(1),10);
  el.innerHTML=`<div class="cnt">${toAr(a.questions.length)} سُؤال</div>
    <div class="unit">${UNIT_AR[a.unit]||''} &middot; صَفْحَة ${toAr(pg)}</div>
    <div class="name">${a.title}</div>
    <div class="desc">${a.subtitle||''}</div>
    <div class="play">👤<span>/</span>👥</div>`;
  grid.appendChild(el);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İHO 7. Sınıf 3. Ünite — Oyun</title>
<meta name="description" content="İmam Hatip Ortaokulu 7. sınıf Arapça 3. ünite — interaktif oyun motoru.">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}

:root{
  --u3-page-bg:linear-gradient(135deg,#0f0c29 0%,#1a1035 40%,#0f1323 100%);
  --u3-page-text:#fff;
  --u3-bar-bg:linear-gradient(180deg,#111,#0a0a0a);
  --u3-bar-border:#222;
  --u3-back-bg:rgba(255,255,255,0.08);
  --u3-back-border:rgba(255,255,255,0.15);
  --u3-name:rgba(255,255,255,0.55);
}
html.light{
  --u3-page-bg:linear-gradient(135deg,#eae8f2 0%,#e0ddf0 40%,#e8e6f2 100%);
  --u3-page-text:var(--text);
  --u3-bar-bg:linear-gradient(180deg,#f8f8f8,#f0f0f0);
  --u3-bar-border:var(--border);
  --u3-back-bg:rgba(0,0,0,0.05);
  --u3-back-border:rgba(0,0,0,0.1);
  --u3-name:rgba(0,0,0,0.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--u3-page-bg);color:var(--u3-page-text);min-height:100vh;display:flex;flex-direction:column}

.bar{height:54px;background:var(--u3-bar-bg);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:1px solid var(--u3-bar-border)}
.bar-back{background:var(--u3-back-bg);border:1px solid var(--u3-back-border);color:var(--u3-page-text);padding:9px 20px;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit;transition:all .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.bar-back:hover{background:rgba(255,255,255,0.15)}
html.light .bar-back:hover{background:rgba(0,0,0,0.08)}
.bar-name{font-family:'Arakom',sans-serif;font-size:16px;color:var(--u3-name);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;direction:rtl;text-align:right}

.stage{flex:1;overflow-y:auto;padding:20px 12px 40px}
#game{margin:0 auto}

@media(max-width:600px){
  .bar{padding:0 12px;gap:8px}
  .bar-back{padding:8px 14px;font-size:14px}
  .bar-name{font-size:14px}
  .stage{padding:14px 6px 32px}
}
</style>
<link rel="stylesheet" href="src/unit3-game-engine.css">
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="bar">
  <a class="bar-back" href="./index.html">← Tüm Oyunlara Dön</a>
  <span class="bar-name" id="barName"></span>
</div>

<div class="stage">
  <div id="game"></div>
</div>

<script src="data/unit3-database.js"></script>
<script src="src/unit3-game-engine.js"></script>
<script>
const META = {
  flashcards:     { ar: 'بِطاقاتُ المُفْرَدات',   tr: 'Kelime Kartları',     limit: 40 },
  match:          { ar: 'لُعْبَةُ المُطابَقَة',    tr: 'Eşleştirme',           limit: 8  },
  quiz:           { ar: 'الاخْتِبارُ الذَّكِيّ',     tr: 'Çoktan Seçmeli Quiz',  limit: 12 },
  truefalse:      { ar: 'صَواب أَمْ خَطَأ',         tr: 'Doğru / Yanlış',       limit: 12 },
  sentenceOrder:  { ar: 'تَرْتيبُ الجُمْلَة',       tr: 'Cümle Sıralama',       limit: 8  },
  fillBlank:      { ar: 'مَلْءُ الفَراغ',           tr: 'Boşluk Doldurma',      limit: 12 },
  memory:         { ar: 'لُعْبَةُ الذّاكِرَة',       tr: 'Hafıza Oyunu',         limit: 8  },
  oddOneOut:      { ar: 'الكَلِمَةُ المُخْتَلِفَة',   tr: 'Farklı Olanı Bul',     limit: 8  },
  wordSearch:     { ar: 'صَيْدُ الكَلِمات',        tr: 'Kelime Avı',           limit: 6  },
  directionsMap:  { ar: 'وَصْفُ الطَّريق',          tr: 'Yol Tarifi Motoru',    limit: 3  },
  comparative:    { ar: 'المُقارَنَة',               tr: 'Karşılaştırma',        limit: 5  },
  traffic:        { ar: 'إِشاراتُ المُرور',          tr: 'Trafik Işıkları',      limit: 9  },
  dialogueBuilder:{ ar: 'بِناءُ الحِوار',           tr: 'Diyalog Kurma',        limit: 3  },
  wheel:          { ar: 'عَجَلَةُ الأَسْئِلَة',      tr: 'Çark Soruları',        limit: 12 },
  balloonPop:     { ar: 'فَرْقَعَةُ البالونات',      tr: 'Balon Patlatma',       limit: 10 },
  typing:         { ar: 'تَرْكيبُ الحُروف',         tr: 'Harf Dizme / Yazma',   limit: 8  }
};

function parseType(){
  const h = (location.hash || '').replace('#','').trim();
  if(h && META[h]) return h;
  const q = new URLSearchParams(location.search).get('type');
  if(q && META[q]) return q;
  return 'flashcards';
}

function load(type){
  const m = META[type];
  document.getElementById('barName').textContent = m.ar;
  document.title = m.tr + ' — İHO 7. Sınıf 3. Ünite';
  Unit3GameEngine.mount('#game', type, {
    data: Unit3Database,
    limit: m.limit,
    title: m.tr,
    subtitle: m.ar
  });
}

load(parseType());
window.addEventListener('hashchange', () => load(parseType()));
</script>
</body>
</html>

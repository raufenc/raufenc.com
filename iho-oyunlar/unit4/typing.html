<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تَرْتيب الحُروف — الصَّفّ السّابِع · الوَحْدَة الرّابِعَة</title>
<meta name="description" content="لُعْبَة تَعْليمِيَّة لِلُّغَة العَرَبِيَّة — الوَحْدَة الرّابِعَة">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}

:root{
  --u4-page-bg:linear-gradient(135deg,#0c1d3a 0%,#102a52 40%,#0a1830 100%);
  --u4-page-text:#fff;
  --u4-bar-bg:linear-gradient(180deg,#0f1c34,#0a142a);
  --u4-bar-border:rgba(255,255,255,0.06);
  --u4-back-bg:rgba(255,255,255,0.08);
  --u4-back-border:rgba(255,255,255,0.15);
  --u4-name:rgba(255,255,255,0.6);
}
html.light{
  --u4-page-bg:linear-gradient(135deg,#e6eef9 0%,#dde7f5 40%,#e8eef7 100%);
  --u4-page-text:var(--text);
  --u4-bar-bg:linear-gradient(180deg,#f8f8f8,#f0f0f0);
  --u4-bar-border:var(--border);
  --u4-back-bg:rgba(0,0,0,0.05);
  --u4-back-border:rgba(0,0,0,0.1);
  --u4-name:rgba(0,0,0,0.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--u4-page-bg);color:var(--u4-page-text);min-height:100vh;display:flex;flex-direction:column}

.bar{height:54px;background:var(--u4-bar-bg);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:1px solid var(--u4-bar-border)}
.bar-back{background:var(--u4-back-bg);border:1px solid var(--u4-back-border);color:var(--u4-page-text);padding:9px 20px;border-radius:10px;cursor:pointer;font-size:clamp(14px,.5vw + 8px,20px);font-family:inherit;transition:all .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.bar-back:hover{background:rgba(255,255,255,0.15)}
html.light .bar-back:hover{background:rgba(0,0,0,0.08)}
.bar-name{font-family:'Arakom',sans-serif;font-size:clamp(18px,.9vw + 10px,30px);color:var(--u4-name);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;direction:rtl;text-align:right}

.stage{flex:1;overflow:hidden;padding:10px 12px 12px;display:flex;align-items:center;justify-content:center}
#game{width:100%}
#game{margin:0 auto}

@media(max-width:600px){
  .bar{padding:0 12px;gap:8px}
  .bar-back{padding:8px 14px;font-size:14px}
  .bar-name{font-size:14px}
  .stage{padding:14px 6px 32px}
}
</style>
<link rel="stylesheet" href="src/u4-engine.css?v=5">
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="bar">
  <a class="bar-back" href="/7sinif/4/">↩ العَوْدَة</a>
  <span class="bar-name">تَرْتيب الحُروف</span>
</div>

<div class="stage">
  <div id="game"></div>
</div>

<script src="data/unit4-database.js?v=5"></script>
<script src="src/u4-engine.js?v=6"></script>
<script>
Unit4GameEngine.mount('#game', 'typing', {
  data: Unit4Database,
  limit: 13
});
</script>
<script src="/iho-oyunlar/intro.js" defer></script>
</body>
</html>

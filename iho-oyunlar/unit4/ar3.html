<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>مَطَرُ الحُرُوف — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Düşen harflerden Arapça kelime inşa et — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي).">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#e0e7ff;--c-muted:rgba(224,231,255,0.55)}
html.light{--c-text:#1e293b;--c-muted:rgba(30,41,59,0.6)}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow-x:hidden;position:relative;background:linear-gradient(180deg,#0c1d3a 0%,#1e3a8a 100%)}
html.light body{background:linear-gradient(180deg,#bae6fd 0%,#3b82f6 100%)}

.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(15,23,42,0.85),rgba(15,23,42,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(56,189,248,0.3)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(7,89,133,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(56,189,248,0.18);border:1px solid rgba(56,189,248,0.4);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(56,189,248,0.3)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:#7dd3fc;flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(56,189,248,0.18);border:1px solid rgba(56,189,248,0.4);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:20px 14px 80px;max-width:780px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud-stat{background:rgba(15,23,42,0.6);border:1px solid rgba(56,189,248,0.3);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
.hud-stat b{display:block;font-size:22px;color:#7dd3fc;margin-top:2px;text-align:center}

.hint{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);border-radius:18px;padding:12px 18px;text-align:center;color:#7dd3fc;font-size:15px;margin-bottom:18px}
.hint small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-bottom:4px}

/* Rain field */
.rain{position:relative;height:160px;margin-bottom:14px;border-radius:18px;background:linear-gradient(180deg,rgba(56,189,248,0.05),transparent 80%);overflow:hidden;border:2px dashed rgba(56,189,248,0.18)}
.rain::before, .rain::after{content:'💧';position:absolute;font-size:22px;opacity:.35;animation:rain 2.5s linear infinite}
.rain::before{left:18%;animation-delay:0s}
.rain::after{left:78%;animation-delay:1.1s}
@keyframes rain{0%{top:-30px}100%{top:200px;opacity:0}}

.target{min-height:74px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(14,165,233,0.05));border:2px dashed rgba(56,189,248,0.4);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;direction:rtl;margin-bottom:14px;transition:.25s;position:relative}
.target.empty::after{content:'Harfleri buraya diz';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--c-muted);font-size:13px;letter-spacing:.04em;pointer-events:none}
.target.ok{border-color:var(--c-good);background:rgba(22,163,74,0.13)}
.target.bad{border-color:var(--c-bad);background:rgba(220,38,38,0.13);animation:shakeX .42s}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl;margin-bottom:14px;min-height:60px}
.drop{
  font-family:'Arakom',sans-serif;font-size:clamp(22px,4vw,32px);font-weight:bold;color:#0c4a6e;
  background:radial-gradient(circle at 30% 25%,#e0f2fe,#7dd3fc 70%,#0284c7 100%);
  border:2px solid #0369a1;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 14px rgba(2,132,199,0.45),inset 0 2px 4px rgba(255,255,255,0.6),inset 0 -3px 6px rgba(0,0,0,0.18);
  transition:all .2s cubic-bezier(.2,.8,.3,1);user-select:none;
}
.drop:hover{transform:translateY(-4px)}
.drop:disabled{opacity:.3;cursor:default;transform:none}
.drop.in-target{background:radial-gradient(circle at 30% 25%,#bae6fd,#38bdf8 70%,#0c4a6e 100%)}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:11px 24px;cursor:pointer;border:1.5px solid transparent;transition:.2s}
.btn.primary{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 8px 24px rgba(2,132,199,0.45)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,0.08);color:var(--c-text);border-color:rgba(255,255,255,0.18)}
html.light .btn.ghost{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.12)}
.btn.ghost:hover{background:rgba(255,255,255,0.16)}

.feedback{min-height:34px;text-align:center;margin-top:12px;font-size:14px;color:var(--c-muted)}
.feedback.ok{color:#86efac}.feedback.bad{color:#fca5a5}

.end{background:linear-gradient(135deg,rgba(56,189,248,0.15),rgba(14,165,233,0.08));border:1.5px solid rgba(56,189,248,0.35);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:#7dd3fc;margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:#7dd3fc;line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end .btn.primary{font-size:16px;padding:14px 32px}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(56,189,248,0.5))}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">مَطَرُ الحُرُوف</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>
<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>
<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const stage=document.getElementById('stage'); const chip=document.getElementById('chip');
  let items=[],i=0,score=0,built=[],letters=[];
  function render(){
    if(i>=items.length) return renderEnd();
    const it=items[i];
    letters=shuffle(Array.from(it.word)).map((c,k)=>({c,k}));
    built=[];
    chip.textContent=`${i+1} / ${items.length}`;
    stage.innerHTML=`
      <div class="hud"><div class="hud-stat">Skor<b>${score}</b></div><div class="hud-stat">Soru<b>${i+1}/${items.length}</b></div></div>
      <div class="hint"><small>Türkçe Anlamı</small>${it.translation||'—'}</div>
      <div class="rain"></div>
      <div class="target empty" id="target" dir="rtl"></div>
      <div class="bank" id="bank">${letters.map((l,k)=>`<button class="drop" data-k="${k}">${l.c}</button>`).join('')}</div>
      <div class="actions">
        <button class="btn ghost" id="clearBtn">↺ Temizle</button>
        <button class="btn primary" id="checkBtn">Kontrol Et</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    document.querySelectorAll('.drop').forEach(b=>b.addEventListener('click',()=>push(parseInt(b.dataset.k,10))));
    document.getElementById('clearBtn').addEventListener('click',clear);
    document.getElementById('checkBtn').addEventListener('click',()=>check(it));
  }
  function push(k){built.push(letters[k]);redraw();const b=document.querySelector(`.bank .drop[data-k="${k}"]`);if(b) b.disabled=true;}
  function redraw(){
    const t=document.getElementById('target');
    if(!t) return;
    t.classList.remove('ok','bad');
    if(built.length===0){t.classList.add('empty');t.innerHTML='';return;}
    t.classList.remove('empty');
    t.innerHTML=built.map((l,j)=>`<button class="drop in-target" data-pos="${j}">${l.c}</button>`).join('');
    t.querySelectorAll('.drop').forEach(b=>b.addEventListener('click',()=>{const pos=parseInt(b.dataset.pos,10);const removed=built.splice(pos,1)[0];redraw();const src=document.querySelector(`.bank .drop[data-k="${removed.k}"]`);if(src) src.disabled=false;}));
  }
  function clear(){built=[];redraw();document.querySelectorAll('.bank .drop').forEach(b=>b.disabled=false);const fb=document.getElementById('fb');if(fb){fb.className='feedback';fb.textContent='';}}
  function check(it){
    const got=built.map(b=>b.c).join('');
    const ok=strip(got)===strip(it.word);
    const t=document.getElementById('target'); const fb=document.getElementById('fb');
    if(ok){t.classList.add('ok');fb.className='feedback ok';fb.textContent='✓ Doğru: '+it.word;score++;burst(24);setTimeout(()=>{i++;render();},1050);}
    else{t.classList.add('bad');fb.className='feedback bad';fb.textContent='✗ Sıra yanlış';setTimeout(()=>t.classList.remove('bad'),500);}
  }
  function renderEnd(){
    chip.textContent=`${items.length} / ${items.length}`;
    const pct=Math.round(score/items.length*100);
    const medal=pct===100?'🥇':pct>=70?'🥈':pct>=40?'🥉':'💧';
    const msg=pct===100?'Tüm damlaları sırayla yakaladın!':pct>=70?'İyi yağmur takibi.':pct>=40?'Yarıyı aştın.':'Pratik gerek.';
    stage.innerHTML=`<div class="end"><div class="medal">${medal}</div><h2 dir="rtl">أَحْسَنْت!</h2><div class="score-big">${score}<small> / ${items.length}</small></div><p>${msg}</p><button class="btn primary" id="again">Tekrar Oyna</button></div>`;
    document.getElementById('again').addEventListener('click',()=>{items=shuffle(items);i=0;score=0;render();});
    if(pct>=70) burst(80);
  }
  function burst(count=36){const c=document.getElementById('cf');c.style.display='block';const colors=['#38bdf8','#facc15','#22c55e','#a855f7','#f472b6','#fff'];const frag=document.createDocumentFragment();for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}c.appendChild(frag);setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);}
  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();}).then(db=>{const g=(db.games||[]).find(x=>x.id==='ar_g3_letter_rain_adapter');if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}items=shuffle(g.items||[]);render();}).catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

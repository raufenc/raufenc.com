<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>اِخْتَرِ التَّرْكِيب — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Boşluğa uygun Arapça kalıbı seç — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي) çoktan seçmeli oyun.">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-amber:#fb923c;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#fff8ec;--c-muted:rgba(255,248,236,0.62);--c-bubble:#fffbeb;--c-bubble-d:#fde68a}
html.light{--c-text:#3a2a10;--c-muted:rgba(58,42,16,0.6)}

html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow-x:hidden;position:relative;background:radial-gradient(ellipse at top,#7c2d12 0%,#1a0e04 60%)}
html.light body{background:radial-gradient(ellipse at top,#fed7aa 0%,#fef6e4 60%)}
body::before{content:'';position:fixed;left:50%;top:-8vw;width:60vw;height:60vw;background:radial-gradient(circle,rgba(251,146,60,0.22) 0%,transparent 60%);transform:translateX(-50%);pointer-events:none;z-index:0}

.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(15,9,3,0.85),rgba(15,9,3,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(252,211,77,0.18)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(217,119,6,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(252,211,77,0.22);transform:translateX(2px)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:var(--c-gold);flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:32px 16px 80px;max-width:780px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hud-stat{background:rgba(0,0,0,0.28);border:1px solid rgba(252,211,77,0.2);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
html.light .hud-stat{background:rgba(255,255,255,0.7);color:#5b3a14;border-color:rgba(217,119,6,0.2)}
.hud-stat b{display:block;font-size:22px;color:var(--c-gold);margin-top:2px;text-align:center}
html.light .hud-stat b{color:#a16207}

/* Avatar + speech bubble */
.scene{display:flex;align-items:flex-start;gap:14px;margin:14px 0 8px;direction:ltr}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#dc2626);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 -4px 8px rgba(0,0,0,.18)}
.bubble{
  flex:1;position:relative;background:linear-gradient(135deg,#fffbeb,#fde68a);color:#3a1d0a;
  padding:22px 24px;border-radius:22px;font-family:'Arakom',sans-serif;font-size:clamp(20px,3.5vw,30px);font-weight:bold;line-height:1.7;
  direction:rtl;text-align:right;box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);
  min-height:96px;
}
.bubble::before{content:'';position:absolute;left:-12px;top:24px;width:20px;height:20px;background:#fffbeb;transform:rotate(45deg);box-shadow:-2px 2px 4px rgba(0,0,0,.12)}
.bubble .blank{display:inline-block;min-width:90px;padding:0 12px;color:#dc2626;border-bottom:3px solid #dc2626;background:rgba(220,38,38,0.06);border-radius:4px;text-align:center}
.bubble .blank.filled{color:#16a34a;border-bottom-color:#16a34a;background:rgba(22,163,74,0.08)}

.q-prompt{text-align:center;color:var(--c-muted);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:18px 0 14px}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.options{grid-template-columns:1fr}}
.opt{
  font-family:'Arakom',sans-serif;font-size:clamp(18px,2.6vw,24px);font-weight:bold;
  background:rgba(255,251,235,0.08);border:1.5px solid rgba(252,211,77,0.22);color:var(--c-text);
  padding:16px 20px;border-radius:18px;cursor:pointer;text-align:center;direction:rtl;line-height:1.4;
  transition:all .25s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden;
}
html.light .opt{background:rgba(255,255,255,0.78)}
.opt:hover{transform:translateY(-3px);border-color:var(--c-gold);background:rgba(255,251,235,0.14)}
.opt:active{transform:translateY(0)}
.opt.correct{background:rgba(22,163,74,0.22);border-color:var(--c-good);box-shadow:0 0 0 4px rgba(22,163,74,0.22),0 0 30px rgba(22,163,74,0.45);animation:popOk .55s ease}
.opt.wrong{background:rgba(220,38,38,0.18);border-color:var(--c-bad);animation:shakeX .42s}
.opt:disabled{cursor:default;opacity:.85}
@keyframes popOk{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

.explanation{
  margin-top:16px;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.55;
  background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.2);color:#7dd3fc;text-align:center;
  display:none;
}
html.light .explanation{background:#e0f2fe;color:#075985;border-color:rgba(7,89,133,0.2)}
.explanation.show{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.end{background:linear-gradient(135deg,rgba(252,211,77,0.1),rgba(180,83,9,0.06));border:1.5px solid rgba(252,211,77,0.28);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto;backdrop-filter:blur(6px)}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:var(--c-gold);margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:var(--c-gold);line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end button{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;color:#1a0e04;padding:14px 32px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 24px rgba(245,158,11,0.4);transition:.2s}
.end button:hover{transform:translateY(-2px)}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(250,204,21,0.5))}

.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">اِخْتَرِ التَّرْكِيب</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>

<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>

<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const AVATARS=['👤','👨‍🎓','👩‍🎓','🧕','🧔','🧑‍🏫','👳','👲'];
  const stage=document.getElementById('stage');
  const chip=document.getElementById('chip');

  let items=[], i=0, score=0, locked=false;

  function render(){
    if(i>=items.length) return renderEnd();
    const it=items[i];
    locked=false;
    chip.textContent=`${i+1} / ${items.length}`;
    const av=AVATARS[i%AVATARS.length];
    const prompt = safe(it.prompt).replace('____','<span class="blank" id="blank">____</span>');
    stage.innerHTML=`
      <div class="hud">
        <div class="hud-stat">Skor<b>${score}</b></div>
        <div class="hud-stat">Soru<b>${i+1}/${items.length}</b></div>
      </div>
      <div class="scene">
        <div class="avatar">${av}</div>
        <div class="bubble" dir="rtl">${prompt}</div>
      </div>
      <div class="q-prompt">Doğru ifadeyi seç</div>
      <div class="options" id="opts"></div>
      <div class="explanation" id="exp"></div>
    `;
    const opts=shuffle(it.options||[]);
    const wrap=document.getElementById('opts');
    opts.forEach(opt=>{
      const b=document.createElement('button');
      b.className='opt'; b.dir='rtl'; b.textContent=opt;
      b.addEventListener('click',()=>choose(b,opt,it));
      wrap.appendChild(b);
    });
  }

  function choose(btn,opt,it){
    if(locked) return; locked=true;
    const all=document.querySelectorAll('.opt'); all.forEach(b=>b.disabled=true);
    const ok=strip(opt)===strip(it.answer);
    if(ok){
      btn.classList.add('correct'); score++;
      const bl=document.getElementById('blank');
      if(bl){ bl.textContent=opt; bl.classList.add('filled'); }
      burst(28);
    } else {
      btn.classList.add('wrong');
      all.forEach(b=>{ if(strip(b.textContent)===strip(it.answer)) b.classList.add('correct'); });
    }
    if(it.explanation){
      const e=document.getElementById('exp');
      e.textContent=it.explanation; e.classList.add('show');
    }
    setTimeout(()=>{ i++; render(); }, ok ? 1200 : 1900);
  }

  function renderEnd(){
    chip.textContent=`${items.length} / ${items.length}`;
    const pct=Math.round(score/items.length*100);
    const medal=pct===100?'🥇':pct>=70?'🥈':pct>=40?'🥉':'📚';
    const msg=pct===100?'Mükemmel! Tüm kalıpları doğru seçtin.'
      :pct>=70?'İyi iş — birkaç kalıp daha pekiştir.'
      :pct>=40?'Yarı yolu aştın; tekrar dene.'
      :'Kalıpları tekrar gözden geçir.';
    stage.innerHTML=`
      <div class="end">
        <div class="medal">${medal}</div>
        <h2 dir="rtl">أَحْسَنْت!</h2>
        <div class="score-big">${score}<small> / ${items.length}</small></div>
        <p>${msg}</p>
        <button id="again">Tekrar Oyna</button>
      </div>`;
    document.getElementById('again').addEventListener('click',()=>{items=shuffle(items);i=0;score=0;render();});
    if(pct>=70) burst(80);
  }

  function burst(count=36){
    const c=document.getElementById('cf'); c.style.display='block';
    const colors=['#facc15','#fb923c','#22c55e','#38bdf8','#f472b6','#fff'];
    const frag=document.createDocumentFragment();
    for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}
    c.appendChild(frag); setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);
  }

  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();})
    .then(db=>{
      const g=(db.games||[]).find(x=>x.id==='ka_g4_correct_phrase');
      if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}
      items=shuffle(g.items||[]); render();
    })
    .catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>كَلِمَاتٌ مُتَقَاطِعَة — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Harf ızgarasında ünite kelimelerini bul — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي).">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#fff8ec;--c-muted:rgba(255,248,236,0.62)}
html.light{--c-text:#3a2a10;--c-muted:rgba(58,42,16,0.6)}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow-x:hidden;position:relative;background:radial-gradient(ellipse at top,#7c2d12 0%,#1a0e04 60%)}
html.light body{background:radial-gradient(ellipse at top,#fed7aa 0%,#fef6e4 60%)}
body::before{content:'';position:fixed;left:50%;top:-8vw;width:60vw;height:60vw;background:radial-gradient(circle,rgba(251,146,60,0.22) 0%,transparent 60%);transform:translateX(-50%);pointer-events:none;z-index:0}
.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(15,9,3,0.85),rgba(15,9,3,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(252,211,77,0.18)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(217,119,6,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(252,211,77,0.22);transform:translateX(2px)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:var(--c-gold);flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:20px 12px 80px;max-width:760px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud-stat{background:rgba(0,0,0,0.28);border:1px solid rgba(252,211,77,0.2);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
html.light .hud-stat{background:rgba(255,255,255,0.7);color:#5b3a14;border-color:rgba(217,119,6,0.2)}
.hud-stat b{display:block;font-size:22px;color:var(--c-gold);margin-top:2px;text-align:center}
html.light .hud-stat b{color:#a16207}

.word-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;margin-bottom:14px}
.wword{font-family:'Arakom',sans-serif;font-size:clamp(14px,2.2vw,17px);font-weight:bold;background:rgba(255,251,235,0.08);color:var(--c-text);border:1px solid rgba(252,211,77,0.2);border-radius:999px;padding:8px 14px;transition:.25s}
.wword.found{background:rgba(22,163,74,0.18);color:#86efac;border-color:rgba(22,163,74,0.4);text-decoration:line-through}

.grid-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.grid{display:grid;gap:4px;direction:ltr;background:rgba(0,0,0,0.32);padding:8px;border-radius:14px;border:1px solid rgba(252,211,77,0.18)}
.cell{
  aspect-ratio:1/1;background:linear-gradient(135deg,#fffbeb,#fde68a);color:#3a1d0a;
  font-family:'Arakom',sans-serif;font-size:clamp(13px,2vw,17px);font-weight:bold;
  border-radius:8px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4);
  transition:transform .15s,background .25s;
  user-select:none;
}
.cell.selected{background:linear-gradient(135deg,#fde047,#f59e0b);color:#1a0e04;transform:scale(1.05);box-shadow:0 0 0 2px var(--c-gold)}
.cell.found{background:linear-gradient(135deg,#bbf7d0,#22c55e);color:#052e16;box-shadow:inset 0 1px 0 rgba(255,255,255,0.4)}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:9px 20px;cursor:pointer;border:1.5px solid transparent;transition:.2s}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--c-text);border-color:rgba(255,255,255,0.18)}
html.light .btn.ghost{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.12)}
.btn.ghost:hover{background:rgba(255,255,255,0.12)}

.feedback{min-height:30px;text-align:center;margin-top:10px;font-size:13px;color:var(--c-muted)}
.feedback.ok{color:#86efac}.feedback.bad{color:#fca5a5}

.end{background:linear-gradient(135deg,rgba(252,211,77,0.1),rgba(180,83,9,0.06));border:1.5px solid rgba(252,211,77,0.28);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:var(--c-gold);margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:var(--c-gold);line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end button{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;color:#1a0e04;padding:14px 32px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 24px rgba(245,158,11,0.4);transition:.2s}
.end button:hover{transform:translateY(-2px)}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(250,204,21,0.5))}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">كَلِمَاتٌ مُتَقَاطِعَة</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>
<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>
<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const stage=document.getElementById('stage'); const chip=document.getElementById('chip');
  let size=12, words=[], grid=[], found=new Set(), selected=[];
  function canPlace(w,r,c,dr,dc){for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||cc<0||rr>=size||cc>=size) return false; if(grid[rr][cc] && grid[rr][cc]!==w[k]) return false;}return true;}
  function place(w){const dirs=[[0,1],[1,0],[1,1]];for(let t=0;t<300;t++){const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)];const r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size);if(canPlace(w,r,c,dr,dc)){for(let k=0;k<w.length;k++)grid[r+dr*k][c+dc*k]=w[k];return true;}}return false;}
  function build(){
    grid=Array.from({length:size},()=>Array(size).fill(''));
    const letters='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
    words.forEach(w=>place(Array.from(w).join('')));
    for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
  }
  function render(){
    chip.textContent=`${found.size} / ${words.length}`;
    stage.innerHTML=`
      <div class="hud"><div class="hud-stat">Bulunan<b id="hudF">${found.size}</b></div><div class="hud-stat">Toplam<b>${words.length}</b></div></div>
      <div class="word-list">${words.map(w=>`<span class="wword ${found.has(w)?'found':''}" data-w="${w}">${w}</span>`).join('')}</div>
      <div class="grid-wrap">
        <div class="grid" style="grid-template-columns:repeat(${size},1fr);width:min(94vw,520px)">
          ${grid.flatMap((row,r)=>row.map((ch,c)=>`<button class="cell" data-r="${r}" data-c="${c}">${ch}</button>`)).join('')}
        </div>
        <div class="actions"><button class="btn ghost" id="clr">↺ Temizle</button></div>
        <div class="feedback" id="fb"></div>
      </div>
    `;
    document.querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>toggleCell(c)));
    document.getElementById('clr').addEventListener('click',clearSel);
  }
  function toggleCell(c){
    if(c.classList.contains('found')) return;
    const key=c.dataset.r+','+c.dataset.c;
    const idx=selected.indexOf(key);
    if(idx>=0){selected.splice(idx,1);c.classList.remove('selected');}
    else{selected.push(key);c.classList.add('selected');}
    checkSel();
  }
  function clearSel(){selected.forEach(k=>{const [r,c]=k.split(',');const cell=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(cell)cell.classList.remove('selected');});selected=[];const fb=document.getElementById('fb');if(fb){fb.className='feedback';fb.textContent='';}}
  function checkSel(){
    if(selected.length<2) return;
    const text=selected.map(k=>{const [r,c]=k.split(',').map(Number);return grid[r][c];}).join('');
    const rev=Array.from(text).reverse().join('');
    const hit=words.find(w=>!found.has(w) && (strip(w)===strip(text)||strip(w)===strip(rev)));
    if(hit){
      found.add(hit);
      selected.forEach(k=>{const [r,c]=k.split(',');const cell=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(cell){cell.classList.remove('selected');cell.classList.add('found');}});
      selected=[];
      document.querySelector(`.wword[data-w="${hit}"]`).classList.add('found');
      document.getElementById('hudF').textContent=found.size;
      chip.textContent=`${found.size} / ${words.length}`;
      const fb=document.getElementById('fb'); fb.className='feedback ok'; fb.textContent=`✓ Bulundu: ${hit}`;
      burst(20);
      if(found.size===words.length) setTimeout(end,700);
    }
  }
  function end(){
    chip.textContent=`${words.length} / ${words.length}`;
    stage.innerHTML=`<div class="end"><div class="medal">🏆</div><h2 dir="rtl">أَحْسَنْت!</h2><div class="score-big">${found.size}<small> / ${words.length}</small></div><p>Tüm kelimeleri buldun!</p><button id="again">Tekrar Oyna</button></div>`;
    document.getElementById('again').addEventListener('click',()=>{found.clear();selected=[];build();render();});
    burst(80);
  }
  function burst(count=36){const c=document.getElementById('cf');c.style.display='block';const colors=['#facc15','#fb923c','#22c55e','#38bdf8','#f472b6','#fff'];const frag=document.createDocumentFragment();for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}c.appendChild(frag);setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);}
  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();}).then(db=>{const g=(db.games||[]).find(x=>x.id==='u4_word_search');if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}size=(g.settings&&g.settings.size)||12;words=(g.items||[]).map(i=>i.word||i.text).filter(Boolean);build();render();}).catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

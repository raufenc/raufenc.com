<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>اِبْنِ الجُمْلَة — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Kelimelerden Arapça cümle inşa et — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي) cümle kurma oyunu.">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#fff8ec;--c-muted:rgba(255,248,236,0.62)}
html.light{--c-text:#3a2a10;--c-muted:rgba(58,42,16,0.6)}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow-x:hidden;position:relative;background:radial-gradient(ellipse at top,#7c2d12 0%,#1a0e04 60%)}
html.light body{background:radial-gradient(ellipse at top,#fed7aa 0%,#fef6e4 60%)}
body::before{content:'';position:fixed;left:50%;top:-8vw;width:60vw;height:60vw;background:radial-gradient(circle,rgba(251,146,60,0.22) 0%,transparent 60%);transform:translateX(-50%);pointer-events:none;z-index:0}
.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(15,9,3,0.85),rgba(15,9,3,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(252,211,77,0.18)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(217,119,6,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(252,211,77,0.22);transform:translateX(2px)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:var(--c-gold);flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:24px 16px 80px;max-width:880px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud-stat{background:rgba(0,0,0,0.28);border:1px solid rgba(252,211,77,0.2);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
html.light .hud-stat{background:rgba(255,255,255,0.7);color:#5b3a14;border-color:rgba(217,119,6,0.2)}
.hud-stat b{display:block;font-size:22px;color:var(--c-gold);margin-top:2px;text-align:center}
html.light .hud-stat b{color:#a16207}

.hint{background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(14,165,233,0.06));border:1px solid rgba(56,189,248,0.25);border-radius:18px;padding:14px 18px;text-align:center;color:#7dd3fc;font-size:15px;margin-bottom:18px}
.hint small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
html.light .hint{background:#e0f2fe;color:#075985;border-color:rgba(7,89,133,0.2)}

/* Construction zone - brick-style */
.zone{
  min-height:96px;padding:14px;border-radius:18px;
  background:repeating-linear-gradient(135deg,rgba(252,211,77,0.05) 0 12px,rgba(252,211,77,0.02) 12px 24px);
  border:3px solid rgba(252,211,77,0.3);border-style:dashed;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-start;direction:rtl;margin-bottom:14px;transition:.25s;position:relative;
}
.zone.empty::after{content:'🧱 Kelimeleri buraya inşa et';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--c-muted);font-size:14px;letter-spacing:.04em;pointer-events:none}
.zone.ok{border-color:var(--c-good);background:rgba(22,163,74,0.12)}
.zone.bad{border-color:var(--c-bad);background:rgba(220,38,38,0.12);animation:shakeX .42s}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl;margin-bottom:18px;min-height:54px}
.brick{
  font-family:'Arakom',sans-serif;font-size:clamp(16px,2.4vw,21px);font-weight:bold;
  background:linear-gradient(180deg,#fef3c7 0%,#fbbf24 70%,#d97706 100%);color:#3a1d0a;
  border-radius:6px;padding:10px 18px;border:2px solid #92400e;cursor:pointer;line-height:1.4;
  box-shadow:0 4px 0 #78350f,0 6px 12px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.5);
  transition:all .18s cubic-bezier(.2,.8,.3,1);position:relative;
}
.brick:active{transform:translateY(3px);box-shadow:0 1px 0 #78350f,0 3px 6px rgba(0,0,0,0.38)}
.brick:hover{transform:translateY(-2px);box-shadow:0 6px 0 #78350f,0 10px 16px rgba(0,0,0,0.42)}
.brick:disabled{opacity:.3;cursor:default;transform:none;box-shadow:0 2px 0 #78350f}
.brick.placed{background:linear-gradient(180deg,#fde68a,#fbbf24)}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:11px 24px;cursor:pointer;border:1.5px solid transparent;transition:.2s}
.btn.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a0e04;box-shadow:0 8px 24px rgba(245,158,11,0.4)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--c-text);border-color:rgba(255,255,255,0.18)}
html.light .btn.ghost{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.12)}
.btn.ghost:hover{background:rgba(255,255,255,0.12)}

.feedback{min-height:34px;text-align:center;margin-top:12px;font-size:14px;color:var(--c-muted)}
.feedback.ok{color:#86efac}.feedback.bad{color:#fca5a5}

.end{background:linear-gradient(135deg,rgba(252,211,77,0.1),rgba(180,83,9,0.06));border:1.5px solid rgba(252,211,77,0.28);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:var(--c-gold);margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:var(--c-gold);line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end .btn.primary{font-size:16px;padding:14px 32px}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(250,204,21,0.5))}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">اِبْنِ الجُمْلَة</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>
<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>
<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const stage=document.getElementById('stage');
  const chip=document.getElementById('chip');
  let items=[],i=0,score=0,built=[],sh=[];
  function tokens(it){return it.tokens && it.tokens.length ? it.tokens.slice() : String(it.sentence).split(/\s+/).filter(Boolean);}
  function render(){
    if(i>=items.length) return renderEnd();
    const it=items[i]; const toks=tokens(it);
    sh=shuffle(toks.map((t,idx)=>({t,idx}))); built=[];
    chip.textContent=`${i+1} / ${items.length}`;
    stage.innerHTML=`
      <div class="hud"><div class="hud-stat">Skor<b>${score}</b></div><div class="hud-stat">Soru<b>${i+1}/${items.length}</b></div></div>
      <div class="hint"><small>Türkçe Anlamı</small>${it.translation||'—'}</div>
      <div class="zone empty" id="zone"></div>
      <div class="bank" id="bank">${sh.map((s,k)=>`<button class="brick" data-k="${k}">${s.t}</button>`).join('')}</div>
      <div class="actions">
        <button class="btn ghost" id="clearBtn">↺ Temizle</button>
        <button class="btn primary" id="checkBtn">Kontrol Et</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    document.querySelectorAll('.bank .brick').forEach(b=>b.addEventListener('click',()=>push(parseInt(b.dataset.k,10))));
    document.getElementById('clearBtn').addEventListener('click',clear);
    document.getElementById('checkBtn').addEventListener('click',()=>check(it));
  }
  function push(k){built.push(sh[k]);redraw();const b=document.querySelector(`.bank .brick[data-k="${k}"]`);if(b) b.disabled=true;}
  function redraw(){
    const z=document.getElementById('zone'); if(!z) return;
    z.classList.remove('ok','bad');
    if(built.length===0){z.classList.add('empty');z.innerHTML='';return;}
    z.classList.remove('empty');
    z.innerHTML=built.map((s,j)=>`<button class="brick placed" data-pos="${j}">${s.t}</button>`).join('');
    z.querySelectorAll('.brick').forEach(b=>b.addEventListener('click',()=>{const pos=parseInt(b.dataset.pos,10);const rm=built.splice(pos,1)[0];redraw();const src=document.querySelector(`.bank .brick[data-k="${sh.findIndex(s=>s===rm)}"]`);if(src) src.disabled=false;}));
  }
  function clear(){built=[];redraw();document.querySelectorAll('.bank .brick').forEach(b=>b.disabled=false);const fb=document.getElementById('fb');if(fb){fb.className='feedback';fb.textContent='';}}
  function check(it){
    const exp=tokens(it).join(' '); const got=built.map(b=>b.t).join(' ');
    const ok=strip(got)===strip(exp);
    const z=document.getElementById('zone'); const fb=document.getElementById('fb');
    if(ok){z.classList.add('ok');fb.className='feedback ok';fb.textContent='✓ Cümle doğru kuruldu';score++;burst(24);setTimeout(()=>{i++;render();},1050);}
    else{z.classList.add('bad');fb.className='feedback bad';fb.textContent='✗ Sıra yanlış';setTimeout(()=>z.classList.remove('bad'),500);}
  }
  function renderEnd(){
    chip.textContent=`${items.length} / ${items.length}`;
    const pct=Math.round(score/items.length*100);
    const medal=pct===100?'🥇':pct>=70?'🥈':pct>=40?'🥉':'🏗️';
    const msg=pct===100?'Tüm cümleleri hatasız inşa ettin!':pct>=70?'İyi iş — birkaç cümle daha pratik.':pct>=40?'Yarısını aştın.':'Cümle yapısını tekrar gözden geçir.';
    stage.innerHTML=`<div class="end"><div class="medal">${medal}</div><h2 dir="rtl">أَحْسَنْت!</h2><div class="score-big">${score}<small> / ${items.length}</small></div><p>${msg}</p><button class="btn primary" id="again">Tekrar Oyna</button></div>`;
    document.getElementById('again').addEventListener('click',()=>{items=shuffle(items);i=0;score=0;render();});
    if(pct>=70) burst(80);
  }
  function burst(count=36){const c=document.getElementById('cf');c.style.display='block';const colors=['#facc15','#fb923c','#22c55e','#38bdf8','#f472b6','#fff'];const frag=document.createDocumentFragment();for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}c.appendChild(frag);setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);}
  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();}).then(db=>{const g=(db.games||[]).find(x=>x.id==='hf_g3_build_sentence');if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}items=shuffle(g.items||[]);render();}).catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>الدِّفَاعُ الفَضَائِي — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Uzay savunma teması: doğru cevap kutusunu vur — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي).">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#fff8ec;--c-muted:rgba(255,248,236,0.62)}
html.light{--c-text:#3a2a10;--c-muted:rgba(58,42,16,0.6)}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow:hidden;position:relative;background:radial-gradient(ellipse at top,#1e1b4b 0%,#020617 60%)}
html.light body{background:radial-gradient(ellipse at top,#dbeafe 0%,#e0e7ff 60%)}
/* Stars */
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 60px 80px,#fff,transparent),radial-gradient(1px 1px at 90px 40px,#fff,transparent),radial-gradient(1px 1px at 130px 90px,#fff,transparent),radial-gradient(2px 2px at 180px 20px,#fff,transparent),radial-gradient(1px 1px at 220px 100px,#fff,transparent),radial-gradient(1px 1px at 270px 60px,#fff,transparent);background-size:300px 200px;opacity:.55;pointer-events:none;z-index:0;animation:starsMove 60s linear infinite}
@keyframes starsMove{from{background-position:0 0}to{background-position:300px 200px}}
html.light body::before{opacity:.15;filter:invert(.85)}

.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(2,6,23,0.85),rgba(2,6,23,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(168,85,247,0.3)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(91,33,182,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(168,85,247,0.18);border:1px solid rgba(168,85,247,0.4);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(168,85,247,0.3);transform:translateX(2px)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:#c4b5fd;flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(168,85,247,0.18);border:1px solid rgba(168,85,247,0.4);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:20px 14px 80px;max-width:880px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud-stat{background:rgba(15,23,42,0.6);border:1px solid rgba(168,85,247,0.3);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
.hud-stat b{display:block;font-size:22px;color:#c4b5fd;margin-top:2px;text-align:center}

.ship{font-size:54px;text-align:center;margin:8px 0 12px;line-height:1;filter:drop-shadow(0 0 16px rgba(168,85,247,0.6));animation:hover 3s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.q-text{font-family:'Arakom',sans-serif;font-size:clamp(20px,3vw,28px);font-weight:bold;text-align:center;direction:rtl;color:#e0e7ff;background:linear-gradient(135deg,rgba(168,85,247,0.12),rgba(56,189,248,0.08));border:1.5px solid rgba(168,85,247,0.35);border-radius:18px;padding:18px 22px;margin-bottom:6px;min-height:80px;display:flex;align-items:center;justify-content:center;line-height:1.6;box-shadow:0 0 30px rgba(168,85,247,0.18)}
html.light .q-text{color:#1e1b4b}
.q-context{text-align:center;color:var(--c-muted);font-size:13px;margin:6px 0 16px;direction:rtl}

.asteroids{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.asteroids{grid-template-columns:1fr}}
.ast{
  font-family:'Arakom',sans-serif;font-size:clamp(17px,2.5vw,22px);font-weight:bold;color:#0f172a;
  background:radial-gradient(circle at 30% 30%,#fef3c7,#fb923c 70%,#92400e 100%);
  border:none;padding:18px 18px;border-radius:50% 50% 50% 50% / 45% 50% 50% 45%;cursor:pointer;
  text-align:center;direction:rtl;line-height:1.4;
  box-shadow:0 8px 20px rgba(251,146,60,0.35),inset 0 -8px 12px rgba(0,0,0,0.25),inset 0 4px 8px rgba(255,255,255,0.35);
  transition:all .2s cubic-bezier(.2,.8,.3,1);position:relative;animation:float 4s ease-in-out infinite;
}
.ast:nth-child(even){animation-delay:.7s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.ast:hover{transform:scale(1.06);box-shadow:0 12px 28px rgba(251,146,60,0.5)}
.ast.correct{background:radial-gradient(circle at 30% 30%,#bbf7d0,#22c55e 70%,#14532d 100%);box-shadow:0 0 0 6px rgba(34,197,94,0.4),0 12px 28px rgba(34,197,94,0.5);animation:explodeGood .6s ease}
.ast.wrong{background:radial-gradient(circle at 30% 30%,#fecaca,#dc2626 70%,#450a0a 100%);box-shadow:0 0 0 6px rgba(220,38,38,0.4);animation:explodeBad .4s ease}
.ast:disabled{cursor:default}
@keyframes explodeGood{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes explodeBad{0%{transform:scale(1)}40%{transform:scale(0.85) rotate(8deg)}100%{transform:scale(1)}}

.explanation{margin-top:18px;padding:14px 18px;border-radius:14px;font-size:14px;line-height:1.55;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.25);color:#c4b5fd;text-align:center;display:none}
html.light .explanation{background:#ede9fe;color:#5b21b6;border-color:rgba(91,33,182,0.2)}
.explanation.show{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.end{background:linear-gradient(135deg,rgba(168,85,247,0.12),rgba(56,189,248,0.08));border:1.5px solid rgba(168,85,247,0.35);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:#c4b5fd;margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:#c4b5fd;line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end button{background:linear-gradient(135deg,#a855f7,#7c3aed);border:none;color:#fff;padding:14px 32px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 24px rgba(168,85,247,0.5);transition:.2s}
.end button:hover{transform:translateY(-2px)}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(168,85,247,0.6))}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">الدِّفَاعُ الفَضَائِي</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>
<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>
<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const stage=document.getElementById('stage'); const chip=document.getElementById('chip');
  let items=[],i=0,score=0,locked=false;
  function render(){
    if(i>=items.length) return renderEnd();
    const it=items[i]; locked=false;
    chip.textContent=`${i+1} / ${items.length}`;
    stage.innerHTML=`
      <div class="hud"><div class="hud-stat">Skor<b>${score}</b></div><div class="hud-stat">Soru<b>${i+1}/${items.length}</b></div></div>
      <div class="ship">🚀</div>
      <div class="q-text" dir="rtl">${it.prompt}</div>
      ${it.context?`<div class="q-context">${it.context}</div>`:''}
      <div class="asteroids" id="opts"></div>
      <div class="explanation" id="exp"></div>
    `;
    shuffle(it.options||[]).forEach(opt=>{const b=document.createElement('button');b.className='ast';b.dir='rtl';b.textContent=opt;b.addEventListener('click',()=>choose(b,opt,it));document.getElementById('opts').appendChild(b);});
  }
  function choose(btn,opt,it){
    if(locked) return; locked=true;
    document.querySelectorAll('.ast').forEach(b=>b.disabled=true);
    const ok=strip(opt)===strip(it.answer);
    if(ok){btn.classList.add('correct');score++;burst(28);}
    else{btn.classList.add('wrong');document.querySelectorAll('.ast').forEach(b=>{if(strip(b.textContent)===strip(it.answer)) b.classList.add('correct');});}
    if(it.explanation){const e=document.getElementById('exp');e.textContent=it.explanation;e.classList.add('show');}
    setTimeout(()=>{i++;render();},ok?1100:1800);
  }
  function renderEnd(){
    chip.textContent=`${items.length} / ${items.length}`;
    const pct=Math.round(score/items.length*100);
    const medal=pct===100?'🥇':pct>=70?'🥈':pct>=40?'🥉':'🚀';
    const msg=pct===100?'Tüm asteroitleri yok ettin!':pct>=70?'İyi atıcı — birkaç hedef daha.':pct>=40?'Yarıyı aştın.':'Hedefleme antrenmanı yap!';
    stage.innerHTML=`<div class="end"><div class="medal">${medal}</div><h2 dir="rtl">أَحْسَنْت!</h2><div class="score-big">${score}<small> / ${items.length}</small></div><p>${msg}</p><button id="again">Tekrar Oyna</button></div>`;
    document.getElementById('again').addEventListener('click',()=>{items=shuffle(items);i=0;score=0;render();});
    if(pct>=70) burst(80);
  }
  function burst(count=36){const c=document.getElementById('cf');c.style.display='block';const colors=['#a855f7','#facc15','#22c55e','#38bdf8','#f472b6','#fff'];const frag=document.createDocumentFragment();for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}c.appendChild(frag);setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);}
  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();}).then(db=>{const g=(db.games||[]).find(x=>x.id==='ar_g1_space_defense_adapter');if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}items=shuffle(g.items||[]);render();}).catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

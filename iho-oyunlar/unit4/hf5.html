<!DOCTYPE html>
<html lang="tr">
<head>
<script src="/lib/design-system/theme.js"></script>
<link rel="stylesheet" href="/lib/design-system/tokens.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>الوَقْتُ يَضْغَط — İHO 7. Sınıf 4. Ünite</title>
<meta name="description" content="Süre dolmadan hızlıca cevap ver — İHO 7. sınıf 4. ünite (مَدِينَتِي وَبَلَدِي) hız testi.">
<style>
@font-face{font-family:'Arakom';src:url('../Arakom-Regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'Arakom';src:url('../Arakom-Bold.ttf') format('truetype');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
:root{--c-gold:#facc15;--c-good:#16a34a;--c-bad:#dc2626;--c-text:#fff8ec;--c-muted:rgba(255,248,236,0.62)}
html.light{--c-text:#3a2a10;--c-muted:rgba(58,42,16,0.6)}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',sans-serif;color:var(--c-text);min-height:100vh;overflow-x:hidden;position:relative;background:radial-gradient(ellipse at top,#7c2d12 0%,#1a0e04 60%)}
html.light body{background:radial-gradient(ellipse at top,#fed7aa 0%,#fef6e4 60%)}
body::before{content:'';position:fixed;left:50%;top:-8vw;width:60vw;height:60vw;background:radial-gradient(circle,rgba(251,146,60,0.22) 0%,transparent 60%);transform:translateX(-50%);pointer-events:none;z-index:0}
.top-bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px 0 170px;background:linear-gradient(180deg,rgba(15,9,3,0.85),rgba(15,9,3,0.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(252,211,77,0.18)}
html.light .top-bar{background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));border-bottom-color:rgba(217,119,6,0.18)}
@media(max-width:600px){.top-bar{padding-left:130px;padding-right:12px}}
@media(max-width:380px){.top-bar{padding-left:120px;gap:8px}}
.back-btn{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.back-btn:hover{background:rgba(252,211,77,0.22);transform:translateX(2px)}
.title-ar{font-family:'Arakom',sans-serif;font-size:18px;color:var(--c-gold);flex:1;text-align:center;direction:rtl;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-chip{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:var(--c-text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:380px){.back-btn-text{display:none}.title-ar{font-size:16px}.progress-chip{padding:5px 10px;font-size:12px}}

.stage{position:relative;z-index:1;padding:24px 16px 80px;max-width:780px;margin:0 auto}
.hud{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud-stat{background:rgba(0,0,0,0.28);border:1px solid rgba(252,211,77,0.2);padding:8px 18px;border-radius:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
html.light .hud-stat{background:rgba(255,255,255,0.7);color:#5b3a14;border-color:rgba(217,119,6,0.2)}
.hud-stat b{display:block;font-size:22px;color:var(--c-gold);margin-top:2px;text-align:center}
html.light .hud-stat b{color:#a16207}

/* Timer ring */
.timer-wrap{display:flex;flex-direction:column;align-items:center;margin:12px 0 20px;position:relative}
.timer{position:relative;width:120px;height:120px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:10}
.timer .bg{stroke:rgba(252,211,77,0.15)}
.timer .fg{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s}
.timer.warn .fg{stroke:#dc2626!important;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(220,38,38,0))}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,0.7))}}
.timer .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--c-gold);font-family:'Inter',sans-serif}
html.light .timer .label{color:#a16207}
.timer.warn .label{color:#dc2626}

.q-text{
  font-family:'Arakom',sans-serif;font-size:clamp(20px,3.2vw,28px);font-weight:bold;
  text-align:center;direction:rtl;color:var(--c-gold);line-height:1.7;
  background:linear-gradient(135deg,rgba(252,211,77,0.08),rgba(180,83,9,0.04));
  border:1.5px solid rgba(252,211,77,0.25);border-radius:18px;padding:20px 22px;margin-bottom:18px;
  min-height:80px;display:flex;align-items:center;justify-content:center;
}
.q-context{text-align:center;color:var(--c-muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:-10px 0 14px}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.options{grid-template-columns:1fr}}
.opt{
  font-family:'Arakom',sans-serif;font-size:clamp(17px,2.5vw,22px);font-weight:bold;
  background:rgba(255,251,235,0.08);border:1.5px solid rgba(252,211,77,0.22);color:var(--c-text);
  padding:16px 18px;border-radius:16px;cursor:pointer;text-align:center;direction:rtl;line-height:1.4;
  transition:all .2s cubic-bezier(.2,.8,.3,1);
}
html.light .opt{background:rgba(255,255,255,0.78)}
.opt:hover{transform:translateY(-3px);border-color:var(--c-gold)}
.opt.correct{background:rgba(22,163,74,0.22);border-color:var(--c-good);box-shadow:0 0 0 4px rgba(22,163,74,0.22);animation:popOk .55s}
.opt.wrong{background:rgba(220,38,38,0.18);border-color:var(--c-bad);animation:shakeX .42s}
.opt:disabled{cursor:default;opacity:.85}
@keyframes popOk{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

.feedback{min-height:34px;text-align:center;margin-top:14px;font-size:14px;color:var(--c-muted)}
.feedback.ok{color:#86efac}.feedback.bad{color:#fca5a5}

.end{background:linear-gradient(135deg,rgba(252,211,77,0.1),rgba(180,83,9,0.06));border:1.5px solid rgba(252,211,77,0.28);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;margin:30px auto}
.end h2{font-family:'Arakom',sans-serif;font-size:30px;color:var(--c-gold);margin-bottom:6px}
.end .score-big{font-size:60px;font-weight:900;color:var(--c-gold);line-height:1;margin:14px 0}
.end .score-big small{font-size:22px;color:var(--c-muted);font-weight:400}
.end p{color:var(--c-muted);margin-bottom:22px}
.end button{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;color:#1a0e04;padding:14px 32px;border-radius:999px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 24px rgba(245,158,11,0.4);transition:.2s}
.end button:hover{transform:translateY(-2px)}
.medal{font-size:72px;line-height:1;filter:drop-shadow(0 6px 18px rgba(250,204,21,0.5))}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards;top:-20px}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.loading{padding:60px 20px;text-align:center;color:var(--c-muted)}
</style>
<script src="/nav.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="./index.html"><span>←</span> <span class="back-btn-text">Tüm Oyunlar</span></a>
  <div class="title-ar" dir="rtl">الوَقْتُ يَضْغَط</div>
  <span class="progress-chip" id="chip">— / —</span>
</header>
<main class="stage" id="stage"><div class="loading">Yükleniyor…</div></main>
<canvas class="confetti" id="cf" style="display:none"></canvas>
<script>
(function(){
  const strip=s=>String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/[؟?،,.؛;]/g,'').trim();
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const stage=document.getElementById('stage');
  const chip=document.getElementById('chip');
  let items=[],i=0,score=0,locked=false,timer=null,timeLeft=10,defaultTime=10;
  const CIRC = 2*Math.PI*48; // r=48
  function render(){
    if(i>=items.length) return renderEnd();
    const it=items[i]; locked=false; timeLeft=defaultTime;
    chip.textContent=`${i+1} / ${items.length}`;
    stage.innerHTML=`
      <div class="hud"><div class="hud-stat">Skor<b>${score}</b></div><div class="hud-stat">Soru<b>${i+1}/${items.length}</b></div></div>
      <div class="timer-wrap"><div class="timer" id="timer">
        <svg viewBox="0 0 110 110">
          <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
          <circle class="bg" cx="55" cy="55" r="48"/>
          <circle class="fg" cx="55" cy="55" r="48" stroke-dasharray="${CIRC}" stroke-dashoffset="0" id="ring"/>
        </svg>
        <div class="label" id="tlabel">${timeLeft}</div>
      </div></div>
      <div class="q-text" dir="rtl">${it.prompt}</div>
      ${it.context?`<div class="q-context">${it.context}</div>`:''}
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>
    `;
    const opts=shuffle(it.options||[]);
    const wrap=document.getElementById('opts');
    opts.forEach(opt=>{const b=document.createElement('button');b.className='opt';b.dir='rtl';b.textContent=opt;b.addEventListener('click',()=>choose(b,opt,it));wrap.appendChild(b);});
    startTimer(it);
  }
  function startTimer(it){
    const ring=document.getElementById('ring');
    const label=document.getElementById('tlabel');
    const tw=document.getElementById('timer');
    let t=defaultTime;
    label.textContent=t;
    ring.style.strokeDashoffset='0';
    timer=setInterval(()=>{
      t--; timeLeft=t;
      ring.style.strokeDashoffset = ((defaultTime-t)/defaultTime*CIRC).toFixed(2);
      label.textContent=Math.max(t,0);
      if(t<=3) tw.classList.add('warn');
      if(t<=0){ clearInterval(timer); locked=true; const fb=document.getElementById('fb'); fb.className='feedback bad'; fb.textContent='⏱ Süre doldu! Doğru cevap: '+it.answer; const all=document.querySelectorAll('.opt'); all.forEach(b=>{b.disabled=true; if(strip(b.textContent)===strip(it.answer)) b.classList.add('correct');}); setTimeout(()=>{i++;render();},1700); }
    },1000);
  }
  function choose(btn,opt,it){
    if(locked) return; locked=true;
    if(timer) clearInterval(timer);
    const all=document.querySelectorAll('.opt'); all.forEach(b=>b.disabled=true);
    const ok=strip(opt)===strip(it.answer);
    if(ok){btn.classList.add('correct');score++;burst(20);}
    else{btn.classList.add('wrong'); all.forEach(b=>{if(strip(b.textContent)===strip(it.answer)) b.classList.add('correct');});}
    setTimeout(()=>{i++;render();},ok?900:1500);
  }
  function renderEnd(){
    if(timer) clearInterval(timer);
    chip.textContent=`${items.length} / ${items.length}`;
    const pct=Math.round(score/items.length*100);
    const medal=pct===100?'🥇':pct>=70?'🥈':pct>=40?'🥉':'⏱️';
    const msg=pct===100?'Hızlı ve doğru!':pct>=70?'İyi hız — birkaç soruda dikkat.':pct>=40?'Yarıyı aştın.':'Daha hızlı tepki için pratik gerek.';
    stage.innerHTML=`<div class="end"><div class="medal">${medal}</div><h2 dir="rtl">أَحْسَنْت!</h2><div class="score-big">${score}<small> / ${items.length}</small></div><p>${msg}</p><button id="again">Tekrar Oyna</button></div>`;
    document.getElementById('again').addEventListener('click',()=>{items=shuffle(items);i=0;score=0;render();});
    if(pct>=70) burst(80);
  }
  function burst(count=36){const c=document.getElementById('cf');c.style.display='block';const colors=['#facc15','#fb923c','#22c55e','#38bdf8','#f472b6','#fff'];const frag=document.createDocumentFragment();for(let k=0;k<count;k++){const i=document.createElement('i');i.style.left=(Math.random()*100)+'%';i.style.background=colors[Math.floor(Math.random()*colors.length)];i.style.animationDelay=(Math.random()*0.4)+'s';i.style.animationDuration=(1.6+Math.random()*1.2)+'s';frag.appendChild(i);}c.appendChild(frag);setTimeout(()=>{c.innerHTML='';c.style.display='none';},2400);}
  fetch('data/unit4.database.json').then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json();}).then(db=>{const g=(db.games||[]).find(x=>x.id==='hf_g5_speed_quiz');if(!g){stage.innerHTML='<div class="loading">Oyun bulunamadı.</div>';return;}defaultTime=(g.settings&&g.settings.timerSeconds)||10;items=shuffle(g.items||[]);render();}).catch(err=>{stage.innerHTML=`<div class="loading"><p>Veri yüklenemedi: ${err.message}</p></div>`;});
})();
</script>
</body>
</html>

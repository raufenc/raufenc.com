<style>
:root{--ink:#123c40;--muted:#51696b;--line:#d7e4e1;--teal:#087c76;--teal-a:#e2f2ef;--bg:#fff8ec;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid #f0a53a;outline-offset:2px}
.ust{max-width:720px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;gap:12px}
.ust svg{flex:none}
.ust .ad{font-size:19px;font-weight:600;line-height:1.2}
.ust .alt{font-size:13.5px;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:4px 20px 72px}
h1,h2,h3,p{margin:0}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--teal);margin:28px 0 10px}
.dev{font-size:clamp(36px,9.4vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.04}
.dev span{display:block;color:var(--teal)}
.giris{font-size:19px;color:var(--muted);margin:18px 0 6px;max-width:34em}
.sanat{display:block;width:100%;max-width:520px;height:auto;margin:10px auto 6px}
.guven{display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:16px;margin:10px 0 18px}
.guven svg{flex:none;margin-top:2px}
.adimlar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:22px}
.adimlar b{display:block;font-size:13px;font-weight:500;color:var(--teal)}
.adimlar span{font-weight:600;font-size:16px;line-height:1.3;display:block}
.kutu{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.kutu h2{font-size:21px;letter-spacing:-.01em;margin-bottom:12px}
.siniflar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sinif{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 6px;font-weight:600;font-size:16.5px;min-height:56px}
.sinif[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-a);color:#05534f}
.buyuk{display:block;width:100%;margin-top:14px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;min-height:58px}
.buyuk:disabled{opacity:.38;cursor:default}
.buyuk.ikincil{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.kucuk{font-size:14.5px;color:var(--muted);margin-top:12px}
.sure{display:inline-block;font-size:13.5px;font-weight:600;color:var(--teal);background:var(--teal-a);border-radius:999px;padding:3px 11px;margin-bottom:10px}
/* soru */
.akis{max-width:600px;margin:0 auto;padding-top:18px}
.soruust{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;color:var(--muted);font-weight:500;min-height:28px}
.soruust em{font-style:normal;color:var(--teal);font-weight:700}
.cubuk{height:8px;background:#e3ecea;border-radius:99px;overflow:hidden;margin:8px 0 26px}
.cubuk i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.durum{font-size:clamp(22px,5.6vw,27px);font-weight:700;letter-spacing:-.015em;line-height:1.28}
.ilkne{color:var(--teal);font-weight:700;font-size:16px;margin:18px 0 10px}
.kartlar{display:grid;gap:10px}
.kart{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-size:18px;line-height:1.35;min-height:64px;transition:border-color .12s,background .12s,transform .12s}
.kart:hover{border-color:#9fcfc8}
.kart:active{transform:scale(.99)}
.kart.secili{border-color:var(--teal);background:var(--teal-a);font-weight:600}
.geri{background:none;border:0;color:var(--muted);font-size:15px;padding:12px 4px;margin-top:14px;text-decoration:underline;text-underline-offset:3px}
/* sonuç */
.sonuc{max-width:600px;margin:0 auto;padding-top:14px}
.skart{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 22px 50px;text-align:center;position:relative;overflow:hidden}
.skart .halka{position:absolute;inset:auto -30% -262px -30%;height:300px;border:2px dashed #d9e9e6;border-radius:50%;pointer-events:none}
.skart .halka.iki{inset:auto -10% -202px -10%;height:222px}
.skart>*{position:relative}
.skart .ustyazi{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--teal)}
.ambler{display:flex;justify-content:center;gap:14px;margin:18px 0 12px;flex-wrap:wrap}
.ambler.sik{gap:8px;flex-wrap:nowrap}
.tarzad{font-size:clamp(32px,9vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.birlikte{font-size:18px;color:var(--muted);margin:12px auto 0;max-width:26em}
.esit{font-size:15px;color:var(--muted);margin-top:10px}
.dugmeler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dugmeler .buyuk{margin-top:0;font-size:16.5px;padding:14px 8px}
.durumyazi{min-height:22px;font-size:14.5px;color:var(--teal);text-align:center;margin-top:8px}
.bolum{margin-top:30px}
.bolum>h2{font-size:22px;letter-spacing:-.015em;margin-bottom:12px}
.yol{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:10px}
.yol svg{flex:none}
.yol h3{font-size:19px;line-height:1.25}
.yol h3 small{font-weight:500;font-size:15px;color:var(--muted)}
.yol p{margin-top:4px;font-size:16.5px}
.kod{display:inline-block;margin-top:10px;font-size:14px;border-radius:10px;padding:5px 10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.kod b{color:var(--ink);font-weight:600}
.an{margin-top:14px}
.an>b{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.satir{display:grid;grid-template-columns:30px 5.6em 1fr auto;gap:8px;align-items:center;padding:5px 0}
.satir .isim{font-weight:600;font-size:16px}
.noktalar{display:flex;flex-wrap:wrap;gap:4px}
.noktalar i{width:10px;height:10px;border-radius:50%;display:block}
.satir .sayi{font-size:14px;color:var(--muted);white-space:nowrap}
.not{font-size:14.5px;color:var(--muted);margin-top:12px}
.dene{background:var(--teal-a);border-radius:20px;padding:18px 20px}
.dene p{font-size:16px;color:#2b5557}
.dene strong{display:block;font-size:18.5px;line-height:1.35;margin-top:6px;color:var(--ink)}
.etiket{font-size:15.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:14px;margin-top:22px}
.kardes{display:block;margin-top:22px;background:var(--ink);color:#fff;border-radius:20px;padding:18px 20px;text-decoration:none}
.kardes small{display:block;opacity:.8;font-size:14.5px}
.kardes b{font-size:19px}
details{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:16px;padding:6px 0}
details h3{font-size:16px;margin-top:14px}
details p,details li{font-size:15px;color:var(--muted)}
details ol{padding-left:20px;margin:8px 0 0}
details li{margin-bottom:4px;font-size:13.5px}
.dip{text-align:center;font-size:13.5px;color:var(--muted);margin-top:34px}
/* rehber (İlgi Testi'nin kardeşi) */
.ustbag{display:flex;justify-content:flex-end;gap:18px;margin-top:6px}
.ustbag button,.baglar button,.baglar a{background:none;border:0;padding:6px 0;font-size:14.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.resim{margin:16px 0 0}
.resim img{display:block;width:100%;height:auto;border-radius:22px;border:1px solid var(--line);background:#e7efe9}
.resim figcaption{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.altilik{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:14px 0 4px;text-align:center}
.altilik span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.adimlar small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.ornekbag{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 0 18px;font-weight:700;font-size:16.5px;color:var(--teal);text-decoration:underline;text-underline-offset:4px}
.alan{display:block;margin:0 0 18px}
.alan b{display:block;font-size:15.5px;margin-bottom:6px}
.alan input{width:100%;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 14px;min-height:52px}
.alan small{display:block;font-size:13.5px;color:var(--muted);margin-top:5px}
.ornekkutu{background:#fff6e2;border:1px solid #ecd9a8;border-radius:16px;padding:14px 16px;font-size:15.5px;color:#5c4a17;margin-bottom:14px}
.ornekkutu .buyuk{margin-top:10px;font-size:16.5px;padding:12px;min-height:50px}
.kahraman{position:relative;background:linear-gradient(160deg,#0f4f52,#0a3c40);color:#fff;border-radius:26px;padding:26px 22px 24px;overflow:hidden}
.kahraman:after{content:"";position:absolute;right:-90px;bottom:-150px;width:340px;height:340px;border:2px dashed rgba(255,255,255,.16);border-radius:50%;pointer-events:none}
.kahraman>*{position:relative}
.k-amb{position:absolute!important;top:18px;right:18px;display:flex}
.k-amb svg{border-radius:50%;box-shadow:0 0 0 3px #0d4649}
.k-amb svg+svg{margin-left:-10px}
.k-amb.sik svg+svg{margin-left:-14px}
.k-ust{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:#9fd8d0}
.k-on{font-size:16px;color:#cfe6e2;margin-top:14px}
.kahraman .tarzad{color:#fff;margin-top:2px}
.kahraman .birlikte{color:#e3f0ee;margin:14px 0 0;max-width:none;font-size:17.5px}
.kahraman .esit{color:#b9d9d4}
.rozetler{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.rozetler span{font-size:13.5px;font-weight:600;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:5px 12px;color:#eef7f5}
.k-alt{font-size:14.5px;color:var(--muted);margin:12px 4px 0}
.sekmeler{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:20px 0 14px}
.sekme{background:none;border:1px solid transparent;border-radius:14px;padding:12px 6px;font-weight:600;font-size:15.5px;color:var(--muted);min-height:48px}
.sekme:last-child{grid-column:1/-1}
.sekme[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--teal);box-shadow:0 2px 8px rgba(18,60,64,.07)}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px}
.panel.acik{display:block}
.p-ust{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--teal)}
.p-baslik{font-size:clamp(24px,6.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.p-giris{font-size:17px;color:var(--muted);margin-top:10px}
.p-alt{font-size:19px;margin-top:24px}
.p-alt+p{color:var(--muted);font-size:16.5px;margin-top:4px}
.ic{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;break-inside:avoid}
.ic-bas{display:flex;gap:12px;align-items:center}
.ic-bas svg{flex:none}
.ic h3{font-size:18.5px;line-height:1.25}
.ic h3 small{font-weight:500;font-size:15px;color:var(--muted)}
.ic>p{font-size:16px;margin-top:10px}
.ic .alinti{color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.ic .alinti b{display:block;font-size:13.5px;color:var(--ink)}
.d-yol{font-size:14px;font-weight:700}
.d-sure{font-size:14.5px!important;color:var(--muted)}
.d-adim{margin:10px 0 0;padding-left:22px;font-size:16px}
.d-adim li{margin-bottom:5px}
.d-soru{font-style:italic;color:#2b5557}
.ic details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.ic summary{font-size:15.5px;color:var(--teal)}
.ic details p{font-size:15.5px;color:var(--ink);margin-top:4px}
.d-lab{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:14px}
.d-lab select{display:block;width:100%;margin-top:6px;font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 10px;min-height:48px}
.d-sec{font-size:16.5px;padding:12px;min-height:50px;background:var(--card)!important}
.d-sec[aria-pressed="true"]{background:var(--teal)!important;color:#fff}
.an-ad{display:block;font-size:12.5px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:22px 0 -4px}
.senin{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:4px;color:#fff}
.a-soru{font-weight:700}
.nerede{font-size:15px!important;color:var(--muted)}
.nerede b{color:var(--ink)}
.kodkutu{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin-top:22px}
.kodkutu h3{font-size:18.5px}
.kodkutu p{font-size:15px;color:#cfe3e0;margin-top:4px}
.kodkutu ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.kodkutu li{display:flex;gap:10px;align-items:center;font-size:15px;background:rgba(255,255,255,.08);border-radius:10px;padding:7px 10px}
.kodkutu li b{font-weight:600}
.kodkutu li span{color:#a9cfc9;font-size:13.5px;margin-left:auto;white-space:nowrap}
.radar{display:block;width:100%;max-width:400px;height:auto;margin:14px auto 4px}
.gunler{display:grid;gap:10px;margin-top:12px}
.gun{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:16px;padding:14px 16px;break-inside:avoid}
.gun small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--teal)}
.gun b{display:block;font-size:17px;margin-top:2px}
.gun p{font-size:15.5px;color:var(--muted);margin-top:4px}
.tanit{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.tanit small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--teal)}
.tanit p{font-size:16px;margin-top:6px}
.tanit a{display:inline-block;margin-top:10px;font-weight:700;font-size:15.5px}
.ozel{background:#e4f2e8;border:1px solid #cfe5d6;border-radius:24px;padding:22px 20px;margin-top:16px}
.ozel h2{font-size:21px;letter-spacing:-.01em}
.ozel>p{font-size:16px;color:#2b5557;margin-top:4px}
.ozel .beyaz{background:#fff;border-color:var(--line);color:var(--ink)}
.ozel a.buyuk{text-align:center;text-decoration:none;margin-top:10px}
.ozel .dugmeler{margin-top:10px}
.baglar{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:12px}
.dip b{display:block;color:var(--ink);font-size:15px}
/* canlılık */
@keyframes yuksel{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes belir{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes don{to{transform:rotate(360deg)}}
.akis .durum,.akis .ilkne{animation:yuksel .3s ease backwards}
.kart{position:relative;padding-right:46px;animation:yuksel .32s ease backwards}
.kart:nth-child(2){animation-delay:.06s}.kart:nth-child(3){animation-delay:.12s}
.kart.secili::after{content:"✓";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;color:var(--teal)}
.soruust em{background:var(--teal-a);border-radius:999px;padding:3px 12px;font-size:13.5px;animation:belir .35s ease backwards}
.soruust em:empty{display:none}
.cubuk{overflow:visible}
.cubuk i{position:relative;min-width:10px}
.cubuk i::after{content:"";position:absolute;right:-8px;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--teal)}
.klavye{display:none;font-size:13.5px;color:var(--muted);margin-top:14px}
@media (hover:hover) and (pointer:fine){.klavye{display:block}}
.hazir{max-width:420px;margin:0 auto;padding:64px 0 40px;text-align:center}
.h-don{position:relative;width:220px;height:220px;margin:0 auto 28px;animation:don 7s linear infinite}
.h-don:before{content:"";position:absolute;inset:26px;border:2px dashed #c5ddd8;border-radius:50%}
.h-don span{position:absolute;margin:-26px;animation:belir .4s ease backwards}
.h-don svg{display:block;animation:don 7s linear infinite reverse}
.hazir h1{font-size:26px;letter-spacing:-.02em}
.hazir p{color:var(--muted);margin-top:6px}
.sonuc .kahraman{animation:yuksel .5s ease backwards}
/* giriş: yol galerisi */
.g-baslik{font-size:22px;letter-spacing:-.015em;margin-top:36px}
.g-alt{color:var(--muted);font-size:16.5px;margin-top:4px}
.g-baslik+.adimlar{border-top:0;padding-top:12px;margin-bottom:0}
.galeri{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.g-kart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.g-kart img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:var(--a)}
.g-kart figcaption{padding:10px 12px 12px;border-top:4px solid var(--r)}
.g-kart b{display:block;font-size:17px;line-height:1.2}
.g-kart span{display:block;font-size:14px;color:var(--muted);line-height:1.3;margin-top:2px}
.icinde{list-style:none;padding:0;margin:14px 0 6px;display:grid;gap:8px}
.icinde li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.icinde i{flex:none;font-style:normal;font-weight:700;font-size:13px;color:var(--teal);background:var(--teal-a);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;margin-top:1px}

/* 4 — Öğrenme haritam */
function radar(h){
  const M = Math.max(9, h.say[h.sirali[0]]), cx = 170, cy = 158, R = 92;
  const nok = (i, d) => { const a = (-90 + 60 * i) * Math.PI / 180; return [cx + Math.cos(a) * R * d, cy + Math.sin(a) * R * d]; };
  const cokgen = d => T.map((t, i) => nok(i, typeof d === 'number' ? d : h.say[t] / M).map(v => v.toFixed(1)).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 340 316" role="img" aria-label="${kac(T.map(t => V.tipler[t].ad + ' ' + h.say[t] + ' ' + Y.kez).join(', '))}">
  ${[1/3, 2/3, 1].map(d => `<polygon points="${cokgen(d)}" fill="none" stroke="#d7e4e1" stroke-width="1.5"/>`).join('')}
  ${T.map((t, i) => { const [x, y] = nok(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3ecea" stroke-width="1.5"/>`; }).join('')}
  <polygon class="radar-alan" points="${cokgen()}" fill="rgba(8,124,118,.16)" stroke="#087c76" stroke-width="2.5" stroke-linejoin="round"/>
  ${T.map((t, i) => { const [x, y] = nok(i, h.say[t] / M), [vx, vy] = nok(i, 1), r = V.tipler[t];
    /* yüz, ad ve sayı köşenin dışında durur; veri noktasının üstünü kapatmaz */
    let fx, fy, tx, ty, yan;
    if (i === 0 || i === 3) { fx = cx - 34; fy = vy + (i === 0 ? -32 : 32); tx = cx - 14; ty = fy - 2; yan = 'start'; }
    else { const sag = i < 3; fx = vx + (sag ? 26 : -26); fy = vy + (i === 1 || i === 5 ? -24 : 2); tx = vx + (sag ? 12 : -12); ty = fy + 31; yan = sag ? 'start' : 'end'; }
    const F1 = v => v.toFixed(1);
    return `<circle cx="${F1(x)}" cy="${F1(y)}" r="6" fill="${r.renk}" stroke="#fff" stroke-width="2"/>
    <clipPath id="ryuz${i}"><circle cx="${F1(fx)}" cy="${F1(fy)}" r="14"/></clipPath><circle cx="${F1(fx)}" cy="${F1(fy)}" r="14" fill="#fff"/>
    <image href="${YUZ(t)}" x="${F1(fx - 14)}" y="${F1(fy - 14)}" width="28" height="28" clip-path="url(#ryuz${i})" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="${F1(fx)}" cy="${F1(fy)}" r="15" fill="none" stroke="${r.renk}" stroke-width="2"/>
    <text x="${F1(tx)}" y="${F1(ty)}" text-anchor="${yan}" font-size="13.5" font-weight="700" fill="#123c40">${kac(r.ad)}</text><text x="${F1(tx)}" y="${F1(ty + 15)}" text-anchor="${yan}" font-size="12" fill="#51696b">${h.say[t]} ${kac(Y.kez)}</text>`; }).join('')}
  </svg>`;
}
function pHarita(G, h){
  return `<p class="p-ust">${kac(B.h_ust)}</p><h2 class="p-baslik">${kac(B.h_baslik)}</h2><p class="p-giris">${kac(B.h_giris)}</p>
  ${radar(h)}
  ${V.anlar.map(a => `<div class="an"><b>${kac(BUYUK(a.ad))}</b>${a.tipler.map(t => `<div class="satir">${amblem(t, 28)}<span class="isim">${kac(V.tipler[t].ad)}</span><span class="noktalar">${('<i style="background:' + V.tipler[t].renk + '"></i>').repeat(h.say[t])}</span><span class="sayi">${h.say[t]} ${kac(Y.kez)}</span></div>`).join('')}</div>`).join('')}
  <p class="not">${kac(Y.hepsi_not)}</p><p class="not">${kac(B.h_alt)}</p>
  ${h.cok ? '' : `<h3 class="p-alt">${kac(Y.dene_baslik)}</h3><div class="dene" style="margin-top:10px"><p>${kac(Y.dene_on.replace('{ad}', V.tipler[h.az].ad))}</p><strong>${kac(V.tipler[h.az].dene)}</strong></div>`}`;
}
/* 5 — Ailene notlar */
function pAile(G, h, o){
  const A = V.aile, iki = h.sirali.slice(0, 2);
  return `<figure class="resim" style="margin:0 0 18px"><img src="gorsel/aile.jpg?v=3ce3f8c4" width="1200" height="800" loading="lazy" alt="Masada açık bir deftere birlikte bakan, gülümseyen anne ve oğlu"></figure>
  <p class="p-ust">${kac(B.y_ust)}</p><h2 class="p-baslik">${kac(G.ad ? B.y_baslik_adli.replace('{ad}', G.ad) : B.y_baslik)}</h2>
  <p class="p-giris">${kac(h.cok ? A.giris_cok : A.giris.replace('{A}', V.tipler[iki[0]].ad).replace('{B}', V.tipler[iki[1]].ad))}</p>
  ${iki.map(t => A.ipuclari[t]).concat([A.genel]).map(([b, m]) => `<div class="ic"><h3>${kac(b)}</h3><p style="margin-top:4px">${kac(m)}</p></div>`).join('')}
  <h3 class="p-alt">${kac(A.takvim_baslik)}</h3>
  <div class="gunler">${A.takvim.map(([g, b, m]) => `<div class="gun"><small>${kac(g)}</small><b>${kac(b)}</b><p>${kac(m)}</p></div>`).join('')}</div>
  <p class="not">${kac(A.guvenli)}</p>
  <h3 class="p-alt">${kac(A.tacev_baslik)}</h3>
  ${A.tacev.map(([e, m, d, u]) => `<div class="tanit"><small>${kac(e)}</small><p>${kac(m)}</p><a href="${kac(u)}" target="_blank" rel="noopener">${kac(d)} →</a></div>`).join('')}
  <p class="not">${kac(A.tacev_not)}</p>
  ${yetiskin()}`;
}
function sonuc(){
  const G = ORN || D, h = hesap(G.c), o = ozet(h), [a, b] = h.sirali;
  const dahi = ad => 'aıou'.includes([...ad.toLocaleLowerCase('tr')].filter(c => 'aeıioöuü'.includes(c)).pop()) ? 'da' : 'de';
  const es = h.esit ? h.sirali.slice(2).filter(t => h.say[t] === h.say[b]).map(t => V.tipler[t].ad) : [];
  const esit = es.length ? (es.length > 1 ? Y.esit_cok : Y.esit).replace('{de}', dahi(es[es.length - 1])).replace('{ucuncu}', es.length > 1 ? es.slice(0, -1).join(', ') + ' ve ' + es[es.length - 1] : es[0]).replace('{ikinci}', V.tipler[b].ad) : '';
  const ozetMetin = h.cok ? o.metin : B.kahraman_ozet.replace('{a}', h.say[a]).replace('{A}', V.tipler[a].ad).replace('{b}', h.say[b]).replace('{B}', V.tipler[b].ad) + ' ' + o.metin;
  const sinif = (Y.siniflar.find(x => x[0] === G.form) || [])[1] || '';
  const paneller = [pNotlar, pDenemeler, pAtlas, pHarita, pAile];
  ciz(`<div class="sonuc">
    ${ORN ? `<div class="ornekkutu">${kac(B.ornek_kutu)}<button class="buyuk" id="ornekdon">${kac(B.ornek_don)}</button></div>` : ''}
    <section class="kahraman" id="skart">
      <div class="k-serit${h.cok ? ' k-hepsi' : ''}" style="grid-template-columns:repeat(${h.cok ? 1 : o.tipler.length},1fr)">${h.cok ? `<img src="gorsel/hero.jpg?v=3ce3f8c4" width="1200" height="800" alt="Yan yana duran altı sevimli robot: Dedektif, Mimar, Haritacı, Gözcü, Tamirci ve Bilge">` : o.tipler.map(t => `<figure style="--r:${V.tipler[t].renk}">${tipResim(t, '', false)}<figcaption>${kac(V.tipler[t].ad)}</figcaption></figure>`).join('')}</div>
      <div class="pariltilar" aria-hidden="true">${Array.from({length: 8}, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>
      <p class="k-ust">${kac(ORN ? B.kahraman_ust_ornek : B.kahraman_ust)}</p>
      <p class="k-on">${kac(G.ad ? B.kahraman_on_adli.replace('{ad}', G.ad) : B.kahraman_on)}</p>
      <h1 class="tarzad">${kac(o.ad)}</h1>
      <p class="birlikte">${kac(ozetMetin)}</p>
      ${esit ? `<p class="esit">${kac(esit)}</p>` : ''}
      <div class="rozetler"><span>${kac(sinif)}</span><span>${kac(h.cok ? B.rozet_cok : B.rozet_iki)}</span><span>${kac(B.rozet_bolum)}</span></div>
      <div class="dugmeler hizli"><button class="buyuk" id="paylasHizli">Kartımı paylaş</button><button class="buyuk ikincil" data-git="1">Bir deneme seç</button></div>
      <p class="durumyazi durumust" id="durumust" role="status"></p>
      <button class="veli-bag" data-git="4">Veliye notlar</button>
    </section>
    <p class="k-alt">${kac(B.kahraman_alt)}</p>
    <div class="sekmeler" role="group" aria-label="Rehber bölümleri">${B.sekmeler.map((x, i) => `<button class="sekme" data-s="${i}" aria-pressed="${i === G.sekme}">${kac(x)}</button>`).join('')}</div>
    ${paneller.map((f, i) => `<section class="panel${i === G.sekme ? ' acik' : ''}" data-p="${i}" aria-label="${kac(B.sekmeler[i])}">${f(G, h, o)}</section>`).join('')}
    <section class="ozel">
      <h2>${kac(B.k_baslik)}</h2><p>${kac(B.k_metin)}</p>
      <button class="buyuk ikincil beyaz" id="yazdir">${kac(B.k_yazdir)}</button>
      <div class="dugmeler"><button class="buyuk ikincil beyaz" id="kaydet">${kac(Y.kaydet)}</button><button class="buyuk ikincil beyaz" id="paylas">${kac(Y.paylas)}</button></div>
      <p class="durumyazi" id="durumyazi" role="status"></p>
      <a class="buyuk" href="${kac(V.tacev)}" target="_blank" rel="noopener">${kac(B.k_tacev)} →</a>
      <div class="baglar"><a href="${kac(Y.kardes_adres)}">${kac(Y.kardes_ad)}</a><button id="kaynak">${kac(B.k_kaynak)}</button><button id="bastan">${kac(Y.bastan)}</button></div>
    </section>
    ${dip()}
  </div>`, '.tarzad');
  const sekmeAc = (i, kaydir) => { G.sekme = i; sakla();
    document.querySelectorAll('.sekme').forEach(x => x.setAttribute('aria-pressed', +x.dataset.s === i));
    document.querySelectorAll('.panel').forEach(x => x.classList.toggle('acik', +x.dataset.p === i));
    if (kaydir) { const y = $('.sekmeler').getBoundingClientRect().top + window.scrollY - 8; window.scrollTo(0, y); const b = $('.panel.acik .p-baslik'); if (b) { b.setAttribute('tabindex', '-1'); b.focus({preventScroll:true}); } } };
  /* gizli bölümlerdeki resimler de hemen yüklensin: yazdırınca boş çıkmasın */
  document.querySelectorAll('.panel img').forEach(x => { x.loading = 'eager'; });
  document.querySelectorAll('.sekme').forEach(x => x.onclick = () => sekmeAc(+x.dataset.s, false));
  document.querySelectorAll('[data-git]').forEach(x => x.onclick = () => sekmeAc(+x.dataset.git, true));
  const denemeBagla = () => {
    document.querySelectorAll('.d-lab select').forEach(x => x.onchange = () => { G.dn[x.dataset.t] = +x.value; sakla(); denemeYenile(x.dataset.t, 'select'); });
    document.querySelectorAll('.d-sec').forEach(x => x.onclick = () => { G.bas = G.bas === x.dataset.t ? null : x.dataset.t; sakla(); denemeYenile(x.dataset.t, '.d-sec'); });
  };
  const denemeYenile = (t, odak) => { $('#denemeler').innerHTML = h.sirali.slice(0, 2).map(u => denemeKart(G, u)).join(''); denemeBagla(); const e = $(`.deneme[data-t="${t}"] ${odak}`); if (e) e.focus({preventScroll:true}); };
  denemeBagla();
  $('#bastan').onclick = () => { sil(); giris(true); };
  const od = $('#ornekdon'); if (od) od.onclick = () => { ORN = null; giris(true); };
  $('#kaydet').onclick = () => kartIndir(o);
  $('#paylasHizli').onclick = $('#paylas').onclick = () => kartPaylas(o);
  $('#yazdir').onclick = () => window.print();
  $('#kaynak').onclick = () => { sekmeAc(4, false); yontemAc(); };
}
window.addEventListener('beforeprint', () => document.querySelectorAll('.panel details').forEach(d => { if (!d.open) { d.dataset.kapali = '1'; d.open = true; } }));
window.addEventListener('afterprint', () => document.querySelectorAll('.panel details[data-kapali]').forEach(d => { d.open = false; delete d.dataset.kapali; }));

/* ---------- paylaşım kartı (1080×1350 PNG) ---------- */
function resim(svg){ return new Promise((ok, hata) => { const im = new Image(); im.onload = () => ok(im); im.onerror = hata; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }); }
function satirla(ctx, metin, en){ const ks = metin.split(' '), out = []; let s = '';
  ks.forEach(k => { const d = s ? s + ' ' + k : k; if (ctx.measureText(d).width > en && s) { out.push(s); s = k; } else s = d; }); if (s) out.push(s); return out; }
function yukleResim(src){ return new Promise((ok, hata) => { const im = new Image(); im.onload = () => ok(im); im.onerror = hata; im.src = src; }); }
async function kartCiz(o, resimsiz){
  try{ await Promise.all([400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 42px Nunito`))); await document.fonts.ready; }catch(e){}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), F = (a, b) => `${a} ${b}px Nunito, system-ui, sans-serif`;
  const ts = o.tipler, cok = ts.length === 6;
  x.fillStyle = V.tipler[ts[0]].acik; x.fillRect(0, 0, W, H);
  x.fillStyle = V.tipler[cok ? 'BAK' : ts[1]].acik;
  x.beginPath(); x.moveTo(W, 0); x.lineTo(W, H); x.lineTo(0, H); x.closePath(); x.fill();
  x.fillStyle = '#fff'; x.beginPath();
  x.roundRect ? x.roundRect(48, 48, W - 96, H - 96, 56) : x.rect(48, 48, W - 96, H - 96); x.fill();
  x.textAlign = 'center'; x.fillStyle = '#51696b'; x.font = F(800, 36); x.fillText(Y.marka + ' · TACEV', W / 2, 135);
  x.fillStyle = '#08736d'; x.font = F(900, cok ? 33 : 38); x.fillText(cok ? Y.kart_ust_cok : Y.kart_ust, W / 2, 205);
  if (!resimsiz) {
    try{
      if (cok) {
        const im = await yukleResim('gorsel/hero.jpg?v=3ce3f8c4'), gw = 630, gh = gw * im.naturalHeight / im.naturalWidth, gx = (W - gw) / 2, gy = 250;
        x.save(); x.beginPath(); x.roundRect ? x.roundRect(gx, gy, gw, gh, 40) : x.rect(gx, gy, gw, gh); x.clip(); x.drawImage(im, gx, gy, gw, gh); x.restore();
      } else {
        const ims = await Promise.all(ts.map(t => yukleResim(RES(t))));
        ims.forEach((im, i) => {
          const cx = i ? 750 : 330, cy = 465, r = 180;
          x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip(); x.drawImage(im, cx - r, cy - r, r * 2, r * 2); x.restore();
          x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.lineWidth = 12; x.strokeStyle = V.tipler[ts[i]].renk; x.stroke();
        });
        x.fillStyle = '#51696b'; x.font = F(800, 48); x.fillText('+', 540, 482);
      }
      x.getImageData(0, 0, 1, 1);
    }catch(e){ return kartCiz(o, true); }
  } else {
    const boy = cok ? 124 : 320, bos = cok ? 20 : 100, top = boy * ts.length + bos * (ts.length - 1);
    for (let i = 0; i < ts.length; i++) {
      const im = await resim(amblemSvg(ts[i], boy));
      x.drawImage(im, (W - top) / 2 + i * (boy + bos), cok ? 390 : 305, boy, boy);
    }
  }
  let p = 100; x.fillStyle = '#123c40'; x.font = F(900, p);
  while (x.measureText(o.ad).width > W - 180 && p > 48) { p -= 2; x.font = F(900, p); }
  x.fillText(o.ad, W / 2, 790);
  x.fillStyle = '#425f60'; x.font = F(600, 38);
  satirla(x, o.metin, W - 240).forEach((s, i) => x.fillText(s, W / 2, 867 + i * 52));
  x.fillStyle = '#123c40'; x.font = F(800, 43); x.fillText(Y.kart_soru, W / 2, 1132);
  x.fillStyle = '#08736d'; x.font = F(900, 46); x.fillText(V.adres, W / 2, 1210);
  x.fillStyle = '#51696b'; x.font = F(500, 26); x.fillText(Y.kart_dip, W / 2, 1260);
  return new Promise((ok, hata) => c.toBlob(b => b ? ok(b) : hata(new Error('Kart oluşturulamadı')), 'image/png'));
}
function yaz(m){ ['#durumyazi', '#durumust'].forEach(k => { const d = $(k); if (d) d.textContent = m; }); }
async function kartIndir(o){
  try{ const b = await kartCiz(o), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ogrenme-tarzim.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); yaz(Y.kaydedildi); }
  catch(e){ yaz(''); }
}
async function kartPaylas(o){
  const metin = Y.paylas_metin.replace('{ad}', o.ad), url = 'https://' + V.adres + '/?k=' + (o.tipler.length === 6 ? 'COK' : o.tipler.join('-'));
  try{
    const b = await kartCiz(o), f = new File([b], 'ogrenme-tarzim.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], text: metin + ' ' + url}); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{
    if (navigator.share) { await navigator.share({text: metin, url}); return; }
    await navigator.clipboard.writeText(metin + ' ' + url); yaz(Y.kopyalandi);
  }catch(e){ if (!e || e.name !== 'AbortError') yaz(url); }
}

$('#marka').textContent = Y.marka; $('#markaAlt').textContent = Y.marka_alt;
yukle();
if (D.form && D.c.length >= V.sorular.length) sonuc(); else giris();
</script>

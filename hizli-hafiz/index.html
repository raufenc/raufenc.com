<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- maximum-scale/user-scalable KALDIRILDI: yakınlaştırma engeli WCAG 1.4.4 ihlali;
     az gören öğrenci ipucunu ve kart üzerindeki minik sembolleri büyütebilmeli. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/hizli-hafiz/">
<title>Hızlı Hafız</title>
<style>
  :root{
    --krem:#f4ead2; --krem2:#efe0c0;
    --lacivert:#16233f; --lacivert2:#24365e;
    --altin:#c8a24b; --altin2:#e6bf5e;
    --kirmizi:#b8452f; --yesil:#3f7a4d;
    --metin:#2c2418; --metin2:#5c4d33;
    --golge:rgba(22,35,63,.18);
    --aktif:#1E6FBF;
    /* board yerleşimi */
    --cols:2; --rows:4; --ust:56px;
    --serit:clamp(56px,10vmin,110px);
    --bar-h:clamp(64px,12vh,104px);
    --pt:0px; --pr:0px; --pb:0px; --pl:0px;
  }
  @media(min-width:620px){ :root{ --cols:4; --rows:2; } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    color:var(--metin);
    background:radial-gradient(120% 90% at 50% -10%, #fbf4e2 0%, var(--krem) 45%, var(--krem2) 100%);
    min-height:100%; -webkit-user-select:none;user-select:none; overflow:hidden;
  }
  .gizli{display:none !important}
  kbd{font-family:inherit;background:#0d1730;color:#ffe9b0;border-radius:6px;padding:1px 8px;font-size:.9em;font-weight:700}

  /* ---------- GİRİŞ ---------- */
  #giris{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:6px}
  .logo{font-size:60px;line-height:1;filter:drop-shadow(0 3px 6px var(--golge))}
  h1{font-size:clamp(34px,9vw,58px);margin:.12em 0 0;letter-spacing:.02em;color:var(--lacivert);text-shadow:0 1px 0 #fff8,0 2px 10px var(--golge)}
  .altbaslik{color:var(--metin2);font-size:clamp(14px,3.6vw,18px);margin:0 0 4px;font-style:italic}
  .rozet{display:inline-block;background:var(--lacivert);color:var(--altin2);font-size:12px;padding:5px 12px;border-radius:999px;letter-spacing:.04em;margin-top:2px;box-shadow:0 2px 6px var(--golge)}
  .menu{display:flex;flex-direction:column;gap:12px;margin-top:24px;width:min(360px,86vw)}
  .btn{border:none;cursor:pointer;font-family:inherit;font-size:19px;font-weight:600;padding:15px 18px;border-radius:14px;color:#fff8ec;
    background:linear-gradient(180deg,var(--lacivert2),var(--lacivert));box-shadow:0 4px 0 #0d1730,0 6px 14px var(--golge);
    transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d1730,0 3px 8px var(--golge)}
  .btn.ikincil{background:linear-gradient(180deg,#fbf1d8,#eddcb4);color:var(--lacivert);box-shadow:0 4px 0 #c9b585,0 6px 14px var(--golge)}
  .btn .k{font-size:22px}
  #giris-durum{margin-top:16px;font-size:12px;color:var(--metin2);opacity:.8}

  /* ---------- OYUN ---------- */
  #oyun{min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(var(--pt) + env(safe-area-inset-top)) calc(var(--pr) + env(safe-area-inset-right)) calc(var(--pb) + env(safe-area-inset-bottom)) calc(var(--pl) + env(safe-area-inset-left))}
  .ust{display:flex;align-items:center;gap:10px;height:var(--ust);padding:6px 8px 0}
  .ikon-btn{border:none;background:#fff6df;color:var(--lacivert);width:40px;height:40px;border-radius:11px;font-size:19px;cursor:pointer;box-shadow:0 2px 0 #c9b585,0 3px 8px var(--golge);flex:0 0 auto}
  .ikon-btn:active{transform:translateY(2px)}
  .ilerleme{flex:1;display:flex;flex-wrap:nowrap;gap:3px;justify-content:center;align-items:center;overflow:hidden}
  .harf{width:22px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:#e7d7b0;color:#b6a680;box-shadow:inset 0 0 0 1px #d8c69a;flex:0 0 auto}
  .harf.dolu{background:linear-gradient(180deg,var(--altin2),var(--altin));color:var(--lacivert);box-shadow:0 2px 5px var(--golge)}
  .harf.bosluk{width:8px;background:transparent;box-shadow:none}
  @media(max-width:430px){ .ilerleme{gap:2px} .harf{width:18px;height:24px;font-size:13px} .harf.bosluk{width:5px} }
  .sayac{font-variant-numeric:tabular-nums;font-weight:700;color:var(--lacivert);min-width:52px;text-align:right;font-size:15px}

  /* İpucu — sabit panel (solo) */
  .ipucu{flex:0 0 auto;max-height:min(32dvh,190px);overflow:auto;overscroll-behavior:contain;
    background:linear-gradient(180deg,#fff7e4,#f3e6c6);border:2px solid var(--altin);border-radius:16px;
    padding:12px 16px;margin:6px auto 8px;max-width:680px;width:100%;box-shadow:0 3px 10px var(--golge),inset 0 0 0 1px #fff7;position:relative}
  .ipucu .et{position:absolute;top:-11px;left:14px;background:var(--lacivert);color:var(--altin2);font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:999px}
  .ipucu p{margin:4px 0 0;font-size:clamp(15px,3.4vw,19px);line-height:1.45;color:var(--metin)}

  /* Tahta — ekranı dolduran büyük board */
  .tahta-sar{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding:2px}
  .tahta{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(6px,1.4vmin,14px);
    aspect-ratio:calc(var(--cols)/var(--rows));
    /* -6px: .tahta-sar'ın dolgusu + yuvarlama payı (yoksa alt sıra 3px taşıyor) */
    width:min(100%, calc((var(--sarH, 60vh) - 6px) * var(--cols) / var(--rows)));
    max-width:1200px;margin:auto}
  .kart{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 3px 8px var(--golge);border:3px solid transparent;background:#e9dab6;transition:transform .1s,box-shadow .1s}
  .kart-ic{position:absolute;inset:0;transition:none} /* rotasyon KATMANI (transition yok) */
  .kart-ic img{width:100%;height:100%;object-fit:cover;display:block}
  .kart:active{transform:scale(.98)}
  .kart.yanlis{animation:salla .4s}
  .kart.dogru{border-color:var(--yesil);box-shadow:0 0 0 3px var(--yesil),0 4px 12px var(--golge)}
  .kart-ic .no{position:absolute;top:5px;left:6px;background:var(--lacivert);color:var(--altin2);font-size:11px;padding:1px 7px;border-radius:999px;opacity:.85;z-index:1}
  @keyframes salla{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .tahta.hepsi .nokta{display:block}
  .nokta{display:none;position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:none;cursor:pointer}

  /* Çok-oyunculu: board söz-hakkı çerçevesi */
  body.soz .tahta{box-shadow:0 0 0 5px var(--aktif),0 0 34px 6px var(--aktif)}
  body.soz .tahta{border-radius:16px}
  body.cok .ust{display:none}
  .yuzen{position:fixed;z-index:45;top:calc(env(safe-area-inset-top) + 8px)}
  .yuzen.sol{left:calc(env(safe-area-inset-left) + 8px)}
  .yuzen.sag{right:calc(env(safe-area-inset-right) + 8px)}
  body:not(.cok) .yuzen{display:none}

  /* Kenar buzz şeritleri */
  #kenarlar{position:fixed;inset:0;z-index:30;pointer-events:none}
  .kenar{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    background:var(--bar);color:#fff8ec;box-shadow:inset 0 0 0 2px #ffffff33,0 0 16px var(--bar);cursor:pointer;
    transition:filter .12s,opacity .12s,box-shadow .12s;-webkit-user-select:none}
  .kenar.alt{left:0;right:0;bottom:0;height:var(--serit)}
  .kenar.tepe{left:0;right:0;top:0;height:var(--serit)}
  .kenar.sol{top:0;bottom:0;left:0;width:var(--serit)}
  .kenar.sag{top:0;bottom:0;right:0;width:var(--serit)}
  .kenar .rot{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.06em;font-size:clamp(15px,2.6vmin,22px)}
  .kenar.tepe .rot{transform:rotate(180deg)}
  .kenar.sol .rot{transform:rotate(90deg)}
  .kenar.sag .rot{transform:rotate(-90deg)}
  .kenar .skor{font-variant-numeric:tabular-nums;background:#0004;border-radius:999px;padding:1px 10px}
  .kenar .tus{background:#fff;color:#16233f;border-radius:6px;padding:1px 9px;font-size:.85em;font-weight:800}
  @keyframes nabiz{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
  .kenar.hazir{animation:nabiz 1.15s infinite}
  .kenar.aktif{filter:brightness(1.2);box-shadow:inset 0 0 0 3px #fff,0 0 26px 5px var(--bar)}
  .kenar.pasif{opacity:.32;filter:grayscale(.7)}
  body.soz .kenar:not(.aktif){pointer-events:none}
  /* çok-oyunculu: board'u kenar şeritlerinden içeri çek */
  body.cok{--ust:0px}
  body.k2{--pt:var(--serit);--pb:var(--serit)}
  body.k3{--pt:52px;--pb:var(--serit);--pl:var(--serit);--pr:var(--serit)}
  body.k4{--pt:var(--serit);--pb:var(--serit);--pl:var(--serit);--pr:var(--serit)}
  /* KARŞIDAN (bilgisayar/akıllı tahta) modu: hiç döndürme, altta düz buzz bar */
  body[data-mod="karsi"] .kart-ic{transform:none !important}
  body[data-mod="karsi"] #kenarlar{display:none}
  body[data-mod="karsi"] .ip-ters{display:none !important}
  body[data-mod="karsi"] #geri span{transform:none !important}
  body[data-mod="karsi"].cok{--pt:48px;--pr:0px;--pl:0px;--pb:var(--bar-h)}
  #buzzbar{display:none;position:fixed;inset:auto 0 0 0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:40}
  body[data-mod="karsi"].cok #buzzbar{display:flex}
  #buzzbar .bz{flex:1;border:0;color:#fff8ec;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5em;font-size:clamp(14px,3.2vw,20px);box-shadow:inset 0 0 0 2px #ffffff33;touch-action:none;-webkit-user-select:none}
  #buzzbar .bz .tus{background:#fff;color:#16233f;border-radius:6px;padding:1px 9px;font-size:.8em}
  #buzzbar .bz .skor{font-variant-numeric:tabular-nums;background:#0004;border-radius:999px;padding:1px 9px;font-size:.85em}
  #buzzbar .bz.aktif{filter:brightness(1.2);box-shadow:inset 0 0 0 3px #fff}
  #buzzbar .bz.pasif{opacity:.32;filter:grayscale(.7)}
  #buzzbar .bz.hazir{animation:nabiz 1.15s infinite}
  body[data-mod="karsi"].soz #buzzbar .bz:not(.aktif){pointer-events:none}

  /* Geri sayım (2sn) */
  #geri{position:fixed;inset:0;z-index:44;display:none;align-items:center;justify-content:center;pointer-events:none}
  #geri span{font-size:clamp(90px,26vmin,220px);font-weight:800;color:var(--aktif);text-shadow:0 4px 24px #0007,0 0 40px var(--aktif);opacity:.9;animation:gpop .3s}
  @keyframes gpop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:.9}}

  /* İpucu pop-up (çok-oyunculu + solo seçenek) */
  #ipucu-pop{position:fixed;inset:0;z-index:35;display:none;pointer-events:none}
  #ipucu-pop.acik{display:block}
  .ip-kutu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;
    max-width:min(620px,88vw);background:linear-gradient(180deg,#fff7e4,#f3e6c6);
    border:2px solid var(--altin);border-radius:18px;padding:16px 22px;box-shadow:0 10px 34px var(--golge);
    transition:top .5s cubic-bezier(.34,1.1,.5,1),transform .5s cubic-bezier(.34,1.1,.5,1),max-width .45s,padding .45s,border-radius .45s;
    animation:ac .18s}
  .ip-kutu .et{position:absolute;top:-11px;left:16px;background:var(--lacivert);color:var(--altin2);font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;transition:opacity .3s}
  .ip-kutu p{margin:6px 0 0;font-size:clamp(17px,3.6vw,25px);line-height:1.5;color:var(--metin);text-align:center;transition:font-size .45s}
  /* KÜÇÜLÜP YUKARI DOCK — kaybolmaz, tur boyu kalır */
  /* Dock: üst barın ALTINA insin ve dokunuşu YUTMASIN (pointer-events:none).
     Eskiden üst barı tamamen, ilk kart sırasını 28px örtüyordu; elementFromPoint
     tahta üzerinde .ip-kutu döndürüyordu → çocuğun dokunuşu tepkisiz kalıyordu.
     11,5px punto da okunmuyordu. */
  #ipucu-pop.mini{pointer-events:none}
  #ipucu-pop.mini .ip-kutu{pointer-events:none;
    top:calc(var(--ust) + var(--pt,0px) + env(safe-area-inset-top) + 6px);transform:translate(-50%,0);
    max-width:min(760px,95vw);padding:6px 16px 7px;border-radius:0 0 14px 14px;
    box-shadow:0 6px 14px var(--golge)}
  #ipucu-pop.mini .ip-kutu p{font-size:clamp(13px,2.7vw,17px);line-height:1.35;margin:0;
    max-width:60ch;margin-inline:auto;overflow-wrap:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #ipucu-pop.mini .ip-kutu .et{opacity:0}
  .ip-ters{position:fixed;top:calc(var(--serit) + 8px);left:50%;transform:translateX(-50%) rotate(180deg);z-index:35;
    pointer-events:none;max-width:min(560px,84vw);background:linear-gradient(180deg,#fff7e4,#f3e6c6);border:2px solid var(--altin);
    border-radius:16px;padding:10px 18px;box-shadow:0 6px 20px var(--golge);display:none}
  body[data-mod="etraf"].cok.k2 #ipucu-pop.acik:not(.mini) ~ .ip-ters{display:block}
  .ip-ters p{margin:0;font-size:clamp(15px,3vw,21px);line-height:1.4;color:var(--metin);text-align:center}

  /* MODALLAR */
  .perde{position:fixed;inset:0;background:rgba(22,35,63,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal{background:linear-gradient(180deg,#fff8e8,#f1e3c2);border:3px solid var(--altin);border-radius:20px;padding:24px;max-width:440px;width:100%;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.4)}
  .modal.renkli{border-color:var(--aktif);box-shadow:0 0 0 4px var(--aktif),0 16px 50px rgba(0,0,0,.4)}
  .modal h2{margin:.1em 0 .3em;color:var(--lacivert);font-size:26px}
  .modal .ad{font-size:30px;font-weight:700;color:var(--kirmizi);margin:.1em 0}
  .modal .ayet{display:inline-block;margin-top:10px;background:var(--lacivert);color:var(--altin2);text-decoration:none;padding:6px 14px;border-radius:999px;font-size:14px}
  .modal p{color:var(--metin2);line-height:1.5;font-size:15px}
  .modal .btn{margin-top:18px}
  .nasil{text-align:left;padding-left:20px;color:var(--metin);font-size:15px}
  .nasil li{margin:.5em 0;line-height:1.5}
  .kisiler{display:flex;gap:12px;justify-content:center;margin-top:8px}
  .kisiler button{flex:1;border:2px solid var(--altin);background:#fff6df;color:var(--lacivert);border-radius:14px;padding:18px 0;font-family:inherit;font-size:26px;font-weight:800;cursor:pointer}
  .kisiler button:active{transform:translateY(2px)}
  .kisiler button small{display:block;font-size:12px;font-weight:600;margin-top:2px}
  .ayar-sat{text-align:left;margin:14px 0}
  .ayar-sat>b{display:block;margin-bottom:6px}
  .sec{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:2px solid var(--altin);background:#fff6df;color:var(--lacivert);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;cursor:pointer;flex:1;min-width:80px}
  .chip.aktif{background:var(--lacivert);color:var(--altin2);border-color:var(--lacivert)}
  .not-kucuk{font-size:12px;color:var(--metin2);opacity:.85;margin-top:4px}
  .tus-sat{display:flex;align-items:center;gap:10px;margin:7px 0}
  .tus-nokta{width:16px;height:16px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #fff6}
  .tus-sat .rozet{margin-left:auto;background:#0d1730;color:#ffe9b0;border-radius:8px;padding:4px 12px;font-weight:800;min-width:44px;text-align:center}
  .tus-sat .deg{border:2px solid var(--altin);background:#fff6df;color:var(--lacivert);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:13px;cursor:pointer}
  .tus-sat.bekliyor .rozet{background:var(--kirmizi);animation:nabiz 1s infinite}

  /* ============================================================
     PREMIUM + ERİŞİLEBİLİRLİK KATMANI (sonda: bilinçli ezer)
     ============================================================ */

  /* 1) Yakınlaşma ekranı: sütun düzeni → ipucu üstte OKUNUR, kapat altta (çakışma yok). */
  #yakin{flex-direction:column;gap:clamp(8px,1.6vh,14px)}
  .yk-ipucu{max-width:min(680px,92vw);background:linear-gradient(180deg,#fff7e4,#f3e6c6);
    border:2px solid var(--altin);border-radius:14px;padding:9px 16px;flex:0 0 auto;
    font-size:clamp(13px,2.5vw,17px);line-height:1.35;color:var(--metin);text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .yk-kart{position:relative;flex:0 1 auto;width:min(94vw,min(560px,68vh));aspect-ratio:1;
    border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .yk-kapat{flex:0 0 auto;background:#fff6df;color:var(--lacivert);border:none;border-radius:999px;
    padding:11px 22px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;
    min-height:44px;box-shadow:0 3px 10px rgba(0,0,0,.35)}

  /* 2) Zemin: düz krem yerine ince tezhip dokusu + sıcak vinyet (kartların diliyle uyumlu). */
  body{
    background:
      radial-gradient(ellipse 78% 62% at 50% 45%, transparent 55%, rgba(120,95,45,.13) 100%),
      repeating-conic-gradient(from 45deg at 50% 50%,
        rgba(160,125,60,.030) 0deg 15deg, transparent 15deg 30deg),
      radial-gradient(120% 90% at 50% -10%, #fbf4e2 0%, var(--krem) 45%, var(--krem2) 100%);
    background-size:auto, 46px 46px, auto;
    background-attachment:fixed;
  }

  /* 3) İlerleme harfleri: 22x28 minik ve soluktu (kontrast ~1.4:1) → daha büyük, altın kitâbe. */
  .harf{width:clamp(24px,3.4vw,32px);height:clamp(30px,4.2vw,40px);font-size:clamp(15px,2.2vw,20px);
        color:#8a7647;background:#ece0c0;box-shadow:inset 0 0 0 1px #cbb888}
  .harf.dolu{color:var(--lacivert);text-shadow:0 1px 0 rgba(255,255,255,.55);
             box-shadow:0 2px 6px var(--golge),inset 0 1px 0 rgba(255,255,255,.6)}
  @media(max-width:430px){ .harf{width:21px;height:27px;font-size:14px} }
  .sayac{font-size:clamp(15px,2vw,19px)}

  /* 4) Dokunma hedefi 40px < 44px (WCAG 2.5.5) → 44px. */
  .ikon-btn{width:44px;height:44px;font-size:20px}

  /* 5) Görünür odak halkası — klavyeyle oynanabilirlik. */
  .kart:focus-visible,.btn:focus-visible,.ikon-btn:focus-visible,.chip:focus-visible,
  .kisiler button:focus-visible,.yk-kapat:focus-visible,.yk-h:focus-visible,.nokta:focus-visible{
    outline:3px solid var(--aktif);outline-offset:3px;border-radius:12px;
  }

  /* 5c) Modallar (özellikle Ayarlar) alçak ekranda TAŞIYORDU: .perde ortalıyor ve
         taşan kısım kırpılıyordu → başlık ve "Kaydet" erişilemiyordu. Artık kaydırılır. */
  .perde{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .perde>.modal{margin:auto}

  /* 5b) Giriş ekranı alçak/yatay ekranda TAŞIYOR ve "Nasıl Oynanır"/"Ayarlar"
         tıklanamıyordu (body overflow:hidden + flex ortalama = üst taraf kırpılır,
         kaydırılamaz). ::before/::after + margin:auto ortalamayı korur AMA taşınca
         düzgün kaydırılır. */
  #giris{max-height:100dvh;overflow-y:auto;justify-content:flex-start;
         -webkit-overflow-scrolling:touch}
  #giris::before,#giris::after{content:"";margin:auto;flex:0 0 0}
  #giris>*{flex-shrink:0}
  @media (max-height:560px){
    .logo-ik{width:46px;height:46px}
    #giris h1{font-size:clamp(26px,6vw,36px)}
    .altbaslik{font-size:13px;margin-bottom:2px}
    .menu{margin-top:12px;gap:8px}
    .btn{font-size:16px;padding:11px 16px}
    #giris-durum{margin-top:8px}
  }
  /* Yatay telefon (geniş ama alçak): menü iki sütun → 4 düğme de ekrana sığar. */
  @media (max-height:520px) and (min-width:600px){
    .menu{display:grid;grid-template-columns:1fr 1fr;width:min(620px,92vw)}
  }

  /* 6b) Satır içi SVG ikonlar — emoji yerine, currentColor ile paletten beslenir. */
  .ik{width:1em;height:1em;display:block;fill:none;stroke:currentColor;
      stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .logo{font-size:0;display:flex;justify-content:center;filter:none}
  .logo-ik{width:clamp(58px,13vw,76px);height:clamp(58px,13vw,76px);
           stroke-width:1.25;color:var(--altin);filter:drop-shadow(0 3px 9px var(--golge))}
  .btn .k{display:flex;align-items:center;font-size:0}
  .btn .k .ik{width:23px;height:23px}
  .ikon-btn .ik{width:21px;height:21px;margin:0 auto}
  .ik-h2{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.14em;stroke-width:1.6}

  /* 6) Hareket duyarlılığı: 'salla'/'nabiz'/'gpop' dâhil tüm hareket kısılsın. */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important;
    }
  }
</style>
</head>
<body>

<!-- ===== İKON SETİ (satır içi SVG — emoji yerine) =====
     Emoji her cihazda farklı çiziliyor ve ürünü ucuzlatıyordu; bunlar
     currentColor ile paletten beslenen, tutarlı çizgi ağırlıklı ikonlar. -->

      <path d="M12 2.6v2.8M12 18.6v2.8M21.4 12h-2.8M5.4 12H2.6M18.6 5.4l-2 2M7.4 16.6l-2 2M18.6 18.6l-2-2M7.4 7.4l-2-2"/>

<!-- GİRİŞ -->
<section id="giris">
  <div class="logo"><svg class="ik logo-ik"><use href="#ik-gul"/></svg></div>
  <h1>Hızlı Hafız</h1>

  <div class="menu">
    <button class="btn" onclick="Oyun.basla('tek')"><span class="k"><svg class="ik"><use href="#ik-tek"/></svg></span> Tek Kişi</button>
    <button class="btn" onclick="Ekran.arkadas()"><span class="k"><svg class="ik"><use href="#ik-iki"/></svg></span> Arkadaşlarla Oyna</button>
    <button class="btn ikincil" onclick="Ekran.nasil()"><span class="k"><svg class="ik"><use href="#ik-kitap"/></svg></span> Nasıl Oynanır</button>
    <button class="btn ikincil" onclick="Ekran.ayar()"><span class="k"><svg class="ik"><use href="#ik-ayar"/></svg></span> Ayarlar</button>
  </div>

</section>

<!-- OYUN -->
<section id="oyun" class="gizli">
  <div class="ust">
    <button class="ikon-btn" onclick="Oyun.cik()" title="Ana menü" aria-label="Ana menü"><svg class="ik"><use href="#ik-ev"/></svg></button>
    <div class="ilerleme" id="ilerleme"></div>
    <div class="sayac" id="sayac">0:00</div>
  </div>
  <div class="ipucu" id="ipucu-panel">

    <p id="ipucu-metin">…</p>

  </div>

<!-- Çok-oyunculu yüzen düğmeler -->

<button class="yuzen sag ikon-btn" onclick="Oyun.ipucuTekrar()" title="İpucu" aria-label="İpucunu tekrar göster"><svg class="ik"><use href="#ik-ampul"/></svg></button>

<!-- Kenar buzz şeritleri (tablet) + alt buzz bar (karşıdan) -->
<div id="kenarlar"></div>
<div id="buzzbar"></div>

<!-- Geri sayım -->
<div id="geri"><span></span></div>

<!-- İpucu pop-up -->
<div id="ipucu-pop"><div class="ip-kutu"><span class="et">BİLGİ KARTI</span><p id="ip-pop-metin"></p></div></div>
<div class="ip-ters"><p id="ip-ters-metin"></p></div>

<!-- MODAL -->
<div id="perde" class="perde gizli"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const HEDEF_KELIME="HIZLI HAFIZ";
const RENKLER=['#1E6FBF','#D6337E','#17A0A8','#7A3FB0'];
const VAR_TUSLAR=['KeyA','KeyL','KeyG','KeyH'];
const KENAR_HARITA={2:['alt','tepe'],3:['alt','sol','sag'],4:['alt','tepe','sol','sag']};
const ROT={alt:0, tepe:180, sol:90, sag:-90};
const PRIO={alt:0, tepe:1, sol:2, sag:3};
function edgeDist(e,cx,cy){ return e==='alt'?1-cy : e==='tepe'?cy : e==='sol'?cx : 1-cx; }
// Her kartı en yakın aktif kenara atar; rotasyon = o kenarın derecesi.
// 2 kişi→4/4, 3 kişi→3/3/2 (alt=2), 4 kişi→2/2/2/2 (determinist, özel-durum yok).
function kartAcisi(i, cols, rows, sayi){
  const r=Math.floor((i-1)/cols), c=(i-1)%cols;
  const cx=(c+0.5)/cols, cy=(r+0.5)/rows;
  const kenarlar=KENAR_HARITA[sayi]; let best=kenarlar[0], bestD=Infinity;
  for(const e of kenarlar){ const d=edgeDist(e,cx,cy);
    if(d<bestD-1e-9 || (Math.abs(d-bestD)<=1e-9 && PRIO[e]<PRIO[best])){ bestD=d; best=e; } }
  return ROT[best];
}
function izgara(){ return matchMedia('(min-width:620px)').matches ? {cols:4,rows:2} : {cols:2,rows:4}; }

function tusEtiket(code){
  if(!code) return '—';
  return code.replace(/^Key/,'').replace(/^Digit/,'').replace('Space','Boşluk').replace('Comma',',').replace('Period','.').replace('Semicolon',';').replace('Slash','/');
}

const Ekran={
  atama:null,
  // atama=null ŞART: "Değiştir"e basıp modalı kapatınca tuş-atama kipi takılı kalıyor,
  // sonraki TÜM klavye girdileri yutuluyordu (oyun klavyeyle oynanamaz hâle geliyordu).
  kapat(){ $('#perde').classList.add('gizli'); $('#perde').innerHTML=''; this.atama=null; },
  perde(html, renkli){
    const p=$('#perde'); p.classList.remove('gizli');
    p.innerHTML=`<div class="modal${renkli?' renkli':''}">${html}</div>`;
    p.onclick=e=>{ if(e.target===p) this.kapat(); };
  },
  nasil(){
    this.perde(`
      <h2>Nasıl Oynanır?</h2>
      <ol class="nasil">
        <li>Üstteki <b>bilgi kartını</b> oku — bir sembolü adını söylemeden tarif eder.</li>
        <li>Ekrandaki <b>8 kartın</b> içinde o sembolü bul.</li>
        <li>Sembolü içeren <b>karta dokun</b>.</li>
        <li><b>Tek kişi:</b> her doğru buluş HIZLI&nbsp;HAFIZ'dan bir harf. <b>Arkadaşlarla:</b> ipucu çıkınca <b>tuşuna bas / renkli kenarına dokun</b> — söz hakkı sende, 2 saniyede kartı seç! İlk 7 doğruya ulaşan kazanır.</li>
        <li>Doğru bulunca sembolün adı ve <b>âyet kaynağı</b> gösterilir.</li>
      </ol>
      <p class="not-kucuk">Tablet modunda kartların yönü sadece okuma kolaylığı içindir; kart sahipliği yoktur, herkes her kartı seçebilir.</p>
      <button class="btn" onclick="Ekran.kapat()">Anladım</button>`);
  },
  arkadas(){
    this.perde(`
      <h2><svg class="ik ik-h2"><use href="#ik-iki"/></svg> Arkadaşlarla Oyna</h2>
      <p class="not-kucuk">Aynı ekranda yarışın. Herkesin bir rengi ve bir tuşu / kenarı var.</p>
      <div class="kisiler">
        <button onclick="Ekran.kapat();Oyun.basla('cok',2)">2<small>kişi</small></button>
        <button onclick="Ekran.kapat();Oyun.basla('cok',3)">3<small>kişi</small></button>
        <button onclick="Ekran.kapat();Oyun.basla('cok',4)">4<small>kişi</small></button>
      </div>
      <div class="not-kucuk" style="margin-top:10px">Tuşları <b>Ayarlar</b>'dan değiştirebilirsin. Telefonda kenarlara dokunarak da oynanır.</div>`);
  },
  ayar(){
    const m=Oyun.mod, ip=Oyun.ipucuKip, ot=Oyun.oturma;
    const c=(cur,v,l,fn)=>`<button class="chip ${cur===v?'aktif':''}" onclick="${fn}('${v}')">${l}</button>`;
    let tusHtml='';
    Oyun.tuslar.forEach((code,i)=>{
      tusHtml+=`<div class="tus-sat" data-i="${i}">
        <span class="tus-nokta" style="background:${RENKLER[i]}"></span>
        <span>${i+1}. Oyuncu</span>
        <span class="rozet">${tusEtiket(code)}</span>
        <button class="deg" onclick="Ekran.tusAta(${i})">Değiştir</button></div>`;
    });
    this.perde(`
      <h2>Ayarlar</h2>
      <div class="ayar-sat">
        <b>Oturma düzeni (Arkadaşlarla Oyna)</b>
        <div class="sec">
          ${c(ot,'etraf','Etrafında (tablet/masa)','Oyun.oturmaAyarla')}
          ${c(ot,'karsi','Karşıdan (bilgisayar/akıllı tahta)','Oyun.oturmaAyarla')}
        </div>
        <div class="not-kucuk">Etrafında: herkes cihazın bir kenarında, kartların yönü adil dağılır. Karşıdan: herkes ekrana yan yana bakar, kartlar düz.</div>
      </div>
      <div class="ayar-sat">
        <b>İpucu gösterimi</b>
        <div class="sec">
          ${c(ip,'panel','Sabit panel','Oyun.ipucuAyarla')}
          ${c(ip,'popup','Pop-up','Oyun.ipucuAyarla')}
        </div>
      </div>
      <div class="ayar-sat">
        <b>Tek kişi — seçim şekli</b>
        <div class="sec">
          ${c(m,'iki','Kart → Sembol','Oyun.modAyarla')}
          ${c(m,'kart','Sadece kart','Oyun.modAyarla')}
          ${c(m,'sembol','Tüm semboller','Oyun.modAyarla')}
        </div>
      </div>
      <div class="ayar-sat">
        <b>Arkadaşlarla Oyna — tuşlar</b>
        ${tusHtml}
        <div class="not-kucuk">Kutucuğa tıkla, sonra atamak istediğin tuşa bas. (2 kişi: 1–2, 3 kişi: 1–3…)</div>
      </div>
      <button class="btn" onclick="Ekran.kapat()">Kaydet</button>`);
  },
  tusAta(i){
    this.atama=i;
    const p=$('#perde'); if(!p) return;
    const sat=p.querySelector(`.tus-sat[data-i="${i}"]`);
    if(sat){ sat.classList.add('bekliyor'); sat.querySelector('.rozet').textContent='bas…'; }
  },
  atamaTus(e){
    const i=this.atama;
    if(e.code==='Escape'){ this.atama=null; this.ayar(); return; }
    if(Oyun.tuslar.some((c,j)=>j!==i && c===e.code)){ this.atama=null; alert('Bu tuş başka oyuncuda kullanılıyor.'); this.ayar(); return; }
    Oyun.tuslar[i]=e.code; Oyun.tuslariKaydet(); this.atama=null; this.ayar();
  }
};

const Oyun={
  veri:null,
  mod:localStorage.getItem('hh:mod')||'iki',
  ipucuKip:localStorage.getItem('hh:ipucu')||'panel',
  oturma:localStorage.getItem('hh_oturma')||'etraf',
  tuslar:(()=>{ try{const t=JSON.parse(localStorage.getItem('hh:tuslar'));return Array.isArray(t)&&t.length===4?t:VAR_TUSLAR.slice();}catch(e){return VAR_TUSLAR.slice();} })(),
  havuz:[], sidHaritasi:{}, hedef:null, sonSid:null,
  // solo
  dogru:0, gereken:0, baslangic:0, sayacT:null, kilit:false, turBitti:false,
  // çok
  kip:'tek', sayi:2, oyuncular:[], sozHakki:null, durum:'bekle', pencereT:null, geriT:null, hedefSkor:7,

  async yukle(){
    try{
      const r=await fetch('icerik/katalog.json');
      // r.ok kontrolü ŞART: 404 HTML dönerse json() "Unexpected token '<'" diye
      // anlaşılmaz patlıyordu (slash'sız URL vakası). Net mesaj ver.
      if(!r.ok) throw new Error('katalog bulunamadı ('+r.status+')');
      this.veri=await r.json();
      this.veri.kartlar.forEach((k,ki)=>k.items.forEach(it=>{ (this.sidHaritasi[it.sid]=this.sidHaritasi[it.sid]||[]).push({ki,it}); }));
      this.havuz=Object.keys(this.veri.semboller).filter(sid=>{ const s=this.veri.semboller[sid]; return s.ben && s.ben.length>4 && this.sidHaritasi[sid]; });
      $('#giris-durum').textContent=`${this.veri.kartlar.length} kart · ${this.havuz.length} oynanır sembol hazır`;
      this.kartlariIsit();
    }catch(e){ $('#giris-durum').textContent='Katalog yüklenemedi: '+e.message; }
  },
  /* 8 kart görseli ~5 MB: menüdeyken SIRAYLA arka planda ısıt. Sıralı olması bilinçli —
     hepsini aynı anda istemek ilk tahta çizimini ve yakınlaşmayı geciktiriyordu. */
  kartlariIsit(){
    const liste=(this.veri&&this.veri.kartlar||[]).map(k=>k.gorsel).filter(Boolean);
    let i=0;
    const sonraki=()=>{
      if(i>=liste.length) return;
      const im=new Image(); im.decoding='async';
      im.onload=im.onerror=()=>{
        if(window.requestIdleCallback) requestIdleCallback(()=>sonraki(),{timeout:500});
        else setTimeout(sonraki,50);
      };
      im.src=liste[i++];
    };
    sonraki();
  },
  modAyarla(v){ this.mod=v; localStorage.setItem('hh:mod',v); Ekran.ayar(); },
  ipucuAyarla(v){ this.ipucuKip=v; localStorage.setItem('hh:ipucu',v); Ekran.ayar(); },
  oturmaAyarla(v){ this.oturma=v; localStorage.setItem('hh_oturma',v); document.body.dataset.mod=v;
    if(this.kip==='cok'){ this.cokKur(); this.tahtaCiz(); this.yeniTur(); } Ekran.ayar(); },
  tuslariKaydet(){ localStorage.setItem('hh:tuslar',JSON.stringify(this.tuslar)); },

  basla(kip,sayi){
    if(!this.veri){ alert('Katalog henüz yüklenmedi.'); return; }
    this.kip=kip; this.sayi=sayi||2; this.sonSid=null; this.durum='bekle'; this.sozHakki=null;
    document.body.classList.remove('cok','k2','k3','k4','soz');
    $('#giris').classList.add('gizli'); $('#oyun').classList.remove('gizli');
    if(kip==='cok'){ this.cokKur(); }
    else{ this.dogru=0; this.gereken=HEDEF_KELIME.replace(/\s/g,'').length; this.ilerlemeCiz();
      this.baslangic=Date.now(); clearInterval(this.sayacT); this.sayacT=setInterval(()=>this.sayacCiz(),250); this.sayacCiz();
      $('#ipucu-panel').classList.toggle('gizli', this.ipucuKip==='popup');
    }
    this.tahtaCiz(); this.yeniTur();
    this.olcSar();
  },

  /* Tahta sarmalayıcısının GERÇEK yüksekliğini --sarH'e yaz.
     ResizeObserver tek başına yetmiyor: gözlem başlarken #oyun display:none
     olduğu için Chrome ilk bildirimi hiç kuyruğa almıyordu → --sarH boş kalıyor,
     tahta 60vh yedeğine düşüp gereksiz dar kalıyordu (360px ekranda 192px). */
  olcSar(){
    var sar=document.querySelector('.tahta-sar'); if(!sar) return;
    var uygula=function(){
      var h=Math.floor(sar.getBoundingClientRect().height);   // yerleşimi senkron zorlar
      if(h>0) document.documentElement.style.setProperty('--sarH',h+'px');
    };
    uygula();                                                  // hemen ölç (rAF kısıtlıysa da çalışır)
    if(window.requestAnimationFrame) requestAnimationFrame(uygula);  // yerleşim oturunca tazele
  },
  cik(){
    clearInterval(this.sayacT); clearTimeout(this.pencereT); clearTimeout(this.geriT);
    this.yakinKapat(); Ekran.kapat(); $('#geri').style.display='none'; $('#ipucu-pop').classList.remove('acik','mini');
    document.body.classList.remove('cok','k2','k3','k4','soz');
    document.documentElement.style.removeProperty('--aktif');
    $('#kenarlar').innerHTML=''; $('#buzzbar').innerHTML='';
    // kip sıfırlanmalı: yoksa ana menüdeyken Ayarlar'dan oturma düzeni değiştirmek
    // hâlâ 'cok' sanıp ana menüyü çok-oyunculu arayüzle gömüyordu.
    this.kip='tek'; this.sozHakki=null; this.durum=null;
    $('#oyun').classList.add('gizli'); $('#giris').classList.remove('gizli');
  },

  /* ---------- SOLO yardımcıları ---------- */
  sayacCiz(){ const s=Math.floor((Date.now()-this.baslangic)/1000); $('#sayac').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },
  ilerlemeCiz(){
    const el=$('#ilerleme'); el.innerHTML=''; let d=0;
    for(const ch of HEDEF_KELIME){
      if(ch===' '){ el.insertAdjacentHTML('beforeend','<span class="harf bosluk"></span>'); continue; }
      const dolu=d<this.dogru; d++;
      el.insertAdjacentHTML('beforeend',`<span class="harf ${dolu?'dolu':''}">${ch}</span>`);
    }
  },

  /* ---------- ÇOK-OYUNCULU kurulum ---------- */
  cokKur(){
    document.body.classList.remove('k2','k3','k4');
    document.body.classList.add('cok','k'+this.sayi);
    document.body.dataset.mod=this.oturma;
    const kenarlar=KENAR_HARITA[this.sayi];
    this.oyuncular=[];
    for(let i=0;i<this.sayi;i++) this.oyuncular.push({id:i, renk:RENKLER[i], tus:this.tuslar[i], kenar:kenarlar[i], skor:0, turKilit:false});
    const kap=$('#kenarlar'), bb=$('#buzzbar'); kap.innerHTML=''; bb.innerHTML='';
    if(this.oturma==='karsi'){
      // Karşıdan: altta yatay buzz bar, soldan sağa P1..Pn, hepsi düz
      this.oyuncular.forEach(o=>{
        const b=document.createElement('div'); b.className='bz'; b.dataset.id=o.id; b.style.background=o.renk;
        b.innerHTML=`<b>${o.id+1}. Oyuncu</b> <span class="skor">0/${this.hedefSkor}</span> <span class="tus">${tusEtiket(o.tus)}</span>`;
        b.addEventListener('pointerdown', e=>{ e.preventDefault(); this.buzz(o.id); }, {passive:false});
        bb.appendChild(b);
      });
    }else{
      // Etrafında: kenar şeritleri, oturma yönüne dönük
      this.oyuncular.forEach(o=>{
        const d=document.createElement('div'); d.className='kenar '+o.kenar; d.style.setProperty('--bar',o.renk); d.dataset.id=o.id;
        d.innerHTML=`<span class="rot"><b>${o.id+1}. Oyuncu</b> <span class="skor">0/${this.hedefSkor}</span> <span class="tus">${tusEtiket(o.tus)}</span></span>`;
        d.addEventListener('pointerdown', e=>{ e.preventDefault(); this.buzz(o.id); }, {passive:false});
        kap.appendChild(d);
      });
    }
    $('#ipucu-panel').classList.add('gizli');
  },
  tahtaCiz(){
    const t=$('#tahta'); t.className='tahta'+(this.kip==='tek'&&this.mod==='sembol'?' hepsi':''); t.innerHTML='';
    this.veri.kartlar.forEach((k,ki)=>{
      const d=document.createElement('div'); d.className='kart'; d.dataset.ki=ki;
      // klavye erişimi: <div> kalıyor (rotasyon .kart-ic katmanı ve CSS buna bağlı),
      // ama düğme semantiği + Enter/Space ekleniyor.
      d.setAttribute('role','button'); d.tabIndex=0;
      d.setAttribute('aria-label',`Kart ${k.no}`);
      d.innerHTML=`<div class="kart-ic"><span class="no">${k.no}</span><img src="${k.gorsel}" alt="" decoding="async"></div>`;
      const ic=d.querySelector('.kart-ic');
      if(this.kip==='tek' && this.mod==='sembol'){
        // aynı sebeple büyükten küçüğe (küçük hedefler üstte kalsın)
        [...k.items].sort((a,b)=>(b.boy||20)-(a.boy||20)).forEach(it=>{
          const b=document.createElement('button'); b.className='nokta';
          b.style.left=it.x+'%'; b.style.top=it.y+'%'; const boy=(it.boy||20); b.style.width=boy+'%'; b.style.height=boy+'%'; b.style.zIndex=String(100-Math.round(boy));
          b.onclick=e=>{ e.stopPropagation(); this.secildi(it.sid,b,d); };
          ic.appendChild(b);
        });
      }else{
        d.onclick=()=>this.kartTikla(ki,d);
      }
      d.onkeydown=e=>{
        if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ e.preventDefault(); d.click(); }
      };
      t.appendChild(d);
    });
    this.yonleriUygula();
  },
  yonleriUygula(){
    const donebilir = (this.kip==='cok' && this.oturma==='etraf');
    const {cols,rows}=izgara();
    document.querySelectorAll('#tahta .kart').forEach((k,idx)=>{
      const ic=k.querySelector('.kart-ic'); if(!ic) return;
      const deg = donebilir ? kartAcisi(idx+1, cols, rows, this.sayi) : 0;
      ic.style.transform = deg ? `rotate(${deg}deg)` : 'none';
    });
  },

  yeniTur(){
    this.kilit=false; this.turBitti=false;   // yeni tur: cevap kilidi açılır
    let sid; do{ sid=this.havuz[Math.floor(Math.random()*this.havuz.length)]; }while(sid===this.sonSid && this.havuz.length>1);
    this.sonSid=sid; this.hedef=sid;
    const metin=this.veri.semboller[sid].ben;
    $('#ipucu-metin').textContent=metin;
    document.querySelectorAll('.kart').forEach(k=>k.classList.remove('dogru','yanlis'));
    if(this.kip==='cok'){
      this.durum='bekle'; this.sozHakki=null;
      this.oyuncular.forEach(o=>o.turKilit=false);
      document.body.classList.remove('soz'); document.documentElement.style.removeProperty('--aktif');
      this.stripGuncelle();
      this.ipucuPopGoster(metin);
    }else{
      if(this.ipucuKip==='popup') this.ipucuPopGoster(metin);
    }
  },

  /* ---------- İpucu pop-up ---------- */
  ipucuPopGoster(metin){
    $('#ip-pop-metin').textContent=metin; $('#ip-ters-metin').textContent=metin;
    const p=$('#ipucu-pop'); p.classList.add('acik'); p.classList.remove('mini');
    p.onclick=e=>{ if(e.target===p||e.target.closest('.ip-kutu')) this.ipucuKucult(); };
    clearTimeout(this._ipT);
    // merkezde kalma süresi cümle uzunluğuna göre (okumaya yetsin); buzz/dokunuş erken küçültür
    const sure=Math.min(7500, Math.max(2800, Math.round((metin||'').length*52)));
    this._ipT=setTimeout(()=>this.ipucuKucult(), sure);
  },
  ipucuKucult(){ $('#ipucu-pop').classList.add('mini'); clearTimeout(this._ipT); },
  ipucuTekrar(){ this.ipucuPopGoster(this.veri.semboller[this.hedef].ben); },

  /* ---------- KART tıklama (tek giriş) ---------- */
  kartTikla(ki,el){
    if(this.turBitti) return;          // tur cevaplandı: ikinci dokunuş sayılmaz
    if(this.kip==='cok'){
      if(this.durum!=='cevap'||this.sozHakki===null) return;
      const varMi=this.veri.kartlar[ki].items.some(it=>it.sid===this.hedef);
      return varMi ? this.cokDogru(el) : this.cokYanlis(el);
    }
    if(this.kilit) return;
    if(this.mod==='kart'){
      const varMi=this.veri.kartlar[ki].items.some(it=>it.sid===this.hedef);
      // kilit ŞART: zoom/sembol modları kilitliyordu ama 'kart' modu kilitlemiyordu →
      // hızlı çift dokunuşta aynı tur birden fazla harf/puan veriyordu.
      if(varMi){ this.kilit=true; this.turBitti=true; this.dogruCevap(el); } else this.yanlisKart(el);
    }else{ this.yakinAc(ki); }
  },

  /* ---------- SOLO: iki-aşamalı zoom ---------- */
  yakinAc(ki){
    const kart=this.veri.kartlar[ki];
    let ov=$('#yakin'); if(!ov){ ov=document.createElement('div'); ov.id='yakin'; document.body.appendChild(ov);
      Object.assign(ov.style,{position:'fixed',inset:0,background:'rgba(22,35,63,.72)',backdropFilter:'blur(3px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'14px',zIndex:50}); }
    ov.style.display='flex';
    // İPUCU yakınlaşmada da OKUNABİLİR olmalı: panel/pop arkada kalıyordu (z-index 35 < 50),
    // çocuk kartı incelerken ipucunu ezberlemek zorunda kalıyordu. Şerit overlay'in İÇİNDE.
    const ipMetin=(this.veri.semboller[this.hedef]||{}).ben||'';
    let h=`<div class="yk-ipucu">${ipMetin}</div>
      <div class="yk-kart"><img src="${kart.gorsel}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
    // ÖNEMLİ: hotspot'lar BÜYÜKTEN KÜÇÜĞE çizilir. Katalog sırasıyla çizilince
    // sonra basılan üstte kalıyordu; büyük daireler küçükleri yutuyor ve
    // doğru cevap (ör. kart5'te güneş, boy 15) YANLIŞ sayılıyordu. 40 örtüşen çift var.
    [...kart.items].sort((a,b)=>(b.boy||20)-(a.boy||20)).forEach(it=>{ const boy=(it.boy||20);
      h+=`<button class="yk-h" data-sid="${it.sid}" aria-label="Sembol" style="position:absolute;left:${it.x}%;top:${it.y}%;width:${boy}%;height:${boy}%;z-index:${100-Math.round(boy)};transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:none;cursor:pointer"></button>`; });
    h+='</div><button id="yk-kapat" class="yk-kapat" aria-label="Kartı kapat">✕ Kapat</button>';
    ov.innerHTML=h;
    $('#yk-kapat').onclick=()=>this.yakinKapat();
    ov.onclick=e=>{ if(e.target===ov) this.yakinKapat(); };
    // Esc ile kapat (klavye kullanıcısı overlay'de kilitli kalmasın)
    this._yakinEsc=e=>{ if(e.key==='Escape'){ e.preventDefault(); this.yakinKapat(); } };
    document.addEventListener('keydown',this._yakinEsc);
    ov.querySelectorAll('.yk-h').forEach(b=>b.onclick=()=>{
      if(this.kilit) return;
      if(b.dataset.sid===this.hedef){ this.kilit=true; this.turBitti=true; b.style.boxShadow='0 0 0 4px var(--yesil),0 0 22px 6px rgba(63,122,77,.7)'; b.style.background='radial-gradient(circle,rgba(63,122,77,.28),transparent 70%)'; setTimeout(()=>{ this.yakinKapat(); this.dogruCevap(); },560); }
      else{ b.style.boxShadow='0 0 0 4px var(--kirmizi)'; setTimeout(()=>b.style.boxShadow='none',450); }
    });
  },
  yakinKapat(){
    const ov=$('#yakin'); if(ov){ ov.style.display='none'; ov.innerHTML=''; }
    if(this._yakinEsc){ document.removeEventListener('keydown',this._yakinEsc); this._yakinEsc=null; }
  },

  secildi(sid,b,el){ // solo 'sembol'
    if(this.kilit) return;
    if(sid===this.hedef){ this.kilit=true; this.turBitti=true; el.classList.add('dogru'); setTimeout(()=>this.dogruCevap(),400); }
    else{ this.yanlisKart(el); }
  },
  yanlisKart(el){ el.classList.add('yanlis'); setTimeout(()=>el.classList.remove('yanlis'),450); },

  /* ---------- SOLO doğru cevap ---------- */
  dogruCevap(){
    this.dogru++; this.ilerlemeCiz();
    const s=this.veri.semboller[this.hedef];
    if(this.dogru>=this.gereken){ this.bitti(); return; }
    Ekran.perde(this.cevapHtml(s,'<button class="btn" onclick="Ekran.kapat();Oyun.yeniTur();">Devam</button>'));
    setTimeout(()=>{ if(!$('#perde').classList.contains('gizli')){ Ekran.kapat(); this.yeniTur(); } },1600);
  },
  cevapHtml(s,btn){
    const ayet=s.ayet?`<a class="ayet" href="https://quran.com/${s.ayet.replace(':','/')}" target="_blank" rel="noopener">Kur'an-ı Kerîm ${s.ayet}</a>`:'';
    return `<h2>Aferin! ✓</h2><div class="ad">${s.ad}</div>${ayet}${btn}`;
  },
  bitti(){
    clearInterval(this.sayacT);
    Ekran.perde(`<h2><svg class="ik ik-h2"><use href="#ik-gul"/></svg> Tamamlandı!</h2><p>HIZLI HAFIZ kelimesini <b>${$('#sayac').textContent}</b> sürede tamamladın.</p>
      <button class="btn" onclick="Ekran.kapat();Oyun.basla('tek');">Tekrar Oyna</button>
      <button class="btn ikincil" style="margin-top:8px" onclick="Ekran.kapat();Oyun.cik();">Ana Menü</button>`);
  },

  /* ================= ÇOK OYUNCULU ================= */
  stripGuncelle(){
    document.querySelectorAll('#kenarlar .kenar, #buzzbar .bz').forEach(el=>{
      const o=this.oyuncular[+el.dataset.id];
      el.classList.toggle('pasif', o.turKilit);
      el.classList.toggle('aktif', this.sozHakki===o.id);
      el.classList.toggle('hazir', this.durum==='bekle' && !o.turKilit);
      const sk=el.querySelector('.skor'); if(sk) sk.textContent=o.skor+'/'+this.hedefSkor;
    });
  },
  tusYakala(e){
    if(Ekran.atama!=null){ Ekran.atamaTus(e); return; }
    if(this.kip!=='cok'||this.durum!=='bekle'||e.repeat) return;
    const p=this.oyuncular.findIndex(o=>o.tus===e.code);
    if(p<0||this.oyuncular[p].turKilit||this.sozHakki!==null) return;
    e.preventDefault(); this.buzz(p);
  },
  buzz(p){
    if(this.kip!=='cok'||this.durum!=='bekle'||this.sozHakki!==null||this.oyuncular[p].turKilit) return;
    this.sozHakki=p; this.durum='cevap';
    document.documentElement.style.setProperty('--aktif',this.oyuncular[p].renk);
    document.body.classList.add('soz');
    const aci = this.oturma==='etraf' ? ROT[this.oyuncular[p].kenar] : 0;
    $('#geri').querySelector('span').style.transform = aci ? `rotate(${aci}deg)` : 'none';
    this.ipucuKucult();
    this.stripGuncelle();
    this.geriSayimBasla();
  },
  geriSayimBasla(){
    const g=$('#geri'), sp=g.querySelector('span'); g.style.display='flex'; sp.textContent='2';
    clearTimeout(this.geriT);
    this.geriT=setTimeout(()=>{ sp.textContent='1'; sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='gpop .3s'; },1000);
    clearTimeout(this.pencereT);
    this.pencereT=setTimeout(()=>this.sureDoldu(),2000);
  },
  geriSayimDur(){ clearTimeout(this.geriT); clearTimeout(this.pencereT); $('#geri').style.display='none'; },

  cokDogru(el){
    if(this.turBitti) return; this.turBitti=true;   // tek turda çoklu puanı engelle
    this.geriSayimDur();
    const o=this.oyuncular[this.sozHakki]; o.skor++;
    if(el){ el.classList.add('dogru'); }
    document.body.classList.remove('soz'); document.documentElement.style.setProperty('--aktif',o.renk);
    this.stripGuncelle();
    const s=this.veri.semboller[this.hedef];
    if(o.skor>=this.hedefSkor){ this.cokBitti(o); return; }
    Ekran.perde(`<h2 style="color:${o.renk}">${o.id+1}. Oyuncu ✓</h2>${this.cevapHtml(s,'<button class="btn" onclick="Ekran.kapat();Oyun.yeniTur();">Devam</button>')}`, true);
    setTimeout(()=>{ if(!$('#perde').classList.contains('gizli')){ Ekran.kapat(); this.yeniTur(); } },1700);
  },
  cokYanlis(el){ if(el){ el.classList.add('yanlis'); setTimeout(()=>el.classList.remove('yanlis'),450); } this.sozBitir(); },
  sureDoldu(){ this.sozBitir(); },
  sozBitir(){
    this.geriSayimDur();
    const o=this.oyuncular[this.sozHakki]; if(o) o.turKilit=true;
    this.sozHakki=null; this.durum='bekle';
    document.body.classList.remove('soz'); document.documentElement.style.removeProperty('--aktif');
    const kalan=this.oyuncular.some(x=>!x.turKilit);
    this.stripGuncelle();
    if(!kalan){
      // kimse bilemedi → cevabı göster
      this.durum='cevap'; // buzz kapalı
      const s=this.veri.semboller[this.hedef];
      Ekran.perde(`<h2>Kimse bilemedi</h2>${this.cevapHtml(s,'<button class="btn" onclick="Ekran.kapat();Oyun.yeniTur();">Sonraki</button>')}`);
      setTimeout(()=>{ if(!$('#perde').classList.contains('gizli')){ Ekran.kapat(); this.yeniTur(); } },2000);
    }
  },
  cokBitti(o){
    this.geriSayimDur(); this.durum='bitti';
    Ekran.perde(`<h2 style="color:${o.renk}"><svg class="ik ik-h2"><use href="#ik-kupa"/></svg> ${o.id+1}. Oyuncu kazandı!</h2>
      <p>${this.hedefSkor} doğruya ilk ulaşan oldu.</p>
      <div style="margin:8px 0">${this.oyuncular.map(x=>`<div style="color:${x.renk};font-weight:700">${x.id+1}. Oyuncu — ${x.skor}</div>`).join('')}</div>
      <button class="btn" onclick="Ekran.kapat();Oyun.basla('cok',${this.sayi});">Tekrar Oyna</button>
      <button class="btn ikincil" style="margin-top:8px" onclick="Ekran.kapat();Oyun.cik();">Ana Menü</button>`, true);
  }
};

document.addEventListener('keydown', e=>Oyun.tusYakala(e));
document.body.dataset.mod=Oyun.oturma;
matchMedia('(min-width:620px)').addEventListener('change', ()=>Oyun.yonleriUygula());
window.Oyun=Oyun; window.Ekran=Ekran;
// Tahta ölçüsü artık TAHMİN değil ÖLÇÜM: .tahta-sar'ın gerçek yüksekliği --sarH'e yazılır.
// Böylece ipucu panelinin metne göre değişen boyu, üst bar, safe-area ve mobil URL
// çubuğu otomatik hesaba katılır (eski --ipY:86px sabiti 360x640'ta 48px taşırıyordu).
(function(){
  var sar=document.querySelector('.tahta-sar');
  if(!sar||!window.ResizeObserver) return;            // RO yoksa --sarH:60vh yedeği devrede
  var son=-1;
  new ResizeObserver(function(es){
    var h=Math.floor(es[0].contentRect.height);
    if(Math.abs(h-son)>0.5){ son=h; document.documentElement.style.setProperty('--sarH',h+'px'); }
  }).observe(sar);
})();
Oyun.yukle();
</script>
</body>
</html>

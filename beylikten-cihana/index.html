teki Edirnekapı'da. İki cami: 2 ilerle.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/mihrimah-sultan","https://islamansiklopedisi.org.tr/mihrimah-sultan-kulliyesi--uskudar","https://islamansiklopedisi.org.tr/edirnekapi-camii-ve-kulliyesi"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":2}},{"id":"S08","sayi":2,"baslik":"Gevher Nesibe ve Çifte Medrese","bilgi":"I. Gıyâseddin Keyhusrev, kız kardeşi Gevher Nesibe adına Kayseri'de darüşşifa ve bitişiğine tıp medresesi yaptırdı (1205–1206); halk bunlara Çifte Medrese der. 2 ilerle.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/gevher-nesibe-darussifasi-ve-tip-medresesi"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":2}},{"id":"S09","sayi":2,"baslik":"Genç Osman","bilgi":"II. Osman 1618'de on dört yaşında tahta çıktı; ordu düzenini değiştirmek isterken 1622'deki ayaklanmada tahttan indirilip öldürüldü. İkinci Osman: 2 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/osman-ii"],"kazanim":"TAR.10.3.4","etki":{"tur":"sayi","sayi":2}},{"id":"S10","sayi":2,"baslik":"II. Bayezid ve Cem Sultan","bilgi":"II. Bayezid 1481'de tahta çıktı; kardeşi Cem Sultan saltanat iddiasıyla ayaklandı. İki kardeşin mücadelesi Cem'in 1495'teki ölümüne dek sürdü. İkinci: 2 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/cem-sultan"],"kazanim":"TAR.10.3.2","etki":{"tur":"sayi","sayi":2}},{"id":"S11","sayi":2,"baslik":"II. Mahmud'un Yeni Ordusu","bilgi":"II. Mahmud 1826'da Yeniçeri Ocağı'nı kaldırdı, yerine Asâkir-i Mansûre-i Muhammediyye ordusunu kurdu. Adındaki 'II.', onu I. Mahmud'dan ayırır: 2 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://islamansiklopedisi.org.tr/asakir-i-mansure-i-muhammediyye","https://islamansiklopedisi.org.tr/mahmud-ii--osmanli"],"kazanim":"TAR.11.2.2","etki":{"tur":"sayi","sayi":2}},{"id":"S12","sayi":3,"baslik":"III. Selim ve Nizâm-ı Cedîd","bilgi":"III. Selim 1789'da tahta çıktı ve Avrupa usulü talimli Nizâm-ı Cedîd ordusunu kurdu. Bestekârdı; Sûzidilârâ makamını o terkip etti. Üçüncü: 3 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi-2.webp","kaynak":["https://islamansiklopedisi.org.tr/selim-iii","https://islamansiklopedisi.org.tr/nizam-i-cedid"],"kazanim":"TAR.11.2.2","etki":{"tur":"sayi","sayi":3}},{"id":"S13","sayi":3,"baslik":"III. Ahmed ve Lale Devri","bilgi":"III. Ahmed 1703–1730 arasında tahtta kaldı; son yılları (1718–1730) Lale Devri diye anılır. İbrahim Müteferrika'nın matbaası bu devirde kuruldu. Üçüncü: 3 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/ahmed-iii","https://islamansiklopedisi.org.tr/lale-devri"],"kazanim":"TAR.11.1.2","etki":{"tur":"sayi","sayi":3}},{"id":"S14","sayi":3,"baslik":"III. Murad Dönemi","bilgi":"III. Murad döneminde (1574–1595) Safevîlerden Şirvan, Gürcistan ve Tebriz alındı, savaş 1590 antlaşmasıyla bitti; Takiyüddin'in rasathanesi de bu devirde kuruldu. Üçüncü: 3 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/murad-iii","https://islamansiklopedisi.org.tr/ferhad-pasa","https://islamansiklopedisi.org.tr/takiyyuddin-er-rasid"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":3}},{"id":"S15","sayi":3,"baslik":"III. Mustafa'nın Eserleri","bilgi":"III. Mustafa (1757–1774) İstanbul'da Laleli Külliyesi'ni yaptırdı; 1766 depreminde yıkılan Fatih Camii'ni de yeniden inşa ettirdi. Üçüncü: 3 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/mustafa-iii","https://islamansiklopedisi.org.tr/laleli-kulliyesi","https://islamansiklopedisi.org.tr/fatih-camii-ve-kulliyesi"],"kazanim":"TAR.11.1.3","etki":{"tur":"sayi","sayi":3}},{"id":"S16","sayi":3,"baslik":"III. Osman'ın Kısa Saltanatı","bilgi":"III. Osman yalnızca 1754–1757 arasında, yaklaşık üç yıl tahtta kaldı; I. Mahmud'un başlattığı Nuruosmaniye Camii onun döneminde bitirildi. III. ve üç yıl: 3 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/osman-iii","https://islamansiklopedisi.org.tr/nuruosmaniye-kulliyesi"],"kazanim":"TAR.11.1.1","etki":{"tur":"sayi","sayi":3}},{"id":"S17","sayi":3,"baslik":"Üç Kıtada Bir Devlet","bilgi":"Osmanlı toprakları Asya, Avrupa ve Afrika'ya yayılıyordu; Bursa, Belgrad ve Kahire aynı devletin şehirleriydi. Üç kıta: 3 ilerle.","tema":{"slug":"kervan-ticaret-yolu","ad":"Kervan ve Ticaret Yolu","renk":"#9C6B30"},"gorsel":"tema-kervan-ticaret-yolu.webp","kaynak":["https://islamansiklopedisi.org.tr/osmanlilar"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":3}},{"id":"S18","sayi":4,"baslik":"Bağdat Fatihi IV. Murad","bilgi":"IV. Murad 1638'de Bağdat'ı Safevîlerden geri aldı; ertesi yıl yapılan Kasr-ı Şirin Antlaşması (1639) doğu sınırını uzun süre belirledi. Dördüncü: 4 ilerle.","tema":{"slug":"fetih-kusatma","ad":"Fetih ve Kuşatma","renk":"#B03A2E"},"gorsel":"tema-fetih-kusatma.webp","kaynak":["https://islamansiklopedisi.org.tr/murad-iv"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":4}},{"id":"S19","sayi":4,"baslik":"Dört Halife Dönemi","bilgi":"Hz. Peygamber'in vefatından sonra İslam toplumunu Hz. Ebû Bekir, Hz. Ömer, Hz. Osman ve Hz. Ali yönetti (632–661). Bu döneme Hulefâ-yi Râşidîn denir. 4 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/hulefa-yi-rasidin"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":4}},{"id":"S20","sayi":4,"baslik":"Avcı IV. Mehmed","bilgi":"IV. Mehmed 1648'de yedi yaşında tahta çıktı, ava düşkünlüğüyle 'Avcı' diye anıldı. Köprülü sadrazamları döneminde Girit'in fethi tamamlandı (1669). Dördüncü: 4 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/mehmed-iv"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":4}},{"id":"S21","sayi":4,"baslik":"Rum'un Dört Zümresi","bilgi":"Âşıkpaşazâde Anadolu'daki dört zümreyi anar: Gāziyân, Ahîyân, Abdalân ve Bâciyân-ı Rûm. Bâciyân'ın, Fatma Bacı'yla anılan bir kadın teşkilatı olduğu ileri sürülür. 4 ilerle.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/baciyan-i-rum","https://islamansiklopedisi.org.tr/ahilik","Mikâil Bayram, Fatma Bacı ve Bacıyân-ı Rûm: Anadolu Bacıları Teşkilâtı (Nüve Kültür Merkezi; Çizgi Kitabevi)"],"kazanim":"TAR.10.2.4","etki":{"tur":"sayi","sayi":4}},{"id":"S22","sayi":4,"baslik":"Dört Eyvanlı Medrese","bilgi":"Büyük Selçuklu döneminde yaygınlaşan dört eyvanlı medrese planı Anadolu'da da uygulandı; Erzurum Çifte Minareli Medrese buna örnektir. Dört eyvan: 4 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/eyvan"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":4}},{"id":"S23","sayi":4,"baslik":"Şehzade Camii'nin Dört Yarım Kubbesi","bilgi":"Mimar Sinan'ın 'çıraklık eserim' dediği İstanbul Şehzade Camii'nde (1544–1548) ana kubbeyi dört yarım kubbe destekler. Dört yarım kubbe: 4 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/sehzade-kulliyesi","https://islamansiklopedisi.org.tr/sinan"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":4}},{"id":"S24","sayi":5,"baslik":"İbn Sînâ'nın Beş Kitabı","bilgi":"İbn Sînâ'nın tıp ansiklopedisi el-Kānûn fi't-tıb beş kitaptan oluşur; eser yüzyıllarca Doğu'da ve Batı'da tıp öğretiminde okutuldu. Beş kitap: 5 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/el-kanun-fit-tib","https://islamansiklopedisi.org.tr/ibn-sina"],"kazanim":"TAR.9.3.4","etki":{"tur":"sayi","sayi":5}},{"id":"S25","sayi":5,"baslik":"Pencik: Beşte Bir","bilgi":"I. Murad döneminde savaş esirlerinin beşte biri devlete ayrıldı. Pencik denen bu usulle alınan gençler yetiştirildi; Yeniçeri Ocağı böyle doğdu. Beşte bir: 5 ilerle.","tema":{"slug":"maliye-defter-teskilat","ad":"Maliye, Defter ve Teşkilat","renk":"#4A5240"},"gorsel":"tema-maliye-defter-teskilat.webp","kaynak":["https://islamansiklopedisi.org.tr/pencik"],"kazanim":"TAR.10.2.3","etki":{"tur":"sayi","sayi":5}},{"id":"S26","sayi":5,"baslik":"Beşinci Padişah Çelebi Mehmed","bilgi":"Beşinci padişah I. Mehmed (Çelebi), Ankara Savaşı'ndan (1402) sonraki Fetret Devri'ni 1413'te bitirip devletin birliğini yeniden kurdu. Beşinci padişah: 5 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/mehmed-i"],"kazanim":"TAR.10.2.2","etki":{"tur":"sayi","sayi":5}},{"id":"S27","sayi":5,"baslik":"Sadrazamın Beş Tuğu","bilgi":"Osmanlı'da sadrazam, padişahtan sonra en çok tuğ taşıyan devlet adamıydı; seferde otağının önüne sadrazamlığı temsil eden beş tuğ dikilirdi. Beş tuğ: 5 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/tug"],"kazanim":"TAR.10.3.2","etki":{"tur":"sayi","sayi":5}},{"id":"S28","sayi":5,"baslik":"V. Murad'ın Kısa Saltanatı","bilgi":"V. Murad 1876'da tahta çıktı; sağlığı bozulduğu için yaklaşık üç ay sonra tahttan indirildi, yerine kardeşi II. Abdülhamid geçti. Beşinci: 5 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/murad-v"],"kazanim":"TAR.11.2.2","etki":{"tur":"sayi","sayi":5}},{"id":"S29","sayi":5,"baslik":"Nevâî'nin Hamse'si","bilgi":"Ali Şîr Nevâî, beş mesneviden oluşan Hamse'sini 15. yüzyılda Türkçe (Çağatayca) yazdı. 'Hamse' Arapçada beş demektir: 5 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/ali-sir-nevai"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":5}},{"id":"S30","sayi":6,"baslik":"Son Padişah VI. Mehmed","bilgi":"Son Osmanlı padişahı VI. Mehmed (Vahdeddin) 1918'de tahta çıktı; saltanat 1 Kasım 1922'de TBMM kararıyla kaldırıldı. Altıncı: 6 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/mehmed-vi"],"kazanim":"TAR.11.3.1","etki":{"tur":"sayi","sayi":6}},{"id":"S31","sayi":6,"baslik":"Altı Asırlık Devlet","bilgi":"Geleneksel kabule göre 1299'da kurulan Osmanlı Devleti, saltanatın kaldırıldığı 1922'ye dek yaklaşık altı asır sürdü. Altı asır: 6 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/osmanlilar"],"kazanim":"TAR.10.2.1","etki":{"tur":"sayi","sayi":6}},{"id":"S32","sayi":6,"baslik":"Edirne'nin Altıgen Darüşşifası","bilgi":"II. Bayezid'in Edirne'deki külliyesinde yer alan darüşşifanın ana bölümü altıgen planlıdır: ortada kubbeli mekân, çevresinde eyvanlar. Altı kenar: 6 ilerle.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/beyazit-ii-camii-ve-kulliyesi--edirne","https://kulturenvanteri.com/en/yer/edirne-ii-beyazit-darussifasi/"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":6}},{"id":"S33","sayi":6,"baslik":"Aklâm-ı Sitte: Altı Kalem","bilgi":"Hattatlar sülüs, nesih, muhakkak, reyhânî, tevkī ve rikā' yazılarına aklâm-ı sitte (altı kalem) derdi. Şeyh Hamdullah bunlarda Osmanlı üslubunu kurdu. 6 ilerle.","tema":{"slug":"hat-tugra-ferman","ad":"Hat, Tuğra ve Ferman","renk":"#3B2E6B"},"gorsel":"tema-hat-tugra-ferman.webp","kaynak":["https://islamansiklopedisi.org.tr/aklam-i-sitte","https://islamansiklopedisi.org.tr/hamdullah-efendi-seyh"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":6}},{"id":"S34","sayi":6,"baslik":"Cezerî'nin Kitabı","bilgi":"Artuklu sarayında çalışan Cezerî, mekanik düzenekleri anlattığı kitabını 1205'te bitirdi ve altı kısma ayırdı; su saatleri ve fıskiyeler bunlardandır. 6 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/cezeri-ismail-b-rezzaz"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":6}},{"id":"S35","sayi":6,"baslik":"Sultanahmet'in Altı Minaresi","bilgi":"I. Ahmed'in başmimar Sedefkâr Mehmed Ağa'ya yaptırdığı Sultanahmet Camii, o zamana dek denenmemiş altı minaresiyle İstanbul silüetinin simgesidir. Altı minare: 6 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/sultan-ahmed-camii-ve-kulliyesi"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":6}},{"id":"S36","sayi":7,"baslik":"Yedikule Hisarı","bilgi":"Fatih, fetihten sonra kara surlarındaki Altınkapı kulelerine yeni kuleler ekletti; dördü Bizans'tan, üçü Fatih'ten kalma yedi kuleli hisara Yedikule denir. 7 ilerle.","tema":{"slug":"fetih-kusatma","ad":"Fetih ve Kuşatma","renk":"#B03A2E"},"gorsel":"tema-fetih-kusatma.webp","kaynak":["https://tr.wikipedia.org/wiki/Yedikule_Zindanlar%C4%B1","https://kultursanat.istanbul/haberler/yedikule-hisari"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":7}},{"id":"S37","sayi":7,"baslik":"Yedi Tepeli Şehir","bilgi":"İstanbul yedi tepe üzerine kurulu kabul edilir; şairler onu 'yedi tepeli' diye anlatır. Fatih, Beyazıt, Süleymaniye ve Yavuz Selim camileri bu tepelerde yükselir. 7 ilerle.","tema":{"slug":"fetih-kusatma","ad":"Fetih ve Kuşatma","renk":"#B03A2E"},"gorsel":"tema-fetih-kusatma.webp","kaynak":["https://islamansiklopedisi.org.tr/istanbul"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":7}},{"id":"S38","sayi":7,"baslik":"Yedi İklim","bilgi":"İslam coğrafyacıları yeryüzünün kuzey yarısını yedi enlem kuşağına, yani yedi iklime ayırırdı; bu ayrımın kökeni eski İran'a dayanır. Yedi iklim: 7 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/iklim"],"kazanim":"TAR.9.3.4","etki":{"tur":"sayi","sayi":7}},{"id":"S39","sayi":7,"baslik":"Yedi Düvel","bilgi":"'Yedi düvel' deyimi birçok büyük devleti topluca anlatır. Millî Mücadele yıllarında Anadolu halkı karşısındaki güçleri bu sözle anardı. 7 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://sozluk.gov.tr/ (yedi düvel)"],"kazanim":"Tema: Millî Mücadele","etki":{"tur":"sayi","sayi":7}},{"id":"S40","sayi":7,"baslik":"Yedinci Padişah Fatih","bilgi":"Fatih Sultan Mehmed, Osman Gazi'den sonra tahta çıkan yedinci Osmanlı padişahıdır; 1453'te İstanbul'u fethedip payitaht yaptı. Yedinci padişah: 7 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/mehmed-ii"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":7}},{"id":"S41","sayi":7,"baslik":"Padişahın Yedi Tuğu","bilgi":"Osmanlı'da tuğ sayısı rütbeyi gösterirdi: padişahın yedi, sadrazamın beş, vezirin üç, beylerbeyinin iki, sancakbeyinin bir tuğu olurdu. Yedi tuğ: 7 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/tug"],"kazanim":"TAR.10.3.2","etki":{"tur":"sayi","sayi":7}},{"id":"S42","sayi":8,"baslik":"Sahn-ı Semân'ın Sekiz Medresesi","bilgi":"Fatih, İstanbul'da camisinin iki yanına sekiz yüksek medrese yaptırdı; bunlara Sahn-ı Semân (sekiz avlu) denir. 'Semân' Arapçada sekizdir: 8 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/sahn-i-seman"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":8}},{"id":"S43","sayi":8,"baslik":"Sekizinci Padişah II. Bayezid","bilgi":"Fatih'in oğlu II. Bayezid (1481–1512), Osmanlı'nın sekizinci padişahıdır. Edirne'deki külliyesi ilim ve sağlık merkeziydi. Sekizinci padişah: 8 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/bayezid-ii"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":8}},{"id":"S44","sayi":8,"baslik":"Talas Savaşı: 8. Yüzyıl","bilgi":"751 Talas Savaşı'nda Müslüman Araplar ile Karluk Türkleri Çin ordusunu yendi; bu yakınlaşma Türklerin İslam'a geçişini hızlandırdı. 751, 8. yüzyıldadır: 8 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/talas-savasi"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":8}},{"id":"S45","sayi":8,"baslik":"Selimiye'nin Sekiz Ayağı","bilgi":"Mimar Sinan, Edirne Selimiye Camii'nin (1568–1574) büyük kubbesini sekiz ayağa oturtarak iç mekânı tek ve ferah bir bütün hâline getirdi. Sekiz ayak: 8 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/selimiye-camii-ve-kulliyesi--edirne"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":8}},{"id":"S46","sayi":8,"baslik":"Heşt Bihişt: Sekiz Padişah","bilgi":"İdrîs-i Bitlisî, II. Bayezid'in emriyle ilk sekiz Osmanlı padişahını anlatan Farsça tarihini yazdı ve adını Heşt Bihişt koydu. Sekiz padişah: 8 ilerle.","tema":{"slug":"hat-tugra-ferman","ad":"Hat, Tuğra ve Ferman","renk":"#3B2E6B"},"gorsel":"tema-hat-tugra-ferman.webp","kaynak":["https://islamansiklopedisi.org.tr/hest-bihist--bitlisi"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":8}},{"id":"S47","sayi":8,"baslik":"Orhun Yazıtları: 8. Yüzyıl","bilgi":"Kül Tigin, Bilge Kağan ve Tonyukuk adına 8. yüzyılda dikilen Orhun Yazıtları, Türk dilinin en eski metinlerini taşır. 8. yüzyıl: 8 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/orhon-yazitlari"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":8}},{"id":"S48","sayi":9,"baslik":"Dokuz Tuğlu Han","bilgi":"Kâşgarlı Mahmud'un eserindeki 'dokuz tuğlu han' ifadesi, Türk hanlarının dokuz tuğ taşıdığını gösterir; Osmanlı padişahı ise yedi tuğ taşırdı. Dokuz tuğ: 9 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/tug"],"kazanim":"TAR.10.1.2","etki":{"tur":"sayi","sayi":9}},{"id":"S49","sayi":9,"baslik":"Dokuz Oğuz","bilgi":"Orhun Yazıtları'nda adı geçen Dokuz Oğuz (Tokuz Oğuz), dokuz boydan oluşan bir Türk boy birliğiydi. Dokuz boy: 9 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/oguzlar","https://islamansiklopedisi.org.tr/dokuz-oguzlar"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":9}},{"id":"S50","sayi":9,"baslik":"Edirne Eski Camii'nin Dokuz Kubbesi","bilgi":"Çelebi Mehmed döneminde 1414'te tamamlanan Edirne Eski Camii, üç sıra hâlinde dokuz kubbeyle örtülüdür; duvarlarındaki büyük hat yazılarıyla ünlüdür. 9 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://www.edirne.gov.tr/eski-camii","https://www.edirne.bel.tr/Kultur/Detay?kulturId=5372349f-8f1e-4ad8-a1a1-2dc4afc283be"],"kazanim":"TAR.10.2.5","etki":{"tur":"sayi","sayi":9}},{"id":"S51","sayi":9,"baslik":"Dokuzuncu Padişah Yavuz","bilgi":"Dokuzuncu padişah Yavuz Sultan Selim (1512–1520), 1517'de Memlûk Devleti'ne son verdi; kutsal emanetler İstanbul'a getirildi. Dokuzuncu padişah: 9 ilerle.","tema":{"slug":"fetih-kusatma","ad":"Fetih ve Kuşatma","renk":"#B03A2E"},"gorsel":"tema-fetih-kusatma.webp","kaynak":["https://islamansiklopedisi.org.tr/selim-i"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":9}},{"id":"S52","sayi":9,"baslik":"Tolunoğulları: 9. Yüzyıl","bilgi":"Ahmed b. Tolun 868'de vali vekili olarak Mısır'a girdi ve Tolunoğulları hanedanını kurdu; Kahire'deki İbn Tolun Camii 879'da tamamlandı. 9. yüzyıl: 9 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/tolunogullari","https://islamansiklopedisi.org.tr/ibn-tolun-camii"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":9}},{"id":"S53","sayi":9,"baslik":"Sâmerrâ: 9. Yüzyıl","bilgi":"Abbasî halifesi Mu'tasım 836'da Türk askerlerini yerleştirmek için Sâmerrâ şehrini kurdurdu; Türkler 9. yüzyılda Abbasî ordusunun temel gücü oldu. 9 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/samerra"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":9}},{"id":"S54","sayi":10,"baslik":"Mete Han'ın Onlu Ordusu","bilgi":"Hun hükümdarı Mete Han orduyu onluk, yüzlük, binlik ve on binlik (tümen) birliklere ayırdı; bu düzen sonraki Türk devletlerinde de sürdü. Onlu düzen: 10 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["İbrahim Kafesoğlu, Türk Millî Kültürü, Ötüken Neşriyat (Hun ordusunun onlu teşkilatı)"],"kazanim":"TAR.10.1.2","etki":{"tur":"sayi","sayi":10}},{"id":"S55","sayi":10,"baslik":"Evliya Çelebi'nin On Cildi","bilgi":"Evliya Çelebi, yarım asrı aşan gezilerini on ciltlik Seyahatnâme'sinde anlattı; eser Osmanlı şehirleri, çarşıları ve yapıları için eşsiz bir kaynaktır. On cilt: 10 ilerle.","tema":{"slug":"kervan-ticaret-yolu","ad":"Kervan ve Ticaret Yolu","renk":"#9C6B30"},"gorsel":"tema-kervan-ticaret-yolu.webp","kaynak":["https://islamansiklopedisi.org.tr/seyahatname--evliya-celebi","https://islamansiklopedisi.org.tr/evliya-celebi"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":10}},{"id":"S56","sayi":10,"baslik":"Fârâbî: 10. Yüzyıl","bilgi":"Fârâbî (ö. 950), İslam felsefesinin kurucularındandır; Aristo'dan sonra 'Muallim-i Sânî' (İkinci Öğretmen) diye anıldı, mûsikiye dair de eser yazdı. 10. yüzyıl: 10 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/farabi"],"kazanim":"TAR.9.3.4","etki":{"tur":"sayi","sayi":10}},{"id":"S57","sayi":10,"baslik":"Süleymaniye'nin On Şerefesi","bilgi":"Süleymaniye Camii'nin (1550–1557) dört minaresinde toplam on şerefe vardır; halk arasında bu, Kanûnî'nin onuncu Osmanlı padişahı olmasına yorulur. On şerefe: 10 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/suleymaniye-camii-ve-kulliyesi","https://islamansiklopedisi.org.tr/suleyman-i"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":10}},{"id":"S58","sayi":10,"baslik":"Hürriyet Bayramı: 10 Temmuz","bilgi":"II. Meşrutiyet 10 Temmuz 1324'te (23 Temmuz 1908) ilan edildi; bu gün 1909'dan itibaren Îd-i Millî (millî bayram) olarak kutlandı. 10 Temmuz: 10 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/mesrutiyet","https://dergipark.org.tr/tr/download/article-file/5336 (Meşrutiyetin Bayramı: 10 Temmuz Îd-i Millîsi, İÜ SBF Dergisi)"],"kazanim":"TAR.11.3.1","etki":{"tur":"sayi","sayi":10}},{"id":"S59","sayi":10,"baslik":"Karahanlılar: 10. Yüzyıl","bilgi":"Karahanlı hükümdarı Satuk Buğra Han 10. yüzyılda Müslüman oldu; Karahanlılar ilk Müslüman Türk devletlerinden sayılır. 10. yüzyıl: 10 ilerle.","tema":{"slug":"orta-asya-turk-kokleri","ad":"Türk-İslam Kökleri","renk":"#6B4A2B"},"gorsel":"tema-orta-asya-turk-kokleri.webp","kaynak":["https://islamansiklopedisi.org.tr/karahanlilar"],"kazanim":"TAR.10.1.2","etki":{"tur":"sayi","sayi":10}},{"id":"S60","sayi":11,"baslik":"Malazgirt: 11. Yüzyıl","bilgi":"Sultan Alparslan 1071 Malazgirt Savaşı'nda Bizans ordusunu yendi, İmparator Romanos Diogenes'i esir aldı; Anadolu'nun kapıları Türklere açıldı. 11. yüzyıl: 11 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi-2.webp","kaynak":["https://islamansiklopedisi.org.tr/malazgirt-muharebesi"],"kazanim":"TAR.10.1.1","etki":{"tur":"sayi","sayi":11}},{"id":"S61","sayi":11,"baslik":"Kutadgu Bilig: 11. Yüzyıl","bilgi":"Yûsuf Has Hâcib 1069–1070'te Kutadgu Bilig'i yazıp Karahanlı hükümdarına sundu; Türk-İslam edebiyatının ilk büyük eserlerindendir. 11. yüzyıl: 11 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/kutadgu-bilig"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":11}},{"id":"S62","sayi":11,"baslik":"On Birinci Padişah II. Selim","bilgi":"II. Selim, babası Kanûnî'nin 1566'daki vefatı üzerine tahta çıkan on birinci Osmanlı padişahıdır; döneminde Kıbrıs fethedildi (1571). 11 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/selim-ii","https://islamansiklopedisi.org.tr/kibris"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":11}},{"id":"S63","sayi":11,"baslik":"Dîvânü Lugâti't-Türk: 11. Yüzyıl","bilgi":"Kâşgarlı Mahmud, Araplara Türkçeyi öğretmek için yazdığı Dîvânü Lugâti't-Türk'e 1072'de başladı, 1074'te bitirdi. 11. yüzyıl: 11 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/divanu-lugatit-turk"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":11}},{"id":"S64","sayi":11,"baslik":"Nizamiye Medreseleri: 11. Yüzyıl","bilgi":"Büyük Selçuklu veziri Nizâmülmülk'ün 1067'de Bağdat'ta açtırdığı Nizamiye Medresesi, sonraki medrese geleneğine örnek oldu. 11. yüzyıl: 11 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/nizamiye-medresesi"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":11}},{"id":"S65","sayi":11,"baslik":"Dandanakan: 11. Yüzyıl","bilgi":"Selçuklular 1040 Dandanakan Savaşı'nda Gaznelileri yenerek Büyük Selçuklu Devleti'ni kurdu. 1040, 11. yüzyıldadır: 11 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://islamansiklopedisi.org.tr/dandanakan-savasi"],"kazanim":"TAR.10.1.1","etki":{"tur":"sayi","sayi":11}},{"id":"S66","sayi":12,"baslik":"On İki Hayvanlı Türk Takvimi","bilgi":"Eski Türk takviminde her yıl bir hayvanla anılırdı: sıçan, öküz, pars, tavşan, ejder, yılan, at, koyun, maymun, tavuk, köpek, domuz. Orhun Yazıtları'nda da geçer. 12 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/takvim"],"kazanim":"TAR.9.3.2","etki":{"tur":"sayi","sayi":12}},{"id":"S67","sayi":12,"baslik":"On İki Makam","bilgi":"Safiyyüddin el-Urmevî 13. yüzyılda Kitâbü'l-Edvâr'da makamları on iki ana makam hâlinde sınıflandırdı; bu kuram Osmanlı mûsikîsini de etkiledi. 12 ilerle.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/kitabul-edvar","https://islamansiklopedisi.org.tr/safiyyuddin-el-urmevi"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":12}},{"id":"S68","sayi":12,"baslik":"On İki Aylık Malî Yıl","bilgi":"Osmanlı, 1677'den itibaren malî işlerde Mart'ta başlayan güneş yılını (Rûmî malî yıl) kullandı; ay yılı 11 gün kısa olduğundan hasatla uyuşmuyordu. 12 ay: 12 ilerle.","tema":{"slug":"maliye-defter-teskilat","ad":"Maliye, Defter ve Teşkilat","renk":"#4A5240"},"gorsel":"tema-maliye-defter-teskilat.webp","kaynak":["https://islamansiklopedisi.org.tr/takvim"],"kazanim":"TAR.10.3.2","etki":{"tur":"sayi","sayi":12}},{"id":"S69","sayi":12,"baslik":"Alaturka Saat: On İki","bilgi":"Osmanlı'da kullanılan ezanî (alaturka) saatte gün güneşin batışıyla başlar; saatler her akşam güneş batarken 12'ye ayarlanırdı. On iki: 12 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/alaturka"],"kazanim":"TAR.11.2.3","etki":{"tur":"sayi","sayi":12}},{"id":"S70","sayi":12,"baslik":"Miryokefalon: 12. Yüzyıl","bilgi":"II. Kılıç Arslan 1176 Miryokefalon Savaşı'nda Bizans ordusunu yendi; Bizans'ın Anadolu'yu geri alma umudu sona erdi. 1176, 12. yüzyıldadır: 12 ilerle.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi-2.webp","kaynak":["https://islamansiklopedisi.org.tr/miryokefalon-savasi"],"kazanim":"TAR.10.1.1","etki":{"tur":"sayi","sayi":12}},{"id":"S71","sayi":12,"baslik":"Celâlî Takvimi","bilgi":"Selçuklu Sultanı Melikşah döneminde Ömer Hayyam'ın da bulunduğu heyet 1079'da Celâlî takvimini hazırladı; güneş yılını on iki aya büyük bir incelikle böldü. 12 ilerle.","tema":{"slug":"takvim-astronomi","ad":"Takvim, İlim ve Astronomi","renk":"#1E3A5F"},"gorsel":"tema-takvim-astronomi.webp","kaynak":["https://islamansiklopedisi.org.tr/celali-takvimi"],"kazanim":"TAR.10.1.4","etki":{"tur":"sayi","sayi":12}},{"id":"S72","sayi":2,"baslik":"Menzil Teşkilatı","bilgi":"Menzilhanelerde at değiştiren ulaklar haberi hızla taşırdı. 2 ilerle ve TEKRAR Sefer Kartı çek!","tema":{"slug":"kervan-ticaret-yolu","ad":"Kervan ve Ticaret Yolu","renk":"#9C6B30"},"gorsel":"tema-kervan-ticaret-yolu.webp","kaynak":["https://islamansiklopedisi.org.tr/menzil--osmanli"],"kazanim":"TAR.10.3.2","etki":{"tur":"tekrar","kod":"T2","sayi":2}},{"id":"S73","sayi":3,"baslik":"Sefer-i Hümâyun Coşkusu","bilgi":"Padişah ordunun başında sefere çıktı; ordu şevkle ilerledi. 3 ilerle ve TEKRAR Sefer Kartı çek!","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://islamansiklopedisi.org.tr/menzil--osmanli"],"kazanim":"TAR.10.3.2","etki":{"tur":"tekrar","kod":"T3","sayi":3}},{"id":"S74","sayi":1,"baslik":"Acele Ferman","bilgi":"Saraydan acele ferman geldi, hemen yola koyul. 1 ilerle ve TEKRAR Sefer Kartı çek!","tema":{"slug":"hat-tugra-ferman","ad":"Hat, Tuğra ve Ferman","renk":"#3B2E6B"},"gorsel":"tema-hat-tugra-ferman.webp","kaynak":["https://islamansiklopedisi.org.tr/ferman"],"kazanim":"TAR.10.3.2","etki":{"tur":"tekrar","kod":"T1","sayi":1}},{"id":"S75","sayi":4,"baslik":"Akıncı Hızı","bilgi":"Uç beylerine bağlı akıncılar hızlı hareketleriyle tanınırdı. 4 ilerle ve TEKRAR Sefer Kartı çek!","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi-2.webp","kaynak":["https://islamansiklopedisi.org.tr/akinci"],"kazanim":"TAR.10.2.4","etki":{"tur":"tekrar","kod":"T4","sayi":4}},{"id":"S76","sayi":0,"baslik":"Donanma Seferi","bilgi":"Kaptanıderya donanmayı denize açtı; gemiyle ileride en yakın limana taşındın.","tema":{"slug":"denizcilik-donanma","ad":"Denizcilik ve Donanma","renk":"#1F5F7A"},"gorsel":"tema-denizcilik-donanma.webp","kaynak":["https://islamansiklopedisi.org.tr/tersane","https://islamansiklopedisi.org.tr/murad-iv"],"kazanim":"TAR.10.3.2","etki":{"tur":"menzil","kod":"M1","hedef":"en_yakin_liman"}},{"id":"S77","sayi":0,"baslik":"Sefere Çağrı","bilgi":"Tuğlar dikildi, ordu Sefer Meydanı'nda toplanıyor. Başa dön ve ulûfeni al!","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://islamansiklopedisi.org.tr/ulufe"],"kazanim":"TAR.10.2.3","etki":{"tur":"menzil","kod":"M2","hedef":"baslangic"}},{"id":"S78","sayi":0,"baslik":"Surre Alayıyla Yolculuk","bilgi":"Surre alayıyla birlikte hac yoluna çıktın. Haremeyn karesine git.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/surre"],"kazanim":"TAR.10.3.1","etki":{"tur":"menzil","kod":"M3","hedef":"haremeyn"}},{"id":"S79","sayi":3,"baslik":"Kış Bastırdı","bilgi":"Sefer mevsimi bitti, ordu kışlağa çekildi. 3 kare GERİ git.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi-2.webp","kaynak":["https://islamansiklopedisi.org.tr/menzil--osmanli"],"kazanim":"TAR.10.3.2","etki":{"tur":"geri","kod":"G3","sayi":3}},{"id":"S80","sayi":2,"baslik":"Yollar Kapandı","bilgi":"Sel ve çamur yolları kapattı; geri dönmek zorunda kaldın. 2 kare GERİ git.","tema":{"slug":"kervan-ticaret-yolu","ad":"Kervan ve Ticaret Yolu","renk":"#9C6B30"},"gorsel":"tema-kervan-ticaret-yolu.webp","kaynak":["https://islamansiklopedisi.org.tr/menzil--osmanli"],"kazanim":"Tema: yol ve ulaşım","etki":{"tur":"geri","kod":"G2","sayi":2}},{"id":"S81","sayi":4,"baslik":"Kuşatma Kaldırıldı","bilgi":"Uzun kuşatma sonuç vermedi, ordu geri çekildi. 4 kare GERİ git.","tema":{"slug":"fetih-kusatma","ad":"Fetih ve Kuşatma","renk":"#B03A2E"},"gorsel":"tema-fetih-kusatma.webp","kaynak":["https://islamansiklopedisi.org.tr/muhasara"],"kazanim":"TAR.10.3.1","etki":{"tur":"geri","kod":"G4","sayi":4}},{"id":"S82","sayi":0,"baslik":"Casus Oyunu","bilgi":"Bir casus seni yanlış yola sürükledi; önündeki en yakın rakiple yer değiştir!","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/casus"],"kazanim":"Tema: istihbarat","etki":{"tur":"yer_degistir","kod":"Y1"}},{"id":"S83","sayi":0,"baslik":"Ani Baskın","bilgi":"Sınır boyunda akın düzenledin; ganimetten payına düşen 500 akçeyi Hazine'den al.","tema":{"slug":"meydan-muharebesi","ad":"Meydan Muharebesi","renk":"#8C2D19"},"gorsel":"tema-meydan-muharebesi.webp","kaynak":["https://islamansiklopedisi.org.tr/akinci","https://islamansiklopedisi.org.tr/pencik"],"kazanim":"TAR.10.2.4","etki":{"tur":"hazineden_al","kod":"H1","deger":500}},{"id":"S84","sayi":0,"baslik":"Şehzade Şenliği","bilgi":"Sarayda şehzade doğdu, şehir günlerce donandı. Şenlik ihsanı olarak Hazine'den 300 akçe al.","tema":{"slug":"lale-devri-sanat","ad":"Mimari ve Sanat","renk":"#9B2D5E"},"gorsel":"tema-lale-devri-sanat.webp","kaynak":["https://islamansiklopedisi.org.tr/sehzade","https://islamansiklopedisi.org.tr/surname"],"kazanim":"Tema: saray ve şenlik","etki":{"tur":"hazineden_al","kod":"H2","deger":300}}],"ferman":[{"id":"F00","deste":"ferman","baslik":"Kanunname-i Âl-i Osman","metin":"Fatih Sultan Mehmed, devlet teşkilatını ve saray düzenini bir kanunnameyle yazıya geçirdi; kurallar belli olunca ticaret güven kazandı. Her tapun için Hazine'den 100 akçe al (en çok 5 tapu).","etki":{"tur":"mulk_basina_al","deger":100,"ust":5},"ogren":"Kanunnameler, padişahın yetkisine dayanan örfî hukuk kurallarını bir araya getiren metinlerdi.","tema":"Hukuk ve teşkilat","kaynak":["https://islamansiklopedisi.org.tr/kanunname"],"kazanim":"TAR.10.2.3","v1_tutar":200},{"id":"F01","deste":"ferman","baslik":"Tımar Beratı","metin":"Padişahın beratıyla sana bir tımar verildi. Toprağın vergi gelirini sen alacak, karşılığında sefere atlı asker (cebelü) götüreceksin. Hazine'den 250 akçe al.","etki":{"tur":"para_al","deger":250},"ogren":"Tımar sisteminde devlet, toprağın vergi gelirini sipahiye bırakır; sipahi de bu gelirle asker besleyip sefere katılırdı.","tema":"Toprak ve ordu","kaynak":["https://islamansiklopedisi.org.tr/timar","https://islamansiklopedisi.org.tr/cebelu"],"kazanim":"TAR.10.2.3","v1_tutar":500},{"id":"F02","deste":"ferman","baslik":"Avârız Vergisi Salındı","metin":"Sefer ve olağanüstü giderler için halktan avârız vergisi toplandı. Sefer masrafına katkı olarak her tapun için Hazine'ye 150 akçe öde (en çok 5 tapu).","etki":{"tur":"mulk_basina_ver","deger":150,"ust":5},"ogren":"Avârız, savaş gibi olağanüstü durumlarda toplanan, zamanla düzenli hâle gelen bir vergiydi.","tema":"Maliye","kaynak":["https://islamansiklopedisi.org.tr/avariz--vergi"],"kazanim":"TAR.10.3.2","v1_tutar":250},{"id":"F03","deste":"ferman","baslik":"Akçenin Ayarı Düşürüldü (1585–1586)","metin":"1585–1586'da akçedeki gümüş azaltıldı (tağşiş); çarşılar ayarı düşük akçeyle doldu, fiyatlar yükseldi, kira gelirleri eridi. Her imar kademen için Hazine'ye 100 akçe öde (en çok 5).","etki":{"tur":"imar_basina_ver","deger":100,"ust":5},"ogren":"Tağşiş, sikkedeki değerli maden oranını düşürmektir; 16. yüzyıl sonundaki enflasyon Celâlî isyanlarını besleyen etkenlerdendi.","tema":"Maliye","kaynak":["https://islamansiklopedisi.org.tr/celali-isyanlari","https://islamansiklopedisi.org.tr/sikke","Şevket Pamuk, Osmanlı İmparatorluğu'nda Paranın Tarihi (Tarih Vakfı Yurt Yayınları) — 1585-1586 tağşişi"],"kazanim":"TAR.10.3.4","v1_tutar":200},{"id":"F04","deste":"ferman","baslik":"Cülûs Affı","metin":"Tahta çıkan padişah cülûs münasebetiyle kapıkulu askerlerine bahşiş dağıttı, bazı mahkûmları affetti. Bu fermanla esaretten kurtulursun; kullanana dek sakla.","etki":{"tur":"esaretten_cik_karti","deger":0,"saklanir":true},"ogren":"Cülûs bahşişi, tahta çıkan padişahın kapıkulu askerlerine dağıttığı geleneksel bir ödemeydi; ulûfe ise düzenli maaştır.","tema":"Saray","kaynak":["https://islamansiklopedisi.org.tr/culus"],"kazanim":"TAR.10.3.2","v1_tutar":0},{"id":"F05","deste":"ferman","baslik":"Sefer-i Hümâyun İlan Edildi","metin":"Padişah orduya bizzat komuta edeceği seferi ilan etti; tuğlar dikildi, ordu toplanıyor. Sefer Meydanı'na git ve ulûfeni al.","etki":{"tur":"basa_git_maas_al","deger":0},"ogren":"Padişahın bizzat katıldığı seferlere sefer-i hümâyun denirdi; ordu belirlenen menzillerde toplanarak yürürdü.","tema":"Ordu","kaynak":["https://islamansiklopedisi.org.tr/menzil--osmanli"],"kazanim":"TAR.10.3.2","v1_tutar":0},{"id":"F06","deste":"ferman","baslik":"Donanma Yeniden Kuruldu (1571–1572)","metin":"İnebahtı yenilgisinden (1571) sonra Sadrazam Sokullu Mehmed Paşa'nın emriyle tersanelerde kısa sürede yeni bir donanma yapıldı. Her limanın için Hazine'den 150 akçe al.","etki":{"tur":"liman_basina_al","deger":150,"ust":5},"ogren":"Sokullu, İnebahtı'dan sonra dağılan donanmayı toplama işini Kaptanıderya Uluç (Kılıç) Ali Paşa'ya verdi.","tema":"Denizcilik","kaynak":["https://islamansiklopedisi.org.tr/sokullu-mehmed-pasa","https://islamansiklopedisi.org.tr/inebahti-deniz-savasi"],"kazanim":"TAR.10.3.1","v1_tutar":300},{"id":"F07","deste":"ferman","baslik":"İstimâlet Siyaseti","metin":"Fethedilen yerlerde halkın dinine ve malına dokunulmadı, eski ağır vergiler hafifletildi; halk yeni idareye ısındı. Her tapun için Hazine'den 100 akçe al (en çok 5 tapu).","etki":{"tur":"mulk_basina_al","deger":100,"ust":5},"ogren":"İstimâlet, fethedilen yerlerdeki halkın gönlünü kazanmaya yönelik uzlaştırıcı Osmanlı fetih siyasetiydi.","tema":"Fetih siyaseti","kaynak":["https://islamansiklopedisi.org.tr/istimalet"],"kazanim":"TAR.10.2.4","v1_tutar":150},{"id":"F08","deste":"ferman","baslik":"İskân Hükmü","metin":"Devlet, Rumeli'de fethedilen topraklara Anadolu'dan aileler yerleştirdi; köyler kuruldu, tarlalar ekildi. Her tapun için Hazine'den 50 akçe al (en çok 5 tapu).","etki":{"tur":"mulk_basina_al","deger":50,"ust":5},"ogren":"Osmanlılar fethedilen yerleri yurt edinmek için Anadolu'dan nüfus taşıdı; bu zorunlu iskâna 'sürgün' de denirdi.","tema":"Fetih siyaseti","kaynak":["https://islamansiklopedisi.org.tr/iskan"],"kazanim":"TAR.10.2.4","v1_tutar":100},{"id":"F09","deste":"ferman","baslik":"Fransa'ya Ahidname (1569)","metin":"II. Selim, Fransız tüccarlarına Osmanlı limanlarında ticaret ayrıcalıkları tanıyan ahidnameyi verdi (1569); Akdeniz ticareti canlandı. Her limanın için Hazine'den 150 akçe al.","etki":{"tur":"liman_basina_al","deger":150,"ust":5},"ogren":"Kapitülasyonlar, padişahın yabancı devlet tüccarlarına ahidnameyle tanıdığı ticari ayrıcalıklardı; sonraki yüzyıllarda aleyhe işledi.","tema":"Ticaret","kaynak":["https://islamansiklopedisi.org.tr/imtiyazat"],"kazanim":"TAR.10.3.1","v1_tutar":250},{"id":"F10","deste":"ferman","baslik":"Kırkçeşme Suyolları","metin":"Kanûnî'nin emriyle Mimar Sinan, Kırkçeşme suyollarını ve kemerlerini yaptı; İstanbul'un çeşmelerine bol su geldi. Suyollarının bakımına katkı olarak her imar kademen için Hazine'ye 50 akçe öde (en çok 5).","etki":{"tur":"imar_basina_ver","deger":50,"ust":5},"ogren":"Belgrad ormanlarından toplanan sular, Sinan'ın yaptığı kemerlerle İstanbul'a taşındı; bu tesislere Kırkçeşme suları denir.","tema":"Şehir ve su","kaynak":["https://islamansiklopedisi.org.tr/kirkcesme-sulari"],"kazanim":"TAR.10.3.5","v1_tutar":100},{"id":"F11","deste":"ferman","baslik":"İstanbul Rasathanesi (1577)","metin":"III. Murad'ın desteğiyle Takiyüddin, İstanbul'da gözlem aletleriyle donatılmış bir rasathane kurdu. Aletlerin yapımına katkı olarak Hazine'ye 150 akçe öde.","etki":{"tur":"para_ver","deger":150},"ogren":"Takiyüddin'in rasathanesi 1577'de çalışmaya başladı ve 1580'de yıktırıldı; burada yeni gözlem cetvelleri hazırlandı.","tema":"İlim","kaynak":["https://islamansiklopedisi.org.tr/takiyyuddin-er-rasid"],"kazanim":"TAR.10.3.5","v1_tutar":300},{"id":"F12","deste":"ferman","baslik":"Matbaa İzni (1727)","metin":"İbrahim Müteferrika'ya verilen izinle İstanbul'da matbaa kuruldu; ilk kitap 1729'da basıldı. Şehirlerindeki medreseler kitaba kavuştu: her imar kademen için Hazine'den 50 akçe al (en çok 5).","etki":{"tur":"imar_basina_al","deger":50,"ust":5},"ogren":"Müteferrika matbaasında sözlük, tarih ve coğrafya kitapları basıldı; ilk basılan kitap Vankulu Lügati'dir.","tema":"İlim","kaynak":["https://islamansiklopedisi.org.tr/muteferrika-matbaasi","https://islamansiklopedisi.org.tr/ibrahim-muteferrika"],"kazanim":"TAR.11.1.2","v1_tutar":100},{"id":"F13","deste":"ferman","baslik":"Îrâd-ı Cedîd Hazinesi","metin":"III. Selim, yeni ordu Nizâm-ı Cedîd'in masrafları için Îrâd-ı Cedîd adlı ayrı bir hazine kurdu; yeni gelir kaynakları bulundu, vergiler artırıldı. Hazine'ye 200 akçe öde.","etki":{"tur":"para_ver","deger":200},"ogren":"Îrâd-ı Cedîd Hazinesi, Nizâm-ı Cedîd (1792–1807) döneminde yeni askerî teşkilatın giderleri için kuruldu.","tema":"Maliye","kaynak":["https://islamansiklopedisi.org.tr/nizam-i-cedid"],"kazanim":"TAR.11.2.2","v1_tutar":400},{"id":"F14","deste":"ferman","baslik":"Karantina Uygulaması (1838)","metin":"Salgınlara karşı İstanbul'da karantina teşkilatı kuruldu (1838); limanlara gelen gemiler bir süre bekletildi, ticaret yavaşladı. Her limanın için Hazine'ye 100 akçe öde.","etki":{"tur":"liman_basina_ver","deger":100,"ust":5},"ogren":"Osmanlı'da karantina 1838'de kurumsallaştı; limanlarda ve sınırlarda karantina merkezleri açıldı.","tema":"Sağlık","kaynak":["https://islamansiklopedisi.org.tr/karantina"],"kazanim":"TAR.11.2.3","v1_tutar":200},{"id":"F15","deste":"ferman","baslik":"Tanzimat Fermanı (1839)","metin":"Gülhane'de okunan Tanzimat Fermanı can, mal ve namus güvencesi verdi; vergilerin herkesin gelirine göre alınacağını bildirdi. Her tapun için Hazine'ye 100 akçe öde (en çok 5 tapu).","etki":{"tur":"mulk_basina_ver","deger":100,"ust":5},"ogren":"Tanzimat Fermanı 1839'da Abdülmecid döneminde ilan edildi; kanun önünde eşitlik ilkesini getirdi.","tema":"Hukuk ve teşkilat","kaynak":["https://islamansiklopedisi.org.tr/tanzimat"],"kazanim":"TAR.11.2.2","v1_tutar":150}],"vakca":[{"id":"V00","deste":"vakca","baslik":"İstanbul'un Fethi (1453)","metin":"1453'te II. Mehmed İstanbul'u fethetti; şehir yeni başkent oldu, ticaret canlandı. Fethin bereketiyle her tapun için Hazine'den 150 akçe al (en çok 5 tapu).","etki":{"tur":"mulk_basina_al","deger":150,"ust":5},"ogren":"1453'te II. Mehmed İstanbul'u fethederek Bizans'a son verdi ve şehri Osmanlı başkenti yaptı.","tema":"Fetih","kaynak":["https://islamansiklopedisi.org.tr/mehmed-ii","https://islamansiklopedisi.org.tr/istanbul"],"kazanim":"TAR.10.3.1","v1_tutar":250},{"id":"V01","deste":"vakca","baslik":"Kara Veba (1347–1351)","metin":"1347'de başlayan Kara Veba (tâun) Akdeniz şehirlerini kırıp geçirdi; çarşılar ve atölyeler boşaldı. Her imar kademen için Hazine'ye 150 akçe öde (en çok 5).","etki":{"tur":"imar_basina_ver","deger":150,"ust":5},"ogren":"1347–1351 Kara Veba (tâun) salgını Avrupa ve Akdeniz nüfusunun büyük bölümünü yok etti.","tema":"Salgın","kaynak":["https://islamansiklopedisi.org.tr/taun"],"kazanim":"Tema: salgınlar","v1_tutar":250},{"id":"V02","deste":"vakca","baslik":"Preveze Deniz Zaferi (1538)","metin":"1538'de Barbaros Hayreddin Paşa, Preveze'de Haçlı donanmasını yendi; Akdeniz'de Osmanlı deniz üstünlüğü kuruldu. Her limanın için Hazine'den 150 akçe al.","etki":{"tur":"liman_basina_al","deger":150,"ust":5},"ogren":"1538 Preveze Deniz Zaferi ile Osmanlı, Barbaros komutasında Akdeniz'de üstünlük kazandı.","tema":"Denizcilik","kaynak":["https://islamansiklopedisi.org.tr/preveze-deniz-muharebesi"],"kazanim":"TAR.10.3.1","v1_tutar":300},{"id":"V03","deste":"vakca","baslik":"İstanbul Depremi (1766)","metin":"22 Mayıs 1766'da İstanbul'u sarsan depremde Fatih Camii'nin kubbesi çöktü, pek çok yapı yıkıldı. En yüksek kademeli şehrin bir kademe düşer (eşitlikte fiyatı yüksek olan); bedel ödenmez.","etki":{"tur":"en_degerli_imar_yik","deger":0},"ogren":"III. Mustafa, depremde yıkılan Fatih Camii'ni yeniden yaptırdı; cami 1771'de ibadete açıldı.","tema":"Afet","kaynak":["https://islamansiklopedisi.org.tr/fatih-camii-ve-kulliyesi"],"kazanim":"TAR.11.1.3","v1_tutar":0},{"id":"V04","deste":"vakca","baslik":"İnebahtı Bozgunu (1571)","metin":"1571 İnebahtı'nda (Lepanto) Osmanlı donanması Haçlı (Kutsal İttifak) donanması karşısında ağır kayıp verdi. Her limanın için Hazine'ye 150 akçe öde.","etki":{"tur":"liman_basina_ver","deger":150,"ust":5},"ogren":"İnebahtı'da büyük kayıp veren Osmanlı donanması kısa sürede yeniden kuruldu.","tema":"Denizcilik","kaynak":["https://islamansiklopedisi.org.tr/inebahti-deniz-savasi"],"kazanim":"TAR.10.3.1","v1_tutar":300},{"id":"V05","deste":"vakca","baslik":"Selimiye Camii Tamamlandı (1574)","metin":"Mimar Sinan 'ustalık eserim' dediği Selimiye'yi Edirne'de tamamladı; şehirler imar yarışına girdi. Her imar kademen için Hazine'den 100 akçe al (en çok 5).","etki":{"tur":"imar_basina_al","deger":100,"ust":5},"ogren":"Mimar Sinan, Selimiye Camii'ni 1574'te Edirne'de tamamladı ve onu ustalık eseri saydı.","tema":"Mimari","kaynak":["https://islamansiklopedisi.org.tr/selimiye-camii-ve-kulliyesi--edirne"],"kazanim":"TAR.10.3.5","v1_tutar":200},{"id":"V06","deste":"vakca","baslik":"Kıtlık Yılları","metin":"16. yüzyılın sonunda Anadolu'da köylülerin bir kısmı toprağını bıraktı, kıtlık baş gösterdi, fiyatlar yükseldi; vergiler ödenemez oldu. Her tapun için Hazine'ye 100 akçe öde (en çok 5 tapu).","etki":{"tur":"mulk_basina_ver","deger":100,"ust":5},"ogren":"Kıtlık ve pahalılık, 16. yüzyıl sonunda Anadolu'da yayılan Celâlî isyanlarının ortamını besleyen etkenlerdendi.","tema":"Afet","kaynak":["https://islamansiklopedisi.org.tr/celali-isyanlari"],"kazanim":"TAR.10.3.4","v1_tutar":200},{"id":"V07","deste":"vakca","baslik":"Bereketli Hasat Yılı","metin":"Yağmurların vaktinde yağdığı bir yılda ambarlar doldu, köyler bollukla şenlendi. Her tapun için Hazine'den 100 akçe al (en çok 5 tapu).","etki":{"tur":"mulk_basina_al","deger":100,"ust":5},"ogren":"Osmanlı ekonomisi büyük ölçüde tarıma dayanırdı; bereketli yıllar vergi gelirini doğrudan artırırdı.","tema":"Tarım","kaynak":["https://islamansiklopedisi.org.tr/timar"],"kazanim":"TAR.10.2.3","v1_tutar":200},{"id":"V08","deste":"vakca","baslik":"Korsan Baskını","metin":"Malta şövalyelerinin gemileri kıyı limanlarını vurdu, tüccar gemileri yağmalandı. Her limanın için Hazine'ye 150 akçe öde.","etki":{"tur":"liman_basina_ver","deger":150,"ust":5},"ogren":"Akdeniz'de korsanlık, 16. yüzyılda hem Hristiyan hem Müslüman taraflarca sürdürülen yaygın bir tehditti.","tema":"Denizcilik","kaynak":["https://islamansiklopedisi.org.tr/malta"],"kazanim":"Tema: Akdeniz ticareti","v1_tutar":250},{"id":"V09","deste":"vakca","baslik":"Hudutta Esir Düştün","metin":"Bir sefer dönüşü hudut boyunda düşman baskıncılarına yakalandın; fidye ödenene dek esarette kalacaksın. Doğruca Yedikule'nin 1. esaret hücresine git; ulûfe alma.","etki":{"tur":"esarete_git","deger":0},"ogren":"Hudut bölgelerinde baskınlarda esir alıp fidye karşılığı serbest bırakmak yaygın bir uygulamaydı.","tema":"Hudut","kaynak":["https://islamansiklopedisi.org.tr/akinci"],"kazanim":"TAR.10.2.4","v1_tutar":0},{"id":"V10","deste":"vakca","baslik":"Şed ve Peştamal Kuşanma","metin":"Ahi geleneğine bağlı esnaf, teşkilata katılanlara törenle şed ve peştamal kuşattı; meslek ahlakı ve el emeği değer kazandı. Her imar kademen için Hazine'den 100 akçe al (en çok 5).","etki":{"tur":"imar_basina_al","deger":100,"ust":5},"ogren":"Ahilik, 13. yüzyıldan itibaren Anadolu'da esnaf ve sanatkârların ahlakını ve üretimini düzenleyen teşkilattı.","tema":"Ahilik ve esnaf","kaynak":["https://islamansiklopedisi.org.tr/ahilik"],"kazanim":"TAR.10.1.3","v1_tutar":150},{"id":"V11","deste":"vakca","baslik":"Sadaka Taşı","metin":"Mahalledeki sadaka taşına varlıklılar gizlice akçe bırakır, muhtaçlar ihtiyacı kadarını alırdı. Sen de bıraktın: nakdi en az olan rakibine 150 akçe bağışla; en az nakit sendeyse bağış yok.","etki":{"tur":"en_yoksula_ver","deger":150},"ogren":"Sadaka taşında veren ile alan birbirini görmezdi; böylece yardım alan kimse mahcup olmazdı.","tema":"Hayır ve dayanışma","kaynak":["https://islamansiklopedisi.org.tr/sadaka"],"kazanim":"TAR.10.2.4","v1_tutar":300},{"id":"V12","deste":"vakca","baslik":"Surre Alayına Bağış","metin":"Haremeyn'e gidecek surre alayı için bağışta bulundun; akçen surre kesesine kondu. Hazine'ye 150 akçe öde.","etki":{"tur":"para_ver","deger":150},"ogren":"Surre, hac zamanı Haremeyn halkına dağıtılmak üzere her yıl İstanbul'dan gönderilen para ve hediyelerdi.","tema":"Hayır ve dayanışma","kaynak":["https://islamansiklopedisi.org.tr/surre"],"kazanim":"TAR.10.3.1","v1_tutar":300},{"id":"V13","deste":"vakca","baslik":"Nilüfer Hatun İmareti","metin":"I. Murad, annesi Nilüfer Hatun adına İznik'te bir imaret yaptırdı; burada yolculara ve yoksullara yemek verilirdi. Yolun düştü, ağırlandın: Hazine'den 100 akçe al.","etki":{"tur":"para_al","deger":100},"ogren":"Nilüfer Hatun, Orhan Gazi'nin eşi ve I. Murad'ın annesidir; İznik'teki imaret bugün müze olarak kullanılır.","tema":"Kadın vakıfları","kaynak" R.10.2.5","kazanim":"TAR.10.2.5","sehre_bagli":3},{"id":"KS04","seviye":"orta","soru":"Osman Bey uç merkezini İznik'e yakın Yenişehir'e taşıdığında pâyitahtını hangi şehre nakletti?","secenekler":["Bilecik","Söğüt","Bursa","Edirne"],"dogru":0,"aciklama":"TDV'ye göre Osman Bey pâyitahtı Karacahisar'dan Bilecik'e, uç merkezini İznik'e yakın Yenişehir'e taşıdı. Bursa 1326'da, Edirne I. Murad devrinde alındı.","kaynak":["https://islamansiklopedisi.org.tr/osman-i"],"kat":{"slug":"kurulus-beylik","ad":"Kuruluş ve Beylik"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":4},{"id":"KS05","seviye":"orta","soru":"Osman Bey'in İnegöl'ü alan silah arkadaşına yurt olarak verdiği bölgeye hangi ad verildi?","secenekler":["Koca-ili","Turgut-ili","Karesi-ili","Aydın-ili"],"dogru":1,"aciklama":"TDV Osman I maddesine göre İnegöl'ü fetheden Turgut Alp'e bölge yurt olarak verildi ve Turgut-ili diye anıldı. Koca-ili İzmit çevresinin adıdır.","kaynak":["https://islamansiklopedisi.org.tr/osman-i"],"kat":{"slug":"kurulus-beylik","ad":"Kuruluş ve Beylik"},"konu":"TAR.10.2.3","kazanim":"TAR.10.2.3","sehre_bagli":5},{"id":"KS06","seviye":"kolay","soru":"Bir malın gelirini hayır hizmetlerine süresiz ayıran vakfın şartlarının yazıldığı belgeye ne ad verilir?","secenekler":["Berat","Ferman","Vakfiye","Tahrir defteri"],"dogru":2,"aciklama":"Vakfın amacı, gelirleri ve görevlileri vakfiyede yazılır. Günümüze ulaşan en eski Osmanlı vakfiyelerinden biri 1323 tarihli Asporça Hatun vakfiyesidir.","kaynak":["https://islamansiklopedisi.org.tr/vakif","https://islamansiklopedisi.org.tr/orhan","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.2.4","kazanim":"TAR.10.2.4","sehre_bagli":6},{"id":"KS07","seviye":"orta","soru":"Orhan Bey 1326'da Bursa'yı hangi yolla aldı?","secenekler":["Depremle yıkılan surlardan girildi","Gemiler karadan yürütülerek kuşatıldı","Donanma limana girince şehir teslim oldu","Uzun süren abluka sonunda şehir teslim oldu"],"dogru":3,"aciklama":"TDV'ye göre on yılı aşan abluka halkı açlığa düşürdü ve şehir 6 Nisan 1326'da teslim edildi. Deprem Gelibolu'nun, gemilerin karadan yürütülmesi İstanbul'un fethiyle ilgilidir.","kaynak":["https://islamansiklopedisi.org.tr/bursa","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":7},{"id":"KS08","seviye":"orta","soru":"Günümüze ulaşan ilk Osmanlı akçeleri hangi hükümdar adına basılmıştır?","secenekler":["Orhan Bey","Osman Bey","I. Murad","Yıldırım Bayezid"],"dogru":0,"aciklama":"Bilinen ilk Osmanlı gümüş sikkeleri Orhan Bey'e aittir; birinde 727 (1326–27) tarihi vardır. Osman Bey'e ait olduğu ileri sürülen bir sikke tartışmalıdır.","kaynak":["https://islamansiklopedisi.org.tr/akce"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.2.3","kazanim":"TAR.10.2.3","sehre_bagli":8},{"id":"KS09","seviye":"kolay","soru":"Olayları yıl yıl anlatan Osmanlı tarih kitaplarına ne ad verilir?","secenekler":["Kanunname","Vekâyi'nâme","Tahrir defteri","Vakfiye"],"dogru":1,"aciklama":"Vak'a 'olay' demektir; olayları sırasıyla anlatan eserlere vekāyi'nâme denir. Kanunname hukuk, tahrir defteri nüfus ve vergi, vakfiye vakıf belgesidir.","kaynak":["https://islamansiklopedisi.org.tr/vakanuvis"],"kat":{"slug":"ilim-kultur-sanat","ad":"İlim, Kültür ve Sanat"},"konu":"TAR.10.3.5","kazanim":"TAR.10.3.5","sehre_bagli":9},{"id":"KS10","seviye":"orta","soru":"Orhan Bey'in İznik'te açtığı ilk Osmanlı medresesinde müderrislik yapan âlim kimdir?","secenekler":["Molla Fenârî","Ali Kuşçu","Dâvûd-i Kayserî","Ebussuûd Efendi"],"dogru":2,"aciklama":"TDV Orhan maddesine göre İznik'teki ilk medresede Dâvûd-i Kayserî görev yaptı (1333). Ali Kuşçu Fatih, Ebussuûd Efendi Kanûnî döneminde öne çıktı.","kaynak":["https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/iznik","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"ilim-kultur-sanat","ad":"İlim, Kültür ve Sanat"},"konu":"TAR.10.2.5","kazanim":"TAR.10.2.5","sehre_bagli":10},{"id":"KS11","seviye":"kolay","soru":"Osmanlı fermanlarının başında yer alan ve padişahın imzası yerine geçen alamete ne ad verilir?","secenekler":["Hatt-ı hümâyun","Berat","Sikke","Tuğra"],"dogru":3,"aciklama":"Ferman, üzerinde tuğra bulunan padişah buyruğudur; tuğrayı çoğunlukla nişancı çekerdi. Hatt-ı hümâyun padişahın kendi el yazısıyla yazdığı emirdir.","kaynak":["https://islamansiklopedisi.org.tr/ferman"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.3.2","kazanim":"TAR.10.3.2","sehre_bagli":11},{"id":"KS12","seviye":"orta","soru":"1337'de alınan İzmit'in idaresi Orhan Bey'in hangi oğluna verildi?","secenekler":["Süleyman Paşa","Şehzade Murad","Şehzade Halil","Çandarlı Kara Halil"],"dogru":0,"aciklama":"TDV'ye göre İzmit'in idaresi Süleyman Paşa'ya bırakıldı; Süleyman Paşa sonra Rumeli'ye geçişi yönetti. Çandarlı Kara Halil bir kadı ve devlet adamıdır, Orhan Bey'in oğlu değildir.","kaynak":["https://islamansiklopedisi.org.tr/izmit","https://islamansiklopedisi.org.tr/orhan"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":12},{"id":"KS13","seviye":"orta","soru":"1354'te Gelibolu'nun Osmanlılar tarafından kolayca alınmasını sağlayan olay hangisidir?","secenekler":["Venedik ile yapılan bir antlaşma","Surları yıkan büyük bir deprem","Bizans'ın şehri satması","Limanın donanmayla kuşatılması"],"dogru":1,"aciklama":"2 Mart 1354 depremi surları yıktı, halkın bir kısmı şehri terk etti; Süleyman Paşa boş kalan kaleye girdi. Kesin Osmanlı hâkimiyeti 1376'da başladı.","kaynak":["https://islamansiklopedisi.org.tr/gelibolu","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":13},{"id":"KS14","seviye":"kolay","soru":"Osmanlı'da gümrük resmi hangi mallardan alınırdı?","secenekler":["Sınırlardan ve iskelelerden geçen ticari mallardan","Toprağın ürününden","Gayrimüslim erkeklerden kişi başına","Olağanüstü durumlarda hanelerden"],"dogru":0,"aciklama":"Gümrük resmi ticari mallardan alınır. Öşür toprak ürününden, cizye gayrimüslimlerden alınan şer'î vergi, avârız olağanüstü hâne vergisidir.","kaynak":["https://islamansiklopedisi.org.tr/gumruk"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.3.2","kazanim":"TAR.10.3.2","sehre_bagli":14},{"id":"KS15","seviye":"orta","soru":"Edirne'nin fethinde Şehzade Murad ile birlikte harekâtı yöneten ve ilk Rumeli beylerbeyi sayılan komutan kimdir?","secenekler":["Evrenos Bey","Çandarlı Kara Halil","Timurtaş Paşa","Lala Şâhin Paşa"],"dogru":3,"aciklama":"TDV'ye göre Edirne, Şehzade Murad ile Lala Şâhin'in sistemli fetih siyasetiyle alındı. Lala Şâhin Filibe'yi de alan ilk Rumeli beylerbeyidir.","kaynak":["https://islamansiklopedisi.org.tr/edirne","https://islamansiklopedisi.org.tr/filibe","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":15},{"id":"KS16","seviye":"orta","soru":"Osmanlı'da olayları devlet adına kaydeden resmî tarihçiye vak'anüvis denirdi. Bu görevi ilk üstlenen tarihçi kabul edilen kimdir?","secenekler":["Naîmâ","Evliya Çelebi","Kâtib Çelebi","Pîrî Reis"],"dogru":0,"aciklama":"Vak'anüvislik XVIII. yüzyıl başında Naîmâ ile resmîleşti. Evliya Çelebi seyyah, Kâtib Çelebi âlim, Pîrî Reis denizci ve haritacıydı.","kaynak":["https://islamansiklopedisi.org.tr/vakanuvis"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.3.2","kazanim":"TAR.10.3.2","sehre_bagli":16},{"id":"KS17","seviye":"zor","soru":"Filibe'yi alan ilk Rumeli beylerbeyi Lala Şâhin, Meriç ovasında hangi tarımı başlatmasıyla anılır?","secenekler":["Pamuk","Çeltik (pirinç)","Tütün","Zeytin"],"dogru":1,"aciklama":"TDV'ye göre Lala Şâhin Meriç üzerine köprü yaptırdı ve şehrin kuzeyindeki araziye pirinç ektirerek çeltik ziraatını bölgeye tanıttı.","kaynak":["https://islamansiklopedisi.org.tr/filibe","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"kurulus-beylik","ad":"Kuruluş ve Beylik"},"konu":"TAR.10.2.4","kazanim":"TAR.10.2.4","sehre_bagli":17},{"id":"KS18","seviye":"zor","soru":"Rumeli beylerbeyinin oturduğu Sofya sancağına Osmanlı döneminde hangi ad verilirdi?","secenekler":["Dârülcihad","Dârü's-saltana","Livâ-i paşa","Pâyitaht-ı kadîm"],"dogru":2,"aciklama":"Eyaletin en yüksek idarecisi beylerbeyi Sofya'da oturduğu için bu sancak 'livâ-i paşa' (paşa sancağı) diye anılırdı. Dârülcihad sınır şehri Belgrad için kullanılırdı.","kaynak":["https://islamansiklopedisi.org.tr/sofya","https://islamansiklopedisi.org.tr/belgrad"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.3.2","kazanim":"TAR.10.3.2","sehre_bagli":18},{"id":"KS19","seviye":"orta","soru":"Selçuklu kervansaraylarında yolcular kaç gün boyunca kurucunun misafiri sayılır ve ücret ödemezdi?","secenekler":["Bir hafta","Kırk gün","Bir ay","Üç gün"],"dogru":3,"aciklama":"TDV Kervansaray maddesine göre vakıf olarak yapılan kervansaraylarda yolcular üç gün kurucunun misafiri sayılır, kendilerinden ücret alınmazdı.","kaynak":["https://islamansiklopedisi.org.tr/kervansaray"],"kat":{"slug":"ilim-kultur-sanat","ad":"İlim, Kültür ve Sanat"},"konu":"TAR.10.1.3","kazanim":"TAR.10.1.3","sehre_bagli":19},{"id":"KS20","seviye":"orta","soru":"Üsküp'ü alan uç beyi Paşa Yiğit, Anadolu'nun hangi bölgesinden getirdiği Türkmenleri şehre yerleştirdi?","secenekler":["Saruhan","Karaman","Dulkadir","Candar"],"dogru":0,"aciklama":"TDV Üsküp maddesine göre Paşa Yiğit Bey Saruhan bölgesinden Türkmenleri getirip Üsküp ve çevresine yerleştirdi; bu iskân şehri önemli bir uç merkezi yaptı.","kaynak":["https://islamansiklopedisi.org.tr/uskup","https://tymm.meb.gov.tr/tarih-dersi/unite/39"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.4","kazanim":"TAR.10.2.4","sehre_bagli":20},{"id":"KS21","seviye":"zor","soru":"Arazi işleriyle ilgili fermanların müsveddesini daima hangi görevli hazırlardı?","secenekler":["Defterdar","Nişancı","Kazasker","Kaptanıderya"],"dogru":1,"aciklama":"TDV Ferman maddesine göre arazi meselelerine dair fermanların müsveddesi daima nişancı tarafından hazırlanırdı; fermanın tuğrasını da çoğunlukla nişancı çekerdi.","kaynak":["https://islamansiklopedisi.org.tr/ferman"],"kat":{"slug":"devlet-teskilat","ad":"Devlet ve Teşkilat"},"konu":"TAR.10.3.2","kazanim":"TAR.10.3.2","sehre_bagli":21},{"id":"KS22","seviye":"orta","soru":"1396 Niğbolu Savaşı'nda Yıldırım Bayezid hangi hükümdarın komutasındaki Haçlı ordusunu yendi?","secenekler":["János Hunyadi","Lehistan Kralı Vladislav","Macar Kralı Sigismund","Sırp Despotu Lazar"],"dogru":2,"aciklama":"TDV'ye göre Niğbolu'yu kuşatan Haçlı ordusu Kral Sigismund komutasındaydı. Hunyadi ve Vladislav Varna (1444), Lazar I. Kosova (1389) dönemlerinin adlarıdır.","kaynak":["https://islamansiklopedisi.org.tr/nigbolu","https://islamansiklopedisi.org.tr/bayezid-i"],"kat":{"slug":"fetihler-ordu","ad":"Fetihler ve Ordu"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":22},{"id":"KS23","seviye":"orta","soru":"Yıldırım Bayezid, 1398'de Osmanlı topraklarına kattığı Amasya'nın idaresini hangi şehzadesine verdi?","secenekler":["Süleyman Çelebi","İsa Çelebi","Musa Çelebi","Çelebi Mehmed"],"dogru":3,"aciklama":"Bayezid Amasya'yı oğlu Çelebi Mehmed'e verdi. Ankara Savaşı'ndan (1402) sonra Çelebi Mehmed kardeşleriyle mücadeleye Amasya'dan başladı ve 1413'te tek hükümdar oldu.","kaynak":["https://islamansiklopedisi.org.tr/amasya","https://islamansiklopedisi.org.tr/mehmed-i"],"kat":{"slug":"sahsiyetler","ad":"Önemli Şahsiyetler"},"konu":"TAR.10.2.2","kazanim":"TAR.10.2.2","sehre_bagli":23},{"id":"KS24","seviye":"kolay","soru":"Bedestenlerin Osmanlı şehir çarşısındaki başlıca işlevi neydi?","secenekler":["Değerli malların satılıp korunduğu güvenli

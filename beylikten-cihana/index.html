asyonla ayarlanmış parametreler","tarih":"2026-09-30","uretici":"motor/sim/ayar-tara.js + motor/sim/gorev-analiz.js (gerçek motor ve botlar)","not":"derle.py bu dosyadaki 'yamalar' (kurallar yolu → değer) ve 'gorev_cp' değerlerini oyun-verisi.json'a uygular. Ölçümler motor/sim/SONUC.md'de. Botlarla ölçüldü; insan masasında doğrulanmadı (tahmin).","kararlar":["Gizli görev CP'leri 1-5 (bkz. gorev_cp); 4-6 oyunculu Aile'de 'yarıdaki CP lideri kazanır' %45-47 → ≈%38-40.","CP hedefleri ekonomi raporunun önerisi olarak korundu (Aile 7/7/6/6/7, Ders 4/5/5/5/4, Usta 4-6 oyuncuda +1): hedefi yükseltmek lider oranını düşürmedi, oyunu uzattı.","Ders 6 takımda son iki takıma ek başlangıç tapusu verilmez: motorda bu kural 5.-6. koltuğu %21'e çıkarıyordu (sapma 4,5); ek tapu olmadan sapma 1,3 (4.000 oyun).","Ders: 'Cihan!' en erken 4. turda denir (cihan_asgari_tur 4) ve gizli görev CP'leri yarıya iner, en az 1 (gorev_cp_carpani 0,5). Önceki hâlde 5-6 takımda oyunların %29-47'si 2. turda bitiyordu, 'Cihan!' diyen %41-51 kaybediyordu; yeni hâlde 2. turda biten 0, ortalama el 18-28, 'Cihan!' diyen kaybeder %11-30 (800 oyun × 5 masa, karışık bot; denetim t1 #2). İnsan masasında doğrulanmadı (tahmin).","Aile tempo (denetim t2 #1, 'Külliye koşusu'): Aile'de 'Cihan!' en erken 5. turda denir (cihan_asgari_tur 5) ve CP modlarında (Aile, Ders, Usta) bir elde en çok 3 imar yapılır (el_imar_ust 3). Önceki hâlde 5 oyunculu Aile'de oyunların %4,8'i ≤3 turda, %12,5'i ≤4 turda bitiyordu ve Söğüt+Domaniç Külliye koşusuyla 1. turda 'Cihan!' denebiliyordu; yeni hâlde ≤4 turda biten %0, 'yarıdaki CP lideri kazanır' 4-5 oyuncuda %45,5/%42,3 → %43,5/%40,5 (karışık bot, 400 oyun × masa; tüm-orta sonuçları SONUC.md'de). Ders'te imar sınırı lider oranını 2-4 puan düşürdü, tempoyu değiştirmedi. İnsan masasında doğrulanmadı (tahmin).","İkinci kalite dalgası (30 Eyl 2026): gizli görevlerde '3 çek, 2 tut' (kurulumda her oyuncu 3 Ferman-ı Hümâyun çeker, 2'sini tutar, 1'ini destenin altına koyar). Seçim olunca su","saltanat":"1302–1324 (geleneksel başlangıç 1299)","renk_adi":"Zeytin Yeşili","hex":"#7F9E36","sehirler":["Bilecik","Yenişehir","İnegöl"],"kareler":[3,4,5],"fiyat":1100,"imar_bedeli":800,"cp":2,"set_aciklama":"Osman Bey'in Bitinya tekfurlarından aldığı ilk şehirler (rivayette 1299).","padisah_karti":"Osman Bey, Söğüt'teki uç beyliğini Bilecik, Yenişehir ve İnegöl'e doğru büyüttü; Osmanlı rivayeti bu fetihleri 1299'a bağlar, TDV ise 1288–1299 arasına yayar. 1302'de Koyunhisar'da (Bafeus) Bizans kuvvetlerini yendi. Devlet adını ondan alır; 1323–1324 arasında vefat etti.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/osman-i","https://islamansiklopedisi.org.tr/orhan"]},{"id":"S3","no":"III","padisah":"Orhan Gazi","unvan":"Bursa'nın Fatihi","ad":"Orhan Gazi · Bursa'nın Fatihi","saltanat":"1324–1362","renk_adi":"İznik Kobaltı","hex":"#224397","sehirler":["Bursa","İznik","İzmit"],"kareler":[7,10,12],"fiyat":1300,"imar_bedeli":800,"cp":2,"set_aciklama":"Orhan Bey'in Bitinya'da aldığı üç büyük Bizans şehri (1326–1337).","padisah_karti":"Orhan Bey (1324–1362) Bursa, İznik ve İzmit'i alarak beyliği Marmara kıyılarına taşıdı. Bilinen ilk Osmanlı akçeleri onun adınadır; İznik'te ilk medreseyi, Bursa'da ilk büyük külliyeyi kurdu. Oğlu Süleyman Paşa'nın 1354'te Gelibolu'yu almasıyla Rumeli'ye geçiş başladı.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/akce","https://islamansiklopedisi.org.tr/gelibolu"]},{"id":"S4","no":"IV","padisah":"I. Murad","unvan":"Hüdâvendigâr","ad":"I. Murad · Hüdâvendigâr","saltanat":"1362–1389","renk_adi":"Erguvan","hex":"#A56BB5","sehirler":["Edirne","Filibe","Sofya"],"kareler":[15,17,18],"fiyat":1700,"imar_bedeli":700,"cp":2,"set_aciklama":"Rumeli'de kalıcı yerleşme: Edirne, Filibe ve Sofya (1360'lar-1380'ler).","padisah_karti":"I. Murad (Hüdâvendigâr; 1362–1389), Edirne'de yaptırdığı sarayla şehri Rumeli'de ikinci merkez yaptı ve komutanlarını buradan uçlara gönderdi. Anadolu'dan sürgünle ya da kendiliğinden gelen yörükler Rumeli'ye yerleşti. 1389'da Kosova'da zafer kazandı; savaş meydanında şehit düşen tek Osmanlı padişahıdır.","not":"Edirne, Orhan'ın sağlığında Şehzade Murad ve Lala Şâhin komutasında alındı (ağırlıklı görüş 1361).","kaynak":["https://islamansiklopedisi.org.tr/murad-i","https://islamansiklopedisi.org.tr/edirne"]},{"id":"S5","no":"V","padisah":"Yıldırım Bayezid","unvan":"Niğbolu Gazisi","ad":"Yıldırım Bayezid · Niğbolu Gazisi","saltanat":"1389–1402","renk_adi":"Kına","hex":"#A8521F","sehirler":["Üsküp","Niğbolu","Amasya"],"kareler":[20,22,23],"fiyat":1700,"imar_bedeli":700,"cp":2,"set_aciklama":"Balkanlar'dan Orta Anadolu'ya hızlı genişleme (1391–1398).","padisah_karti":"Yıldırım Bayezid (1389–1402) Üsküp ve Niğbolu'yu aldı, Batı Anadolu beyliklerini topraklarına kattı. 1396'da Niğbolu'da Haçlı ordusunu yendi; Bursa'da Ulucami'yi (1399) ve bedesteni (1400) yaptırdı. 1402 Ankara Savaşı'nda Timur'a yenilip esir düştü; devlet on yıllık bir fetret yaşadı.","not":"Amasya Yıldırım Bayezid döneminde (1392 ya da 1398; tartışmalı) Osmanlı'ya katıldı ve Fetret Devri'nde de Osmanlı'da kaldı (TDV Amasya). Sivas (1398'de bırakıldı, 1400'de Timur aldı) kalıcı fetih ölçütünü karşılamadığı için çıkarıldı.","kaynak":["https://islamansiklopedisi.org.tr/bayezid-i","https://islamansiklopedisi.org.tr/bursa","https://islamansiklopedisi.org.tr/bedesten"]},{"id":"S6","no":"VI","padisah":"II. Murad","unvan":"Selanik'in Fatihi","ad":"II. Murad · Selanik'in Fatihi","saltanat":"1421–1444, 1446–1451","renk_adi":"Gül Kurusu","hex":"#C77F92","sehirler":["İzmir","Selanik","Yanya"],"kareler":[25,27,28],"fiyat":1900,"imar_bedeli":700,"cp":2,"set_aciklama":"Fetretten sonra Ege'de ve Rumeli'de yeniden toparlanma (1424–1430).","padisah_karti":"II. Murad (1421–1444, 1446–1451) Fetret'ten sonra bozulan düzeni yeniden kurdu; İzmir'i, Selanik'i ve Yanya'yı aldı. Yanya halkına dinî ve malî haklar tanıyan fermanı istimâlet siyasetinin örneğidir. Varna (1444) ve II. Kosova (1448) zaferlerini kazandı, Edirne'de Üç Şerefeli Cami'yi yaptırdı.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/murad-ii","https://islamansiklopedisi.org.tr/yanya","https://islamansiklopedisi.org.tr/edirne"]},{"id":"S7","no":"VII","padisah":"Fatih Sultan Mehmed","unvan":"İstanbul'un Fatihi","ad":"Fatih Sultan Mehmed · İstanbul'un Fatihi","saltanat":"1444–1446, 1451–1481","renk_adi":"Lâl","hex":"#7D1428","sehirler":["İstanbul","Konya","Kayseri"],"kareler":[29,33,34],"fiyat":2100,"imar_bedeli":700,"cp":2,"set_aciklama":"Bizans'ın sonu ve Anadolu birliği: İstanbul, Konya, Kayseri (1453–1474).","padisah_karti":"II. Mehmed (Fatih; 1444–1446, 1451–1481) 29 Mayıs 1453'te İstanbul'u alarak şehri pâyitaht yaptı. Trabzon'u (1461) aldı, Karamanoğulları'nı ortadan kaldırarak Konya ve Kayseri'yi Osmanlı'ya bağladı. Fatih Külliyesi'ndeki Sahn-ı Semân medreseleri ve devlet düzenini yazıya geçiren kanunnamesi onun eseridir.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/mehmed-ii","https://islamansiklopedisi.org.tr/istanbul","https://islamansiklopedisi.org.tr/konya"]},{"id":"S8","no":"VIII","padisah":"Yavuz Sultan Selim","unvan":"Hâdimü'l-Haremeyn","ad":"Yavuz Sultan Selim · Hâdimü'l-Haremeyn","saltanat":"1512–1520","renk_adi":"Zümrüt","hex":"#1F7458","sehirler":["Halep","Şam","Kahire"],"kareler":[35,36,38],"fiyat":2100,"imar_bedeli":600,"cp":2,"set_aciklama":"Mısır Seferi: Memlûk topraklarının Osmanlı'ya geçişi (1516–1517).","padisah_karti":"I. Selim (Yavuz; 1512–1520) 1514'te Çaldıran'da Safevîleri, 1516'da Mercidâbık'ta ve 1517'de Ridâniye'de Memlûkleri yendi. Halep, Şam, Kudüs ve Kahire Osmanlı'ya geçti; Mekke Emîri'nin bağlılık bildirmesiyle Haremeyn'in himayesi üstlenildi ve padişahlar 'hâdimü'l-Haremeyn' unvanını kullanmaya başladı.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/selim-i","https://islamansiklopedisi.org.tr/haremeyn"]},{"id":"S9","no":"IX","padisah":"Kanûnî Sultan Süleyman","unvan":"Belgrad'ın Fatihi","ad":"Kanûnî Sultan Süleyman · Belgrad'ın Fatihi","saltanat":"1520–1566","renk_adi":"Tezhip Altını","hex":"#D1AE66","sehirler":["Belgrad","Bağdat","Basra"],"kareler":[41,43,45],"fiyat":2300,"imar_bedeli":600,"cp":2,"set_aciklama":"Tuna'dan Basra Körfezi'ne: Belgrad, Bağdat ve Basra (1521–1538).","padisah_karti":"I. Süleyman (Kanûnî; 1520–1566) Belgrad'ı (1521) ve Rodos'u (1522) aldı, 1526'da Mohaç'ta Macar ordusunu yendi. Irakeyn Seferi'nde Bağdat'a girdi (1534), Basra bağlılığını bildirdi. Mimar Sinan'a Süleymaniye'yi yaptırdı; 46 yıllık saltanatı 1566'da Sigetvar seferinde sona erdi.","not":null,"kaynak":["https://islamansiklopedisi.org.tr/suleyman-i","https://islamansiklopedisi.org.tr/belgrad","https://islamansiklopedisi.org.tr/bagdat"]}],"kareler":[{"i":0,"tur":"baslangic","ad":"Sefer Meydanı","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":8,"y":9,"kenar":"alt","gorsel":"img/sefermeydani.webp","yeni_gorsel_gerekli":false,"bag":"Başlangıç karesi; her tam turda ulûfe alınır.","kisa":"Sefer kararı alınınca padişah tuğları meydana çıkarılırdı. Buradan her geçişte ulûfe alırsın.","uzun":"Osmanlı'da ordunun sefere çıkmasına karar verilince padişahın tuğları meydana çıkarılır, ilk konak yerine götürülüp otağ-ı hümâyunun önüne dikilirdi. Tuğlar yürüyüşte ve konaklamada birliklerin yerini belli ederdi. Maaşlı askerlere ödenen ücrete ulûfe denirdi; günlük akçe hesabıyla bulunur, 'kıst' adıyla üç ayda bir toptan verilirdi. Oyunda Sefer Meydanı bu düzenli ödemeyi temsil eder: ileri harekette buradan geçen ya da üstüne gelen oyuncu Hazine'den ulûfe alır.","kural":"İleri harekette buradan geçersen ya da üstüne gelirsen Hazine'den ulûfe al. Geri gitmek, yer değiştirmek ve esarete gönderilmek ulûfe vermez.","kaynak":["https://islamansiklopedisi.org.tr/tug","https://islamansiklopedisi.org.tr/ulufe"],"ekonomi":{"ulufe":1000}},{"i":1,"tur":"sehir","ad":"Söğüt","set":"S1","bolge":"anadolu","fetih_yili":null,"fetih_yili_metin":"yurt (XIII. yy ortası-sonu, rivayet)","tartismali":false,"x":9,"y":9,"kenar":"alt","gorsel":"img/sogut.webp","yeni_gorsel_gerekli":false,"bag":"Rivayete göre Selçuklu sultanının Ertuğrul Gazi'ye kışlak olarak verdiği yurt; Ertuğrul Gazi'nin türbesi buradadır.","kisa":"Rivayete göre Ertuğrul Gazi'ye kışlak olarak verilen Söğüt; Osmanlı Beyliği'nin doğduğu uç yurdu.","uzun":"Osmanlı tarihçilerinin ortak rivayetine göre Selçuklu Sultanı Alâeddin, Ertuğrul Gazi'ye Söğüt vadisini kışlak, Domaniç dağlarını yaylak olarak verdi. Söğüt, Ertuğrul Gazi'nin uç yurdu ve oğlu Osman Bey'in ilk idare merkezi oldu. Ertuğrul Gazi'nin muhtemelen Orhan Bey döneminde yapılan türbesi buradadır. Şeyh Edebâli ile Osman, Orhan ve I. Murad'ın vakıflarına Söğüt'ten gelir ayrılmıştı. Kasaba İstanbul'dan Anadolu'ya giden hac yolu üzerindeydi. Bugün Bilecik'e bağlı bir ilçedir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/sogut","https://islamansiklopedisi.org.tr/ertugrul-gazi"],"set_ad":"Ertuğrul Gazi · Uç Yurdu","set_no":"I","tapu_serit":"Kuruluş yurdu: rivayete göre Ertuğrul Gazi'ye verilen kışlak ve yaylak.","ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira":[200,300,700,1500,2300,3000,3600],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":1100,"yapi_satis":700,"muzakere_yarim":[null,null,350,750,1150,1500,1800]}},{"i":2,"tur":"sehir","ad":"Domaniç","set":"S1","bolge":"anadolu","fetih_yili":null,"fetih_yili_metin":"yurt (yaylak, rivayet)","tartismali":false,"x":10,"y":9,"kenar":"alt","gorsel":"img/domanic.webp","yeni_gorsel_gerekli":false,"bag":"Kayı obasının yazları sürülerini çıkardığı yayla; rivayete göre Söğüt ile birlikte yurt olarak verildi.","kisa":"Rivayete göre Söğüt'le birlikte yaylak olarak verilen Domaniç; Kayı obasının yaz yurdu.","uzun":"Osmanlı rivayetine göre Ertuğrul Gazi'nin halkı kışı Söğüt'te geçirir, yazın sürüleriyle Domaniç yaylalarına çıkardı. Bu göç yolu İnegöl ovasından geçtiği için İnegöl tekfuruyla anlaşmazlık doğdu. Rivayete göre Osman Bey, Domaniç beli yakınında İkizce'de Karacahisar ve İnegöl tekfurlarının kuvvetleriyle savaştı (1286); bu, onun ilk büyük savaşı sayılır ve kardeşi Saru Yatı burada hayatını kaybetti. Domaniç Osmanlı döneminde uzun süre nahiye olarak kaldı; 1960'tan beri Kütahya'nın ilçesidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/osman-i","https://islamansiklopedisi.org.tr/ertugrul-gazi","https://islamansiklopedisi.org.tr/sogut","https://www.domanic.gov.tr/kaymakamligimizin-kisa-bir-tarihcesi"],"set_ad":"Ertuğrul Gazi · Uç Yurdu","set_no":"I","tapu_serit":"Kuruluş yurdu: rivayete göre Ertuğrul Gazi'ye verilen kışlak ve yaylak.","ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira":[200,300,700,1500,2300,3000,3600],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":1100,"yapi_satis":700,"muzakere_yarim":[null,null,350,750,1150,1500,1800]}},{"i":3,"tur":"sehir","ad":"Bilecik","set":"S2","bolge":"anadolu","fetih_yili":1299,"fetih_yili_metin":"1299 (Osmanlı rivayeti)","tartismali":true,"x":11,"y":9,"kenar":"alt","gorsel":"img/bilecik.webp","yeni_gorsel_gerekli":false,"bag":"Osmanlı rivayetinde 1299'da Osman Gazi'nin aldığı ve pâyitahtını Karacahisar'dan taşıdığı tekfur şehri.","kisa":"Osmanlı rivayetine göre 1299'da Osman Bey'in aldığı Bilecik; Şeyh Edebâli'nin yaşadığı şehir.","uzun":"Osmanlı kaynaklarına göre bölge tekfurlarının Osman Bey'e hazırladığı tuzak haber alınınca ani bir baskınla Yarhisar ve Bilecik alındı (1299). Osman Bey pâyitahtını Karacahisar'dan Bilecik'e taşıdı, burada bir mescid yaptırdı, Bilecik'in gelirlerini ailesine ayırıp Şeyh Edebâli diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/osman-i","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/bayezid-ii","https://islamansiklopedisi.org.tr/bursa"],"set_ad":"Osman Gazi · Beyliğin Kurucusu","set_no":"II","tapu_serit":"Osman Bey'in Bitinya tekfurlarından aldığı ilk şehirler (rivayette 1299).","ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira":[200,300,800,1700,2600,3300,4000],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":800,"yapi_satis":500,"muzakere_yarim":[null,null,400,850,1300,1650,2000]}},{"i":5,"tur":"sehir","ad":"İnegöl","set":"S2","bolge":"anadolu","fetih_yili":1299,"fetih_yili_metin":"1299 civarı (Osmanlı rivayeti)","tartismali":true,"x":13,"y":9,"kenar":"alt","gorsel":"img/inegol.webp","gorsel_kaynak":"inegol","yeni_gorsel_gerekli":true,"bag":"Osman Gazi'nin silah arkadaşı Turgut Alp'in aldığı ve kendisine yurt olarak verilen kasaba (Turgut-ili).","kisa":"Osman Bey'in silah arkadaşı Turgut Alp'in aldığı İnegöl; bölge uzun süre 'Turgut-ili' diye anıldı.","uzun":"Kayı obasının Söğüt ile Domaniç arasındaki göç yolu İnegöl ovasından geçiyordu; sürüler ekinlere zarar verince İnegöl tekfuruyla çatışma çıktı. Osmanlı rivayetine göre Osman Bey'in ilk akını İnegöl yakınındaki Kulaca Hisarı'na yapıldı (1285). İnegöl'ü alan Turgut Alp'e bölge yurt olarak verildi ve Turgut-ili diye anıldı. Fatih'in vezîriâzamı İshak Paşa'nın cami, medrese ve imaretten oluşan külliyesi şehrin merkezini oluşturdu; vakfiyesi 1486 tarihlidir. Bugün Bursa'ya bağlı bir ilçedir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/osman-i","https://islamansiklopedisi.org.tr/ishak-pasa-kulliyesi","https://islamansiklopedisi.org.tr/bursa"],"set_ad":"Osman Gazi · Beyliğin Kurucusu","set_no":"II","tapu_serit":"Osman Bey'in Bitinya tekfurlarından aldığı ilk şehirler (rivayette 1299).","ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira":[200,300,800,1700,2600,3300,4000],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":800,"yapi_satis":500,"muzakere_yarim":[null,null,400,850,1300,1650,2000]}},{"i":6,"tur":"vakif","ad":"Vakıf","set":null,"bolge":null,"fetih_yili":1323,"fetih_yili_metin":"1323–1324 (ilk vakfiyeler)","tartismali":false,"x":14,"y":9,"kenar":"alt","gorsel":"img/buyukvakif.webp","yeni_gorsel_gerekli":false,"bag":"Günümüze ulaşan en eski Osmanlı vakfiyeleri Asporça Hatun (1323) ve Mekece (1324) vakfiyeleridir; satılmaz, herkese bereket verir.","kisa":"Asporça Hatun vakfiyesi (1323) en eski Osmanlı vakfiyelerindendir. Vakıf satılmaz, herkese bereket verir.","uzun":"Vakıf, bir malın gelirini cami, medrese, imaret, darüşşifa, çeşme ve köprü gibi hayır hizmetlerine süresiz ayırmaktır; Osmanlı uygulamasında vakfedilen mal alınıp satılamaz, miras bırakılamaz. Bilinen en eski Osmanlı vakfiyeleri arasında Asporça Hatun adına düzenlenen 1323 tarihli vakfiye ile Orhan Bey'in Mekece'deki hankahına ait 1324 tarihli vakfiye yer alır. Ağır vergiyi ödeyemeyen mahallelere yardım eden avârız vakıfları da vardı. Oyunda Vakıf'a gelen herkese bereket dağıtır, nakdi en az olana yardım eder.","kural":"Satılmaz, ipotek ve imar edilmez. Gelen oyuncu dahil herkes Hazine'den bereket alır; nakdi en az olana ayrıca yardım verilir. İstersen hayrat yaptırıp Hayır mührü alırsın.","kaynak":["https://islamansiklopedisi.org.tr/vakif","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/avariz-vakfi"],"ekonomi":{"herkese_bereket":100,"en_az_nakitliye_yardim":400,"hayrat_bedeli":2500}},{"i":7,"tur":"sehir","ad":"Bursa","set":"S3","bolge":"anadolu","fetih_yili":1326,"fetih_yili_metin":"6 Nisan 1326","tartismali":false,"x":14,"y":8,"kenar":"sag","gorsel":"img/bursa.webp","yeni_gorsel_gerekli":false,"bag":"On yılı aşan ablukanın ardından 6 Nisan 1326'da Orhan Bey'e teslim oldu; ilk büyük Osmanlı şehri.","kisa":"1326'da Orhan Bey'e teslim olan Bursa; ilk büyük Osmanlı başkenti ve ilk padişahların türbe şehri.","uzun":"On yılı aşan ablukanın ardından Bursa 6 Nisan 1326'da Orhan Bey'e teslim oldu; Bizanslı komutanın İstanbul'a gitmesine izin verildi, metropolit görevini sürdürdü. Orhan Bey 1339–1340'ta kale eteğinde cami, imaret, medrese, hamam ve handan oluşan külliyesini kurdu; bu yapılar şehrin çarşı merkezi oldu. Yıldırım Bayezid'in Ulucami'si (1399) ve bedesteni (1400), Yeşil ve Muradiye külliyeleri onu izledi. Bursa ipek ticaretiyle ünlendi. Tarihî merkezi Cumalıkızık'la birlikte 2014'te UNESCO Dünya Mirası oldu.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/bursa","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/bedesten","https://whc.unesco.org/en/list/1452/"],"set_ad":"Orhan Gazi · Bursa'nın Fatihi","set_no":"III","tapu_serit":"Orhan Bey'in Bitinya'da aldığı üç büyük Bizans şehri (1326–1337).","ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira":[200,400,1100,2200,3400,4400,5300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":800,"yapi_satis":500,"muzakere_yarim":[null,null,550,1100,1700,2200,2650]}},{"i":8,"tur":"tesis","ad":"Darphane","set":null,"bolge":null,"fetih_yili":1327,"fetih_yili_metin":"h. 727 (1326–27) · ilk akçe","tartismali":false,"x":14,"y":7,"kenar":"sag","gorsel":"img/darphane.webp","yeni_gorsel_gerekli":false,"bag":"Günümüze ulaşan ilk Osmanlı akçeleri Orhan Bey adınadır; birinin üzerinde 727 (1326–27) tarihi vardır.","kisa":"Günümüze ulaşan ilk Osmanlı akçeleri Orhan Bey adınadır; birinde 727 (1326–27) tarihi okunur.","uzun":"Darphane, sikkenin basıldığı devlet kurumudur; dârüddarp diye de anılır. Günümüze ulaşan ilk Osmanlı gümüş sikkeleri Orhan Bey adınadır; birinin üzerinde 727 (1326–27) tarihi vardır ve Orhan Bey'in ilk sikkesinin Bursa'da kesildiği bilinir. 'Akçe' adı 'beyaz, parlak' anlamındaki 'ak' kökünden gelir. Bakır para I. Murad döneminde, sultânî denilen altın para ise 1478'de basılmaya başlandı. Oyunun para birimi de akçedir; Darphane tapusu kira getirir ama imar edilmez.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene ya da mezata bırak. Rakibinse kira, sahibinin tesis sayısına göre sabit tablodan okunur. Tesisler imar edilmez, Cihan Puanı vermez.","kaynak":["https://islamansiklopedisi.org.tr/akce","https://islamansiklopedisi.org.tr/darphane"],"ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira_tablosu":[300,800],"muzakere_yarim":[null,400]}},{"i":9,"tur":"vaka","ad":"Vak'a","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":14,"y":6,"kenar":"sag","gorsel":"img/vaka.webp","yeni_gorsel_gerekli":false,"bag":"Olay kartı destesi.","kisa":"Vak'a: şehrin, çarşının ve doğanın olayları. Vak'a destesinden bir kart çek, oku ve uygula.","uzun":"Vak'a Arapça 'olay' demektir; olayları sırasıyla anlatan tarih kitaplarına vekāyi'nâme denirdi. Vak'a destesindeki kartlar devletin kararlarından çok toplumun yaşadıklarını anlatır: salgınlar, yangınlar, depremler, bereketli ya da kıt hasat yılları, çarşıdaki canlanma ya da darlık. Her kartta önce olay, sonra oyun etkisi yazar. Kartla gelen para Hazine'den gelir, ödenen para Hazine'ye gider; hiçbir kart bir oyuncuya başka bir oyuncudan para aldırmaz. Bağış kartında ise kendi nakdinden başkalarına verirsin.","kural":"Vak'a destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Para Hazine'den gelir ya da Hazine'ye gider.","kaynak":["https://islamansiklopedisi.org.tr/vakanuvis"]},{"i":10,"tur":"sehir","ad":"İznik","set":"S3","bolge":"anadolu","fetih_yili":1331,"fetih_yili_metin":"2 Mart 1331 (İbn Kemal: 1333)","tartismali":false,"x":14,"y":5,"kenar":"sag","gorsel":"img/iznik.webp","yeni_gorsel_gerekli":false,"bag":"1329 Pelekanon zaferinden sonra 2 Mart 1331'de teslim oldu; Orhan ilk Osmanlı medresesini burada kurdu.","kisa":"1331'de Orhan Bey'e teslim olan İznik; ilk Osmanlı medreselerinden birinin ve çini atölyelerinin şehri.","uzun":"1329 Pelekanon yenilgisinden sonra yardım alamayan İznik, isteyenin kalıp isteyenin gidebilmesi şartıyla 2 Mart 1331'de Orhan Bey'e teslim oldu. Orhan Bey Çandarlı Kara Halil'i kadı tayin etti, bir imaret ve medrese yaptırdı; ilk medresede Dâvûd-i Kayserî ders verdi. Yeşil Cami (1378–1392) şehrin simgesi oldu. I. Murad 1388'de annesi Nilüfer Hatun adına bir imaret yaptırdı. İznik, İstanbul'un fethinden sonra çini üretimiyle öne çıktı. Bugün Bursa'ya bağlı bir ilçedir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Fethin tarihi kaynaklarda farklıdır: TDV İslâm Ansiklopedisi 2 Mart 1331'i esas alır; Osmanlı tarihçisi İbn Kemal 1333 yılını verir.","kaynak":["https://islamansiklopedisi.org.tr/iznik","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/nilufer-hatun-imareti"],"set_ad":"Orhan Gazi · Bursa'nın Fatihi","set_no":"III","tapu_serit":"Orhan Bey'in Bitinya'da aldığı üç büyük Bizans şehri (1326–1337).","ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira":[200,400,1100,2200,3400,4400,5300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":800,"yapi_satis":500,"muzakere_yarim":[null,null,550,1100,1700,2200,2650]}},{"i":11,"tur":"ferman","ad":"Ferman","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":14,"y":4,"kenar":"sag","gorsel":"img/ferman.webp","yeni_gorsel_gerekli":false,"bag":"Padişah buyruğu kart destesi.","kisa":"Ferman: padişah buyruğu. Ferman destesinden bir kart çek, oku ve uygula.","uzun":"Ferman, Dîvân-ı Hümâyun'da alınan kararlara göre yazılan ve üzerinde padişahın tuğrası bulunan buyruğun genel adıdır. Önemli işler padişaha arz edilir, padişahın kendi eliyle yazdığı emre hatt-ı hümâyun denirdi; ferman bu emir doğrultusunda kaleme alınırdı. Oyundaki Ferman kartları devletin kararlarını ve devletin yaşadığı olayları anlatır: kanunnameler, seferler, cülûs, imar buyrukları. Kart etkisi Hazine üzerinden işler. Af Fermanı kartı elinde kalır ve esaretten çıkmak için kullanılır.","kural":"Ferman destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Af Fermanı kartı sende kalır.","kaynak":["https://islamansiklopedisi.org.tr/ferman"]},{"i":12,"tur":"sehir","ad":"İzmit","set":"S3","bolge":"anadolu","fetih_yili":1337,"fetih_yili_metin":"1337","tartismali":false,"x":14,"y":3,"kenar":"sag","gorsel":"img/izmit.webp","gorsel_kaynak":"izmit","yeni_gorsel_gerekli":true,"bag":"1337'de ahidnâmeyle teslim alındı; kiliselerden biri medreseye çevrildi, idaresi Süleyman Paşa'ya verildi.","kisa":"1337'de Orhan Bey'e geçen İzmit; Süleyman Paşa'nın yönettiği, Koca-ili sancağının merkezi olan şehir.","uzun":"1329'da Pelekanon'da yenilen Bizans, İzmit'i bir süre haraç ödeyerek elinde tuttu; şehir 1337'de Osmanlılar'a geçti ve idaresi Orhan Bey'in oğlu Süleyman Paşa'ya verildi. Kiliselerden biri medreseye çevrildi. Merkezi olduğu Koca-ili sancağıyla İzmit, İstanbul'dan sonraki önemli menzil oldu; Kanûnî İran seferlerinde burada konakladı ve eski tersane yeniden çalıştırıldı. 1579'da tamamlanan Pertev Paşa Külliyesi cami, imaret, mektep, hamam ve kervansaraydan oluşuyordu. Bugün Kocaeli ilinin merkezidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/izmit","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/menzil--osmanli"],"set_ad":"Orhan Gazi · Bursa'nın Fatihi","set_no":"III","tapu_serit":"Orhan Bey'in Bitinya'da aldığı üç büyük Bizans şehri (1326–1337).","ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira":[200,400,1100,2200,3400,4400,5300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":800,"yapi_satis":500,"muzakere_yarim":[null,null,550,1100,1700,2200,2650]}},{"i":13,"tur":"liman","ad":"Gelibolu Limanı","set":null,"bolge":"rumeli","fetih_yili":1354,"fetih_yili_metin":"1354 (kalıcı olarak 1376)","tartismali":false,"x":14,"y":2,"kenar":"sag","gorsel":"img/gelibolu.webp","gorsel_kaynak":"gelibolu","yeni_gorsel_gerekli":true,"bag":"2 Mart 1354 depreminden sonra Süleyman Paşa'nın aldığı ilk Rumeli üssü; 1366–1376 arası Bizans'ta kaldı, 1390'da Yıldırım limanı tahkim ettirdi.","kisa":"1354 depreminden sonra Süleyman Paşa'nın aldığı Gelibolu; Rumeli'ye geçişin ve erken donanmanın üssü.","uzun":"2 Mart 1354'te bir deprem Gelibolu surlarını yıktı; halkın bir kısmı şehri terk etti ve Süleyman Paşa kaleyi kolayca aldı. 1366'da Savoy Dükü Amedeo'nun Haçlı filosu şehri alıp ertesi yıl Bizans'a bıraktı; 1376'da IV. Andronikos kaleyi I. Murad'a teslim etti. 1390'da Yıldırım Bayezid'in emriyle Saruca Paşa kaleyi güçlendirdi, limanın havuzlarını temizletti ve girişini zincirle kapattırdı. 1403'te Clavijo limanda kırk kadar gemi gördü. Pîrî Reis burada doğdu. Bugün Çanakkale'nin ilçesidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene ya da mezata bırak. Rakibinse kira, sahibinin elindeki liman sayısına göre artar. Limanlar imar edilmez, Cihan Puanı vermez.","not_oyuncu":"Gelibolu 1354'te alındı; 1366'da yeniden Bizans'a geçti ve 1376'da kesin olarak Osmanlı'ya katıldı.","kaynak":["https://islamansiklopedisi.org.tr/gelibolu","https://islamansiklopedisi.org.tr/orhan","https://islamansiklopedisi.org.tr/piri-reis"],"ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira_tablosu":[300,700,1300],"muzakere_yarim":[null,350,650]}},{"i":14,"tur":"vergi","ad":"Gümrük","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":14,"y":1,"kenar":"sag","gorsel":"img/vergi.webp","yeni_gorsel_gerekli":false,"bag":"Sınırlardan ve iskelelerden geçen ticari mallardan alınan vergi; Bursa, Edirne gibi şehirlerde kara gümrükleri vardı.","kisa":"Sınırlardan ve iskelelerden geçen ticari mallardan alınan vergi. Tutarı Hazine'ye ödersin.","uzun":"Gümrük, devletler arası ticarette malların sınırda denetlendiği yerdir; bu geçişte alınan vergiye gümrük resmi denir. Osmanlı Devleti'nde dış gümrüklerin yanında şehirler ve bölgeler arasında iç gümrükler de vardı; Avrupa'da XIX. yüzyıl ortasında kalkan iç gümrükler Osmanlı'da XX. yüzyıl başına kadar sürdü. Gümrük geliri gümrük emini denen görevlilerle ya da iltizam usulüyle toplanırdı; bu vergi bâc ve damga adlarıyla da anılırdı. Oyunda ödediğin gümrük Hazine'ye gider, hiçbir yerde birikmez.","kural":"Tutarı Hazine'ye öde; para hiçbir yerde birikmez. Müzakere yapılmaz; nakdin yetmezse yapı sat, ipotek et ya da takasla nakit topla.","kaynak":["https://islamansiklopedisi.org.tr/gumruk"],"ekonomi":{"tutar":600}},{"i":15,"tur":"sehir","ad":"Edirne","set":"S4","bolge":"rumeli","fetih_yili":1361,"fetih_yili_metin":"1361 (tartışmalı: 1361/1362/1367/1369)","tartismali":true,"x":14,"y":0,"kenar":"sag","gorsel":"img/edirne.webp","yeni_gorsel_gerekli":false,"bag":"Orhan'ın sağlığında Şehzade Murad ile Lala Şâhin'in harekâtıyla alındı (ağırlıklı görüş 1361); Rumeli fetihlerinin üssü oldu.","kisa":"1361'de (tartışmalı) Şehzade Murad ile Lala Şâhin'in aldığı Edirne; Rumeli fetihlerinin merkezi.","uzun":"Edirne'nin fetih tarihi tartışmalıdır: 1361, 1362, 1367 ve 1369 ileri sürülür. Ağır basan görüşe göre şehir, Orhan Bey hayattayken Şehzade Murad ile Lala Şâhin'in harekâtıyla 1361'de alındı. I. Murad burada saray yaptırarak Edirne'yi Rumeli'de ikinci merkez yaptı; Ankara Savaşı'ndan (1402) sonra devlet merkezi oldu. Eski Cami, Üç Şerefeli Cami, II. Bayezid'in darüşşifalı külliyesi ve Mimar Sinan'ın 1568–1574'te yaptığı Selimiye şehri süsler. Selimiye 2011'de UNESCO Dünya Mirası oldu.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Fetih için 1361, 1362, 1367 ve 1369 yılları ileri sürülür. Tarihçilere göre I. Murad devrinde asıl merkez bir süre daha Bursa'ydı; Edirne Rumeli'deki ikinci merkezdi.","kaynak":["https://islamansiklopedisi.org.tr/edirne","https://islamansiklopedisi.org.tr/murad-i","https://whc.unesco.org/en/list/1366/"],"set_ad":"I. Murad · Hüdâvendigâr","set_no":"IV","tapu_serit":"Rumeli'de kalıcı yerleşme: Edirne, Filibe ve Sofya (1360'lar-1380'ler).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[300,500,1600,3100,4900,6300,7600],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,800,1550,2450,3150,3800]}},{"i":16,"tur":"vaka","ad":"Vak'a","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":13,"y":0,"kenar":"ust","gorsel":"img/vaka.webp","yeni_gorsel_gerekli":false,"bag":"Olay kartı destesi.","kisa":"Vak'a: şehrin, çarşının ve doğanın olayları. Vak'a destesinden bir kart çek, oku ve uygula.","uzun":"Osmanlı'da devlet adına olayları kaydeden resmî tarihçiye vak'anüvis denirdi. Görevin resmîleşmesi XVIII. yüzyıl başında Sadrazam Amcazâde Hüseyin Paşa döneminde oldu: ilk vak'anüvis sayılan Naîmâ'ya 1702'den önce görev beratı ve günlük 120 akçe maaş verildi. Vak'anüvis orduyla sefere çıkınca yerine bir vekil bırakılırdı. Oyundaki Vak'a kartları da bir vak'anüvisin defteri gibi, masadaki herkesin yaşadığı olayları tarihi ve kaynağıyla anlatır; her kartın altında kısa bir öğrenme notu bulunur.","kural":"Vak'a destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Para Hazine'den gelir ya da Hazine'ye gider.","kaynak":["https://islamansiklopedisi.org.tr/vakanuvis"]},{"i":17,"tur":"sehir","ad":"Filibe","set":"S4","bolge":"rumeli","fetih_yili":1364,"fetih_yili_metin":"1360'lar (tartışmalı: 1361/1364/1360'ların sonu)","tartismali":true,"x":12,"y":0,"kenar":"ust","gorsel":"img/filibe.webp","yeni_gorsel_gerekli":false,"bag":"Lala Şâhin'e eman ile teslim oldu; Rumeli beylerbeyinin uç merkezi oldu.","kisa":"1360'larda Lala Şâhin'e teslim olan Filibe; XV. yüzyılda Rumeli beylerbeyinin merkezi, bugün Plovdiv.","uzun":"Osmanlı tarihçileri Filibe'nin Edirne'den hemen sonra 1361'de alındığını yazar; TDV bu tarihi kesin saymaz, fethi 1360'ların sonuna yerleştirir. Halk direnmeden teslim olunca herkesin yerinde kalmasına izin verildi. İlk Rumeli beylerbeyi Lala Şâhin Meriç üzerine köprü yaptırdı ve ovada çeltik ekimini başlattı. XV. yüzyılın ilk yarısında beylerbeyi merkezi olan şehirde II. Murad'ın Cuma Camii (1425 dolayı) ve Şehâbeddin Paşa'nın İmaret Camii bugün ayaktadır. 1878'den beri Plovdiv adıyla Bulgaristan'ın ikinci büyük şehridir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Osmanlı kronikleri fethi 1361'e, tarihçi Halil İnalcık 1364'e tarihler; TDV İslâm Ansiklopedisi 1360'ların sonunu işaret eder.","kaynak":["https://islamansiklopedisi.org.tr/filibe","https://islamansiklopedisi.org.tr/murad-i"],"set_ad":"I. Murad · Hüdâvendigâr","set_no":"IV","tapu_serit":"Rumeli'de kalıcı yerleşme: Edirne, Filibe ve Sofya (1360'lar-1380'ler).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[300,500,1600,3100,4900,6300,7600],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,800,1550,2450,3150,3800]}},{"i":18,"tur":"sehir","ad":"Sofya","set":"S4","bolge":"rumeli","fetih_yili":1383,"fetih_yili_metin":"1383 (yaygın tarih 1385)","tartismali":true,"x":11,"y":0,"kenar":"ust","gorsel":"img/sofya.webp","gorsel_kaynak":"sofya","yeni_gorsel_gerekli":true,"bag":"1380'lerin başında I. Murad'ın Rumeli seferi sırasında Osmanlı idaresine girdi.","kisa":"1380'lerin başında I. Murad döneminde alınan Sofya; Rumeli beylerbeyinin merkezi, bugün Bulgaristan'ın başkenti.","uzun":"Sofya 1380'lerin başında Osmanlı idaresine girdi; TDV fethin 1383'te I. Murad'ın Rumeli seferi sırasında olduğunu ileri sürer, yaygın kabul 1385'tir. XV. yüzyılın ikinci yarısından itibaren Rumeli beylerbeyi burada oturdu ve sancak 'livâ-i paşa' diye anıldı. Şehir Balkan yolunda bir menzil ve İstanbul'un et ile pirinç ihtiyacının toplandığı bir depo oldu. Beylerbeyi Mahmud Paşa'nın Büyük Cami'si, Yahyâ Paşa'nın bedesteni (1506) ve Mimar Sinan'ın Sofu Mehmed Paşa Külliyesi şehri şekillendirdi. Bugün Bulgaristan'ın başkentidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"TDV İslâm Ansiklopedisi fethi muhtemelen 1383'e tarihler; yaygın kabul 1385'tir.","kaynak":["https://islamansiklopedisi.org.tr/sofya","https://islamansiklopedisi.org.tr/filibe"],"set_ad":"I. Murad · Hüdâvendigâr","set_no":"IV","tapu_serit":"Rumeli'de kalıcı yerleşme: Edirne, Filibe ve Sofya (1360'lar-1380'ler).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[300,500,1600,3100,4900,6300,7600],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,800,1550,2450,3150,3800]}},{"i":19,"tur":"kervansaray","ad":"Kervansaray","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":10,"y":0,"kenar":"ust","gorsel":"img/kervansaray.webp","yeni_gorsel_gerekli":false,"bag":"Osmanlı menzil külliyelerindeki kervansaraylar yol boyunca konak ve güvenlik sağlardı (tematik kare; belirli bir tarihe bağlı değil).","kisa":"Yol üstündeki konak yeri. Ortada biriken para yoktur: Kervan Sorusu'nu cevapla ya da Kılavuz Beratı al.","uzun":"Kervansaraylar ticaret yollarında yolcuları, tüccarları ve hayvanlarını barındıran vakıf yapılarıydı. Selçuklu kervansaraylarında yolcu üç gün boyunca kurucunun misafiri sayılır, ücret ödemezdi; fakir yolculara ayakkabı, hayvanlara yem ve nalbant hizmeti verilirdi. Osmanlılar ıssız yolları şenlendirmek için menzil külliyeleri yaptırdı; Sokullu Mehmed Paşa'nın Havsa ve Payas'taki, Pertev Paşa'nın İzmit'teki külliyeleri bunlardandır. Oyunda Kervansaray'da para havuzu yoktur; bilgi ya da yol kılavuzluğu kazanırsın.","kural":"Satın alınmaz. Birini seç: Kervan Sorusu (doğruysa Hazine'den ödül ve Bilgi mührü) ya da Kılavuz Beratı (sonraki bir elinde 2 Sefer kartından birini oynarsın). İstersen hiçbir şey yapma.","kaynak":["https://islamansiklopedisi.org.tr/kervansaray","https://islamansiklopedisi.org.tr/menzil--osmanli"],"ekonomi":{"kervan_sorusu_odulu":400}},{"i":20,"tur":"sehir","ad":"Üsküp","set":"S5","bolge":"rumeli","fetih_yili":1392,"fetih_yili_metin":"1391 veya 6 Ocak 1392","tartismali":true,"x":9,"y":0,"kenar":"ust","gorsel":"img/uskup.webp","yeni_gorsel_gerekli":false,"bag":"Uç beyi Paşa Yiğit tarafından alındı; Saruhan'dan getirilen Türkmenlerle iskân edildi.","kisa":"1391–92'de Paşa Yiğit Bey'in aldığı Üsküp; Balkan fetihlerinin uç merkezi, bugün Kuzey Makedonya'nın başkenti.","uzun":"Yıldırım Bayezid 1390'da Timurtaş Paşa, Evrenos ve Paşa Yiğit beyleri Sırbistan üzerine gönderdi; Üsküp uç beyi Paşa Yiğit'in akınlarıyla alındı. Osmanlı kronikleri tarih vermez; TDV Bayezid I maddesi 1391, Batılı kaynaklar 6 Ocak 1392 der. Paşa Yiğit Saruhan'dan getirdiği Türkmenleri şehre yerleştirdi; Üsküp, Sırbistan ve Bosna seferlerinin üssü oldu. Sultan Murad (1436) ve Mustafa Paşa (1492) camileri, Kurşunlu Han ve Vardar üzerindeki Taşköprü Osmanlı mirasıdır. Bugün Kuzey Makedonya'nın başkentidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Fetih için 1391 ve 6 Ocak 1392 tarihleri verilir. Üsküp bugün Kuzey Makedonya'nın başşehridir.","kaynak":["https://islamansiklopedisi.org.tr/uskup","https://islamansiklopedisi.org.tr/bayezid-i"],"set_ad":"Yıldırım Bayezid · Niğbolu Gazisi","set_no":"V","tapu_serit":"Balkanlar'dan Orta Anadolu'ya hızlı genişleme (1391–1398).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[400,600,1700,3400,5400,6900,8300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,850,1700,2700,3450,4150]}},{"i":21,"tur":"ferman","ad":"Ferman","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":8,"y":0,"kenar":"ust","gorsel":"img/ferman.webp","yeni_gorsel_gerekli":false,"bag":"Padişah buyruğu kart destesi.","kisa":"Ferman: padişah buyruğu. Ferman destesinden bir kart çek, oku ve uygula.","uzun":"Fermanın hazırlanışı bir ekip işiydi. Divanda karara bağlanan işin müsveddesini konuya göre nişancı, reîsülküttâb ya da divan kâtipleri yazardı; arazi işlerine dair fermanların müsveddesi daima nişancıya aitti. Tuğrayı da çoğunlukla nişancı çekerdi. Kâtipler güvenilir kişiler arasından seçilir, sahte ferman düzenleyen ağır cezaya çarptırılırdı. Fermanlar 'vâcibü'l-imtisâl' gibi sıfatlarla anılır, buyruğa mutlaka uyulacağı belirtilirdi. Ferman kartları bu yazılı buyruk geleneğini oyuna taşır.","kural":"Ferman destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Af Fermanı kartı sende kalır.","kaynak":["https://islamansiklopedisi.org.tr/ferman"]},{"i":22,"tur":"sehir","ad":"Niğbolu","set":"S5","bolge":"rumeli","fetih_yili":1395,"fetih_yili_metin":"1395 (Niğbolu Zaferi 25 Eylül 1396)","tartismali":false,"x":7,"y":0,"kenar":"ust","gorsel":"img/nigbolu.webp","gorsel_kaynak":"nigbolu","yeni_gorsel_gerekli":true,"bag":"Bulgar kralı Şişman'ın son merkezi 1395'te alındı; ertesi yıl Haçlı ordusuna karşı Niğbolu Zaferi burada kazanıldı.","kisa":"1395'te alınan son Bulgar merkezi Niğbolu; 1396'da Yıldırım Bayezid'in Haçlı ordusunu yendiği şehir.","uzun":"Tuna kıyısındaki Niğbolu, son Bulgar kralı İvan Şişman'ın merkeziydi; Bulgar kroniklerine göre 3 Haziran 1395'te Osmanlılar'a geçti. Ertesi yıl Kral Sigismund komutasındaki Haçlı ordusu kaleyi kuşattı; Yıldırım Bayezid bu orduyu 25 Eylül 1396'da Niğbolu yakınında yendi. Bayezid kaleyi onarttı ve bir cuma camii yaptırdı; Kadı İvaz bir medrese ekledi, kaledeki Bulgar askerler Osmanlı garnizonuna alındı. Niğbolu 1395–1878 arasında sancak merkeziydi. Bugün Bulgaristan'da Nikopol adlı bir kasabadır.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/nigbolu","https://islamansiklopedisi.org.tr/bayezid-i"],"set_ad":"Yıldırım Bayezid · Niğbolu Gazisi","set_no":"V","tapu_serit":"Balkanlar'dan Orta Anadolu'ya hızlı genişleme (1391–1398).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[400,600,1700,3400,5400,6900,8300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,850,1700,2700,3450,4150]}},{"i":23,"tur":"sehir","ad":"Amasya","set":"S5","bolge":"anadolu","fetih_yili":1398,"fetih_yili_metin":"1398 (kimi kaynakta 1392)","tartismali":true,"x":6,"y":0,"kenar":"ust","gorsel":"img/amasya.webp","gorsel_kaynak":"amasya","yeni_gorsel_gerekli":true,"bag":"Kadı Burhâneddin'in ölümünden sonra 1398'de Osmanlı topraklarına katıldı; Yıldırım Bayezid şehrin idaresini oğlu Çelebi Mehmed'e verdi.","kisa":"Yıldırım Bayezid'in 1398'de Osmanlı topraklarına kattığı Amasya; Çelebi Mehmed'den başlayarak şehzade sancağı.","uzun":"Yeşilırmak vadisinde, Pontus krallarının kayalara oyulmuş mezarlarının altında kurulan Amasya, Kadı Burhâneddin'in ölümünden sonra 1398'de Yıldırım Bayezid'in topraklarına katıldı; Bayezid şehrin idaresini oğlu Çelebi Mehmed'e verdi. 1402 Ankara Savaşı'ndan sonra Çelebi Mehmed devleti yeniden toparlama mücadelesine Amasya'dan başladı. Şehir sonraki iki yüzyılda şehzadelerin sancakbeyi olarak yetiştiği başlıca merkezlerden biri oldu. II. Bayezid'in 1486'da tamamlanan külliyesi şehrin tanınmış eserlerindendir. Bugün Amasya ilinin merkezidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Amasya'nın Osmanlı'ya bağlanışı için kaynaklar 1392 ya da 1398 yılını verir (tartışmalı). Şehir Fetret Devri'nde de Osmanlı'da kaldı.","kaynak":["https://islamansiklopedisi.org.tr/amasya","https://islamansiklopedisi.org.tr/bayezid-i","https://islamansiklopedisi.org.tr/mehmed-i"],"set_ad":"Yıldırım Bayezid · Niğbolu Gazisi","set_no":"V","tapu_serit":"Balkanlar'dan Orta Anadolu'ya hızlı genişleme (1391–1398).","ekonomi":{"fiyat":1700,"bilgi_fiyati":1300,"ipotek":1050,"ipotek_kaldirma":1300,"kira":[400,600,1700,3400,5400,6900,8300],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,null,850,1700,2700,3450,4150]}},{"i":24,"tur":"tesis","ad":"Bedesten","set":null,"bolge":null,"fetih_yili":1400,"fetih_yili_metin":"h. 802 (1400)","tartismali":false,"x":5,"y":0,"kenar":"ust","gorsel":"img/bedesten.webp","yeni_gorsel_gerekli":false,"bag":"Bursa Bedesteni'ni Yıldırım Bayezid, hayratına gelir sağlamak üzere 1400'de yaptırdı.","kisa":"Bursa Bedesteni'ni Yıldırım Bayezid 1400'de hayır kurumlarına gelir sağlamak için yaptırdı.","uzun":"Bedesten, mücevher, değerli kumaş ve silah gibi kıymetli malların satıldığı kalın duvarlı, kubbeli çarşı yapısıdır. Ahşap dükkânları kül eden yangınlara karşı güvenli olduğu için tüccarların kasaları, defterleri ve loncaların belgeleri burada saklanırdı; şehrin çarşısı bedestenin çevresinde biçimlenirdi. Bursa Bedesteni'ni Yıldırım Bayezid 1400'de hayratına gelir sağlamak için yaptırdı. Fatih'in İstanbul'da yaptırdığı Büyük Bedesten de Kapalıçarşı'nın çekirdeğidir. Bedesten tapusu kira getirir ama imar edilmez.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene ya da mezata bırak. Rakibinse kira, sahibinin tesis sayısına göre sabit tablodan okunur. Tesisler imar edilmez, Cihan Puanı vermez.","kaynak":["https://islamansiklopedisi.org.tr/bedesten","https://islamansiklopedisi.org.tr/istanbul"],"ekonomi":{"fiyat":1100,"bilgi_fiyati":850,"ipotek":700,"ipotek_kaldirma":850,"kira_tablosu":[300,800],"muzakere_yarim":[null,400]}},{"i":25,"tur":"sehir","ad":"İzmir","set":"S6","bolge":"anadolu","fetih_yili":1424,"fetih_yili_metin":"1424 (ilk alınış 1390)","tartismali":true,"x":4,"y":0,"kenar":"ust","gorsel":"img/izmir.webp","yeni_gorsel_gerekli":false,"bag":"İlk kez 1390'da Aydın-ili ile alındı; Cüneyd Bey'in direnişinden sonra 1424'te II. Murad kesin olarak zaptetti.","kisa":"1424'te II. Murad'ın kesin olarak aldığı İzmir; Anadolu ürünlerinin dışa açılan liman kapısı.","uzun":"İzmir'in kara tarafı Aydınoğulları'nın, liman kalesi ise uzun süre Latinlerin elindeydi. Yıldırım Bayezid 1390'da Aydın-ili'yle birlikte şehri aldı, ama sahildeki kale 1402'de Timur'un zaptına kadar Latinlerde kaldı. Fetret yıllarında şehri yöneten Aydınoğlu Cüneyd Bey'in direnişi kırıldıktan sonra II. Murad İzmir'i 1424'te kesin olarak zaptetti. Şehir Anadolu ürünlerini dışarıya gönderen bir ihracat kapısı oldu; Hisar ve Kemeraltı (1671) camileri çarşının çevresinde yükseldi. Bugün Ege'nin en büyük şehridir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"İzmir ilk kez 1390'da alındı; kesin zapt için 1424 ve 1425 yılları verilir.","kaynak":["https://islamansiklopedisi.org.tr/izmir","https://islamansiklopedisi.org.tr/murad-ii"],"set_ad":"II. Murad · Selanik'in Fatihi","set_no":"VI","tapu_serit":"Fetretten sonra Ege'de ve Rumeli'de yeniden toparlanma (1424–1430).","ekonomi":{"fiyat":1900,"bilgi_fiyati":1450,"ipotek":1150,"ipotek_kaldirma":1450,"kira":[400,700,2100,4100,6500,8300,10100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,350,1050,2050,3250,4150,5050]}},{"i":26,"tur":"vaka","ad":"Vak'a","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":3,"y":0,"kenar":"ust","gorsel":"img/vaka.webp","yeni_gorsel_gerekli":false,"bag":"Olay kartı destesi.","kisa":"Vak'a: şehrin, çarşının ve doğanın olayları. Vak'a destesinden bir kart çek, oku ve uygula.","uzun":"Osmanlı şehirleri yangın, deprem ve salgınla sık karşılaştı: 1509 depremi İzmit'te surları, camileri ve medreseyi yıktı; Bursa Bedesteni 1958 yangınında harap oldu. Böyle zamanlarda mahalle halkının kurduğu avârız vakıflarının gelirleri âfetzedelere, yetimlere ve fakirlere harcanırdı. Vak'a kartları bu iniş çıkışları oyuna taşır: bir kart kazanç getirir, bir başkası yapılarından birini kaybettirebilir. Ortada biriken bir para havuzu yoktur; olayın bedeli ya da getirisi Hazine üzerinden işler.","kural":"Vak'a destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Para Hazine'den gelir ya da Hazine'ye gider.","kaynak":["https://islamansiklopedisi.org.tr/avariz-vakfi","https://islamansiklopedisi.org.tr/izmit","https://islamansiklopedisi.org.tr/bedesten"]},{"i":27,"tur":"sehir","ad":"Selanik","set":"S6","bolge":"rumeli","fetih_yili":1430,"fetih_yili_metin":"29 Mart 1430","tartismali":false,"x":2,"y":0,"kenar":"ust","gorsel":"img/selanik.webp","yeni_gorsel_gerekli":false,"bag":"Venedik idaresindeki şehir 29 Mart 1430'da bizzat II. Murad'ın önderliğindeki kuşatmayla alındı.","kisa":"29 Mart 1430'da II. Murad'ın aldığı Selanik; Osmanlı coğrafyacılarının 'İstanbul'un bir parçası' saydığı liman.","uzun":"Selanik ilk kez 1387'de alındı ama tam bir idare kurulmadı ve 1403'te Bizans'a bırakıldı. II. Murad şehri kuşatınca Bizans onu Venedik'e sattı; Venedik idaresi (1423–1430) şehir halkı için zor bir dönem oldu. 29 Mart 1430'da II. Murad şehri aldı. 1492'de İspanya'dan çıkarılan Yahudilerin bir kısmı buraya yerleşti. Hamza Bey'in kızı Hafsa Hatun'un 1467–68'de kurduğu mescid, 1619'da Yunanistan'da Osmanlılar'ın yaptığı en büyük camiye dönüştü. Atatürk bu şehirde doğdu. Bugünkü adı Thessaloniki'dir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/selanik","https://islamansiklopedisi.org.tr/murad-ii"],"set_ad":"II. Murad · Selanik'in Fatihi","set_no":"VI","tapu_serit":"Fetretten sonra Ege'de ve Rumeli'de yeniden toparlanma (1424–1430).","ekonomi":{"fiyat":1900,"bilgi_fiyati":1450,"ipotek":1150,"ipotek_kaldirma":1450,"kira":[400,700,2100,4100,6500,8300,10100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,350,1050,2050,3250,4150,5050]}},{"i":28,"tur":"sehir","ad":"Yanya","set":"S6","bolge":"rumeli","fetih_yili":1430,"fetih_yili_metin":"Ekim 1430","tartismali":false,"x":1,"y":0,"kenar":"ust","gorsel":"img/yanya.webp","gorsel_kaynak":"yanya","yeni_gorsel_gerekli":true,"bag":"Rumeli beylerbeyi Sinan Paşa'ya teslim oldu; II. Murad şehre dinî ve malî imtiyazlar tanıyan bir ferman verdi (istimâlet örneği).","kisa":"Ekim 1430'da Sinan Paşa'ya teslim olan Yanya; II. Murad'ın imtiyaz fermanıyla istimâlet örneği.","uzun":"Göl kıyısındaki bir yarımadaya kurulan Yanya, Epir'in merkeziydi. Bizans tarihçisi Sphrantzes'e göre şehir Ekim 1430'da Rumeli beylerbeyi Sinan Paşa'ya teslim oldu. II. Murad Yanya halkına dinî ve malî imtiyazlar tanıyan bir ferman verdi; bu haklar yaklaşık iki yüzyıl yürürlükte kaldı. 1618'de Arslan Paşa cami, medrese, imaret ve hamamdan oluşan külliyesini yaptırdı; cami bugün müze olarak kullanılır. 1913'te Esad Paşa'nın altı ay süren savunmasından sonra şehir Yunanistan'a geçti. Bugünkü adı Ioannina'dır.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/yanya","https://islamansiklopedisi.org.tr/murad-ii"],"set_ad":"II. Murad · Selanik'in Fatihi","set_no":"VI","tapu_serit":"Fetretten sonra Ege'de ve Rumeli'de yeniden toparlanma (1424–1430).","ekonomi":{"fiyat":1900,"bilgi_fiyati":1450,"ipotek":1150,"ipotek_kaldirma":1450,"kira":[400,700,2100,4100,6500,8300,10100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,350,1050,2050,3250,4150,5050]}},{"i":29,"tur":"sehir","ad":"İstanbul","set":"S7","bolge":"payitaht","fetih_yili":1453,"fetih_yili_metin":"29 Mayıs 1453","tartismali":false,"x":0,"y":0,"kenar":"ust","gorsel":"img/istanbul.webp","yeni_gorsel_gerekli":false,"bag":"Elli dört günlük kuşatmanın ardından 29 Mayıs 1453'te II. Mehmed tarafından fethedildi ve pâyitaht oldu.","kisa":"29 Mayıs 1453'te II. Mehmed'in (Fatih) aldığı İstanbul; Osmanlı pâyitahtı ve Fatih Külliyesi'nin şehri.","uzun":"II. Mehmed (Fatih) 29 Mayıs 1453'te İstanbul'u alarak Bizans'a son verdi ve şehri pâyitaht yaptı. Fetihten üç gün sonra aman ilan edildi: kaçanların dönmesine, kendi evlerinde oturmalarına ve dinlerini serbestçe yaşamalarına izin verildi, patriklik yeniden kuruldu. Fatih Külliyesi'nde cami, sekiz büyük medrese (Sahn-ı Semân), imaret, darüşşifa ve kütüphane bir aradaydı; Büyük Bedesten ve çarşı ekonomiyi canlandırdı. Mihrimah Sultan'ın külliyesi (1565) ve Hatice Turhan Sultan'ın tamamlattığı Yeni Cami şehri büyüttü.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/istanbul","https://islamansiklopedisi.org.tr/mehmed-ii","https://islamansiklopedisi.org.tr/bedesten"],"set_ad":"Fatih Sultan Mehmed · İstanbul'un Fatihi","set_no":"VII","tapu_serit":"Bizans'ın sonu ve Anadolu birliği: İstanbul, Konya, Kayseri (1453–1474).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[500,800,2500,4900,7800,9900,12100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,400,1250,2450,3900,4950,6050]}},{"i":30,"tur":"vergi","ad":"Avârız","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":0,"y":1,"kenar":"sol","gorsel":"img/vergi.webp","yeni_gorsel_gerekli":false,"bag":"Olağanüstü ihtiyaçlarda hâne başına toplanan vergi; ödemekte zorlanan mahalleler için avârız vakıfları kurulurdu.","kisa":"Olağanüstü ihtiyaçlarda hâne başına toplanan vergi. Tutarı Hazine'ye ödersin; müzakere yapılmaz.","uzun":"Avârız sözlükte 'sonradan ortaya çıkan' demektir. Savaş gibi olağanüstü ihtiyaçlar için başlangıçta ara sıra ve az miktarda toplanan bu vergi, zamanla daha sık ve yüksek alınır oldu. Vergi hâne esasına göre toplanırdı; tahrir defterlerinde vergi verebilen hâneler 'avârız hânesi' diye yazılır, derbentçi, müderris, imam gibi belli hizmetleri görenler kısmen ya da tamamen muaf tutulurdu. Ödemekte zorlanan mahalleler için kurulan avârız vakıfları vergiyi karşılar, âfetlerde de halka yardım ederdi.","kural":"Tutarı Hazine'ye öde; para hiçbir yerde birikmez. Müzakere yapılmaz; nakdin yetmezse yapı sat, ipotek et ya da takasla nakit topla.","kaynak":["https://islamansiklopedisi.org.tr/avariz--vergi","https://islamansiklopedisi.org.tr/avariz-vakfi"],"ekonomi":{"tutar":900}},{"i":31,"tur":"esaret","ad":"Yedikule","set":null,"bolge":null,"fetih_yili":1458,"fetih_yili_metin":"1457–58 (inşa)","tartismali":false,"x":0,"y":2,"kenar":"sol","gorsel":"img/yedikule.webp","yeni_gorsel_gerekli":false,"bag":"Fatih'in 1457–58'de Altınkapı'nın gerisinde yaptırdığı iç kale; hazine ve zindan olarak kullanıldı.","kisa":"Fatih'in 1458'de Altınkapı'nın gerisine yaptırdığı yedi kuleli hisar; devlet evrakının ve siyasi mahpusların yeri.","uzun":"Fatih Sultan Mehmed İstanbul'un fethinden sonra surları onarttı ve Yaldızlıkapı'nın (Altınkapı) gerisine bir iç hisar yapılmasını emretti; yedi kulesi olan bu hisar 1458'de tamamlandı ve Yedikule adını aldı. Osmanlı döneminde değerli devlet evrakı ve eşyası burada saklandı; siyasi mahpuslar ve alıkonulan yabancılar burada tutuldu. XIX. yüzyılda bir süre baruthane oldu, 1895'te müzeler idaresine verildi. Oyunda Yedikule'ye hareketle gelmek yalnız bir ziyarettir; esirler buradaki üç hücrede bekler.","kural":"Hareketle gelmek ziyarettir. Esirsen elinin başında birini seç: fidye öde, Af Fermanı kullan, Bilgi ile çık ya da bekle. Esaretteki 3. elinde çıkmak zorundasın.","kaynak":["https://islamansiklopedisi.org.tr/istanbul","https://kultursanat.istanbul/haberler/yedikule-hisari"],"ekonomi":{"fidye":300}},{"i":32,"tur":"liman","ad":"Trabzon Limanı","set":null,"bolge":"anadolu","fetih_yili":1461,"fetih_yili_metin":"Ağustos-Eylül 1461","tartismali":false,"x":0,"y":3,"kenar":"sol","gorsel":"img/trabzon.webp","yeni_gorsel_gerekli":false,"bag":"Trabzon Ağustos-Eylül 1461'de Fatih'e teslim oldu; Gelibolu sancakbeyi Kasım Bey donanmayla sefere destek verdi.","kisa":"1461'de Fatih'e teslim olan Trabzon; Tebriz'e uzanan ticaret yolunun Karadeniz iskelesi. Kanûnî burada doğdu.","uzun":"Trabzon, Tebriz'den gelen ticaret yolunun Karadeniz'e ulaştığı limandı; Marco Polo 1295'te bu yolla ülkesine döndü. Fatih şehri kuşatırken Gelibolu sancakbeyi Kasım Bey donanmayla harekâta destek verdi; Trabzon Ağustos-Eylül 1461'de teslim oldu. Halkın bir kısmı başka bölgelere gönderildi, yerlerine Anadolu'dan aileler yerleştirildi. Şehzade Selim yaklaşık yirmi dört yıl burada sancakbeyliği yaptı; oğlu Süleyman Trabzon'da doğdu. Selim'in annesi Gülbahar Hatun adına yapılan Hatuniye Külliyesi (1505–06) zengin vakıflarıyla şehir hayatında önemli rol oynadı.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene ya da mezata bırak. Rakibinse kira, sahibinin elindeki liman sayısına göre artar. Limanlar imar edilmez, Cihan Puanı vermez.","kaynak":["https://islamansiklopedisi.org.tr/trabzon","https://islamansiklopedisi.org.tr/surgun"],"ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira_tablosu":[300,700,1300],"muzakere_yarim":[null,350,650]}},{"i":33,"tur":"sehir","ad":"Konya","set":"S7","bolge":"anadolu","fetih_yili":1468,"fetih_yili_metin":"Nisan 1468","tartismali":false,"x":0,"y":4,"kenar":"sol","gorsel":"img/konya.webp","yeni_gorsel_gerekli":false,"bag":"Karamanoğulları'nın merkezi Nisan 1468'de Fatih tarafından alındı; Şehzade Mustafa sancakbeyi yapıldı.","kisa":"Nisan 1468'de Fatih'in Karamanoğulları'ndan aldığı Konya; Türkiye Selçuklu başkenti, Mevlânâ'nın şehri.","uzun":"Konya, Türkiye Selçuklu Devleti'nin başkenti ve XIII. yüzyılda Mevlânâ Celâleddîn-i Rûmî'nin yaşadığı şehirdi; Selçuklu'dan sonra Karamanoğulları'nın merkezi oldu. Şehir Yıldırım Bayezid, Çelebi Mehmed ve II. Murad dönemlerinde alınmış, ama elde tutulamamıştı. Fatih Nisan 1468'de önce Gevele Hisarı'nı, ardından Konya'yı aldı, surları onarttı ve oğlu Şehzade Mustafa'yı sancakbeyi yaptı. II. Selim'in şehzadeliğinde başlatılan Sultan Selim Camii Mevlânâ Dergâhı'nın batısındadır. Bugün Konya ilinin merkezidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Konya 1397'de, 1414'te ve 1437'de alındı ama elde tutulamadı; kalıcı fetih 1468'dir.","kaynak":["https://islamansiklopedisi.org.tr/konya"],"set_ad":"Fatih Sultan Mehmed · İstanbul'un Fatihi","set_no":"VII","tapu_serit":"Bizans'ın sonu ve Anadolu birliği: İstanbul, Konya, Kayseri (1453–1474).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[500,800,2500,4900,7800,9900,12100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,400,1250,2450,3900,4950,6050]}},{"i":34,"tur":"sehir","ad":"Kayseri","set":"S7","bolge":"anadolu","fetih_yili":1474,"fetih_yili_metin":"1474","tartismali":false,"x":0,"y":5,"kenar":"sol","gorsel":"img/kayseri.webp","yeni_gorsel_gerekli":false,"bag":"Karamanoğulları Beyliği'nin ortadan kaldırılmasının ardından 1474'te Gedik Ahmed Paşa ile Osmanlı idaresine girdi.","kisa":"1474'te Gedik Ahmed Paşa ile Osmanlı'ya geçen Kayseri; Gevher Nesibe Darüşşifası'nın şehri.","uzun":"Kayseri Türkiye Selçuklu döneminde bir ilim ve ticaret şehriydi: Gevher Nesibe'nin vasiyeti üzerine kardeşi I. Gıyâseddin Keyhusrev'in 1205–06'da yaptırdığı tıp medresesi ve darüşşifa ile Mahperi Hunat Hatun'un külliyesi (1238) bu dönemdendir. Şehir 1398'de Yıldırım Bayezid'e geçmiş, Ankara Savaşı'ndan sonra kaybedilmişti. 1474'te Gedik Ahmed Paşa Karamanoğulları'nı ortadan kaldırınca Osmanlı idaresi kuruldu. Bedesten (1497) ve Mimar Sinan'a atfedilen Kurşunlu Cami (1586) Osmanlı eserleridir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/kayseri","https://islamansiklopedisi.org.tr/sinan"],"set_ad":"Fatih Sultan Mehmed · İstanbul'un Fatihi","set_no":"VII","tapu_serit":"Bizans'ın sonu ve Anadolu birliği: İstanbul, Konya, Kayseri (1453–1474).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[500,800,2500,4900,7800,9900,12100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":700,"yapi_satis":450,"muzakere_yarim":[null,400,1250,2450,3900,4950,6050]}},{"i":35,"tur":"sehir","ad":"Halep","set":"S8","bolge":"arap","fetih_yili":1516,"fetih_yili_metin":"Ağustos 1516","tartismali":false,"x":0,"y":6,"kenar":"sol","gorsel":"img/halep.webp","yeni_gorsel_gerekli":false,"bag":"24 Ağustos 1516 Mercidâbık zaferinin ardından Osmanlı hâkimiyetine girdi.","kisa":"Mercidâbık zaferinden (24 Ağustos 1516) dört gün sonra Yavuz'a geçen Halep; doğu-batı ticaretinin kavşağı.","uzun":"Yavuz Sultan Selim'in Memlûk Sultanı Kansu Gavri'yi 24 Ağustos 1516'da Mercidâbık'ta yenmesinden sonra Halep 28 Ağustos'ta Osmanlı hâkimiyetine girdi. Şehir Avrupa kumaşı ve gümüşü ile Hint baharatının, sonra İran ipeğinin alınıp satıldığı büyük bir pazardı. Mimar Sinan'ın ilk eserlerinden Hüsrev Paşa Camii (1544) ve Dukakinzâde Mehmed Paşa'nın dört çarşı ile üç büyük han içeren Adliye külliyesi (1555) şehri büyüttü. I. Dünya Savaşı öncesinde İstanbul ve Kahire'den sonra Osmanlı'nın üçüncü büyük şehriydi.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/halep","https://islamansiklopedisi.org.tr/selim-i"],"set_ad":"Yavuz Sultan Selim · Hâdimü'l-Haremeyn","set_no":"VIII","tapu_serit":"Mısır Seferi: Memlûk topraklarının Osmanlı'ya geçişi (1516–1517).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[600,900,2600,5300,8300,10600,12900],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[null,450,1300,2650,4150,5300,6450]}},{"i":36,"tur":"sehir","ad":"Şam","set":"S8","bolge":"arap","fetih_yili":1516,"fetih_yili_metin":"3 Ekim 1516","tartismali":false,"x":0,"y":7,"kenar":"sol","gorsel":"img/sam.webp","yeni_gorsel_gerekli":false,"bag":"Yavuz Sultan Selim 3 Ekim 1516'da şehre girdi; Emeviye Camii'nde 'hâdimü'l-Haremeyn' unvanıyla anıldı.","kisa":"3 Ekim 1516'da Yavuz'un girdiği Şam; hac kervanlarının toplandığı, Süleymaniye Tekkesi'nin şehri.","uzun":"Mercidâbık'tan sonra Yavuz Sultan Selim şehrin ileri gelenlerinin itaatini kabul etti ve 3 Ekim 1516'da Şam'a girdi; Emeviyye Camii'nde 'hâdimü'l-Haremeyni'ş-şerîfeyn' unvanıyla anıldı. Osmanlı döneminde Şam, İstanbul'dan gelen surre alayının hac kervanına katıldığı toplanma yeriydi; her yıl on binlerce hacı adayı şehirde konaklardı. Kanûnî 1554–1559'da Mimar Sinan'a Süleymaniye Külliyesi'ni (Tekkiye) yaptırdı; çarşılar ve hanlar şehri bir ticaret merkezine dönüştürdü. Bugün Suriye'nin başkentidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/sam--suriye","https://islamansiklopedisi.org.tr/selim-i","https://islamansiklopedisi.org.tr/surre"],"set_ad":"Yavuz Sultan Selim · Hâdimü'l-Haremeyn","set_no":"VIII","tapu_serit":"Mısır Seferi: Memlûk topraklarının Osmanlı'ya geçişi (1516–1517).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[600,900,2600,5300,8300,10600,12900],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[null,450,1300,2650,4150,5300,6450]}},{"i":37,"tur":"seref","ad":"Kudüs","set":null,"bolge":null,"fetih_yili":1516,"fetih_yili_metin":"Aralık 1516","tartismali":false,"x":0,"y":8,"kenar":"sol","gorsel":"img/kudus.webp","yeni_gorsel_gerekli":false,"bag":"Yavuz Sultan Selim 30 Aralık 1516'da Kudüs'ü ziyaret edip Mescid-i Aksâ'da namaz kıldı; şeref karesi, satılmaz.","kisa":"Aralık 1516'da Yavuz'un ziyaret ettiği Kudüs; Kanûnî'nin surlarıyla çevrili şeref karesi. Satılmaz.","uzun":"Kudüs muhtemelen Ekim 1516'da Osmanlı idaresine girdi; Yavuz Sultan Selim Aralık 1516'nın sonunda şehri ziyaret etti. Osmanlı yönetimi, Kavalalı Mehmed Ali Paşa dönemi (1831–1840) dışında Aralık 1917'ye kadar yaklaşık dört yüzyıl sürdü. Kanûnî Kubbetü's-Sahre'yi onarttı, bugün de ayakta olan 34 kuleli, 7 kapılı surları beş yılda yaptırdı, su yollarını yeniledi. Hürrem Sultan'ın 1551'de kurduğu külliyenin imaretinde misafirlere, öğrencilere ve fakirlere yemek dağıtılırdı. Üç ilâhî dinin kutsal saydığı bir şehirdir.","kural":"Satılmaz, ipotek ve imar edilmez. Gelen oyuncu bir Şeref mührü alır (en çok 3). Akçe verilmez; mühür Cihan Puanı'na sayılır.","not_oyuncu":"Yavuz Sultan Selim'in şehre gelişi için 29 ve 30 Aralık 1516 tarihleri verilir.","kaynak":["https://islamansiklopedisi.org.tr/kudus","https://islamansiklopedisi.org.tr/selim-i"]},{"i":38,"tur":"sehir","ad":"Kahire","set":"S8","bolge":"arap","fetih_yili":1517,"fetih_yili_metin":"Ocak 1517","tartismali":false,"x":0,"y":9,"kenar":"alt","gorsel":"img/kahire.webp","yeni_gorsel_gerekli":false,"bag":"22 Ocak 1517 Ridâniye zaferinden sonra Osmanlı birlikleri şehre girdi; Memlük Sultanlığı sona erdi.","kisa":"Ocak 1517'de Ridâniye zaferinden sonra Yavuz'un girdiği Kahire; Memlûk Sultanlığı'nın son başkenti.","uzun":"Yavuz Sultan Selim 22 Ocak 1517'de Ridâniye'de Memlûk ordusunu yendi ve Kahire'ye girdi; Memlûk Sultanlığı sona erdi. Osmanlılar Kahire'ye kendi mimari üslûplarını kabul ettirmeye çalışmadı; Hadım Süleyman Paşa (1528, kalede), Sinan Paşa (1571, Bulak) ve III. Mehmed'in annesi Safiye Sultan'a atfedilen Melike Safiye (1610) camileri gibi birkaç büyük yapı eklendi. 1517'de nüfusunun en çok 150–200 bin olduğu tahmin edilen şehir 1798'de 263 bine ulaştı. Ezher yüzyıllarca ilim merkezi oldu. Bugün Mısır'ın başkentidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/kahire","https://islamansiklopedisi.org.tr/selim-i"],"set_ad":"Yavuz Sultan Selim · Hâdimü'l-Haremeyn","set_no":"VIII","tapu_serit":"Mısır Seferi: Memlûk topraklarının Osmanlı'ya geçişi (1516–1517).","ekonomi":{"fiyat":2100,"bilgi_fiyati":1600,"ipotek":1300,"ipotek_kaldirma":1600,"kira":[600,900,2600,5300,8300,10600,12900],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[null,450,1300,2650,4150,5300,6450]}},{"i":39,"tur":"liman","ad":"İskenderiye Limanı","set":null,"bolge":"arap","fetih_yili":1517,"fetih_yili_metin":"19 Mayıs 1517","tartismali":false,"x":1,"y":9,"kenar":"alt","gorsel":"img/iskenderiye.webp","yeni_gorsel_gerekli":false,"bag":"Câfer Bey idaresindeki Osmanlı donanmasının gelişiyle 19 Mayıs 1517'de Osmanlı idaresine geçti.","kisa":"19 Mayıs 1517'de Câfer Bey'in donanmasıyla Osmanlı'ya geçen İskenderiye; İstanbul-Kahire deniz yolunun limanı.","uzun":"Ridâniye'den sonra, Tomanbay'ın Kahire'de idamından otuz altı gün geçmişken Câfer Bey idaresindeki Osmanlı donanması İskenderiye'ye geldi ve şehir 19 Mayıs 1517'de Osmanlı idaresine girdi; Yavuz Sultan Selim 2 Haziran'da gelip dört gün kaldı. İskenderiye bundan sonra İstanbul'dan Kahire'ye uzanan deniz yolunun önemli limanı oldu. Antik çağın ünlü feneri XIV. yüzyıla kadar ayaktaydı. Osmanlı döneminde Seyyidî Mıfrid (1672) ve Ebû Ali (1715) camileri yapıldı. Bugün Mısır'ın en önemli limanıdır.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene ya da mezata bırak. Rakibinse kira, sahibinin elindeki liman sayısına göre artar. Limanlar imar edilmez, Cihan Puanı vermez.","kaynak":["https://islamansiklopedisi.org.tr/iskenderiye"],"ekonomi":{"fiyat":1300,"bilgi_fiyati":1000,"ipotek":800,"ipotek_kaldirma":1000,"kira_tablosu":[300,700,1300],"muzakere_yarim":[null,350,650]}},{"i":40,"tur":"seref","ad":"Haremeyn","set":null,"bolge":null,"fetih_yili":1517,"fetih_yili_metin":"6 Temmuz 1517","tartismali":false,"x":2,"y":9,"kenar":"alt","gorsel":"img/haremeyn.webp","yeni_gorsel_gerekli":false,"bag":"6 Temmuz 1517'de Mekke şerifinin oğlu Ebû Nümeyy'i kabul eden Yavuz, Haremeyn'in himayesini resmen üstlendi; şeref karesi, satılmaz.","kisa":"1517'de Mekke Emîri'nin bağlılığıyla himayesi Osmanlı'ya geçen Mekke ve Medine. Satılmaz; şeref karesi.","uzun":"Haremeyn, Mekke ve Medine'nin birlikte anılışıdır. Mısır'ın fethinden sonra Mekke Emîri Şerîf Berekât, oğlu Ebû Nümeyy'i Mısır'a göndererek bağlılığını bildirdi ve Mekke'nin anahtarlarını sundu (1517). Yavuz Sultan Selim 'hâdimü'l-Haremeyni'ş-şerîfeyn', yani iki kutsal şehrin hizmetkârı unvanını benimsedi; Osmanlı padişahı bu beldelerin sahibi değil hizmetkârı sayılırdı. Yıldırım Bayezid'den beri gönderilen yıllık yardım (surre) artırıldı, Kanûnî Haremeyn vakıflarına yeni köyler ekledi.","kural":"Satılmaz, ipotek ve imar edilmez. Gelen oyuncu bir Şeref mührü alır (en çok 3); akçe verilmez. Surre Alayı kartı seni buraya getirir.","kaynak":["https://islamansiklopedisi.org.tr/haremeyn","https://islamansiklopedisi.org.tr/selim-i","https://islamansiklopedisi.org.tr/surre"]},{"i":41,"tur":"sehir","ad":"Belgrad","set":"S9","bolge":"rumeli","fetih_yili":1521,"fetih_yili_metin":"1521","tartismali":false,"x":3,"y":9,"kenar":"alt","gorsel":"img/belgrad.webp","yeni_gorsel_gerekli":false,"bag":"Fatih'in alamadığı kale 1521'de Kanûnî'nin Macaristan seferinde fethedildi.","kisa":"1521'de Kanûnî'nin fethettiği Belgrad; Fatih'in alamadığı 'dârülcihad' kalesi, Tuna boyunun üssü.","uzun":"Tuna ile Sava'nın birleştiği yerdeki Belgrad'ı II. Murad 1440'ta altı ay kuşattı, Fatih 1456'da kuşatmada yaralandı; iki girişim de sonuç vermedi. Kanûnî şehri 1521'de aldı. Halkın bir kısmı İstanbul'a götürülüp bugün Belgrad Ormanı ve Belgradkapı diye bilinen yerlere yerleştirildi. Osmanlılar sınır şehri Belgrad'a 'dârülcihad' dedi; Evliya Çelebi 217 cami ve Sûk-ı Sultânî çarşısından söz eder. Son Osmanlı garnizonu 1867'de çekildi. Bugün Sırbistan'ın başkentidir; Osmanlı camilerinden yalnız Bayraklı Cami ayaktadır.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","kaynak":["https://islamansiklopedisi.org.tr/belgrad","https://islamansiklopedisi.org.tr/suleyman-i"],"set_ad":"Kanûnî Sultan Süleyman · Belgrad'ın Fatihi","set_no":"IX","tapu_serit":"Tuna'dan Basra Körfezi'ne: Belgrad, Bağdat ve Basra (1521–1538).","ekonomi":{"fiyat":2300,"bilgi_fiyati":1750,"ipotek":1400,"ipotek_kaldirma":1750,"kira":[700,1100,3100,6200,9700,12400,15100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[350,550,1550,3100,4850,6200,7550]}},{"i":42,"tur":"nefy","ad":"Nefy","alt_ad":"sürgün cezası","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":4,"y":9,"kenar":"alt","gorsel":"img/surgun.webp","yeni_gorsel_gerekli":false,"bag":"Osmanlı hukukunda suçlunun belirli bir yere gönderilip orada oturmaya mecbur tutulması cezası.","kisa":"Nefy: suçluyu bir kaleye ya da adaya gönderip orada oturmaya mecbur eden ceza. Doğruca Yedikule'ye gidersin.","uzun":"Nefy, Osmanlı hukukunda suçlunun yaşadığı yerden uzaklaştırılıp belirli bir yerde oturmaya mecbur tutulduğu cezadır; bu ceza için çoğunlukla Rodos, Kıbrıs gibi adalar ya da korunaklı kaleler seçilirdi. Osmanlı'da 'sürgün' kelimesi ise daha çok bir topluluğun devlet eliyle başka bir bölgeye yerleştirilmesini, yani iskânı anlatırdı: Rodos (1522) ve Kıbrıs (1571) fetihlerden sonra Anadolu'dan getirilen ailelerle böyle şenlendirildi. Oyunda Nefy karesi seni Yedikule'deki esaret hücresine gönderir; Sefer Meydanı'ndan geçmez, ulûfe almazsın.","kural":"Doğruca Yedikule'nin 1. esaret hücresine git. Ulûfe almazsın, tekrar hakkın düşer; serbest eylemlerini yine yapabilirsin.","kaynak":["https://islamansiklopedisi.org.tr/surgun","https://islamansiklopedisi.org.tr/iskan","https://islamansiklopedisi.org.tr/nefiy"]},{"i":43,"tur":"sehir","ad":"Bağdat","set":"S9","bolge":"arap","fetih_yili":1534,"fetih_yili_metin":"1534 (kesin geri alış: 1638, IV. Murad)","tartismali":true,"x":5,"y":9,"kenar":"alt","gorsel":"img/bagdat.webp","yeni_gorsel_gerekli":false,"bag":"Kanûnî 1534'te şehre girdi; 1624'te Safevîlere geçen şehri 1638'de IV. Murad geri aldı.","kisa":"1534'te Kanûnî'nin girdiği Bağdat; Abbasî başkenti. 1624'te kaybedildi, 1638'de IV. Murad geri aldı.","uzun":"Abbasîlerin kurduğu Bağdat, Nizâmiye Medresesi (1066) gibi kurumlarıyla İslâm dünyasının ilim merkezlerindendi. Irakeyn Seferi'nde halk şehrin anahtarlarını Vezîriâzam İbrâhim Paşa'ya teslim etti; Kanûnî 28 Kasım 1534'te şehre girdi, şair Fuzûlî fethe tarih düşürdü. Kanûnî, İmâm-ı Âzam Ebû Hanîfe'nin kabri üzerine türbe, cami ve medrese yaptırdı, Abdülkādir-i Geylânî'nin cami ve türbesine vakıflar bağladı. Şehir 1624'te Safevîlere geçti; IV. Murad 1638'de kırk gün süren kuşatmayla geri aldı. Bugün Irak'ın başkentidir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Bağdat 1624–1638 arasında Safevî idaresinde kaldı; IV. Murad şehri 24 Aralık 1638'de kesin olarak geri aldı.","kaynak":["https://islamansiklopedisi.org.tr/bagdat","https://islamansiklopedisi.org.tr/murad-iv"],"set_ad":"Kanûnî Sultan Süleyman · Belgrad'ın Fatihi","set_no":"IX","tapu_serit":"Tuna'dan Basra Körfezi'ne: Belgrad, Bağdat ve Basra (1521–1538).","ekonomi":{"fiyat":2300,"bilgi_fiyati":1750,"ipotek":1400,"ipotek_kaldirma":1750,"kira":[700,1100,3100,6200,9700,12400,15100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[350,550,1550,3100,4850,6200,7550]}},{"i":44,"tur":"ferman","ad":"Ferman","set":null,"bolge":null,"fetih_yili":null,"tartismali":false,"x":6,"y":9,"kenar":"alt","gorsel":"img/ferman.webp","yeni_gorsel_gerekli":false,"bag":"Padişah buyruğu kart destesi.","kisa":"Ferman: padişah buyruğu. Ferman destesinden bir kart çek, oku ve uygula.","uzun":"Fermanlar bir göreve atamadan arazi ve vergi işlerine kadar pek çok konuda verilirdi. Devlet görevlilerinin halka karşı yetkilerini kötüye kullanmasını yasaklayan genel buyruklara adâletnâme denirdi. Dîvân-ı Hümâyun'da alınan önemli kararlar mühimme defterlerine yazılırdı. Feridun Ahmed Bey padişah mektuplarını, ferman ve berat suretlerini Münşeâtü's-selâtîn adlı eserinde topladı. Ferman kartları oyunda devletin bu kararlarını ve olaylarını anlatır; etkileri her zaman Hazine üzerinden işler.","kural":"Ferman destesinin üstündeki kartı çek, yüksek sesle oku, etkisini uygula ve ıskartaya koy. Af Fermanı kartı sende kalır.","kaynak":["https://islamansiklopedisi.org.tr/ferman"]},{"i":45,"tur":"sehir","ad":"Basra","set":"S9","bolge":"arap","fetih_yili":1538,"fetih_yili_metin":"1534 itaat, 1538 anahtar teslimi","tartismali":false,"x":7,"y":9,"kenar":"alt","gorsel":"img/basra.webp","yeni_gorsel_gerekli":false,"bag":"Basra hâkimi Râşid 1534'te itaat etti, 1538'de şehrin anahtarlarını Kanûnî'ye gönderdi.","kisa":"1534'te itaat eden, 1538'de anahtarlarını Kanûnî'ye gönderen Basra; Basra Körfezi'nin kapısı.","uzun":"Hz. Ömer döneminde kurulan Basra, erken İslâm asırlarında Arap dili, fıkıh ve hadis çalışmalarının merkezlerindendi. Kanûnî Bağdat'tayken (1534) Basra hâkimi Râşid b. Megāmis gelip itaatini bildirdi; 1538'de oğlunu ve vezirini Edirne'deki padişaha göndererek şehrin anahtarlarını teslim etti, Kanûnî adına hutbe okundu ve sikke basıldı. Baharat yolundaki Basra ve körfez, Osmanlılar ile Portekizliler arasında uzun mücadelelere sahne oldu. Basra müstakil bir eyaletti. Bugün Irak'ın güneyindedir.","kural":"Sahipsizse satın al, Bilgi ile Fetih dene (tek soru, %25 indirim) ya da geç: mezat solundaki oyuncudan başlar. Rakibinse kira öde; kira eşiğe ulaşıyorsa Müzakere diyebilirsin.","not_oyuncu":"Basra 1534'te itaat bildirdi; şehrin anahtarları 1538'de teslim edildi.","kaynak":["https://islamansiklopedisi.org.tr/basra"],"set_ad":"Kanûnî Sultan Süleyman · Belgrad'ın Fatihi","set_no":"IX","tapu_serit":"Tuna'dan Basra Körfezi'ne: Belgrad, Bağdat ve Basra (1521–1538).","ekonomi":{"fiyat":2300,"bilgi_fiyati":1750,"ipotek":1400,"ipotek_kaldirma":1750,"kira":[700,1100,3100,6200,9700,12400,15100],"kira_adlari":["arsa","tam_set","han","hamam","medrese","cami","kulliye"],"imar_bedeli":600,"yapi_satis":400,"muzakere_yarim":[350,550,1550,3100,4850,6200,7550]}}],"desteler":{"sefer":[{"id":"S00","sayi":1,"baslik":"I. Murad: Hüdâvendigâr","bilgi":"I. Murad (Hüdâvendigâr) 1362'de tahta çıktı ve Rumeli'de hızla ilerledi. 1389 Kosova Savaşı'nı kazandı; savaş meydanında şehit düşen tek Osmanlı padişahıdır. Birinci: 1 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan.webp","kaynak":["https://islamansiklopedisi.org.tr/murad-i"],"kazanim":"TAR.10.2.2","etki":{"tur":"sayi","sayi":1}},{"id":"S01","sayi":1,"baslik":"Haseki Külliyesi: Sinan'ın İlk Eseri","bilgi":"Mimar Sinan, hassa başmimarı olduktan sonraki ilk eserini Hürrem Sultan adına yaptı: cami, medrese, mektep, imaret ve darüşşifası olan Haseki Külliyesi. İlk eser: 1 ilerle.","tema":{"slug":"hayir-vakif-dayanisma","ad":"Hayır, Vakıf ve Dayanışma","renk":"#2F7A6B"},"gorsel":"tema-hayir-vakif-dayanisma.webp","kaynak":["https://islamansiklopedisi.org.tr/haseki-kulliyesi","https://islamansiklopedisi.org.tr/hurrem-sultan"],"kazanim":"TAR.10.3.5","etki":{"tur":"sayi","sayi":1}},{"id":"S02","sayi":1,"baslik":"İznik: İlk Osmanlı Medresesi","bilgi":"Orhan Bey 1331'de İznik'i aldı; burada yaptırdığı ilk Osmanlı medresesi 1336'da açıldı, ilk müderrisi Dâvûd-i Kayserî oldu. İlk medrese: 1 ilerle.","tema":{"slug":"ilim-medrese","ad":"İlim ve Medrese","renk":"#2E6B4F"},"gorsel":"tema-ilim-medrese.webp","kaynak":["https://islamansiklopedisi.org.tr/davud-i-kayseri"],"kazanim":"TAR.10.2.5","etki":{"tur":"sayi","sayi":1}},{"id":"S03","sayi":1,"baslik":"İlk Osmanlı Sikkesi: Akçe","bilgi":"Akçe, Osmanlıların ilk gümüş parası ve ilk sikkesidir; bilinen en eski akçeler Orhan Bey adına basıldı. Sikke basmak hükümdarlık alametiydi. İlk sikke: 1 ilerle.","tema":{"slug":"sikke-darphane","ad":"Sikke ve Darphane","renk":"#8A6D1B"},"gorsel":"tema-sikke-darphane.webp","kaynak":["https://islamansiklopedisi.org.tr/akce"],"kazanim":"TAR.10.2.3","etki":{"tur":"sayi","sayi":1}},{"id":"S04","sayi":1,"baslik":"Osman Bey: Kurucu Bey","bilgi":"Devlete adını veren Osman Bey, Söğüt çevresindeki uç beyliğini büyüttü; 1302'de Koyunhisar (Bafeus) Savaşı'nda Bizans kuvvetlerini yendi. Kurucu bey: 1 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-2.webp","kaynak":["https://islamansiklopedisi.org.tr/osman-i"],"kazanim":"TAR.10.2.2","etki":{"tur":"sayi","sayi":1}},{"id":"S05","sayi":1,"baslik":"Tuğra: İlk İmza","bilgi":"Tuğra, padişahın adını taşıyan resmî imza-alametidir; mühür değildir, nişancı çekerdi. Osmanlı'da ilk tuğra Orhan Gazi'ye aittir (1324). İlk tuğra: 1 ilerle.","tema":{"slug":"hat-tugra-ferman","ad":"Hat, Tuğra ve Ferman","renk":"#3B2E6B"},"gorsel":"tema-hat-tugra-ferman.webp","kaynak":["https://islamansiklopedisi.org.tr/tugra"],"kazanim":"TAR.10.3.2","etki":{"tur":"sayi","sayi":1}},{"id":"S06","sayi":2,"baslik":"Fatih'in İki Saltanatı","bilgi":"II. Mehmed iki kez tahta çıktı: 1444–1446 ve 1451–1481. 1453'te İstanbul'u fethedip 'Fatih' unvanını aldı. İki saltanat: 2 ilerle.","tema":{"slug":"kurulus-hanedan","ad":"Kuruluş ve Hanedan","renk":"#7B1E27"},"gorsel":"tema-kurulus-hanedan-3.webp","kaynak":["https://islamansiklopedisi.org.tr/mehmed-ii"],"kazanim":"TAR.10.3.1","etki":{"tur":"sayi","sayi":2}},{"id":"S07","sayi":2,"baslik":"Mihrimah Sultan'ın İki Camisi","bilgi":"Mimar Sinan, Kanûnî'nin kızı Mihrimah Sultan için İstanbul'un iki yakasına iki külliye yaptı: biri Üsküdar İskele'de, ö

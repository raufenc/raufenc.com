  function takasNorm(t) {
    function taraf(x) { x = x || {}; return { tapular: (x.tapular || []).slice().map(Number).sort(function (a, b) { return a - b; }), akce: x.akce | 0, af: x.af | 0, berat: !!x.berat }; }
    return { hedef: t.hedef, ver: taraf(t.ver), al: taraf(t.al) };
  }
  function takasAnahtar(kimden, t) { return kimden + '>' + t.hedef + ':' + JSON.stringify(t.ver) + '|' + JSON.stringify(t.al); }
  function takasKontrol(D, kimden, t0) {
    var X = H(), t = takasNorm(t0), P = X.P;
    var p = D.oyuncular[kimden], q = D.oyuncular[t.hedef];
    if (!q || q.elendi || q.id === kimden) return 'geçersiz karşı taraf';
    if (D.el.takasSayisi >= P.takas.el_basi_teklif_ust) return 'bu elde en çok ' + P.takas.el_basi_teklif_ust + ' takas teklifi';
    if (D.el.reddedilen.indexOf(takasAnahtar(kimden, t)) >= 0) return 'reddedilen teklif bu elde yinelenemez';
    function tarafKontrol(x, sahip, alan) {
      for (var j = 0; j < x.tapular.length; j++) {
        var i = x.tapular[j], m = D.mulk[i];
        if (!X.tapu[i] || !m || m.sahip !== sahip.id) return kareAd(X, i) + ' ' + ekle(sahip.ad, 'nın') + ' değil';
        if (m.ipotekli) return 'ipotekli tapu takas edilemez';
        if (X.kare[i].tur === 'sehir' && setteYapiVar(D, X, X.kare[i].set)) return 'setinde yapı bulunan şehir takas edilemez';
      }
      if (x.akce < 0 || x.akce % 50) return 'akçe 50\'nin katı olmalı';
      if (x.akce > sahip.para) return ekle(sahip.ad, 'nın') + ' nakdi yetmiyor';
      if (x.af < 0 || x.af > sahip.af.length) return 'Af Fermanı yok';
      if (x.berat && !sahip.berat) return 'Kılavuz Beratı yok';
      if (x.berat && alan.berat) return 'bir oyuncu en çok 1 berat tutar';
      return null;
    }
    var h = tarafKontrol(t.ver, p, q) || tarafKontrol(t.al, q, p);
    if (h) return h;
    function bos(x) { return !x.tapular.length && !x.akce && !x.af && !x.berat; }
    if (bos(t.ver) || bos(t.al)) return 'takas iki taraflıdır';
    if (t.ver.berat && t.al.berat) return 'aynı beratı değiştirmek anlamsız';
    return null;
  }
  function takasUygula(D, kimden, t0, O) {
    var X = H(), t = takasNorm(t0), p = D.oyuncular[kimden], q = D.oyuncular[t.hedef];
    function aktar(x, a, b) {
      x.tapular.forEach(function (i) { D.mulk[i].sahip = b.id; });
      if (x.akce) paraAktar(D, a.id, b.id, x.akce, 'takas', O);
      for (var j = 0; j < x.af; j++) b.af.push(a.af.pop());
      if (x.berat) { a.berat = false; b.berat = true; }
    }
    aktar(t.ver, p, q); aktar(t.al, q, p);
    ol(O, 'takas_kabul', { kimden: kimden, kime: t.hedef, teklif: t }, ad(D, t.hedef) + ', ' + ekle(ad(D, kimden), 'nın') + ' takas teklifini kabul etti.');
    t.ver.tapular.concat(t.al.tapular).forEach(function (i) {
      var k = X.kare[i], s = D.mulk[i].sahip;
      if (k.tur === 'sehir' && setTam(D, X, k.set, s)) ol(O, 'set_tamam', { oyuncu: s, set: k.set }, ad(D, s) + ' ' + X.setAd[k.set].ad + ' setini tamamladı.');
    });
  }

  // ------------------------------------------------------------------------------------------
  // Geçerli eylemler
  // ------------------------------------------------------------------------------------------
  function nakitToplamaEylemleri(D, id, liste) {
    tapular(D, id).forEach(function (i) {
      if (!yapiSatUygun(D, id, i)) liste.push({ tur: 'yapi_sat', oyuncu: id, kare: i });
      if (!ipotekUygun(D, id, i)) liste.push({ tur: 'ipotek_et', oyuncu: id, kare: i });
    });
  }
  function gecerliEylemler(D) {
    if (!D || D.bitti || !D.bekleyen) return [];
    var X = H(), P = X.P, b = D.bekleyen, id = b.oyuncu, p = D.oyuncular[id], L = [];
    switch (b.tur) {
      case 'esaret':
        if (b.esirEl >= 3 || p.para >= P.fidye) L.push({ tur: 'fidye_ode', oyuncu: id });
        if (p.af.length) L.push({ tur: 'af_kullan', oyuncu: id });
        L.push({ tur: 'bilgi_ile_cik', oyuncu: id });
        if (b.esirEl < 3) L.push({ tur: 'bekle', oyuncu: id });
        nakitToplamaEylemleri(D, id, L);
        break;
      case 'sefer':
        if (D.ayarlar.usta) p.el.forEach(function (k) { L.push({ tur: 'kart_oyna', oyuncu: id, kart: k }); });
        else L.push({ tur: 'sefer_cek', oyuncu: id });
        if (p.berat && !b.ikinci && !D.el.kilavuzKullanildi) L.push({ tur: 'kilavuz', oyuncu: id });
        break;
      case 'kart_sec':
        b.secenekler.forEach(function (k) { L.push({ tur: 'kart_sec', oyuncu: id, kart: k }); });
        break;
      case 'satin_alma':
        if (p.para >= b.fiyat) L.push({ tur: 'satin_al', oyuncu: id });
        if (!b.fetihDenendi && p.para >= b.bilgiFiyati) L.push({ tur: 'bilgi_ile_fetih', oyuncu: id });
        L.push({ tur: 'gec', oyuncu: id });
        nakitToplamaEylemleri(D, id, L);
        break;
      case 'soru':
        [0, 1, 2, 3].forEach(function (s) { L.push({ tur: 'cevapla', oyuncu: id, sik: s }); });
        break;
      case 'mezat': {
        var q = D.oyuncular[b.oyuncu], min = mezatMin(b);
        if (q.para >= min) {
          L.push({ tur: 'teklif', oyuncu: b.oyuncu, miktar: min, min: min, max: a50(q.para), adim: 50 });
          [100, 500].forEach(function (x) { if (b.yuksekId != null && b.yuksek + x <= q.para && b.yuksek + x > min) L.push({ tur: 'teklif', oyuncu: b.oyuncu, miktar: b.yuksek + x }); });
        }
        L.push({ tur: 'cekil', oyuncu: b.oyuncu });
        break;
      }
      case 'kira':
        L.push({ tur: 'kira_ode', oyuncu: id });
        L.push({ tur: 'muzakere', oyuncu: id });
        break;
      case 'borc':
        if (p.para >= b.miktar) L.push({ tur: 'borc_ode', oyuncu: id });
        nakitToplamaEylemleri(D, id, L);
        if (tasfiyeDegeri(D, id) < b.miktar) L.push({ tur: 'iflas', oyuncu: id });
        if (D.el.takasSayisi < P.takas.el_basi_teklif_ust) L.push({ tur: 'takas_teklif', oyuncu: id, sablon: true });
        break;
      case 'hayrat':
        if (p.para >= b.bedel) L.push({ tur: 'hayrat_yap', oyuncu: id });
        L.push({ tur: 'gec', oyuncu: id });
        break;
      case 'kervansaray':
        L.push({ tur: 'kervan_sorusu', oyuncu: id });
        if (!p.berat) L.push({ tur: 'berat_al', oyuncu: id });
        L.push({ tur: 'gec', oyuncu: id });
        break;
      case 'serbest':
        tapular(D, id).forEach(function (i) {
          if (!imarUygun(D, id, i)) L.push({ tur: 'imar', oyuncu: id, kare: i });
          if (!yapiSatUygun(D, id, i)) L.push({ tur: 'yapi_sat', oyuncu: id, kare: i });
          if (!ipotekUygun(D, id, i)) L.push({ tur: 'ipotek_et', oyuncu: id, kare: i });
          if (!ipotekKaldirUygun(D, id, i)) L.push({ tur: 'ipotek_kaldir', oyuncu: id, kare: i });
        });
        if (D.el.takasSayisi < P.takas.el_basi_teklif_ust) L.push({ tur: 'takas_teklif', oyuncu: id, sablon: true });
        L.push({ tur: 'el_bitti', oyuncu: id });
        break;
      case 'takas_cevap':
        L.push({ tur: 'takas_kabul', oyuncu: id });
        L.push({ tur: 'takas_ret', oyuncu: id });
        break;
      case 'gorev_sec':
        // Yalnız bir kart geri konuyorsa (3 çek, 2 tut) her seçenek bir eylemdir; daha büyük seçimlerde 'tut' dizisi gönderilir.
        if (b.gorevler.length - b.tut === 1) b.gorevler.forEach(function (g) {
          L.push({ tur: 'gorev_sec', oyuncu: id, birak: g, tut: b.gorevler.filter(function (x) { return x !== g; }) });
        });
        else L.push({ tur: 'gorev_sec', oyuncu: id, tut: b.gorevler.slice(0, b.tut), sablon: true });
        break;
    }
    return L;
  }

  /** Eylemin şu durumda geçerli olup olmadığı: null (geçerli) ya da neden metni. */
  function eylemDogrula(D, e) {
    if (!D || !e || typeof e !== 'object') return 'eylem yok';
    if (EYLEM_TURLERI.indexOf(e.tur) < 0) return 'bilinmeyen eylem: ' + e.tur;
    if (e.tur === 'koltuk_degistir') {
      if (!D.oyuncular[e.oyuncu]) return 'oyuncu yok';
      if (e.bot != null && ['kolay', 'orta', 'zor', 'rastgele'].indexOf(e.bot) < 0) return 'bilinmeyen bot seviyesi';
      return null;
    }
    if (D.bitti) return 'oyun bitti';
    if (e.tur === 'sure_doldu') return D.sonTur ? 'Son Tur zaten ilan edildi' : null;
    var b = D.bekleyen;
    if (!b) return 'bekleyen karar yok';
    var sahip = b.oyuncu;
    if (e.oyuncu != null && e.oyuncu !== sahip) return 'sıra bu oyuncuda değil (karar ' + ad(D, sahip) + ' bekliyor)';
    var X = H(), P = X.P, id = sahip, p = D.oyuncular[id];
    switch (e.tur) {
      case 'imar': return b.tur !== 'serbest' ? 'imar yalnız serbest aşamada' : imarUygun(D, id, e.kare);
      case 'yapi_sat': return ['serbest', 'borc', 'satin_alma', 'esaret'].indexOf(b.tur) < 0 ? 'şimdi yapı satılamaz' : yapiSatUygun(D, id, e.kare);
      case 'ipotek_et': return ['serbest', 'borc', 'satin_alma', 'esaret'].indexOf(b.tur) < 0 ? 'şimdi ipotek edilemez' : ipotekUygun(D, id, e.kare);
      case 'ipotek_kaldir': return b.tur !== 'serbest' ? 'ipotek yalnız serbest aşamada kaldırılır' : ipotekKaldirUygun(D, id, e.kare);
      case 'takas_teklif':
        if (b.tur !== 'serbest' && b.tur !== 'borc') return 'takas yalnız serbest aşamada ya da borç öderken';
        return takasKontrol(D, id, e);
      case 'teklif': {
        if (b.tur !== 'mezat') return 'mezat yok';
        var m = e.miktar;
        if (typeof m !== 'number' || m % 50) return 'teklif 50\'nin katı olmalı';
        if (m < mezatMin(b)) return 'teklif en az ' + mezatMin(b);
        if (m > p.para) return 'teklif nakdi aşamaz';
        return null;
      }
      case 'cevapla':
        if (b.tur !== 'soru') return 'soru yok';
        return [0, 1, 2, 3].indexOf(e.sik) < 0 ? 'şık 0-3 olmalı' : null;
      case 'gorev_sec':
        if (b.tur !== 'gorev_sec') return 'görev seçimi yok';
        return gorevSecimCoz(b, e) ? null : 'tutulacak ' + b.tut + ' Fermân-ı Hümâyun, çekilen kartlardan seçilmeli';
    }
    var L = gecerliEylemler(D);
    for (var j = 0; j < L.length; j++) {
      var g = L[j];
      if (g.tur === e.tur && (g.kart == null || g.kart === e.kart)) return null;
    }
    return 'şu anda geçerli değil (' + e.tur + ', karar: ' + b.tur + ')';
  }

  /** gorev_sec eyleminden tutulacak kartlar (geçersizse null). 'birak' (tek kart) ya da 'tut' (dizi) kabul edilir. */
  function gorevSecimCoz(b, e) {
    var tut;
    if (Array.isArray(e.tut)) tut = e.tut.slice();
    else if (e.birak != null && b.gorevler.length - b.tut === 1) tut = b.gorevler.filter(function (g) { return g !== e.birak; });
    else return null;
    if (e.birak != null && tut.indexOf(e.birak) >= 0) return null;
    if (e.birak != null && b.gorevler.indexOf(e.birak) < 0) return null;
    if (tut.length !== b.tut) return null;
    for (var j = 0; j < tut.length; j++) if (b.gorevler.indexOf(tut[j]) < 0 || tut.indexOf(tut[j]) !== j) return null;
    return tut;
  }

  // ------------------------------------------------------------------------------------------
  // uygula
  // ------------------------------------------------------------------------------------------
  function uygula(D0, e, secenek) {
    secenek = secenek || {};
    var hata = eylemDogrula(D0, e);
    if (hata) return { durum: D0, olaylar: [{ tur: 'gecersiz', eylem: e, neden: hata, metin: 'Geçersiz eylem: ' + hata }], hata: hata };
    var D = secenek.yerinde ? D0 : kopya(D0);
    var O = secenek.olaysiz ? null : [];
    var X = H(), P = X.P;
    D.adim++;
    if (e.tur === 'koltuk_degistir') {
      D.oyuncular[e.oyuncu].bot = e.bot || null;
      ol(O, 'koltuk', { oyuncu: e.oyuncu, bot: e.bot || null }, ad(D, e.oyuncu) + ' koltuğu ' + (e.bot ? 'bota (' + e.bot + ')' : 'insana') + ' devredildi.');
      return { durum: D, olaylar: O || [] };
    }
    if (e.tur === 'sure_doldu') {
      var bt = Math.max(D.tur, D.ayarlar.zaferAsgariTur || 1);
      D.sonTur = { oyuncu: null, tur: D.tur, neden: 'sure', el: D.elNo, bitisTur: bt };
      ol(O, 'son_tur', { turNo: D.tur, neden: 'sure', bitisTur: bt }, bt > D.tur
        ? 'Süre doldu: oyun en erken ' + bt + '. tur sonunda biter; Son Tur işareti ' + bt + '. tura kondu.'
        : 'Süre doldu: Son Tur işareti kondu, bu tur tamamlanınca oyun biter.');
      return { durum: D, olaylar: O || [] };
    }
    var b = D.bekleyen, id = b.oyuncu, p = D.oyuncular[id];
    switch (e.tur) {
      // --- Esaret (§14) ---
      case 'fidye_ode':
        D.bekleyen = null;
        D.is.push({ op: 'ode', miktar: P.fidye, alacakli: null, sebep: 'fidye' }, { op: 'serbest_birak', yol: 'fidye' });
        break;
      case 'af_kullan': {
        D.bekleyen = null;
        var a = p.af.shift(); D.desteler[a.deste].i.push(a.id);
        ol(O, 'af_kullanildi', { oyuncu: id, kart: a.id }, ad(D, id) + ' Af Fermanı kullandı.');
        D.is.push({ op: 'serbest_birak', yol: 'Af Fermanı' });
        break;
      }
      case 'bilgi_ile_cik': D.bekleyen = null; soruBaslat(D, p, 'esaret', { esirEl: b.esirEl, kare: p.konum }, O); break;
      case 'bekle':
        D.bekleyen = null; D.el.asama = 'serbest';
        ol(O, 'esarette_bekledi', { oyuncu: id, esirEl: p.esirEl }, ad(D, id) + ' esarette bekliyor (' + p.esirEl + '. el).');
        break;

      // --- Sefer (§6-7) ---
      case 'sefer_cek': D.bekleyen = null; kartOyna(D, p, seferCek(D, O), O); break;
      case 'kart_oyna': D.bekleyen = null; p.el.splice(p.el.indexOf(e.kart), 1); kartOyna(D, p, e.kart, O); break;
      case 'kilavuz': {
        D.el.kilavuzKullanildi = true; p.berat = false; p.ist.beratKullan++;
        ol(O, 'kilavuz', { oyuncu: id }, ad(D, id) + ' Kılavuz Beratı kullandı.');
        if (D.ayarlar.usta) { p.el.push(seferCek(D, O)); D.bekleyen = { tur: 'sefer', oyuncu: id, ikinci: b.ikinci }; }
        else { var c1 = seferCek(D, O), c2 = seferCek(D, O); D.bekleyen = { tur: 'kart_sec', oyuncu: id, secenekler: [c1, c2] }; }
        break;
      }
      case 'kart_sec': {
        var diger = b.secenekler[0] === e.kart ? b.secenekler[1] : b.secenekler[0];
        D.desteler.sefer.i.push(diger); D.bekleyen = null; kartOyna(D, p, e.kart, O);
        break;
      }

      // --- Boş tapu (§9.1) ---
      case 'satin_al':
        D.bekleyen = null;
        paraAktar(D, id, 'hazine', b.fiyat, kareAd(X, b.kare), O);
        sahiplen(D, id, b.kare, b.fiyat, 'liste', O);
        break;
      case 'bilgi_ile_fetih': D.bekleyen = null; soruBaslat(D, p, 'fetih', { kare: b.kare, fiyat: b.fiyat, bilgiFiyati: b.bilgiFiyati }, O); break;
      case 'gec':
        D.bekleyen = null;
        if (b.tur === 'satin_alma') {
          ol(O, 'gecti', { oyuncu: id, kare: b.kare }, ad(D, id) + ' ' + kareEkle(X, b.kare, 'yi') + ' almadı.');
          mezatBaslat(D, b.kare, id, O);
        } else if (b.tur === 'kervansaray') ol(O, 'gecti', { oyuncu: id }, ad(D, id) + " Kervansaray'da dinlendi.");
        break;
      case 'cevapla': {
        D.bekleyen = null;
        var q = X.soru[b.soru], dogru = e.sik === q.dogru;
        p.ist.soru++; if (dogru) p.ist.dogru++;
        if (dogru) p.muhur.bilgi.push(b.soru); else D.desteler.bilgi.i.push(b.soru);
        ol(O, 'cevap', { oyuncu: id, soru: b.soru, sik: e.sik, dogruSik: q.dogru, dogru: dogru, baglam: b.baglam },
          ad(D, id) + (dogru ? ' doğru cevap verdi; Bilgi mührü aldı.' : ' yanlış cevap verdi. Doğru cevap: ' + q.secenekler[q.dogru] + '.'));
        if (D.ayarlar.herkesCevaplar && e.digerleri) {
          Object.keys(e.digerleri).forEach(function (k) {
            var qid = +k;
            if (qid === id || !D.oyuncular[qid] || D.oyuncular[qid].elendi) return;
            if (e.digerleri[k] === q.dogru) paraAktar(D, 'hazine', qid, P.herkes_cevaplar_odulu, 'herkes cevaplar', O);
          });
        }
        switch (b.baglam) {
          case 'fetih':
            if (dogru) { p.ist.fetihDogru++; paraAktar(D, id, 'hazine', b.bilgiFiyati, 'Bilgi ile Fetih: ' + kareAd(X, b.kare), O); sahiplen(D, id, b.kare, b.bilgiFiyati, 'bilgi', O); }
            else D.bekleyen = { tur: 'satin_alma', oyuncu: id, kare: b.kare, fiyat: b.fiyat, bilgiFiyati: b.bilgiFiyati, fetihDenendi: true };
            break;
          case 'muzakere': {
            var kira = dogru ? b.muzakereYarim : b.miktar;
            if (dogru) { p.ist.muzakereDogru++; ol(O, 'muzakere', { oyuncu: id, kare: b.kare, once: b.miktar, sonra: kira }, 'Müzakere başarılı: kira ' + akce(kira) + ' oldu.'); }
            D.is.unshift({ op: 'ode', miktar: kira, alacakli: b.alacakli, sebep: kareEkle(X, b.kare, 'nın') + ' kirası', kare: b.kare, kira: true });
            break;
          }
          case 'esaret':
            if (dogru) { p.ist.esaretBilgi++; D.is.push({ op: 'serbest_birak', yol: 'Bilgi ile Çıkış' }); }
            else if (b.esirEl >= 3) D.is.push({ op: 'ode', miktar: P.fidye, alacakli: null, sebep: 'fidye (3. el zorunlu)' }, { op: 'serbest_birak', yol: 'zorunlu fidye' });
            else { D.el.asama = 'serbest'; ol(O, 'esarette_bekledi', { oyuncu: id, esirEl: p.esirEl }, ad(D, id) + ' esarette kalıyor.'); }
            break;
          case 'kervan':
            if (dogru) { p.ist.kervanDogru++; paraAktar(D, 'hazine', id, P.kervansaray.soru_odulu, 'Kervan Sorusu', O); }
            break;
        }
        break;
      }
      // --- Mezat ---
      case 'teklif':
        b.yuksek = e.miktar; b.yuksekId = id;
        ol(O, 'mezat_teklif', { oyuncu: id, kare: b.kare, miktar: e.miktar }, ad(D, id) + ' ' + akce(e.miktar) + ' teklif etti.');
        b.j++;
        mezatSiradaki(D, O);
        break;
      case 'cekil':
        ol(O, 'mezat_cekildi', { oyuncu: id, kare: b.kare }, ad(D, id) + ' mezattan çekildi.');
        if (b.bicim === 'tek_tur') b.j++;
        else b.aktif.splice(b.j, 1);
        mezatSiradaki(D, O);
        break;
      // --- Kira ---
      case 'kira_ode':
        D.bekleyen = null;
        D.is.unshift({ op: 'ode', miktar: b.miktar, alacakli: b.alacakli, sebep: kareEkle(X, b.kare, 'nın') + ' kirası', kare: b.kare, kira: true });
        break;
      case 'muzakere':
        D.bekleyen = null;
        soruBaslat(D, p, 'muzakere', { kare: b.kare, miktar: b.miktar, alacakli: b.alacakli, muzakereYarim: b.muzakereYarim }, O);
        break;
      // --- Borç ---

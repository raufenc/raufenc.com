<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f52_1title f52_1desc"><title id="f52_1title">Can ve mal dokunulmazlığı</title><desc id="f52_1desc">Şematik öğretim görseli. Can. Mal. Güven. Hak. Veda öğütlerinde insanların canına ve malına saygı gösterilmesi vurgulandı. Bir insanın güvenliği ve eşyası, güçlü veya yakın birine ait olduğu için değerli değildir. Hakların korunması topluluk içinde güven oluşturur. Bugünkü sınıf örneğinde de bir arkadaşının eşyasını izinsiz almak, ona ait karar hakkını yok sayar. Bu örnek, öğüdü yaşımıza uygun biçimde düşünmemizi sağlar.</desc><defs><linearGradient id="f52_1sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E1E3F2"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f52_1wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f52_1shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#57629A" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#57629A" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 9 · BÖLÜM 52</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Can ve mal dokunulmazlığı</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="26" fill="#FFFCF3" stroke="#DDD2BF" stroke-width="2"/><rect x="80" y="240" width="968" 
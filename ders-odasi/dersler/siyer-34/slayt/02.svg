<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f34_1title f34_1desc"><title id="f34_1title">Bir noktayı koruma görevi</title><desc id="f34_1desc">Şematik öğretim görseli. Uhud çevresi. Görev noktası. Birbirine bağlı görevler. Uhud&apos;da okçular belirli bir noktayı korumakla görevlendirilmişti. Bu görev, diğer birliklerin durumuyla bağlantılıydı. Şemadaki işaretler ayrıntılı askerî taktik öğretmek için değil, bir sorumluluğun daha geniş bir düzenin parçası olduğunu göstermek içindir. Bir noktada yapılan tercih, başka yerlerdeki insanları da etkileyebilir. Bu nedenle görev, yalnız onu yapan kişinin kendi işi olarak düşünülemez.</desc><defs><linearGradient id="f34_1sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E2E9D6"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f34_1wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f34_1shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#526843" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#526843" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 6 · BÖLÜM 34</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Bir noktayı koruma görevi</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="26" fill="#FFFCF3" str
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f1_0title f1_0desc"><title id="f1_0title">Önce büyük haritayı okuyalım</title><desc id="f1_0desc">Şematik öğretim görseli. Arabistan. Hicaz. Kızıldeniz. Mekke. Peygamber Efendimiz (sallallahü aleyhi ve sellem)&apos;in hayatının geçtiği Arabistan, Asya&apos;nın güneybatısındaki büyük bir yarımadadır. Bu derslerde özellikle batı kesimindeki Hicaz bölgesine bakacağız. Haritada Kızıldeniz&apos;i bulup doğusundaki kara parçasını izleyelim. Böylece şehir adlarını ezberlemek yerine birbirleriyle ilişkilerini görmeye başlarız. Ekrandaki çizim yönleri öğrenmek içindir; gerçek uzaklıkları ölçmek için ölçekli bir harita gerekir.</desc><defs><linearGradient id="f1_0sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D6EBE6"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f1_0wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f1_0shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#176B71" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#176B71" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 1 · BÖLÜM 01</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Önce büyük haritayı okuyalım</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" he
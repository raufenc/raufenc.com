<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f19_0title f19_0desc"><title id="f19_0title">İnanç nedeniyle baskı</title><desc id="f19_0desc">Şematik öğretim görseli. Mekke dönemi. İnanç. Baskı. Mekke&apos;de İslâm&apos;ı kabul eden bazı insanlar baskı ve kötü muameleyle karşılaştı. Özellikle güçlü bir aile veya kabile tarafından korunmayan kişiler daha savunmasız kalabiliyordu. Bu durum, ilk Müslümanların yaşadığı güçlüğü anlamamıza yardım eder. Baskıyı ayrıntılı acı sahnelerine dönüştürmeden konuşacağız: Bir insanın inancı sebebiyle zarar görmesi haksızlıktır; dayanışma ise bu haksızlığın etkisini azaltmak için somut sorumluluk almayı gerektirir.</desc><defs><linearGradient id="f19_0sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E8E0F0"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f19_0wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f19_0shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#6B5189" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#6B5189" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 4 · BÖLÜM 19</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">İnanç nedeniyle baskı</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="26" f
"80" y="834" font-family="Arial, sans-serif" font-size="17" fill="#4F5C62" font-weight="500" text-anchor="start">Hayatının farklı dönemlerinden tematik tekrar · Tarihî fotoğraf veya birebir mimari çizim değildir; şematik öğretim</text><text x="80" y="856" font-family="Arial, sans-serif" font-size="17" fill="#4F5C62" font-weight="500" text-anchor="start">görselidir.</text><text x="1510" y="846" font-family="Arial, sans-serif" font-size="22" fill="#326F65" font-weight="700" text-anchor="end">02</text></svg>
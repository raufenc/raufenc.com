<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f24_0title f24_0desc"><title id="f24_0title">İsrâ: gece yolculuğu</title><desc id="f24_0desc">Şematik öğretim görseli. Mescid-i Harâm. Mescid-i Aksâ. İsrâ. İsrâ, Peygamber Efendimiz (sallallahü aleyhi ve sellem) için Mescid-i Harâm&apos;dan Mescid-i Aksâ&apos;ya gerçekleşen gece yolculuğunu anlatır. İsrâ sûresinin ilk âyet-i kerîmesinde bu yolculuk bildirilir. Burada başlangıç ve varış yerlerini tanımak kavramı anlamamıza yardımcı olur. Ekrandaki bağlantı şeması, olayın nasıl gerçekleştiğini gösteren bir tasvir değildir; yalnız isimleri ve iki mekân arasındaki kavramsal ilişkiyi ayırmak içindir.</desc><defs><linearGradient id="f24_0sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E8E0F0"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f24_0wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f24_0shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#6B5189" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#6B5189" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 4 · BÖLÜM 24</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">İsrâ: gece yolculuğu</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="26" fill="#FFFCF3" stroke="#DDD2BF" stroke-width="2"/><rect x="80" y="240" width="968" height="514" rx="18" fill="#E8E0F0" stroke="none" stroke-width="1"/><text x="115" y="280" font-family="Arial, sans-serif" font-size="19" fill="#6B5189" font-weight="700" text-anchor="start">İsrâ · başlangıç ve varış mekânları</text><rect x="135" y="535" width="330" height="112" rx="16" fill="#FFFCF3" stroke="#6B5189" stroke-width="3"/><text x="157" y="573" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="700" text-anchor="start">Mescid-i Harâm</text><text x="157" y="617" font-family="Arial, sans-serif" font-size="18" fill="#6B5189" font-weight="500" text-anchor="start">Mekke</text><rect x="660" y="310" width="330" height="112" rx="16" fill="#FFFCF3" stroke="#6B5189" stroke-width="3"/><text x="682" y="348" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="700" text-anchor="start">Mescid-i Aksâ</text><text x="682" y="392" font-family="Arial, sans-serif" font-size="18" fill="#6B5189" font-weight="500" text-anchor="start">Kudüs</text><path d="M440 528 L658 434" fill="none" stroke="#94583A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M648.1435289615039 446.6035700762636 L658 434 642.0689874460091 432.51580358288214" fill="none" stroke="#94583A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="541" y="461" font-family="Arial, sans-serif" font-size="27" fill="#94583A" font-weight="700" text-anchor="middle">İsrâ</text><circle cx="300" cy="504" r="30" fill="#EEDDC0" stroke="#6B5189" stroke-width="3"/><circle cx="825" cy="446" r="30" fill="#EEDDC0" stroke="#6B5189" stroke-width="3"/><text x="564" y="730" font-family="Arial, sans-serif" font-size="18" fill="#193750" font-weight="500" text-anchor="middle">Bu bağlantı, yolculuğun gerçekleşme biçiminin tasviri değildir.</text><path d="M300 504 C450 504 1040 316 1110 316" fill="none" stroke="#6B5189" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><path d="M825 446 C975 446 1040 484 1110 484" fill="none" stroke="#6B5189" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><path d="M548 487 C698 487 1040 652 1110 652" fill="none" stroke="#6B5189" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><rect x="1110" y="246" width="430" height="140" rx="16" fill="#FFFCF3" stroke="#C5CDBF" stroke-width="2"/><rect x="1110" y="246" width="7" height="140" rx="3" fill="#6B5189" stroke="none" stroke-width="1"/><text x="1136" y="322" font-family="Arial, sans-serif" font-size="16" fill="#6B5189" font-weight="700" text-anchor="start">01</text><text x="1176" y="323.36" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="600" text-anchor="start">Mescid-i Harâm</text><circle cx="300" cy="504" r="23" fill="#FFFCF3" stroke="#6B5189" stroke-width="4"/><circle cx="300" cy="504" r="14" fill="#6B5189" stroke="none" stroke-width="1"/><text x="300" y="510" font-family="Arial, sans-serif" font-size="17" fill="#FFFCF3" font-weight="700" text-anchor="middle">1</text><rect x="1110" y="414" width="430" height="140" rx="16" fill="#FFFCF3" stroke="#C5CDBF" stroke-width="2"/><rect x="1110" y="414" width="7" height="140" rx="3" fill="#6B5189" stroke="none" stroke-width="1"/><text x="1136" y="490" font-family="Arial, sans-serif" font-size="16" fill="#6B5189" font-weight="700" text-anchor="start">02</text><text x="1176" y="491.36" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="600" text-anchor="start">Mescid-i Aksâ</text><circle cx="825" cy="446" r="23" fill="#FFFCF3" stroke="#6B5189" stroke-width="4"/><circle cx="825" cy="446" r="14" fill="#6B5189" stroke="none" stroke-width="1"/><text x="825" y="452" font-family="Arial, sans-serif" font-size="17" fill="#FFFCF3" font-weight="700" text-anchor="middle">2</text><rect x="1110" y="582" width="430" heig
ght="500" text-anchor="middle">Yaklaşık konum ilişkisi; kafilenin kesin güzergâhı değildir.</text><path d="M546 420 C696 420 1040 316 1110 316" fill="none" stroke="#486A87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><path d="M382 540 C532 540 1040 484 1110 484" fill="none" stroke="#486A87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><path d="M816 595 C966 595 1040 652 1110 652" fill="none" stroke="#486A87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity=".55"/><rect x="1110" y="246" width="430" height="140" rx="16" fill="#FFFCF3" stroke="#C5CDBF" stroke-width="2"/><rect x="1110" y="246" width="7" height="140" rx="3" fill="#486A87" stroke="none" stroke-width="1"/><text x="1136" y="322" font-family="Arial, sans-serif" font-size="16" fill="#486A87" font-weight="700" text-anchor="start">01</text><text x="1176" y="323.36" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="600" text-anchor="start">Medine yolu</text><circle cx="546" cy="420" r="23" fill="#FFFCF3" stroke="#486A87" stroke-width="4"/><circle cx="546" cy="420" r="14" fill="#486A87" stroke="none" stroke-width="1"/><text x="546" y="426" font-family="Arial, sans-serif" font-size="17" fill="#FFFCF3" font-weight="700" text-anchor="middle">1</text><rect x="1110" y="414" width="430" height="140" rx="16" fill="#FFFCF3" stroke="#C5CDBF" stroke-width="2"/><rect x="1110" y="414" width="7" height="140" rx="3" fill="#486A87" stroke="none" stroke-width="1"/><text x="1136" y="490" font-family="Arial, sans-serif" font-size="16" fill="#486A87" font-weight="700" text-anchor="start">02</text><text x="1176" y="491.36" font-family="Arial, sans-serif" font-size="23" fill="#193750" font-weight="600" text-anchor="start">Hudeybiye çevresi</text><circle cx="382" cy="540" r="23" fill="#FFFCF3" stroke="#486A87" stroke-width="4"/><circle cx="382" cy="540
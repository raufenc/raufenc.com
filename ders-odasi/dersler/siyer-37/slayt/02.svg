<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f37_1title f37_1desc"><title id="f37_1title">Hudeybiye&apos;de karşılaşılan engel</title><desc id="f37_1desc">Şematik öğretim görseli. Medine yolu. Hudeybiye çevresi. Mekke&apos;ye giriş. Kureyş, Müslümanların o yıl Mekke&apos;ye girişini engelledi. Kafile Hudeybiye çevresinde bulunduğu sırada ziyaretin nasıl gerçekleşebileceği bir görüşme konusu hâline geldi. Haritadaki durak, yeni bir şehir kurulduğunu veya umrenin orada tamamlandığını göstermez. Yolculuğun hedefi ile beklenen yer farklıdır. Bir olayın mekânını doğru okumak, sonraki antlaşmanın neden bu adla anıldığını da anlamamızı kolaylaştırır.</desc><defs><linearGradient id="f37_1sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DCEAF0"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f37_1wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f37_1shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#486A87" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#486A87" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 7 · BÖLÜM 37</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Hudeybiye&apos;de karşılaşılan engel</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="56
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f33_2title f33_2desc"><title id="f33_2title">Farklı durumlar, farklı uygulamalar</title><desc id="f33_2desc">Şematik öğretim görseli. Görüşme. Şartları değerlendirme. Serbest bırakma. Esirlerin durumu Eshâb-ı kirâm ile görüşüldü; serbest bırakılmaları için farklı yollar uygulandı. Herkesin aynı imkâna sahip olduğu varsayılmadı. Bu nedenle tek bir uygulamayı bütün esirler için geçerliymiş gibi anlatmak doğru olmaz. Kaynak okurken &apos;bazıları&apos; ile &apos;hepsi&apos; arasındaki farkı dikkatle izleriz. Küçük görünen bu kelime farkı, tarihî bilginin doğruluğunu önemli ölçüde değiştirebilir.</desc><defs><linearGradient id="f33_2sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E2E9D6"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f33_2wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f33_2shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#526843" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#526843" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 6 · BÖLÜM 33</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Farklı durumlar, farklı uygulamalar</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="2
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="f31_3title f31_3desc"><title id="f31_3title">Farklı yerlerden ortak merkeze</title><desc id="f31_3desc">Şematik öğretim görseli. Bulunduğumuz yer. Yön oku. Ortak kıble. Dünyanın farklı yerlerinde yaşayan Müslümanlar, bulundukları konuma göre Kâbe&apos;ye yönelir. Bu yüzden pusuladaki yön herkes için aynı olmayabilir. Şemada farklı noktalardan aynı merkeze uzanan okları takip et. Ortak bir kıble, uzakta yaşayan insanların ibadetinde birlik olduğunu gösterir. Gerçek kıble belirlenirken doğru konum bilgisi ve güvenilir yöntem gerekir; bu çizim yalnız düşünceyi açıklayan bir şemadır.</desc><defs><linearGradient id="f31_3sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E2E9D6"/><stop offset="1" stop-color="#F8EBCD"/></linearGradient><linearGradient id="f31_3wood"><stop stop-color="#C79560"/><stop offset="1" stop-color="#E2BE80"/></linearGradient><filter id="f31_3shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#193750" flood-opacity=".12"/></filter></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F2E7" stroke="none" stroke-width="1"/><rect x="28" y="27" width="1544" height="845" rx="28" fill="#FFFCF3" stroke="#D8CEBD" stroke-width="2"/><rect x="80" y="48" width="9" height="17" rx="4" fill="#526843" stroke="none" stroke-width="1"/><text x="104" y="62" font-family="Arial, sans-serif" font-size="18" fill="#526843" font-weight="700" text-anchor="start">SİYER YOLCULUĞU · ÜNİTE 6 · BÖLÜM 31</text><text x="80" y="105" font-family="Arial, sans-serif" font-size="40" fill="#193750" font-weight="700" text-anchor="start">Farklı yerlerden ortak merkeze</text><path d="M80 194 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 50) scale(1 .82)"><rect x="58" y="218" width="1012" height="560" rx="26" fill="#FFFCF3" 
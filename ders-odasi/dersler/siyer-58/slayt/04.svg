0 805 H1520" fill="none" stroke="#D9D0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="834" font-family="Arial, sans-serif" font-size="17" fill="#4F5C62" font-weight="500" text-anchor="start">Medine hayatından tematik tekrar · Tarihî fotoğraf veya birebir mimari çizim değildir; şematik öğretim görselidir.</text><text x="1510" y="846" font-family="Arial, sans-serif" font-size="22" fill="#326F65" font-weight="700" text-anchor="end">04</text></svg>
<script src="ayarlar.js"></script>

<script>
(function () {
  var id = (new URLSearchParams(location.search).get('d') || document.documentElement.dataset.ders || 'fikih-2');
  if (!/^[a-z0-9-]+$/.test(id)) id = 'fikih-2';
  var s = document.createElement('script');
  s.src = 'dersler/' + id + '/ders.js';
  s.onload = function () {
    if (DO._ders) DO._ders._kok = 'dersler/' + id + '/';
    document.title = (DO._ders ? DO._ders.ad + ' · ' : '') + 'Ders Odası';
    DO.Oynatici.baslat();
  };
  s.onerror = function () {
    document.body.innerHTML = '<p style="font:18px sans-serif;padding:40px;color:#fff">“' + id + '” dersi bulunamadı. <a style="color:#e9b949" href="index.html">Ders listesine dön</a></p>';
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
